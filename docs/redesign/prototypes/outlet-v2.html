<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=15">
  <link rel="stylesheet" href="assets/app.css?v=43">
  <link rel="stylesheet" href="assets/dash.css?v=86">
  <link rel="stylesheet" href="assets/mme.css?v=35">

</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=9"></script>
  <script src="assets/messages.js?v=36"></script>
  <script src="assets/messages-v2.js?v=47"></script>
  <script src="assets/messages-spread.js?v=16"></script>
  <script src="assets/messages-mme.js?v=21"></script>
  <script src="assets/components.js?v=13"></script>
  <script src="assets/motion.js?v=2"></script>
  <script src="assets/dash.js?v=20"></script>
  <script src="assets/politics.js?v=11"></script>
  <script src="assets/spread.js?v=6"></script>
  <script src="assets/entity-cards.js?v=8"></script>
  <script src="assets/mme.js?v=22"></script>
  <script src="assets/shell.js?v=58"></script>
  <script src="data/media.js"></script>
  <script src="data/home.js"></script>
  <script src="data/stories.js?v=1"></script>
  <script src="data/storyDetail.js?v=1"></script>
  <script src="data/groups.js?v=1"></script>
  <script src="data/outlet.js"></script>
  <script src="data/mme.js?v=20"></script>
  <script>
    // Media, page of one outlet: /outlet/<slug>. The four numbers 2×2 and the latest articles on the Επισκόπηση tab, then the cards of the tab in two columns. Tabs: Επισκόπηση, Θέματα, Ιστορίες, Στάση και πρόσωπα.
    // The page is open at ?slug=<slug> (Rosa.gr when there is none). All 36 outlets of the snapshot work.
    // The 29 outlets of the live page ΜΜΕ & πρόσωπα also get its profile cards (data/mme.js, whole window): the numbers with ranks, the weekly agenda,
    // the stories it pushes or skips, the stance by topic, the frames, whom it quotes, how it presents the people and the newest headlines.
    const { t, fmt, h, load, params } = App
    const { reset, NO_GROUP, Spark, card, cardHead, Stat } = Dash
    const media = load('media', ['dates', 'outlets', 'outletDaily', 'issues'], (b) => b.outlets)
    const home = load('home', ['outlets'], (b) => b.outlets)
    const list = load('stories', ['issues', 'stories'], (b) => b.stories)
    const detail = load('storyDetail', ['outlets', 'stories'], (b) => b.stories)
    const groupsData = load('groups', ['groups'], (b) => b.groups)
    const sample = load('outlet', ['rows'], (b) => b.rows)
    const mme = load('mme', ['sets'], (b) => Object.keys(b.sets))
    const colorOfGroup = Dash.groupColors(groupsData.data ? groupsData.data.groups : [])
    const slug = params.get('slug') || '17661f5754'
    const outlet = media.data ? media.data.outlets.find((o) => o.slug === slug) : null
    const SIMILAR = 12
    const STORIES = 16
    const MIN_SHARED = 10

    const { DiffRow, scaleOf } = Entity

    Shell.start({
      id: 'outlet',
      route: `/outlet/${slug}`,
      dash: true,
      title: () => (outlet ? outlet.name : t('nav.media')),
      breadcrumbs: () => null,
      render (content) {
        content.classList.add('dash', 'minimal')
        reset()
        const problem = Dash.stateContent([media, home, list, detail, groupsData])
        if (problem) { content.replaceChildren(...problem.filter(Boolean), protoNote()); return }
        if (!outlet) { content.replaceChildren(UI.ErrorPage({ status: 404 })); return }

        const m = media.data
        const d = list.data
        const dd = detail.data
        const k = m.outlets.indexOf(outlet)
        const kd = dd.outlets.findIndex((o) => o.slug === slug)
        const dates = m.dates
        const last = dates.length - 1
        const name = (x) => x[App.locale] || x.el
        const sum = (arr) => arr.reduce((a, b) => a + b, 0)

        // Collected articles per day. The first day with articles is the start of the collection.
        const collected = home.data.outlets.find((o) => o.name === outlet.name).daily
        const start = collected.findIndex((v) => v > 0)
        const end = collected.length - 1 - [...collected].reverse().findIndex((v) => v > 0)
        const collectedTotal = sum(collected)
        const dayLabel = (i) => fmt.date(dates[i], { day: 'numeric', month: 'short' })

        // The stories of the outlet: the articles, the first day of the outlet and the line of days. A story keeps its first day over all outlets.
        const issueOf = new Map(d.stories.map((s) => [s.id, s]))
        const mine = []
        const topicAll = new Array(d.issues.length).fill(0)
        const topicMine = new Array(d.issues.length).fill(0)
        const topicDays = new Map()
        dd.stories.forEach((s) => {
          const story = issueOf.get(s.id)
          const days = new Array(last + 1).fill(0)
          let n = 0
          let first = last
          let storyStart = last
          const covering = new Set()
          for (let i = 0; i < s.t.length; i += 3) {
            const [o, day, rows] = [s.t[i], s.t[i + 1], s.t[i + 2]]
            storyStart = Math.min(storyStart, day)
            covering.add(o)
            if (story) topicAll[story.issue] += rows
            if (o !== kd) continue
            n += rows
            days[day] += rows
            first = Math.min(first, day)
            if (story) {
              topicMine[story.issue] += rows
              if (!topicDays.has(story.issue)) topicDays.set(story.issue, new Array(last + 1).fill(0))
              topicDays.get(story.issue)[day] += rows
            }
          }
          if (n) mine.push({ story, n, days, first, storyStart, reach: covering.size })
        })
        mine.sort((a, b) => b.n - a.n)

        const group = outlet.group
        const record = group ? groupsData.data.groups.find((g) => g.name === group) : null
        const groupColor = (g) => (g && colorOfGroup.get(g)) || NO_GROUP

        const makeDaily = (height) => {
          const el = Entity.DailyCard({ dates, daily: m.outletDaily[k], topicDays, issues: d.issues, info: t('outlet2.daily.info'), topics: false, height })
          el.classList.replace('c-12', 'c-9')
          return el
        }
        const dailyCard = makeDaily()

        // The share of each topic in the stories of the outlet, and in all outlets. The topic of the catch-all rows does not count.
        const mineTotal = sum(topicMine.filter((_, i) => !d.issues[i].catchAll))
        const allTotal = sum(topicAll.filter((_, i) => !d.issues[i].catchAll))
        const topicShares = mineTotal
          ? d.issues.map((issue, i) => ({ issue, i })).filter(({ issue, i }) => !issue.catchAll && topicAll[i])
            .map(({ issue, i }) => ({ label: name(issue), value: topicMine[i] / mineTotal, usual: topicAll[i] / allTotal }))
          : []
        const diffKey = Entity.diffKey()

        // How the outlet writes: the news share, the clickbait share and the stance, each against all outlets. Stance and clickbait come from the groups file.
        const files = [...groupsData.data.groups.flatMap((g) => g.outlets), ...(groupsData.data.ungrouped || [])]
        const mineFile = files.find((o) => o.slug === slug)
        const allOf = (key) => sum(files.map((o) => o[key]))
        const analysed = sum(m.outletDaily[k].map((c) => c[0]))
        const analysedAll = allOf('analysed')
        const newsRows = analysed ? [{ label: t('outlet2.how.news'), value: mineFile.news / mineFile.analysed, usual: allOf('news') / analysedAll }] : []
        const clickRows = mineFile && mineFile.cbKnown ? [{ label: t('outlet2.how.clickbait'), value: mineFile.cbYes / mineFile.cbKnown, usual: allOf('cbYes') / allOf('cbKnown') }] : []
        const stanceOf = (o) => (o ? o.stance : [0, 0, 0])
        const stanceMine = stanceOf(mineFile)
        const stanceAll = [0, 1, 2].map((i) => sum(files.map((o) => o.stance[i])))
        const stanceN = sum(stanceMine)
        const howScale = scaleOf([...newsRows, ...clickRows])
        const rowsOf = (rows) => (rows.length ? UI.BarList(rows.map((r) => DiffRow({ ...r, scale: howScale }))) : null)
        const note = (text) => h('p', { class: 'dcard-sub' }, text)
        const howCard = card('c-12', cardHead(t('outlet2.how.title'), diffKey, t('outlet2.how.info')),
          h('div', { class: 'how-panel' }, rowsOf([...newsRows, ...clickRows]), note(t('outlet2.how.news.n', { n: fmt.int(analysed) })),
            note(clickRows.length ? t('outlet2.how.clickbait.n', { baited: fmt.int(mineFile.cbYes), scored: fmt.int(mineFile.cbKnown) }) : t('outlet2.how.clickbait.none'))))
        const stanceCard = Entity.StanceCard({
          cls: 'c-12',
          rows: [{ label: t('entity.stance.outlet'), color: groupColor(group), counts: stanceMine }, { label: t('entity.stance.all'), color: NO_GROUP, counts: stanceAll }],
          foot: stanceN >= 30 ? t('outlet2.how.stance.n', { n: fmt.int(stanceN) }) : null
        })

        // The latest stories of the outlet: the stories it started to cover most recently (the bigger story first on a day), each with the day of its first article, the outlets that cover it and its own articles.
        // The first-day count says how often the outlet is first.
        const firsts = mine.filter((r) => r.first === r.storyStart).length
        const latest = mine.filter((r) => r.story).sort((a, b) => b.first - a.first || b.reach - a.reach || b.n - a.n).slice(0, STORIES)
        const storiesCard = card('c-7', cardHead(t('outlet2.stories.title'), null, `${t('outlet2.stories.first', { n: fmt.int(firsts), total: fmt.int(mine.length) })}. ${t('outlet2.stories.info')}`),
          latest.length
            ? h('ul', { class: 'rows-related latest-stories' }, latest.map((r) => h('li', {},
              h('span', { class: 'related-main' }, h('span', { class: 'story-line', title: `${name(r.story)} / ${name(d.issues[r.story.issue])}` }, UI.EntityLink({ type: 'story', key: String(r.story.id), label: name(r.story) }), h('span', { class: 'muted-text' }, ` / ${name(d.issues[r.story.issue])}`))),
              h('span', { class: 'row-value' }, dayLabel(r.first)),
              h('span', { class: 'row-value' }, t('outlet2.stories.reach', { n: fmt.int(r.reach) })),
              h('span', { class: 'row-value' }, fmt.int(r.n)))))
            : h('p', { class: 'dcard-empty' }, t('outlet2.stories.empty')))

        // The profile cards of ΜΜΕ & πρόσωπα, for an outlet of its Greek set. The sums are for its whole window.
        const mset = mme.kind === 'data' ? mme.data.sets.gr : null
        const mk = mset ? mset.outlets.findIndex((o) => o.slug === slug) : -1
        const MS = mk >= 0 ? Mme.summary(mset, 0, mset.dates.length - 1) : null
        const live = MS ? {
          weekly: Mme.WeeklyAgenda(mset, mk), coverage: Mme.CoverageCard(MS, mk), stance: Mme.StanceByTopic(MS, mk, 20),
          voices: Mme.VoicesCard(MS, mk), portrayal: Mme.PortrayalCard(MS, mk)
        } : null
        const emphasisCard = Mme.EmphasisCard(MS, mk, topicShares, mineTotal)
        const liveHeadlines = MS ? Mme.Headlines(mset, mk) : []

        const headlines = sample.kind === 'data' && sample.data.slug === slug ? sample.data.headlines : []
        // The newest articles, newest first, in a list that scrolls inside its card. It sits next to the title card, so the card is as tall as the title card.
        const latestCard = card('c-6 outlet-latest', cardHead(t('outlet2.latest.title'), null, liveHeadlines.length ? t('mme.o.headlines.info') : t('outlet2.headlines.info')),
          liveHeadlines.length
            ? h('div', { class: 'latest-scroll' }, h('ul', { class: 'plain-list' }, liveHeadlines))
            : headlines.length
              ? h('div', { class: 'latest-scroll' }, h('ul', { class: 'plain-list' }, headlines.map((x) => h('li', {}, App.safeUrl(x.url) ? h('a', { href: App.safeUrl(x.url), rel: 'noopener', target: '_blank' }, x.title) : x.title))))
              : h('p', { class: 'dcard-empty' }, t('outlet2.headlines.empty')))

        // One card for the related outlets: the other outlets of the group and the outlets that write the same stories. The dot is the group of the row outlet.
        // The similarity is the shared stories over the stories of either outlet. A pair needs 10 shared stories, so a peer of the group with fewer shows a dash.
        const pairOf = new Map(Spread.pairs(dd).list.filter((p) => p.a === kd || p.b === kd).map((p) => [p.a === kd ? p.b : p.a, p]))
        const strong = [...pairOf].filter(([, p]) => p.shared >= MIN_SHARED).sort((a, b) => b[1].score - a[1].score).slice(0, SIMILAR).map(([i]) => i)
        const peers = record ? record.outlets.filter((o) => o.slug !== slug).map((o) => dd.outlets.findIndex((x) => x.slug === o.slug)) : []
        const related = [...new Set([...strong, ...peers])].map((i) => {
          const o = dd.outlets[i]
          const p = pairOf.get(i)
          return { slug: o.slug, name: o.name, group: o.group, same: Boolean(group) && o.group === group, shared: p ? p.shared : 0, score: p && p.shared >= MIN_SHARED ? p.score : null }
        }).sort((a, b) => (b.score ?? -1) - (a.score ?? -1) || b.shared - a.shared)
        // A pie where a slice is as wide as the similarity and reaches as far as it: the 12 most similar outlets. The slice color is the group of the outlet, as everywhere else.
        // The list under the pie is the text of the chart: the outlet, its group, the shared stories and the similarity. Outlets with fewer than 10 shared stories have no slice.
        const ROSE = 12
        const slices = related.filter((r) => r.score !== null).slice(0, ROSE)
        const unscored = related.filter((r) => r.score === null)
        function RoseChart (rows) {
          return Dash.fit((holder, width) => {
            const size = Math.min(width, 340)
            const R = size / 2 - 30
            const cx = width / 2
            const cy = size / 2
            const total = sum(rows.map((r) => r.score))
            const top = Math.max(...rows.map((r) => r.score))
            const pt = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)]
            const svg = h('svg', { class: 'chart', width, height: size, viewBox: `0 0 ${width} ${size}`, 'aria-hidden': 'true' })
            let a0 = -Math.PI / 2
            rows.forEach((r) => {
              const sweep = (r.score / total) * Math.PI * 2
              const a1 = a0 + sweep
              const rad = R * (r.score / top)
              const [x0, y0] = pt(rad, a0)
              const [x1, y1] = pt(rad, a1)
              const d = rows.length === 1 ? `M ${cx - rad} ${cy} a ${rad} ${rad} 0 1 0 ${rad * 2} 0 a ${rad} ${rad} 0 1 0 ${-rad * 2} 0 Z` : `M ${cx} ${cy} L ${x0} ${y0} A ${rad} ${rad} 0 ${sweep > Math.PI ? 1 : 0} 1 ${x1} ${y1} Z`
              svg.append(h('path', { class: 'rose-slice', d, fill: groupColor(r.group), stroke: 'var(--surface-page)', 'stroke-width': 2, 'stroke-linejoin': 'round' },
                h('title', {}, `${r.name}: ${fmt.pct(r.score)} · ${t('outlet2.related.row', { shared: fmt.int(r.shared) })}`)))
              // A narrow slice has no label of its own (it would sit on its neighbors): its value is in the list under the pie.
              if (sweep >= 0.4) {
                const mid = a0 + sweep / 2
                const [lx, ly] = pt(rad + 10, mid)
                const side = Math.cos(mid)
                svg.append(h('text', { x: lx, y: ly + 4, 'text-anchor': side > 0.3 ? 'start' : side < -0.3 ? 'end' : 'middle' }, fmt.pct(r.score)))
              }
              a0 = a1
            })
            holder.replaceChildren(svg)
          })
        }
        const slugOfGroup = new Map(groupsData.data.groups.map((g) => [g.name, g.slug]))
        const roseLegend = h('ul', { class: 'rose-legend' }, slices.map((r) => h('li', { title: t('outlet2.related.row', { shared: fmt.int(r.shared) }) },
          h('span', { class: 'rose-swatch', style: `background:${groupColor(r.group)}`, 'aria-hidden': 'true' }),
          h('span', { class: 'rose-name' }, UI.EntityLink({ type: 'outlet', key: r.slug, label: r.name }),
            h('span', { class: 'rose-group', title: r.group || t('story.nogroup') }, '/ ', r.group && slugOfGroup.has(r.group) ? UI.EntityLink({ type: 'group', key: slugOfGroup.get(r.group), label: r.group }) : r.group || t('story.nogroup'))),
          h('span', { class: 'row-value' }, fmt.pct(r.score)))))
        const relatedCard = card('c-12', cardHead(t('outlet2.related.title'), null, t('outlet2.related.info')),
          related.length
            ? [slices.length ? h('div', { class: 'rose-body' }, RoseChart(slices), roseLegend) : null,
              unscored.length ? h('p', { class: 'dcard-sub' }, `${t('outlet2.related.few')} `, unscored.map((r, i) => [i ? ', ' : '', UI.EntityLink({ type: 'outlet', key: r.slug, label: r.name })])) : null]
            : h('p', { class: 'dcard-empty' }, t('outlet2.related.empty')))

        // The outlet card (its group and the numbers inside it) is on the left of the daily chart. The live numbers with their ranks come from ΜΜΕ & πρόσωπα;
        // an outlet that is not in it gets the numbers of the groups file, with no rank.
        const facts = MS ? Mme.outletFacts(MS, mk) : null
        const fileNews = mineFile && mineFile.analysed ? { label: t('outlet2.how.news'), value: fmt.pct(mineFile.news / mineFile.analysed), sub: '' } : null
        const fileClick = mineFile && mineFile.cbKnown ? { label: t('outlet2.how.clickbait'), value: fmt.pct(mineFile.cbYes / mineFile.cbKnown), sub: '' } : null
        const wide = (stat) => { stat.classList.remove('c-4'); return stat }
        const factStat = (f) => (f ? wide(Stat({ label: f.label, value: f.value, sub: f.sub })) : null)
        // One card with the outlet as its title (the period is in its info), and the group and the numbers in small cards inside it. The group card is as wide as the card.
        const named = (stat) => { stat.querySelector('.dstat-value').classList.add('is-text'); return stat }
        const groupStat = named(wide(Stat({ label: t('entity.fact.group'), value: record ? UI.EntityLink({ type: 'group', key: record.slug, label: group }) : t('story.nogroup'), sub: outlet.owner ? `${t('entity.fact.owner')}: ${outlet.owner}` : '' })))
        groupStat.classList.add('is-wide')
        const statGrid = card('c-3 outlet-card', cardHead(outlet.name, null, `${dayLabel(start)} → ${fmt.date(dates[end])} · ${t('entity.fact.days', { n: end - start + 1 })}`),
          h('div', { class: 'stats-2x2 outlet-stats' },
            groupStat,
            wide(Stat({ label: t('entity.fact.articles'), value: fmt.int(collectedTotal), sub: '', viz: Spark(collected, start, end, t('outlet2.daily.title'), { w: 56, hgt: 16 }) })),
            wide(Stat({ label: t('entity.fact.stories'), value: fmt.int(mine.length), sub: '' })),
            factStat(facts ? facts.news : fileNews), factStat(facts ? facts.clickbait : fileClick)))

        // The tabs: each card has one tab. A tab is rows of one, two or three columns (spans of 12), and the last card of a column takes the height that is left.
        // The tabs with no cards are not shown (the people and the topics of the live page are for the outlets of ΜΜΕ & πρόσωπα only).
        // The outlets of ΜΜΕ & πρόσωπα have the live cards. The others have the two cards of the groups file, and those stay on the first tab.
        // The outlets of ΜΜΕ & πρόσωπα have the live cards. The others have the two cards of the groups file only.
        const layouts = {
          overview: [[[6, [relatedCard]], [6, [latestCard]]]],
          topics: [[[12, [live && live.weekly]]], [[12, [emphasisCard]]]],
          stories: [[[7, [storiesCard]], [5, [live && live.coverage]]]],
          people: [[[6, [stanceCard, howCard, live && live.stance]], [6, [live && live.portrayal, live && live.voices]]]]
        }
        // A row keeps its columns with cards. One column alone, or two that are 8 and 4 wide, share the 12 columns.
        const tabRows = (key) => layouts[key].map((row) => row.map(([span, cards]) => [span, cards.filter(Boolean)]).filter(([, cards]) => cards.length))
          .filter((row) => row.length).map((row) => (row.length === 1 ? [[12, row[0][1]]] : row))
        const tabKeys = Object.keys(layouts).filter((key) => tabRows(key).length)
        const tab = tabKeys.includes(params.get('tab')) ? params.get('tab') : 'overview'
        const tabHref = (key) => { const q = new URLSearchParams(location.search); q.set('slug', slug); if (key === 'overview') q.delete('tab'); else q.set('tab', key); return `?${q}` }
        const tabNav = h('nav', { class: 'section-tabs', 'aria-label': outlet.name }, h('ul', {},
          tabKeys.map((key) => h('li', {}, h('a', { href: tabHref(key), 'aria-current': key === tab ? 'page' : null }, t(`outlet2.tab.${key}`))))))
        const bar = Dash.TopBar({ title: outlet.name, tabs: Shell.headerV2 ? h('div', { class: 'page-tabs' }, tabNav) : tabNav, quiet: true })
        const columns = h('div', { class: 'dash-grid story-grid entity-grid entity-rows' },
          tabRows(tab).flat().map(([span, cards]) => h('div', { class: `card-col card-col-fill c-${span} story-col` }, ...cards)))
        content.replaceChildren(bar, ...(tab === 'overview' ? [h('div', { class: 'dash-grid' }, statGrid, dailyCard)] : []), columns, protoNote())
        // Side by side, the daily chart takes the height that the four numbers leave, so the cards of the row end level.
        if (tab === 'overview') {
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (!window.matchMedia('(min-width: 1280px)').matches || !dailyCard.isConnected) return
            const body = dailyCard.lastElementChild
            const slack = dailyCard.getBoundingClientRect().bottom - parseFloat(getComputedStyle(dailyCard).paddingBottom) - body.getBoundingClientRect().bottom
            if (slack > 4) dailyCard.replaceWith(makeDaily(220 + Math.floor(slack)))
          }))
        }
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
