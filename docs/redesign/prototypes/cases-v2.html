<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <base href="/">
  <script src="assets/routes.js?v=4"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=37">
  <link rel="stylesheet" href="assets/app.css?v=69">
  <link rel="stylesheet" href="assets/dash.css?v=94">
  <link rel="stylesheet" href="assets/politics.css?v=12">
  <script src="assets/page-move.js?v=4"></script>
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=11"></script>
  <script src="assets/messages.js?v=42"></script>
  <script src="assets/messages-v2.js?v=50"></script>
  <script src="assets/messages-politics.js?v=16"></script>
  <script src="assets/components.js?v=18"></script>
  <script src="assets/motion.js?v=5"></script>
  <script src="assets/dash.js?v=24"></script>
  <script src="assets/politics.js?v=11"></script>
  <script src="assets/shell.js?v=70"></script>
  <script src="data/cases.js?v=1"></script>
  <script>
    // Ιστορίες, Υποθέσεις (from Πολιτική): the coverage of one case in all outlets (K46). The page opens with a result, not an empty input (G6).
    // The prototype has one stored answer of the case API, so the input shows that case.
    const { t, fmt, h, load } = App
    const { reset, card, cardHead, Stat, TopBar } = Dash
    const result = load('cases', ['by_source', 'timeline', 'articles'], (b) => b.articles)
    // The card of the words and the themes shows one of the two lists. The switch is the one of the time chart of Εκλογές.
    let words = 'framing'

    Shell.start({
      id: 'cases',
      route: '/cases',
      dash: true,
      title: () => t('nav.spread'),
      breadcrumbs: () => [{ label: t('nav.spread') }, { label: t('tab.spread.cases') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        const title = t('tab.spread.cases')
        const problem = Dash.stateContent([result], { title, tabs, quiet: true })
        if (problem) { content.replaceChildren(...problem); return }
        const d = result.data
        const month = (iso) => fmt.date(iso.slice(0, 10), { month: 'short', year: '2-digit' })
        const day = (iso) => fmt.date(iso.slice(0, 10), { day: 'numeric', month: 'short', year: 'numeric' })
        const form = h('form', { class: 'case-form', role: 'search', onSubmit: (e) => e.preventDefault() },
          h('label', { class: 'visually-hidden', for: 'case-q' }, t('case.query')),
          h('input', { id: 'case-q', class: 'search-input', type: 'search', value: d.q, 'aria-describedby': 'case-only' }),
          h('button', { type: 'submit', class: 'button' }, t('case.run')),
          h('span', { id: 'case-only', class: 'muted-text' }, t('case.only', { q: d.q })))
        const bar = TopBar({ title, tabs, quiet: true, actions: [form] })

        const stats = [
          Stat({ kpi: 'K46', label: t('case.stat.n'), value: fmt.int(d.total), sub: t('case.stat.n.sub', { q: d.q }) }),
          Stat({ label: t('case.stat.outlets'), value: fmt.int(d.by_source.length), sub: t('case.stat.outlets.sub') }),
          Stat({ label: t('case.stat.period'), value: `${month(d.first_date)} → ${month(d.last_date)}`, sub: `${day(d.first_date)} – ${day(d.last_date)}` })
        ]

        // The months from the first to the last article. The answer has only the months with articles.
        const counts = new Map(d.timeline.buckets.map((b, i) => [b.slice(0, 7), d.timeline.total[i]]))
        const months = []
        for (let x = new Date(`${d.timeline.buckets[0].slice(0, 7)}-01T00:00:00Z`); x.toISOString().slice(0, 7) <= d.timeline.buckets[d.timeline.buckets.length - 1].slice(0, 7); x.setUTCMonth(x.getUTCMonth() + 1)) months.push(x.toISOString().slice(0, 7))
        // #60: the titles say what each chart shows; the topic of the card goes to its info. The dashed line is the average month.
        const monthly = months.map((m) => counts.get(m) || 0)
        const peakMonth = monthly.indexOf(Math.max(...monthly))
        const monthAvg = monthly.reduce((a, b) => a + b, 0) / (monthly.length || 1)
        const timeCard = card('c-8', cardHead(t('case.time.finding', { month: month(`${months[peakMonth]}-01`), n: fmt.int(monthly[peakMonth]) }), null, `${t('case.time.title')}. ${t('case.time.info')}`),
          UI.BarChart({ labels: months.map((m) => month(`${m}-01`)), values: monthly, height: 220, label: t('case.time.title'), reference: { value: monthAvg, label: t('find.avg', { n: fmt.int(Math.round(monthAvg)) }) },
            tooltipOf: (i) => `${month(`${months[i]}-01`)} · ${fmt.int(counts.get(months[i]) || 0)}` }))
        // The bar of an outlet has the color of its group, as on the other pages.
        const lead = d.by_source.slice().sort((a, b) => b.count - a.count)[0]
        const outletCard = card('c-4', cardHead(lead ? t('case.outlets.finding', { name: lead.source, share: fmt.pct(lead.count / (d.total || 1)) }) : t('case.outlets.title'), null, `${t('case.outlets.title')}. ${t('case.outlets.info')}`),
          UI.BarList(d.by_source.map((s) => ({ label: s.source, sub: t('case.outlets.sub', { group: s.group || '–', first: day(s.first), last: day(s.last) }), value: s.count, color: Dash.groupColor(s.group) }))))

        const lists = {
          framing: d.framing.terms.filter((x) => x.total).sort((a, b) => b.total - a.total).map((x) => ({ label: x.label, value: x.total })),
          themes: d.themes.map((x) => ({ label: x.label, value: x.count }))
        }
        const wordsHead = h('div', {})
        const wordsHolder = h('div', {})
        const drawWords = () => {
          const pick = UI.SegmentedControl({ label: t('case.words.measure'), value: words, options: ['framing', 'themes'].map((k) => ({ value: k, label: t(`case.words.${k}`) })), onChange: (k) => { words = k; drawWords() } })
          wordsHead.replaceChildren(cardHead(t(`case.${words}.title`), pick, t(`case.${words}.info`)))
          wordsHolder.replaceChildren(UI.BarList(lists[words]))
        }
        drawWords()
        const wordsCard = card('c-6', wordsHead, wordsHolder)
        const entityCard = card('c-6', cardHead(t('case.entities.title'), null, t('case.entities.info')),
          h('div', { class: 'chips case-chips' }, d.entities.map((e) => h('span', { class: 'target-chip' }, e.text, h('strong', {}, fmt.int(e.count))))))

        const articles = d.articles.slice().sort((a, b) => b.date.localeCompare(a.date))
        const articleCard = card('c-12', cardHead(t('case.articles.title'), null, t('case.articles.info')),
          UI.DataTable({
            rows: articles, pageSize: 8,
            columns: [
              { label: t('gz.col.outlet'), render: (a) => h('span', { class: 'nowrap' }, a.source) },
              { label: t('case.col.date'), render: (a) => h('span', { class: 'nowrap muted-text' }, day(a.date)) },
              { label: t('case.col.title'), render: (a) => h('a', { class: 'quiet-link', href: a.url, target: '_blank', rel: 'noopener' }, a.title) }
            ]
          }))

        content.replaceChildren(bar, h('div', { class: 'dash-grid' }, ...stats, timeCard, outletCard, wordsCard, entityCard, articleCard), h('p', { class: 'proto-note' }, t('case.note')))
      }
    })
    reset()
  </script>
</body>
</html>
