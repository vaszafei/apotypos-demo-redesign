<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=4">
  <link rel="stylesheet" href="assets/app.css?v=12">
  <link rel="stylesheet" href="assets/dash.css?v=63">
  <link rel="stylesheet" href="assets/politics.css?v=1">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=3"></script>
  <script src="assets/messages.js?v=17"></script>
  <script src="assets/messages-v2.js?v=31"></script>
  <script src="assets/messages-politics.js?v=2"></script>
  <script src="assets/components.js?v=6"></script>
  <script src="assets/dash.js?v=11"></script>
  <script src="assets/politics.js?v=1"></script>
  <script src="assets/shell.js?v=31"></script>
  <script src="data/cases.js?v=1"></script>
  <script>
    // Πολιτική, Υποθέσεις: the coverage of one case in all outlets (K46). The page opens with a result, not an empty input (G6).
    // The prototype has one stored answer of the case API, so the input shows that case.
    const { t, fmt, h, load } = App
    const { reset, card, cardHead, Stat, TopBar } = Dash
    const { ColumnChart, Rows } = Politics
    const result = load('cases', ['by_source', 'timeline', 'articles'], (b) => b.articles)

    Shell.start({
      id: 'cases',
      route: '/cases',
      dash: true,
      title: () => t('nav.politics'),
      breadcrumbs: () => [{ label: t('nav.politics') }, { label: t('tab.politics.cases') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        const title = t('tab.politics.cases')
        const problem = Dash.stateContent([result], { title, tabs, quiet: true })
        if (problem) { content.replaceChildren(...problem); return }
        const d = result.data
        const month = (iso) => fmt.date(iso.slice(0, 10), { month: 'short', year: '2-digit' })
        const day = (iso) => fmt.date(iso.slice(0, 10), { day: 'numeric', month: 'short', year: 'numeric' })
        const form = h('form', { class: 'case-form', role: 'search', onSubmit: (e) => e.preventDefault() },
          h('label', { class: 'visually-hidden', for: 'case-q' }, t('case.query')),
          h('input', { id: 'case-q', class: 'search-input', type: 'search', value: d.q, 'aria-describedby': 'case-only' }),
          h('button', { type: 'submit', class: 'button' }, t('case.run')),
          h('span', { id: 'case-only', class: 'muted-text' }, t('case.only', { q: d.q })))
        const bar = TopBar({ title, tabs, quiet: true, actions: [form] })

        const stats = [
          Stat({ kpi: 'K46', label: t('case.stat.n'), value: fmt.int(d.total), sub: t('case.stat.n.sub', { q: d.q }) }),
          Stat({ label: t('case.stat.outlets'), value: fmt.int(d.by_source.length), sub: t('case.stat.outlets.sub') }),
          Stat({ label: t('case.stat.period'), value: `${month(d.first_date)} → ${month(d.last_date)}`, sub: `${day(d.first_date)} – ${day(d.last_date)}` })
        ]

        // The months from the first to the last article. The answer has only the months with articles.
        const counts = new Map(d.timeline.buckets.map((b, i) => [b.slice(0, 7), d.timeline.total[i]]))
        const months = []
        for (let x = new Date(`${d.timeline.buckets[0].slice(0, 7)}-01T00:00:00Z`); x.toISOString().slice(0, 7) <= d.timeline.buckets[d.timeline.buckets.length - 1].slice(0, 7); x.setUTCMonth(x.getUTCMonth() + 1)) months.push(x.toISOString().slice(0, 7))
        const timeCard = card('c-8', cardHead(t('case.time.title'), null, t('case.time.info')),
          ColumnChart({ labels: months.map((m) => month(`${m}-01`)), values: months.map((m) => counts.get(m) || 0), height: 220, aria: t('case.time.title'),
            tips: months.map((m) => `${month(`${m}-01`)} · ${fmt.int(counts.get(m) || 0)}`) }))
        const outletCard = card('c-4', cardHead(t('case.outlets.title'), null, t('case.outlets.info')),
          Rows(d.by_source.map((s) => ({ label: s.source, sub: t('case.outlets.sub', { group: s.group || '–', first: day(s.first), last: day(s.last) }), value: s.count })), { cls: 'rows-wrap' }))

        const framingCard = card('c-4', cardHead(t('case.framing.title'), null, t('case.framing.info')),
          Rows(d.framing.terms.filter((x) => x.total).sort((a, b) => b.total - a.total).map((x) => ({ label: x.label, value: x.total }))))
        const themeCard = card('c-4', cardHead(t('case.themes.title'), null, t('case.themes.info')),
          Rows(d.themes.map((x) => ({ label: x.label, value: x.count }))))
        const entityCard = card('c-4', cardHead(t('case.entities.title'), null, t('case.entities.info')),
          h('div', { class: 'chips case-chips' }, d.entities.map((e) => h('span', { class: 'target-chip' }, e.text, h('strong', {}, fmt.int(e.count))))))

        const articles = d.articles.slice().sort((a, b) => b.date.localeCompare(a.date))
        const articleCard = card('c-12', cardHead(t('case.articles.title'), null, t('case.articles.info')),
          UI.DataTable({
            rows: articles, pageSize: 12,
            columns: [
              { label: t('gz.col.outlet'), render: (a) => h('span', { class: 'nowrap' }, a.source) },
              { label: t('case.col.date'), render: (a) => h('span', { class: 'nowrap muted-text' }, day(a.date)) },
              { label: t('case.col.title'), render: (a) => h('a', { class: 'quiet-link', href: a.url, target: '_blank', rel: 'noopener' }, a.title) }
            ]
          }))

        content.replaceChildren(bar, h('div', { class: 'dash-grid' }, ...stats, timeCard, outletCard, framingCard, themeCard, entityCard, articleCard), h('p', { class: 'proto-note' }, t('case.note')))
      }
    })
    reset()
  </script>
</body>
</html>
