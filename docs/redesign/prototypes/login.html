<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=10">
  <link rel="stylesheet" href="assets/app.css?v=34">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=5"></script>
  <script src="assets/messages.js?v=31"></script>
  <script src="assets/components.js?v=13"></script>
  <script src="assets/motion.js?v=1"></script>
  <script src="assets/shell.js?v=48"></script>
  <script>
    // Log in (prototype): the accounts are fixed (shell.js). A visitor who is in already goes straight on.
    const { t, h, Icon } = App
    const next = Shell.safeNext(new URLSearchParams(location.search).get('next'))
    if (Shell.currentUser()) location.replace(next)

    Shell.start({
      id: 'login',
      title: () => t('login.title'),
      breadcrumbs: () => null,
      render (content) {
        const user = h('input', { id: 'login-user', name: 'username', type: 'text', autocomplete: 'username', autocapitalize: 'none', spellcheck: 'false', required: true })
        const password = h('input', { id: 'login-password', name: 'password', type: 'password', autocomplete: 'current-password', required: true })
        const error = h('p', { class: 'login-error', role: 'alert', hidden: true }, t('login.error'))
        const form = h('form', { class: 'login-form', onSubmit: (e) => {
          e.preventDefault()
          if (Shell.signIn(user.value, password.value)) { location.href = next; return }
          error.hidden = false
          password.value = ''
          password.focus()
        } },
        h('label', { for: 'login-user' }, t('login.user'), user),
        h('label', { for: 'login-password' }, t('login.password'), password),
        error,
        h('button', { type: 'submit', class: 'button button-primary' }, t('login.submit')))
        content.classList.add('is-gated')
        content.replaceChildren(
          h('h1', { class: 'visually-hidden' }, t('login.title')),
          h('section', { class: 'gate' }, h('div', { class: 'gate-card' },
            h('span', { class: 'gate-icon' }, Icon('lock-closed', 'icon')),
            h('h2', { class: 'gate-title' }, t('login.title')),
            h('p', { class: 'gate-text' }, t('login.text')),
            form)))
        user.focus()
      }
    })
  </script>
</body>
</html>
