<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=15">
  <link rel="stylesheet" href="assets/app.css?v=50">
  <link rel="stylesheet" href="assets/dash.css?v=95">
  <script src="assets/page-move.js?v=1"></script>
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=9"></script>
  <script src="assets/messages.js?v=41"></script>
  <script src="assets/messages-v2.js?v=57"></script>
  <script src="assets/messages-spread.js?v=17"></script>
  <script src="assets/components.js?v=20"></script>
  <script src="assets/motion.js?v=3"></script>
  <script src="assets/dash.js?v=21"></script>
  <script src="assets/spread.js?v=6"></script>
  <script src="assets/entity-cards.js?v=10"></script>
  <script src="assets/shell.js?v=62"></script>
  <script src="data/home.js?v=4"></script>
  <script src="data/stories.js?v=2"></script>
  <script src="data/storyDetail.js?v=2"></script>
  <script src="data/groups.js?v=1"></script>
  <script>
    // Topics, page of one topic: /topic/<i>. A compact title card, then the cards in rows of two. No tab bar, no breadcrumbs.
    // The page is open at ?i=<index of the topic in the 36 topics> (the first topic when there is none). All 36 topics of the snapshot work.
    const { t, fmt, h, load, params } = App
    const { reset, Spark, card, cardHead } = Dash
    const home = load('home', ['dates', 'issues', 'issueDaily'], (b) => b.issueDaily)
    const list = load('stories', ['issues', 'stories'], (b) => b.stories)
    const detail = load('storyDetail', ['outlets', 'stories', 'base'], (b) => b.stories)
    const groupsData = load('groups', ['groups', 'topicsAll'], (b) => b.groups)
    const index = Number(params.get('i') || 0)
    const OUTLETS = 6
    const STORIES = 5
    const SIMILAR = 5
    const MIN_ROWS = 200
    const MIN_LINK = 0.3
    const twoDecimals = new Intl.NumberFormat('el-GR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })

    const { DiffRow, scaleOf } = Entity
    const sum = (arr) => arr.reduce((a, b) => a + b, 0)
    const sumRange = (arr, i0, i1) => sum(arr.slice(i0, i1 + 1))
    // The two daily lines move together when the correlation is high.
    function correlation (a, b) {
      const n = a.length
      const ma = sum(a) / n
      const mb = sum(b) / n
      let ab = 0
      let aa = 0
      let bb = 0
      for (let i = 0; i < n; i++) { ab += (a[i] - ma) * (b[i] - mb); aa += (a[i] - ma) ** 2; bb += (b[i] - mb) ** 2 }
      return aa && bb ? ab / Math.sqrt(aa * bb) : 0
    }

    Shell.start({
      id: 'topic',
      route: `/topic/${index}`,
      dash: true,
      title: () => (home.data && home.data.issues[index] ? (home.data.issues[index][App.locale] || home.data.issues[index].el) : t('nav.topics')),
      breadcrumbs: () => null,
      render (content) {
        content.classList.add('dash', 'minimal')
        reset()
        const problem = Dash.stateContent([home, list, detail, groupsData])
        if (problem) { content.replaceChildren(...problem.filter(Boolean), protoNote()); return }
        const issues = home.data.issues
        if (!Number.isInteger(index) || index < 0 || index >= issues.length) { content.replaceChildren(UI.ErrorPage({ status: 404 })); return }

        const hd = home.data
        const d = list.data
        const dd = detail.data
        const name = (x) => x[App.locale] || x.el
        const issue = issues[index]
        const dates = hd.dates
        const last = dates.length - 1
        // The topics have no count after the coded days (null): the windows, the sparkline and the match of lines end on the last day that has one.
        const lastData = hd.issueDaily.reduce((m, row) => Math.max(m, row.findLastIndex((v) => v !== null)), 0)
        const daily = hd.issueDaily[index]
        const total = sum(daily)
        const allTotals = hd.issueDaily.map(sum)
        const rank = allTotals.filter((v) => v > total).length + 1
        const share = total / sum(allTotals)
        // The change of the last 14 days against the 14 before, as in the table of topics. A topic with fewer than 200 articles in the 14 before has none.
        const now = sumRange(daily, lastData - 13, lastData)
        const before = sumRange(daily, lastData - 27, lastData - 14)
        const change = before >= MIN_ROWS ? (now - before) / before : null
        const dayLabel = (i) => fmt.date(dates[i], { day: 'numeric', month: 'short' })
        let peak = 0
        daily.forEach((v, i) => { if (v > daily[peak]) peak = i })

        // The stories of the topic. A generic story is a catch-all, so it is not a story.
        const mine = d.stories.filter((s) => s.issue === index && !s.generic).map((s) => {
          let articles = 0
          const days = new Array(last + 1).fill(0)
          for (let i = 0; i < s.days.length; i += 2) { days[s.days[i]] = s.days[i + 1]; articles += s.days[i + 1] }
          return { ...s, articles, days }
        }).sort((a, b) => b.articles - a.articles)
        const inTopic = new Map(d.stories.filter((s) => s.issue === index).map((s) => [s.id, true]))
        const issueOf = new Map(d.stories.map((s) => [s.id, s.issue]))

        // The articles in stories: for the topic and for all topics. The outlets, the frames, the sections, the stance and the clickbait come from them.
        const outletTopic = new Array(dd.outlets.length).fill(0)
        const outletAll = new Array(dd.outlets.length).fill(0)
        const det = { f: new Array(8).fill(0), c: new Array(10).fill(0), s: new Array(4).fill(0), k: [0, 0] }
        let rowsTopic = 0
        let rowsAll = 0
        dd.stories.forEach((s) => {
          const mineStory = inTopic.has(s.id)
          for (let i = 0; i < s.t.length; i += 3) {
            outletAll[s.t[i]] += s.t[i + 2]
            rowsAll += s.t[i + 2]
            if (mineStory) { outletTopic[s.t[i]] += s.t[i + 2]; rowsTopic += s.t[i + 2] }
          }
          if (mineStory && s.f) { s.f.forEach((v, k) => { det.f[k] += v }); s.c.forEach((v, k) => { det.c[k] += v }); s.s.forEach((v, k) => { det.s[k] += v }); det.k[0] += s.k[0]; det.k[1] += s.k[1] }
        })

        // The title card: the name, the period once, and one line of facts.
        const storiesPerDay = dates.map((_, i) => mine.filter((x) => x.days[i] > 0).length)
        const titleCard = Entity.TitleCard({
          kind: t('hero.kind.topic'),
          title: name(issue),
          meta: `${dayLabel(0)} → ${fmt.date(dates[lastData])} · ${t('entity.fact.days', { n: lastData + 1 })}`,
          facts: [
            { label: t('entity.fact.articles'), value: fmt.int(total), sub: t('entity.fact.peak', { date: dayLabel(peak), n: fmt.int(daily[peak]) }), spark: Spark(daily, 0, lastData, t('topic2.daily.title'), { w: 56, hgt: 16 }) },
            { label: t('entity.fact.stories'), value: fmt.int(mine.length), spark: Spark(storiesPerDay, 0, last, t('entity.fact.stories'), { w: 56, hgt: 16 }) },
            { label: t('entity.fact.share'), value: fmt.pct(share), sub: t('entity.fact.rank', { n: rank, total: issues.length }) },
            change !== null && !issue.catchAll ? { label: t('entity.fact.change'), value: `${change > 0 ? '▲' : '▼'} ${fmt.signed(change * 100)}%`, sub: t('entity.fact.change.sub') } : null
          ]
        })

        const dailyCard = card('c-8', cardHead(t('topic2.daily.title'), null, t('topic2.daily.info')),
          Entity.DailyChart({ dates, series: [{ name: name(issue), color: 'var(--series-news)', values: daily }], height: 300 }))

        // The outlets: the share of the articles of an outlet in this topic, against the share of the topic in all outlets. An outlet needs 200 articles in stories.
        const usual = rowsAll ? rowsTopic / rowsAll : 0
        const outletRows = dd.outlets.map((o, k) => ({ o, label: o.name, value: outletAll[k] ? outletTopic[k] / outletAll[k] : 0, usual, n: outletAll[k] })).filter((r) => r.n >= MIN_ROWS)
        const more = outletRows.slice().sort((a, b) => (b.value - b.usual) - (a.value - a.usual)).slice(0, OUTLETS)
        const less = outletRows.slice().sort((a, b) => (a.value - a.usual) - (b.value - b.usual)).slice(0, OUTLETS)
        const link = (r) => ({ ...r, label: UI.EntityLink({ type: 'outlet', key: r.o.slug, label: r.label }) })
        const groupsRows = groupsData.data.groups.map((g) => {
          const gTotal = sum(g.topics)
          return { label: g.name, value: gTotal ? g.topics[index] / gTotal : 0, usual: groupsData.data.topicsAll[index] / sum(groupsData.data.topicsAll) }
        }).sort((a, b) => (b.value - b.usual) - (a.value - a.usual))
        const diffKey = Entity.diffKey()
        const scale = scaleOf([...more, ...less, ...groupsRows])
        const rowsOf = (rows) => UI.BarList(rows.map((r) => DiffRow({ ...r, scale, tipKey: 'topic2.how.tip' })))
        const outletsCard = card('c-8', cardHead(t('topic2.outlets.title'), diffKey, t('topic2.outlets.info')),
          outletRows.length
            ? [h('div', { class: 'how-grid how-grid-2' },
              h('div', { class: 'how-panel' }, h('h3', { class: 'rows-caption' }, t('topic2.outlets.more')), rowsOf(more.map(link))),
              h('div', { class: 'how-panel' }, h('h3', { class: 'rows-caption' }, t('topic2.outlets.less')), rowsOf(less.map(link)))),
            h('p', { class: 'dcard-sub' }, t('topic2.outlets.n', { n: fmt.int(rowsTopic), total: fmt.int(rowsAll) }))]
            : h('p', { class: 'dcard-empty' }, t('topic2.empty')))
        const colorOfGroup = Dash.groupColors(groupsData.data.groups)
        const groupsCard = card('c-6', cardHead(t('topic2.groups.title'), null, t('topic2.groups.info')),
          rowsOf(groupsRows.map((r) => ({ ...r, label: h('span', { class: 'group-cell' }, h('span', { class: 'dot', style: `--dot:${colorOfGroup.get(r.label)}` }), r.label) }))), diffKey.cloneNode(true))

        // How the topic is written: the frame, the section, the stance and the clickbait, each against all articles. The rows share one scale.
        const part = (arr, i, s = sum(arr)) => (s ? arr[i] / s : 0)
        const framed = (key, labelKey, count) => {
          const all = det[key].map((_, i) => ({ label: t(`story.${key === 'f' ? 'frame' : 'section'}.${dd[labelKey][i]}`), value: part(det[key], i), usual: part(dd.base[key], i) }))
          return all.filter((r) => r.value > 0).sort((a, b) => b.value - a.value).slice(0, count)
        }
        const stanceN = sum(det.s.slice(1))
        const stanceRows = ['critical', 'neutral', 'supportive'].map((code, i) => ({ label: t(`stance.${code}`), value: part(det.s.slice(1), i, stanceN), usual: part(dd.base.s.slice(1), i, sum(dd.base.s.slice(1))) }))
        const [scored, baited] = det.k
        const clickRows = scored ? [{ label: t('story.how.clickbait'), value: baited / scored, usual: dd.base.k[1] / dd.base.k[0] }] : []
        const panels = [
          { title: t('story.how.frame'), rows: framed('f', 'frames', 8) },
          { title: t('story.how.section'), rows: framed('c', 'sections', 6) },
          { title: t('story.how.stance'), rows: stanceN ? stanceRows : [], note: stanceN ? t('topic2.how.stance.n', { n: fmt.int(stanceN) }) : t('story.how.stance.none') },
          { title: t('story.how.clickbait'), rows: clickRows, note: scored ? t('story.how.clickbait.n', { n: fmt.int(baited), total: fmt.int(scored) }) : t('story.how.clickbait.none') }
        ]
        const howScale = Math.max(0.05, ...panels.flatMap((p) => p.rows.map((r) => Math.abs(r.value - r.usual))))
        const panel = (p) => h('div', { class: 'how-panel' }, h('h3', { class: 'rows-caption' }, p.title),
          p.rows.length ? UI.BarList(p.rows.map((r) => DiffRow({ ...r, scale: howScale, tipKey: 'topic2.how.tip' }))) : null, p.note ? h('p', { class: 'dcard-sub' }, p.note) : null)
        const howCard = card('c-6', cardHead(t('topic2.how.title'), null, t('topic2.how.info')),
          h('div', { class: 'how-grid how-grid-2' }, panel(panels[0]), h('div', {}, panel(panels[1]), panel(panels[3]))), diffKey.cloneNode(true))
        const stanceCard = Entity.StanceCard({
          rows: [{ label: t('entity.stance.topic'), color: 'var(--series-news)', counts: det.s.slice(1) }, { label: t('entity.stance.all'), color: Dash.NO_GROUP, counts: dd.base.s.slice(1) }],
          foot: stanceN ? t('topic2.how.stance.n', { n: fmt.int(stanceN) }) : null
        })

        const storiesCard = card('c-4', cardHead(t('topic2.stories.title'), null, t('topic2.stories.info')),
          mine.length
            ? h('ul', { class: 'rows-related' }, mine.slice(0, STORIES).map((s) => h('li', {},
              h('span', { class: 'related-main' }, UI.EntityLink({ type: 'story', key: String(s.id), label: name(s) }), h('span', { class: 'muted-text' }, t('topic2.stories.outlets', { n: s.outlets }))),
              Spark(s.days, 0, last, t('outlet2.stories.spark'), { w: 84, hgt: 20 }),
              h('span', { class: 'row-value' }, fmt.int(s.articles)))))
            : h('p', { class: 'dcard-empty' }, t('topic2.stories.empty')))

        // The topics with a daily line like this one. The catch-all topic is not a match.
        const similar = issues.map((x, k) => ({ x, k, r: k === index || x.catchAll ? -1 : correlation(daily.slice(0, lastData + 1), hd.issueDaily[k].slice(0, lastData + 1)) })).filter((r) => r.r >= MIN_LINK).sort((a, b) => b.r - a.r).slice(0, SIMILAR)
        const similarCard = card('', cardHead(t('topic2.similar.title'), null, t('topic2.similar.info')),
          similar.length ? UI.BarList(similar.map((r) => ({ label: UI.EntityLink({ type: 'topic', key: String(r.k), label: name(r.x) }), value: r.r, text: twoDecimals.format(r.r) })), { max: 1 }) : h('p', { class: 'dcard-empty' }, t('topic2.similar.empty')))

        // The title card, then the cards in rows of two: the daily columns beside the stance and the similar topics, the outlets and the stories, the groups and how it is written.
        content.replaceChildren(h('div', { class: 'dash-grid entity-grid entity-rows' },
          titleCard, dailyCard, h('div', { class: 'entity-stack c-4' }, stanceCard, similarCard), outletsCard, storiesCard, groupsCard, howCard), protoNote())
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
