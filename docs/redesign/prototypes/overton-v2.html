<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=6">
  <link rel="stylesheet" href="assets/app.css?v=22">
  <link rel="stylesheet" href="assets/dash.css?v=79">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=4"></script>
  <script src="assets/messages.js?v=28"></script>
  <script src="assets/messages-v2.js?v=37"></script>
  <script src="assets/components.js?v=9"></script>
  <script src="assets/motion.js?v=1"></script>
  <script src="assets/dash.js?v=16"></script>
  <script src="assets/shell.js?v=44"></script>
  <script src="data/overton.js?v=1"></script>
  <script>
    // Μέσα, Μετατοπίσεις (was Αναλύσεις › Παράθυρο): when the way the coverage describes a topic changes. It reads the overton file (36 topics, 53 weeks of 2025).
    // The file has no drift for each week. It has the strongest shift of each topic, its week and the articles of each week.
    const { t, fmt, h, load } = App
    const { reset, card, cardHead, TopBar } = Dash
    const shifts = load('overton', ['topics', 'weeks'], (b) => b.topics)

    // Weekly articles of one topic. The dot is the week of the strongest shift. It is blue above the limit and gray below.
    function WeekSpark (topic, weeks, limit) {
      const w = 110
      const hgt = 24
      const max = Math.max(...topic.n, 1)
      const x = (i) => 1 + (i / (topic.n.length - 1)) * (w - 2)
      const y = (v) => hgt - 2 - (v / max) * (hgt - 4)
      const at = weeks.indexOf(topic.week)
      const label = t('shifts.spark', { topic: topic.label })
      return h('svg', { class: 'spark', width: w, height: hgt, viewBox: `0 0 ${w} ${hgt}`, role: 'img', 'aria-label': label },
        h('path', { class: 'spark-range', d: topic.n.map((v, k) => `${k ? 'L' : 'M'}${x(k).toFixed(1)} ${y(v).toFixed(1)}`).join(' ') }),
        at >= 0 ? h('circle', { cx: x(at), cy: y(topic.n[at]), r: 3, fill: topic.ratio >= limit ? 'var(--emph-less)' : 'var(--bar-muted)', stroke: '#ffffff', 'stroke-width': 1.5 }) : null)
    }

    // Bars: how many topics had the strongest shift in each month of 2025.
    function MonthChart ({ counts, avg }) {
      const months = counts.map((_, i) => fmt.date(`2025-${String(i + 1).padStart(2, '0')}-01`, { month: 'short' }))
      return UI.BarChart({ labels: months, values: counts, height: 230, axisLabel: t('shifts.month.axis'), label: t('shifts.month.title'),
        reference: { value: avg, label: t('shifts.month.avg', { n: fmt.dec(avg) }) },
        tooltipOf: (i) => t('shifts.month.tip', { month: months[i], n: fmt.int(counts[i]) }) })
    }

    Shell.start({
      id: 'topics',
      route: '/overton',
      dash: true,
      title: () => t('tab.media.shifts'),
      breadcrumbs: () => [{ label: t('nav.media') }, { label: t('tab.media.topics') }, { label: t('tab.media.shifts') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        reset()
        const bar = TopBar({ title: t('tab.media.shifts'), tabs, quiet: true })
        if (shifts.kind !== 'data') {
          content.replaceChildren(bar, shifts.kind === 'empty' ? h('div', { class: 'dash-grid' }, card('c-12', UI.EmptyState({ text: t('shifts.empty') }))) : UI.ErrorState({ onRetry: () => location.reload() }), protoNote())
          return
        }

        const d = shifts.data
        const name = (x) => x.label
        const limit = d.threshold
        const rows = d.topics.slice().sort((a, b) => b.ratio - a.ratio)
        const moved = rows.filter((r) => r.ratio >= limit)
        const strongest = rows[0]
        const weekDate = (iso) => fmt.date(iso, { day: 'numeric', month: 'short' })
        const counts = new Array(12).fill(0)
        moved.forEach((r) => { counts[Number(r.week.slice(5, 7)) - 1]++ })

        const ratio = (v) => `${new Intl.NumberFormat('el-GR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v)}×`
        // #60: the 3 stat cards repeated the table (its first row) and the chart (the sum of its columns). Their facts are now the title
        // and the line under it: how many topics are measured, how many shifted above the limit, and the strongest shift.
        const table = card('c-8', cardHead(t('shifts.table.finding', { n: fmt.int(moved.length), total: fmt.int(rows.length), topic: name(strongest), x: ratio(strongest.ratio) }), null, `${t('shifts.table.title')}. ${t('shifts.table.info')}`),
          h('p', { class: 'dcard-sub' }, t('shifts.table.lead', { n: fmt.dec(limit), from: fmt.date(d.window[0]), to: fmt.date(d.window[1]) })),
          UI.DataTable({
            rows, rankColumn: true, pageSize: 12, emptyText: t('shifts.empty'),
            columns: [
              { label: t('media.col.issue'), render: (r) => h('span', { class: 'nowrap' }, name(r)) },
              { label: t('shifts.col.shift'), num: true, render: (r) => (r.ratio >= limit ? h('span', { class: 'delta' }, ratio(r.ratio)) : h('span', { class: 'mini-empty', title: t('shifts.below') }, ratio(r.ratio))) },
              { label: t('shifts.col.week'), render: (r) => h('span', { class: 'nowrap' }, weekDate(r.week)) },
              { label: t('shifts.col.articles'), num: true, phone: false, render: (r) => fmt.int(r.size) },
              { label: t('shifts.col.trend'), phone: false, render: (r) => WeekSpark(r, d.weeks, limit) }
            ]
          }))
        // The title names the month with the most shifts. The dashed line is the average of the months.
        const top = Math.max(...counts)
        const topMonths = counts.map((n, i) => (n === top ? fmt.date(`2025-${String(i + 1).padStart(2, '0')}-01`, { month: 'short' }) : null)).filter(Boolean)
        const monthCard = card('c-4', cardHead(top ? t('shifts.month.finding', { months: topMonths.join(t('shifts.and')), n: fmt.int(top) }) : t('shifts.month.title'), null, `${t('shifts.month.title')}. ${t('shifts.month.info')}`),
          MonthChart({ counts, avg: moved.length / 12 }))

        content.replaceChildren(bar, h('div', { class: 'dash-grid' }, table, h('div', { class: 'c-4 card-col' }, monthCard)), protoNote())
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
