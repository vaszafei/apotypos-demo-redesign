<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=10">
  <link rel="stylesheet" href="assets/app.css?v=31">
  <link rel="stylesheet" href="assets/dash.css?v=81">
  <link rel="stylesheet" href="assets/home.css?v=28">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=4"></script>
  <script src="assets/messages.js?v=30"></script>
  <script src="assets/messages-v2.js?v=46"></script>
  <script src="assets/messages-home.js?v=18"></script>
  <script src="assets/components.js?v=12"></script>
  <script src="assets/motion.js?v=1"></script>
  <script src="assets/dash.js?v=16"></script>
  <script src="assets/home.js?v=24"></script>
  <script src="assets/shell.js?v=47"></script>
  <script src="data/home.js"></script>
  <script src="data/stories.js?v=1"></script>
  <script src="data/storyDetail.js?v=1"></script>
  <script>
    // Home: the calendar of a month and the chart pick a day, the card shows the stories of that day (a story of the list is picked in the card),
    // then the topics of the picked day and the quick access. The page covers the whole window of the data.
    const { t, fmt, h, load } = App
    const { card, cardHead } = Dash
    const result = load('home', ['dates', 'outlets', 'issues', 'issueDaily'], (b) => b.dates)
    const stories = load('stories', ['dates', 'issues', 'stories'], (b) => b.stories)
    const detail = load('storyDetail', ['dates', 'outlets', 'stories'], (b) => b.stories)
    const range = { from: '2026-08-01', to: '2026-09-30' }
    let lastValid = { ...range }
    let selected = null
    let rank = 0

    function sumRange (daily, i0, i1) {
      let s = 0
      for (let i = i0; i <= i1; i++) s += daily[i]
      return s
    }

    Shell.start({
      id: 'home',
      route: '/',
      dash: true,
      title: () => t('home.title'),
      breadcrumbs: () => [],
      render (content) {
        content.classList.add('dash', 'minimal')
        const ix = stories.kind === 'data' && result.kind === 'data'
          ? Home.index({ stories: stories.data, detail: detail.kind === 'data' ? detail.data : null })
          : null

        const draw = () => {
          Dash.reset()
          const data = result.data
          const bar = () => Dash.TopBar({ title: t('home.title'), quiet: true })
          if (result.kind === 'failed' || result.kind === 'notFound') {
            content.replaceChildren(bar(), UI.ErrorState({ onRetry: () => location.reload() }), protoNote())
            return
          }
          if (result.kind === 'empty') {
            content.replaceChildren(bar(), h('div', { class: 'dash-grid' }, card('c-12', UI.EmptyState({ text: t('home.k01.empty') }))), protoNote())
            return
          }
          const dates = data.dates
          const i0 = dates.indexOf(lastValid.from)
          const i1 = dates.indexOf(lastValid.to)
          const len = i1 - i0 + 1
          if (selected === null || selected < i0 || selected > i1) selected = i1

          // The articles of all the outlets for each day of the data.
          const totals = dates.map((_, i) => data.outlets.reduce((s, o) => s + o.daily[i], 0))
          const collected = sumRange(totals, i0, i1)

          // The stories of the day. A pick of a day in the calendar or the chart, or of a story in the list, draws this card again.
          const dayCard = () => Home.DayCard(ix ? Home.dayInfo(ix, selected, rank) : null, { date: dates[selected], onStory: (r) => { rank = r; redraw() } })
          let day = dayCard()
          const redraw = () => { const next = dayCard(); day.replaceWith(next); day = next }

          const calendar = Home.Calendar({ dates, totals, selected, onPick: (i) => pick(i, 'calendar') })

          const days = dates.slice(i0, i1 + 1)
          const daily = totals.slice(i0, i1 + 1)
          const avg = collected / len
          const chart = () => UI.BarChart({
            dates: days, values: daily, label: t('home.daily.title'), height: 263, picked: selected - i0, onPick: (j) => pick(i0 + j, 'chart'),
            reference: { value: avg, label: t('home.daily.avg', { n: fmt.int(Math.round(avg)) }) },
            tooltipOf: (i) => `${fmt.date(days[i])}: ${fmt.int(daily[i])}`
          })
          const chartBody = h('div', {}, chart())
          const dailyCard = card('c-7', cardHead(t('home.daily.title'), null, t('home.daily.info')), chartBody)

          const topicsCard = () => Home.TopicsCard({ home: data, day: selected })
          let topics = topicsCard()

          function pick (i, from) {
            selected = i
            rank = 0
            redraw()
            const next = topicsCard()
            topics.replaceWith(next)
            topics = next
            if (from === 'chart') calendar.select(i)
            else chartBody.replaceChildren(chart())
          }

          const main = h('div', { class: 'c-7 card-col' }, calendar.node, dailyCard, topics)
          const aside = h('div', { class: 'c-5 card-col' }, day, Home.QuickCard())
          content.replaceChildren(bar(),
            h('div', { class: 'dash-grid home-grid' }, main, aside), protoNote())
        }
        draw()
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
