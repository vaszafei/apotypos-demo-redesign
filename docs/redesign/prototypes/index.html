<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=10">
  <link rel="stylesheet" href="assets/app.css?v=33">
  <link rel="stylesheet" href="assets/dash.css?v=81">
  <link rel="stylesheet" href="assets/home.css?v=31">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=4"></script>
  <script src="assets/messages.js?v=30"></script>
  <script src="assets/messages-v2.js?v=46"></script>
  <script src="assets/messages-home.js?v=20"></script>
  <script src="assets/components.js?v=13"></script>
  <script src="assets/motion.js?v=1"></script>
  <script src="assets/dash.js?v=16"></script>
  <script src="assets/home.js?v=27"></script>
  <script src="assets/shell.js?v=48"></script>
  <script src="data/home.js"></script>
  <script src="data/stories.js?v=1"></script>
  <script src="data/storyDetail.js?v=1"></script>
  <script>
    // Home: a page that scrolls. First the hero, with the title, the large search field (the search of the top bar steps aside while it is on screen) and the numbers of the period.
    // Then the articles per day of the period, then the day (the calendar of a month, the stories of the picked day and its topics), then the quick access.
    // The chart and the calendar pick the day. The page covers the whole window of the data.
    const { t, fmt, h, load, Icon } = App
    const { card, cardHead } = Dash
    const result = load('home', ['dates', 'outlets', 'issues', 'issueDaily'], (b) => b.dates)
    const stories = load('stories', ['dates', 'issues', 'stories'], (b) => b.stories)
    const detail = load('storyDetail', ['dates', 'outlets', 'stories'], (b) => b.stories)
    const range = { from: '2026-08-01', to: '2026-09-30' }
    let lastValid = { ...range }
    let selected = null
    let rank = 0

    function sumRange (daily, i0, i1) {
      let s = 0
      for (let i = i0; i <= i1; i++) s += daily[i]
      return s
    }

    Shell.start({
      id: 'home',
      route: '/',
      dash: true,
      title: () => t('home.title'),
      breadcrumbs: () => [],
      render (content) {
        content.classList.add('dash', 'minimal')
        const ix = stories.kind === 'data' && result.kind === 'data'
          ? Home.index({ stories: stories.data, detail: detail.kind === 'data' ? detail.data : null })
          : null

        const draw = () => {
          Dash.reset()
          const data = result.data
          const bar = () => Dash.TopBar({ title: t('home.title'), quiet: true })
          if (result.kind === 'failed' || result.kind === 'notFound') {
            content.replaceChildren(bar(), UI.ErrorState({ onRetry: () => location.reload() }), protoNote())
            return
          }
          if (result.kind === 'empty') {
            content.replaceChildren(bar(), h('div', { class: 'dash-grid' }, card('c-12', UI.EmptyState({ text: t('home.k01.empty') }))), protoNote())
            return
          }
          const dates = data.dates
          const i0 = dates.indexOf(lastValid.from)
          const i1 = dates.indexOf(lastValid.to)
          const len = i1 - i0 + 1
          if (selected === null || selected < i0 || selected > i1) selected = i1

          // The articles of all the outlets for each day of the data.
          const totals = dates.map((_, i) => data.outlets.reduce((s, o) => s + o.daily[i], 0))
          const collected = sumRange(totals, i0, i1)

          // The stories of the day. A pick of a day in the calendar or the chart, or of a story in the list, draws this card again.
          const dayCard = (swap) => Home.DayCard(ix ? Home.dayInfo(ix, selected, rank) : null, { date: dates[selected], swap, onStory: (r) => { rank = r; redraw('story') } })
          let day = dayCard()
          const redraw = (swap) => { const next = dayCard(swap); day.replaceWith(next); day = next }

          const calendar = Home.Calendar({ dates, totals, selected, onPick: (i) => pick(i, 'calendar') })

          const days = dates.slice(i0, i1 + 1)
          const daily = totals.slice(i0, i1 + 1)
          const avg = collected / len
          const chart = () => UI.BarChart({
            dates: days, values: daily, label: t('home.daily.title'), height: 280, picked: selected - i0, onPick: (j) => pick(i0 + j, 'chart'),
            reference: { value: avg, label: t('home.daily.avg', { n: fmt.int(Math.round(avg)) }) },
            tooltipOf: (i) => `${fmt.date(days[i])}: ${fmt.int(daily[i])}`
          })
          const chartEl = chart()
          const chartBody = h('div', {}, chartEl)
          // The picked day under the chart, with a link down to its stories.
          const pickedDay = h('strong', {})
          const showPicked = () => { pickedDay.textContent = fmt.date(dates[selected], { weekday: 'long', day: 'numeric', month: 'long' }) }
          showPicked()
          const dailyCard = card('c-12 home-daily', cardHead(t('home.daily.title'), null, t('home.daily.info')), chartBody,
            h('p', { class: 'home-picked' }, t('home.picked'), ' ', pickedDay, h('a', { href: '#home-day' }, t('home.picked.go'), Icon('chevron-down', 'icon icon-sm'))))

          const topicsCard = () => Home.TopicsCard({ home: data, day: selected })
          let topics = topicsCard()

          function pick (i, from) {
            selected = i
            showPicked()
            rank = 0
            redraw('day')
            const next = topicsCard()
            next.classList.add('is-swap')
            topics.replaceWith(next)
            topics = next
            if (from === 'chart') calendar.select(i)
            else chartEl.pick(selected - i0)
          }

          // The hero: the stories in the most articles on the last day, and the numbers of the period.
          const inRange = new Set()
          if (ix) for (let i = i0; i <= i1; i++) ix.byDay[i].forEach((x) => inRange.add(x.s.id))
          const trending = ix ? ix.byDay[i1].slice(0, 4).map((x) => ({ label: x.s[App.locale] || x.s.el, n: x.n, href: `story-v2.html?id=${x.s.id}` })) : []
          const hero = Home.Hero({
            from: dates[i0], to: dates[i1], totals: daily, trending,
            stats: [
              [t('home.stat.articles'), fmt.int(collected)],
              [t('home.stat.outlets'), fmt.int(data.outlets.length)],
              [t('home.stat.stories'), ix ? fmt.int(inRange.size) : '–'],
              [t('home.stat.topics'), fmt.int(data.issues.filter((x) => !x.soft).length)]
            ]
          })

          const trend = Home.Section({ id: 'home-trend', kicker: t('home.sec.trend.kicker'), title: t('home.sec.trend.title'), lead: t('home.sec.trend.lead', { from: fmt.date(dates[i0]), to: fmt.date(dates[i1]) }) },
            h('div', { class: 'dash-grid' }, dailyCard))
          const today = Home.Section({ id: 'home-day', kicker: t('home.sec.day.kicker'), title: t('home.sec.day.title'), lead: t('home.sec.day.lead') },
            h('div', { class: 'dash-grid home-grid' }, calendar.node, day, topics))
          const explore = Home.Section({ id: 'home-explore', kicker: t('home.sec.explore.kicker'), title: t('home.sec.explore.title'), lead: t('home.sec.explore.lead') },
            Home.QuickLinks())
          content.replaceChildren(hero.node, trend, today, explore, protoNote())
          Shell.heroSearch(hero.field)
        }
        draw()
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
