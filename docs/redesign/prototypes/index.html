<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=10">
  <link rel="stylesheet" href="assets/app.css?v=29">
  <link rel="stylesheet" href="assets/dash.css?v=80">
  <link rel="stylesheet" href="assets/mme.css?v=33">
  <link rel="stylesheet" href="assets/date-range.css?v=4">
  <link rel="stylesheet" href="assets/home.css?v=3">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=4"></script>
  <script src="assets/messages.js?v=30"></script>
  <script src="assets/messages-v2.js?v=46"></script>
  <script src="assets/messages-mme.js?v=15"></script>
  <script src="assets/messages-home.js?v=1"></script>
  <script src="assets/components.js?v=10"></script>
  <script src="assets/motion.js?v=1"></script>
  <script src="assets/dash.js?v=16"></script>
  <script src="assets/date-range.js?v=1"></script>
  <script src="assets/mme.js?v=19"></script>
  <script src="assets/spread.js?v=6"></script>
  <script src="assets/home.js?v=1"></script>
  <script src="assets/shell.js?v=47"></script>
  <script src="data/home.js"></script>
  <script src="data/stories.js?v=1"></script>
  <script src="data/groups.js?v=2"></script>
  <script src="data/mme.js?v=1"></script>
  <script>
    // Home: the numbers of a period (the date picker in the page head), the top story of a day (the calendar and the chart pick the day),
    // the topics that rise and fall, and the shortcuts to the analyses. The period and the day are the state of the page.
    const { t, fmt, h, load } = App
    const { card, cardHead, Stat, Spark } = Dash
    const result = load('home', ['dates', 'outlets', 'issues', 'issueDaily'], (b) => b.dates)
    const stories = load('stories', ['dates', 'issues', 'stories'], (b) => b.stories)
    const groups = load('groups', ['groups'], (b) => b.groups)
    // «Τι ξεχωρίζει στο διάστημα» comes from Μέσα › Επισκόπηση: the Greek outlets of data/mme.js, for the period of the page.
    const mme = load('mme', ['sets'], (b) => Object.keys(b.sets))
    const range = { from: '2026-08-01', to: '2026-09-30' }
    let lastValid = { ...range }
    let selected = null

    function sumRange (daily, i0, i1) {
      let s = 0
      for (let i = i0; i <= i1; i++) s += daily[i]
      return s
    }

    Shell.start({
      id: 'home',
      route: '/',
      dash: true,
      title: () => t('home.title'),
      breadcrumbs: () => [],
      render (content) {
        content.classList.add('dash', 'minimal')
        const ix = stories.kind === 'data' && result.kind === 'data'
          ? Home.index({ stories: stories.data, set: mme.kind === 'data' ? mme.data.sets.gr : null, groups: groups.kind === 'data' ? groups.data.groups : [] })
          : null

        const draw = () => {
          Dash.reset()
          const data = result.data
          const bar = (actions) => Dash.TopBar({ title: t('home.title'), actions, quiet: true })
          if (result.kind === 'failed' || result.kind === 'notFound') {
            content.replaceChildren(bar(), UI.ErrorState({ onRetry: () => location.reload() }), protoNote())
            return
          }
          if (result.kind === 'empty') {
            content.replaceChildren(bar(), h('div', { class: 'dash-grid' }, card('c-12', UI.EmptyState({ text: t('home.k01.empty') }))), protoNote())
            return
          }
          const dates = data.dates
          const i0 = dates.indexOf(lastValid.from)
          const i1 = dates.indexOf(lastValid.to)
          const len = i1 - i0 + 1
          if (selected === null || selected < i0 || selected > i1) selected = i1
          const name = (issue) => issue[App.locale] || issue.el

          const picker = UI.DateRangePicker({ dates, from: lastValid.from, to: lastValid.to, presets: Mme.presets({ dates }),
            onChange: (r) => { Object.assign(range, r); if (r.from <= r.to) lastValid = { ...r }; draw() } })

          // The articles of all the outlets for each day of the whole window; a period and a day are slices of it.
          const totals = dates.map((_, i) => data.outlets.reduce((s, o) => s + o.daily[i], 0))
          const collected = sumRange(totals, i0, i1)
          const previous = i0 - len >= 0 ? sumRange(totals, i0 - len, i0 - 1) : null
          const outletsActive = data.outlets.filter((o) => sumRange(o.daily, i0, i1) > 0).length
          const issueCounts = data.issues.map((issue, k) => ({ issue, count: sumRange(data.issueDaily[k], i0, i1) }))
          const analysed = issueCounts.reduce((s, x) => s + x.count, 0)
          const news = issueCounts.filter((x) => !x.issue.soft).sort((a, b) => b.count - a.count)
          const newsTotal = news.reduce((s, x) => s + x.count, 0)

          const hero = card('hero home-hero',
            h('div', { class: 'hero-main' },
              h('p', { class: 'hero-kicker' }, t('home.hero.kicker')),
              h('h2', { class: 'hero-title' }, t('home.title')),
              h('p', { class: 'dcard-sub hero-lead' }, t('home.hero.lead')),
              h('div', { class: 'hero-chips' },
                h('span', { class: 'hero-period' }, h('strong', {}, fmt.period(lastValid.from, lastValid.to)), ' · ', t('home.hero.meta', { n: fmt.int(outletsActive), date: fmt.date(data.updatedAt) })))))

          const wide = (stat) => { stat.classList.remove('c-4'); return stat }
          const stats = [
            wide(Stat({ kpi: 'K01', label: t('home.k01'), value: fmt.int(collected), empty: !collected,
              sub: previous ? t('change.vsPrevious', { sign: '', value: `${fmt.signed(((collected - previous) / previous) * 100)}%` }) : t('home.stat.k01.avg', { n: fmt.int(Math.round(collected / len)) }),
              viz: Spark(totals, i0, i1, t('home.daily.title'), { w: 96, hgt: 24 }) })),
            wide(Stat({ kpi: 'K02', label: t('home.k02'), value: fmt.int(outletsActive), sub: t('home.k02.hint'), empty: !outletsActive })),
            wide(Stat({ kpi: 'K03', label: t('home.k03'), value: analysed ? fmt.pct(newsTotal / analysed) : '', empty: !analysed,
              sub: t('home.k03.hint', { news: fmt.int(newsTotal), analysed: fmt.int(analysed) }), viz: analysed ? UI.HBar(newsTotal / analysed, 1) : null })),
            wide(Stat({ kpi: 'K04', label: t('home.k04'), value: newsTotal ? fmt.pct(news[0].count / newsTotal) : '', empty: !newsTotal,
              sub: newsTotal ? t('home.k04.hint', { issue: name(news[0].issue) }) : null, viz: newsTotal ? UI.HBar(news[0].count / newsTotal, 1) : null }))
          ]
          
          // The top story of the day. A pick in the calendar or the chart draws this card again.
          const groupSlug = ix ? ix.groupSlug : new Map()
          const dayCard = () => Home.DayCard(ix ? Home.dayInfo(ix, selected) : null, { totals, isLast: selected === dates.length - 1, groupSlug })
          let day = dayCard()

          const strip = Home.DayStrip({ dates, totals, i0, i1, selected, onPick: (i) => pick(i, 'strip') })

          const left = h('div', { class: 'c-7 card-col card-col-fill' }, hero, h('div', { class: 'stats-2x2 home-stats' }, ...stats), strip.node)

          const days = dates.slice(i0, i1 + 1)
          const daily = totals.slice(i0, i1 + 1)
          const avg = collected / len
          const chart = () => UI.BarChart({
            dates: days, values: daily, label: t('home.daily.title'), height: 300, picked: selected - i0, onPick: (j) => pick(i0 + j, 'chart'),
            reference: { value: avg, label: t('home.daily.avg', { n: fmt.int(Math.round(avg)) }) },
            tooltipOf: (i) => `${fmt.date(days[i])}: ${fmt.int(daily[i])}`
          })
          const chartBody = h('div', {}, chart())
          const dailyCard = card('c-7', cardHead(t('home.daily.title'), null, t('home.daily.info')), chartBody)

          function pick (i, from) {
            selected = i
            const next = dayCard()
            day.replaceWith(next)
            day = next
            if (from === 'chart') strip.select(i)
            else chartBody.replaceChildren(chart())
          }

          const topicsCard = card('c-7', cardHead(t('home.topics.title'), null, t('home.topics.note')),
            UI.DataTable({
              rankColumn: true, emptyText: t('home.topics.empty'), pageSize: 14, moreStep: 8,
              rows: news.filter((x) => x.count > 0),
              columns: [
                { label: t('home.col.issue'), render: (r) => name(r.issue) },
                { label: t('home.col.articles'), num: true, render: (r) => fmt.int(r.count) },
                { label: t('home.col.share'), num: true, render: (r) => fmt.pct(r.count / newsTotal) },
                { label: '', phone: false, render: (r) => UI.HBar(r.count / newsTotal, news[0].count / newsTotal) }
              ]
            }))

          const side = h('div', { class: 'c-5 card-col card-col-fill' }, highlights(), Home.AnalysesCard())
          content.replaceChildren(Dash.TopBar({ title: t('home.title'), actions: [picker], quiet: true }),
            h('div', { class: 'dash-grid home-grid' }, left, day, dailyCard, Home.TrendsCard({ home: data, i0, i1 }), topicsCard, side), protoNote())
        }
        draw()
      }
    })

    // The highlights card of the media, for the days of the period that the set has. It is left out when the set does not cover the period.
    function highlights () {
      if (mme.kind !== 'data' || !mme.data.sets.gr) return null
      const set = mme.data.sets.gr
      const i0 = set.dates.indexOf(lastValid.from)
      const i1 = set.dates.indexOf(lastValid.to)
      if (i0 < 0 || i1 < i0) return null
      const el = Mme.HighlightsCard(Mme.summary(set, i0, i1))
      el.classList.remove('c-12')
      el.querySelector('.dcard-head').after(h('p', { class: 'dcard-sub' }, t('mme.home.note')))
      return el
    }

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
