<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <base href="/">
  <script src="assets/routes.js?v=4"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=37">
  <link rel="stylesheet" href="assets/app.css?v=69">
  <link rel="stylesheet" href="assets/dash.css?v=94">
  <link rel="stylesheet" href="assets/politics.css?v=12">
  <script src="assets/page-move.js?v=4"></script>
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=11"></script>
  <script src="assets/messages.js?v=42"></script>
  <script src="assets/messages-v2.js?v=50"></script>
  <script src="assets/messages-politics.js?v=16"></script>
  <script src="assets/components.js?v=18"></script>
  <script src="assets/motion.js?v=5"></script>
  <script src="assets/dash.js?v=24"></script>
  <script src="assets/politics.js?v=11"></script>
  <script src="assets/shell.js?v=71"></script>
  <script src="data/statements.js?v=1"></script>
  <script>
    // Πρόσωπα, Δηλώσεις (from Πολιτική): the statement tracker (C11). The two names of one person are one row, and the rank has its own column.
    // The totals are the sub line of the table card, not stat cards. The counts are not the «δηλώσεις» of the overview, which come from ΜΜΕ & πρόσωπα.
    const { t, fmt, h, load } = App
    const { reset, card, cardHead, TopBar } = Dash
    const result = load('statements', ['rows'], (b) => b.rows)

    Shell.start({
      id: 'statements',
      route: '/track',
      dash: true,
      title: () => t('nav.people'),
      breadcrumbs: () => [{ label: t('nav.people') }, { label: t('tab.people.statements') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        const title = t('tab.people.statements')
        const problem = Dash.stateContent([result], { title, tabs, quiet: true })
        if (problem) { content.replaceChildren(...problem); return }
        const rows = result.data.rows
        const bar = TopBar({ title, tabs, quiet: true })
        const sum = (k) => fmt.int(rows.reduce((a, r) => a + r[k], 0))
        const max = rows[0] ? rows[0].total : 1
        // #60: the title names the person quoted the most and the share of all the statements.
        const all = rows.reduce((a, r) => a + r.total, 0)
        const table = card('c-12', cardHead(rows[0] ? t('st.table.finding', { name: rows[0].speaker, share: fmt.pct(rows[0].total / (all || 1)) }) : t('st.table.title'), null, `${t('st.table.title')}. ${t('st.table.info')}`),
          h('p', { class: 'dcard-sub' }, t('st.table.sub', { total: sum('total'), promises: sum('promises'), predictions: sum('predictions'), n: fmt.int(rows.length) })),
          UI.DataTable({
            rows, rankColumn: true, pageSize: 10,
            columns: [
              { label: t('st.col.person'), render: (r) => h('span', { class: 'leader-cell' }, r.speaker, r.names.length > 1 ? h('span', { class: 'row-sub' }, t('st.names', { names: r.names.filter((n) => n !== r.speaker).join(', ') })) : null) },
              { label: t('st.col.total'), num: true, render: (r) => UI.HBar(r.total, max, { text: fmt.int(r.total) }) },
              { label: t('st.col.promises'), num: true, render: (r) => (r.promises ? fmt.int(r.promises) : h('span', { class: 'mini-empty' }, '0')) },
              { label: t('st.col.predictions'), num: true, render: (r) => (r.predictions ? fmt.int(r.predictions) : h('span', { class: 'mini-empty' }, '0')) }
            ]
          }))
        content.replaceChildren(bar, h('div', { class: 'dash-grid' }, table), h('p', { class: 'proto-note' }, t('st.note')))
      }
    })
    reset()
  </script>
</body>
</html>
