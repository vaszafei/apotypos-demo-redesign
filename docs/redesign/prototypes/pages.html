<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=15">
  <link rel="stylesheet" href="assets/app.css?v=43">
  <link rel="stylesheet" href="assets/dash.css?v=86">
  <script src="assets/page-move.js?v=1"></script>
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=9"></script>
  <script src="assets/messages.js?v=36"></script>
  <script src="assets/messages-v2.js?v=47"></script>
  <script src="assets/components.js?v=13"></script>
  <script src="assets/motion.js?v=2"></script>
  <script src="assets/dash.js?v=20"></script>
  <script src="assets/shell.js?v=58"></script>
  <script src="data/pages.js"></script>
  <script>
    // The table of all 58 routes. scripts/make-pages-table.py makes data/pages.js from the route map.
    const { t, h } = App
    const { rows, counts } = window.FIXTURES.pages
    const view = { type: 'all' }
    const types = ['Dashboard', 'Ranked list', 'Detail', 'Matrix', 'Explorer', 'Text', 'Removed']

    Shell.start({
      id: 'pages',
      title: () => t('pages.title'),
      breadcrumbs: () => [{ label: t('pages.title') }],
      render (content) {
        const draw = () => {
          const visible = rows.filter((r) => view.type === 'all' || r.type === view.type)
          const table = UI.DataTable({
            rows: visible, pageSize: Infinity, emptyText: t('media.empty'),
            rowId: (r) => Shell.routeAnchor(r.route),
            columns: [
              { label: t('pages.col.route'), render: (r) => [
                h('code', {}, r.route),
                h('details', { class: 'row-details' }, h('summary', {}, t('pages.details')),
                  h('dl', {},
                    h('dt', {}, t('pages.col.status')), h('dd', {}, r.status),
                    r.kpis.length > 0 && [h('dt', {}, t('pages.col.kpis')), h('dd', {}, r.kpis.map((k) => h('span', { style: { display: 'block' }, lang: 'en' }, `${k.id} ${k.name}`)))],
                    r.kpis.length > 0 && [h('dt', {}, t('pages.col.data')), h('dd', {}, [...new Set(r.kpis.map((k) => k.path))].map((p) => h('code', { style: { display: 'block' } }, p)))],
                    h('dt', {}, t('pages.col.note')), h('dd', { lang: 'en' }, r.note)))
              ] },
              { label: t('pages.col.type'), render: (r) => t(`type.${r.type}`) },
              { label: t('pages.col.section'), render: (r) => Shell.placeOf(r.route.split('?')[0]) || t(`place.${r.section}`) },
              { label: t('pages.col.prototype'), render: (r) => r.prototype
                ? h('a', { href: r.prototype }, t('pages.prototype.own'))
                : h('a', { href: r.typePrototype }, t('pages.prototype.type')) }
            ]
          })
          content.replaceChildren(
            UI.PageHeader({ title: t('pages.title'), hint: t('pages.hint') }),
            h('p', { 'data-testid': 'page-counts' }, t('pages.counts', counts)),
            Tree(),
            Tokens(),
            Cards(),
            UI.FilterBar(h('div', { class: 'field' }, t('pages.filter.type'), UI.SegmentedControl({
              label: t('pages.filter.type'), value: view.type, onChange: (v) => { view.type = v; draw() },
              options: [{ value: 'all', label: t('pages.filter.all') }, ...types.map((x) => ({ value: x, label: t(`type.${x}`) }))]
            }))),
            h('section', { class: 'card' }, table))
          markTarget()
        }
        draw()
      }
    })

    // The tree of the sidebar (#62): each section with its tabs and sub-tabs, the question of each and its link. It is made from the same NAV as the sidebar.
    function Tree () {
      return h('section', { class: 'card page-tree', 'aria-labelledby': 'page-tree-title' },
        h('h2', { id: 'page-tree-title' }, t('pages.tree.title')),
        h('p', { class: 'muted-text' }, t('pages.tree.hint')),
        Shell.tree().map((item) => h('div', {},
          h('h3', {}, item.label),
          h('ul', {}, item.pages.map((p) => h('li', {}, h('a', { href: p.href }, p.label), p.question ? h('span', { class: 'muted-text' }, ` · ${p.question}`) : null))))))
    }

    // The card (#2): head, body, the link under it and the three states, in the two looks that pages use today.
    function Cards () {
      const swap = (card, kind) => {
        const body = card.querySelector('[data-state]')
        const next = kind === 'error' ? Dash.cardState('error', null, () => { swap(card, 'loading'); setTimeout(() => swap(card, 'error'), 1200) }) : Dash.cardState(kind, t(`pages.cards.${kind}`))
        body.replaceWith(next)
      }
      const state = (kind) => {
        const card = Dash.card('c-4', Dash.cardHead(t(`pages.cards.state.${kind}`)), Dash.cardState(kind, t(`pages.cards.${kind}`)))
        if (kind === 'error') swap(card, 'error')
        return card
      }
      const row = (cls) => h('div', { class: `dash ${cls}` }, h('h3', {}, t(`pages.cards.look.${cls || 'plain'}`)), h('div', { class: 'dash-grid' },
        Dash.card('c-4', Dash.cardHead(t('pages.cards.title.plain')), h('p', { class: 'dcard-sub' }, t('pages.cards.body'))),
        Dash.card('c-4', Dash.cardHead(t('pages.cards.title.full'), h('span', { class: 'dcard-sub' }, t('pages.cards.tools')), t('pages.cards.info')),
          h('p', { class: 'dcard-sub' }, t('pages.cards.sub')), h('p', {}, t('pages.cards.body')),
          Dash.cardFoot(h('a', { class: 'dcard-link', href: '#' }, t('pages.cards.link'), ' →'))),
        state('loading'), state('empty'), state('error')))
      return h('section', { class: 'card page-cards', 'aria-labelledby': 'page-cards-title' },
        h('h2', { id: 'page-cards-title' }, t('pages.cards.heading')),
        h('p', { class: 'muted-text' }, t('pages.cards.hint')), row(''), row('minimal'))
    }

    // The color tokens (#2), layer by layer. Each swatch reads its token, so a theme switch shows that theme.
    function Tokens () {
      const range = (prefix, from, to) => Array.from({ length: to - from + 1 }, (_, i) => `${prefix}${from + i}`)
      const LAYERS = [
        ['neutral', ['--surface-page', '--surface-card', '--surface-raised', '--surface-sunken', '--ink', '--text-primary', '--text-secondary', '--border', '--rule', '--bar-track', '--bar-muted']],
        ['accent', ['--accent', '--focus']],
        ['cat', [...range('--cat-', 0, 9), '--cat-strong']],
        ['seq', range('--seq-', 1, 7)],
        ['div', ['--stance-critical', '--stance-critical-strong', '--stance-neutral', '--stance-supportive', '--div-mid', '--emph-less', '--emph-more', '--side-a', '--side-b']],
        ['series', ['--series-1', '--series-other']],
        ['status', ['--error-text', '--error-bg', '--notice-text', '--notice-bg', '--success-text', '--success-bg', '--target-bg', '--status-ok', '--status-over', '--status-open', '--status-no']],
        ['party', ['--party-nd', '--party-syriza', '--party-pasok', '--party-kke', '--party-el', '--party-plefsi', '--party-near', '--party-fl', '--party-mera25', '--party-niki']]
      ]
      // A step of the sequential ramp shows its text color on it.
      const swatch = (name) => h('li', { class: 'token-item' },
        h('span', { class: 'token-chip', style: `background:var(${name});${name.startsWith('--seq-') ? `color:var(${name.replace('--seq-', '--seq-text-')})` : ''}` }, name.startsWith('--seq-') ? 'Aa' : null),
        h('code', {}, name))
      return h('section', { class: 'card page-tokens', 'aria-labelledby': 'page-tokens-title' },
        h('h2', { id: 'page-tokens-title' }, t('pages.tokens.title')),
        h('p', { class: 'muted-text' }, t('pages.tokens.hint')),
        LAYERS.map(([key, names]) => h('div', {}, h('h3', {}, t(`pages.tokens.${key}`)), h('ul', { class: 'token-list' }, names.map(swatch)))))
    }

    // The rows render after the page loads, so the browser cannot scroll to the hash by itself.
    function markTarget () {
      const id = decodeURIComponent(location.hash.slice(1))
      const row = id && document.getElementById(id)
      if (!row) return
      row.classList.add('is-target')
      row.scrollIntoView({ block: 'center' })
    }
    window.addEventListener('hashchange', () => { document.querySelectorAll('.is-target').forEach((r) => r.classList.remove('is-target')); markTarget() })
  </script>
</body>
</html>
