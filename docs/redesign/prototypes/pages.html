<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=15">
  <link rel="stylesheet" href="assets/app.css?v=51">
  <link rel="stylesheet" href="assets/dash.css?v=103">
  <link rel="stylesheet" href="assets/politics.css?v=8">
  <link rel="stylesheet" href="assets/date-range.css?v=15">
  <link rel="stylesheet" href="assets/parts.css?v=3">
  <script src="assets/page-move.js?v=1"></script>
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=9"></script>
  <script src="assets/messages.js?v=45"></script>
  <script src="assets/messages-v2.js?v=59"></script>
  <script src="assets/messages-mme.js?v=29"></script>
  <script src="assets/messages-parts.js?v=2"></script>
  <script src="assets/components.js?v=20"></script>
  <script src="assets/motion.js?v=4"></script>
  <script src="assets/dash.js?v=30"></script>
  <script src="assets/date-range.js?v=5"></script>
  <script src="assets/parts.js?v=2"></script>
  <script src="assets/politics.js?v=11"></script>
  <script src="assets/shell.js?v=64"></script>
  <script src="data/pages.js"></script>
  <script>
    // The table of all 58 routes. scripts/make-pages-table.py makes data/pages.js from the route map.
    const { t, h, fmt } = App
    const { rows, counts } = window.FIXTURES.pages
    const view = { type: 'all' }
    const types = ['Dashboard', 'Ranked list', 'Detail', 'Matrix', 'Explorer', 'Text', 'Removed']

    Shell.start({
      id: 'pages',
      title: () => t('pages.title'),
      breadcrumbs: () => [{ label: t('pages.title') }],
      render (content) {
        // The sections above the table are built once: a filter change draws only the filter bar and the table, so the parts keep their state and the frame does not reload.
        content.replaceChildren(
          UI.PageHeader({ title: t('pages.title'), hint: t('pages.hint') }),
          h('p', { 'data-testid': 'page-counts' }, t('pages.counts', counts)),
          h('div', { class: 'dash' }, h('div', { class: 'dash-grid' }, Tree(), Tokens(), Cards(), Stats(), Charts(), PartsSection())))
        let shown = []
        const draw = () => {
          const visible = rows.filter((r) => view.type === 'all' || r.type === view.type)
          const table = UI.DataTable({
            rows: visible, pageSize: Infinity, emptyText: t('media.empty'),
            rowId: (r) => Shell.routeAnchor(r.route),
            columns: [
              { label: t('pages.col.route'), render: (r) => [
                h('code', {}, r.route),
                h('details', { class: 'row-details' }, h('summary', {}, t('pages.details')),
                  h('dl', {},
                    h('dt', {}, t('pages.col.status')), h('dd', {}, r.status),
                    r.kpis.length > 0 && [h('dt', {}, t('pages.col.kpis')), h('dd', {}, r.kpis.map((k) => h('span', { style: { display: 'block' }, lang: 'en' }, `${k.id} ${k.name}`)))],
                    r.kpis.length > 0 && [h('dt', {}, t('pages.col.data')), h('dd', {}, [...new Set(r.kpis.map((k) => k.path))].map((p) => h('code', { style: { display: 'block' } }, p)))],
                    h('dt', {}, t('pages.col.note')), h('dd', { lang: 'en' }, r.note)))
              ] },
              { label: t('pages.col.type'), render: (r) => t(`type.${r.type}`) },
              { label: t('pages.col.section'), render: (r) => Shell.placeOf(r.route.split('?')[0]) || t(`place.${r.section}`) },
              { label: t('pages.col.prototype'), render: (r) => r.prototype
                ? h('a', { href: r.prototype }, t('pages.prototype.own'))
                : h('a', { href: r.typePrototype }, t('pages.prototype.type')) }
            ]
          })
          shown.forEach((node) => node.remove())
          shown = [
            UI.FilterBar(h('div', { class: 'field' }, t('pages.filter.type'), UI.SegmentedControl({
              label: t('pages.filter.type'), value: view.type, onChange: (v) => { view.type = v; draw() },
              options: [{ value: 'all', label: t('pages.filter.all') }, ...types.map((x) => ({ value: x, label: t(`type.${x}`) }))]
            }))),
            h('div', { class: 'dash' }, h('div', { class: 'dash-grid' }, Dash.card('c-12', table)))]
          content.append(...shown)
          markTarget()
        }
        draw()
      }
    })

    // The tree of the sidebar (#62): each section with its tabs and sub-tabs, the question of each and its link. It is made from the same NAV as the sidebar.
    function Tree () {
      return Dash.card('c-12 page-tree',
        h('h2', { id: 'page-tree-title' }, t('pages.tree.title')),
        h('p', { class: 'muted-text' }, t('pages.tree.hint')),
        Shell.tree().map((item) => h('div', {},
          h('h3', {}, item.label),
          h('ul', {}, item.pages.map((p) => h('li', {}, h('a', { href: p.href }, p.label), p.question ? h('span', { class: 'muted-text' }, ` · ${p.question}`) : null))))))
    }

    // The card (#2): head, body, the link under it and the three states, in the two looks that pages use today.
    function Cards () {
      const swap = (card, kind) => {
        const body = card.querySelector('[data-state]')
        const next = kind === 'error' ? Dash.cardState('error', null, () => { swap(card, 'loading'); setTimeout(() => swap(card, 'error'), 1200) }) : Dash.cardState(kind, t(`pages.cards.${kind}`))
        body.replaceWith(next)
      }
      const state = (kind) => {
        const card = Dash.card('c-4', Dash.cardHead(t(`pages.cards.state.${kind}`)), Dash.cardState(kind, t(`pages.cards.${kind}`)))
        if (kind === 'error') swap(card, 'error')
        return card
      }
      const row = (cls) => h('div', { class: `dash ${cls}` }, h('h3', {}, t(`pages.cards.look.${cls || 'plain'}`)), h('div', { class: 'dash-grid' },
        Dash.card('c-4', Dash.cardHead(t('pages.cards.title.plain')), h('p', { class: 'dcard-sub' }, t('pages.cards.body'))),
        Dash.card('c-4', Dash.cardHead(t('pages.cards.title.full'), h('span', { class: 'dcard-sub' }, t('pages.cards.tools')), t('pages.cards.info')),
          h('p', { class: 'dcard-sub' }, t('pages.cards.sub')), h('p', {}, t('pages.cards.body')),
          Dash.cardFoot(h('a', { class: 'dcard-link', href: '#' }, t('pages.cards.link'), ' →'))),
        state('loading'), state('empty'), state('error')))
      return Dash.card('c-12 page-cards',
        h('h2', { id: 'page-cards-title' }, t('pages.cards.heading')),
        h('p', { class: 'muted-text' }, t('pages.cards.hint')), row(''), row('minimal'))
    }

    // The stat card (#2): the number, the short line, the change against the previous period and a small picture. The compact variant is the one of Μέσα › Επισκόπηση.
    function Stats () {
      const spark = () => Dash.Spark([4, 6, 5, 9, 7, 12, 10], 0, 6, t('pages.stats.spark'), { w: 80, hgt: 22 })
      const forms = (variant) => [
        Dash.Stat({ variant, label: t('pages.stats.plain'), value: '1.248', sub: t('pages.stats.sub') }),
        Dash.Stat({ variant, label: t('pages.stats.up'), value: '1.248', delta: 0.12, sub: t('pages.stats.delta') }),
        Dash.Stat({ variant, label: t('pages.stats.down'), value: '1.102', delta: -0.08, sub: t('pages.stats.delta') }),
        Dash.Stat({ variant, label: t('pages.stats.viz'), value: '1.248', sub: t('pages.stats.sub'), viz: spark() }),
        Dash.Stat({ variant, label: t('pages.stats.bar'), value: '62%', sub: t('pages.stats.sub'), viz: UI.HBar(0.62, 1, { label: '62%' }) }),
        Dash.Stat({ variant, label: t('pages.stats.empty'), empty: true })]
      return Dash.card('c-12 page-stats',
        h('h2', { id: 'page-stats-title' }, t('pages.stats.heading')),
        h('p', { class: 'muted-text' }, t('pages.stats.hint')),
        h('div', { class: 'dash' }, h('h3', {}, t('pages.stats.look.plain')), h('div', { class: 'dash-grid' }, forms())),
        h('div', { class: 'dash' }, h('h3', {}, t('pages.stats.look.compact')), h('div', { class: 'dash-grid' }, h('div', { class: 'c-6' }, h('div', { class: 'stats-2x2' }, forms('compact'))))))
    }

    // The charts (#2): one of each type that has shared code, with sample data. The types that live in one page are listed with their page.
    function Charts () {
      const days = t('pages.charts.days').split(',')
      const [c1, c2, c3] = Dash.SLOTS
      const item = (key, ...body) => Dash.card('c-6', Dash.cardHead(t(`pages.charts.${key}`)), ...body)
      const owner = UI.OwnershipMap({ max: 1, caption: t('pages.charts.owner'), groups: [{ title: t('pages.charts.owner.title'), shareText: t('pages.charts.owner.share'),
        outlets: [0.7, 0.4].map((v, i) => ({ name: `${t('pages.charts.owner.outlet')} ${i + 1}`, value: v, valueText: fmt.pct(v) })) }] })
      const matrix = UI.MatrixChart({ caption: t('pages.charts.matrix.caption'), rowHeader: t('pages.charts.matrix.row'),
        rows: [1, 2, 3].map((i) => ({ label: `${t('pages.charts.matrix.row')} ${i}` })), columns: [1, 2, 3].map((i) => ({ label: `${t('pages.charts.matrix.col')} ${i}` })),
        cell: (r, c) => { const v = ((r + 1) * (c + 2)) % 5 / 5; return { ...Dash.seq(v), text: fmt.pct(v), title: `${t('pages.charts.matrix.row')} ${r + 1}, ${t('pages.charts.matrix.col')} ${c + 1}: ${fmt.pct(v)}` } } })
      const OWN = [['scatter', 'media-v2.html'], ['timeline', 'cases-v2.html'], ['bubbles', 'groups-v2.html'], ['sunburst', 'groups-v2.html']]
      return Dash.card('c-12 page-charts',
        h('h2', { id: 'page-charts-title' }, t('pages.charts.heading')),
        h('p', { class: 'muted-text' }, t('pages.charts.hint')),
        h('div', { class: 'dash' }, h('div', { class: 'dash-grid' },
          item('bar', UI.BarChart({ labels: days, values: [12, 18, 9, 22, 15, 7, 11], height: 180, label: t('pages.charts.aria.bar') })),
          item('stacked', UI.BarChart({ labels: days, height: 180, label: t('pages.charts.aria.bar'),
            series: [{ name: t('pages.charts.series.a'), color: c1, values: [8, 10, 5, 12, 9, 4, 6] }, { name: t('pages.charts.series.b'), color: c2, values: [4, 8, 4, 10, 6, 3, 5] }] })),
          item('line', Politics.LineChart({ labels: days, height: 180, zero: true, yFormat: fmt.int, aria: t('pages.charts.aria.line'),
            series: [{ label: t('pages.charts.series.a'), color: c1, values: [3, 5, 4, 8, 6, 9, 7] }, { label: t('pages.charts.series.b'), color: c2, values: [6, 4, 5, 3, 4, 2, 3] }] })),
          item('spark', Dash.Spark([4, 6, 5, 9, 7, 12, 10], 0, 6, t('pages.stats.spark'))),
          item('hbar', UI.HBar(0.62, 1, { text: '62%', label: '62%' })),
          item('parts', UI.StackedBar([{ label: t('pages.charts.part.a'), value: 35, color: UI.STANCE_COLORS[0] }, { label: t('pages.charts.part.b'), value: 45, color: UI.STANCE_COLORS[1] }, { label: t('pages.charts.part.c'), value: 20, color: UI.STANCE_COLORS[2] }])),
          item('diverging', UI.DivergingBar({ left: 0.35, middle: 0.2, right: 0.45, scale: 0.6, label: t('pages.charts.diverging') })),
          item('matrix', matrix),
          item('owner', owner))),
        h('h3', {}, t('pages.charts.own')),
        h('ul', {}, OWN.map(([key, href]) => h('li', {}, h('a', { href }, t(`pages.charts.own.${key}`)), h('span', { class: 'muted-text' }, ` · ${href}`)))))
    }

    // The parts (#2): the patterns of the live-site audit, with sample data. Only this page shows them.
    function PartsSection () {
      const k = (key) => t(`pages.parts.${key}`)
      const summary = Parts.Summary({ title: k('sum.title'), info: k('sum.info'),
        items: [{ text: k('sum.1'), href: 'topics-v2.html', link: k('sum.link') }, { text: k('sum.2') }, { text: k('sum.3') }] })
      const summaryEmpty = Parts.Summary({ title: k('sum.empty'), items: [] })
      const quotes = Parts.Quotes({ title: k('hlq.title'), info: k('hlq.info'),
        headlines: [
          { title: k('hlq.h1'), url: 'https://example.org/1', outlet: `${k('hlq.outlet')} 1`, date: '2026-09-28', angle: k('hlq.angle1'), frame: k('hlq.frame1'), stance: 'supportive' },
          { title: k('hlq.h2'), url: 'https://example.org/2', outlet: `${k('hlq.outlet')} 2`, date: '2026-09-27', angle: k('hlq.angle2'), frame: k('hlq.frame2'), stance: 'critical' },
          { title: k('hlq.h3'), outlet: `${k('hlq.outlet')} 3`, date: '2026-09-25', frame: k('hlq.frame3'), stance: 'neutral' }],
        quotes: [{ text: k('hlq.q1'), source: `${k('hlq.source')} 1`, url: 'https://example.org/3', date: '2026-09-28' }, { text: k('hlq.q2'), source: `${k('hlq.source')} 2`, date: '2026-09-27' }] })
      // The filters keep their own state and draw their controls again on a change. The pressed button gets the focus back,
      // and the summary line stays the same node, so a screen reader announces the new text.
      const filters = { topic: 'all', set: 'gr' }
      const TOPICS = [['all', 120], ['economy', 42], ['health', 31], ['foreign', 27], ['education', 20]]
      const filterCard = () => {
        const controls = h('div', { class: 'fchip-controls' })
        const picked = h('p', { class: 'dcard-sub', 'aria-live': 'polite' })
        const draw = () => {
          const focused = [...controls.querySelectorAll('button')].indexOf(document.activeElement)
          controls.replaceChildren(
            Parts.Chips({ label: k('filters.topics'), value: filters.topic, onChange: (key) => { filters.topic = key; draw() },
              items: TOPICS.map(([key, n]) => ({ key, n, label: k(`filters.${key}`) })) }),
            Parts.DataSwitch({ value: filters.set, onChange: (v) => { filters.set = v; draw() } }))
          if (focused >= 0) controls.querySelectorAll('button')[focused]?.focus()
          picked.textContent = t('pages.parts.filters.picked', { topic: k(`filters.${filters.topic}`), set: t(`parts.set.${filters.set}`) })
        }
        draw()
        return Dash.card('c-6 fchip-card', Dash.cardHead(k('filters.title'), null, k('filters.info')), controls, picked)
      }
      // C: 61 days of sample volumes. D: 12 outlets × 8 topics, with a few cells under the minimum of 20 articles.
      const dates = Array.from({ length: 61 }, (_, i) => new Date(Date.UTC(2026, 7, 1 + i)).toISOString().slice(0, 10))
      const presets = UI.periodPresets(dates)
      const last14 = presets.find((p) => p.key === 'last14')
      const period = Parts.Period({ title: k('brush.title'), info: k('brush.info'), dates, presets, from: last14.from, to: last14.to,
        values: dates.map((_, i) => Math.round(80 + 35 * Math.sin(i / 4) + ((i * 37) % 23))), onChange: () => {} })
      const heatmap = Parts.Heatmap({ title: k('hmx.title'), info: k('hmx.info'), rowHeader: k('hmx.row'), minN: 20,
        rows: Array.from({ length: 12 }, (_, i) => ({ label: `${k('hmx.row')} ${i + 1}` })),
        columns: k('hmx.topics').split(',').map((label) => ({ label })),
        cell: (r, c) => ({ v: (((r + 1) * (c + 3)) % 11) / 30, n: (r * 17 + c * 29) % 90 }) })
      // The report frame, with a standalone report of reports/france-riots/ (#38 decides where it is used).
      const frame = Parts.Frame({ src: 'reports/france-riots/compare.html', title: k('frame.title'), back: 'france-v2.html' })
      const method = Parts.Method({ lead: k('method.lead'),
        sections: [{ heading: k('method.data'), text: k('method.data.text') }, { heading: k('method.measure'), text: k('method.measure.text') }],
        limits: [k('method.limit1'), k('method.limit2')] })
      return Dash.card('c-12 page-parts',
        h('h2', { id: 'page-parts-title' }, k('heading')),
        h('p', { class: 'muted-text' }, k('hint')),
        h('div', { class: 'dash' }, h('div', { class: 'dash-grid' }, summary, summaryEmpty, quotes, filterCard(), period, heatmap, method, frame)))
    }

    // The color tokens (#2), layer by layer. Each swatch reads its token, so a theme switch shows that theme.
    function Tokens () {
      const range = (prefix, from, to) => Array.from({ length: to - from + 1 }, (_, i) => `${prefix}${from + i}`)
      const LAYERS = [
        ['neutral', ['--surface-page', '--surface-card', '--surface-raised', '--surface-sunken', '--ink', '--text-primary', '--text-secondary', '--border', '--rule', '--bar-track', '--bar-muted']],
        ['accent', ['--accent', '--focus']],
        ['cat', [...range('--cat-', 0, 9), '--cat-strong']],
        ['seq', range('--seq-', 1, 7)],
        ['div', ['--stance-critical', '--stance-critical-strong', '--stance-neutral', '--stance-supportive', '--div-mid', '--emph-less', '--emph-more', '--side-a', '--side-b']],
        ['series', ['--series-1', '--series-other']],
        ['status', ['--error-text', '--error-bg', '--notice-text', '--notice-bg', '--success-text', '--success-bg', '--target-bg', '--status-ok', '--status-over', '--status-open', '--status-no']],
        ['party', ['--party-nd', '--party-syriza', '--party-pasok', '--party-kke', '--party-el', '--party-plefsi', '--party-near', '--party-fl', '--party-mera25', '--party-niki']]
      ]
      // A step of the sequential ramp shows its text color on it.
      const swatch = (name) => h('li', { class: 'token-item' },
        h('span', { class: 'token-chip', style: `background:var(${name});${name.startsWith('--seq-') ? `color:var(${name.replace('--seq-', '--seq-text-')})` : ''}` }, name.startsWith('--seq-') ? 'Aa' : null),
        h('code', {}, name))
      return Dash.card('c-12 page-tokens',
        h('h2', { id: 'page-tokens-title' }, t('pages.tokens.title')),
        h('p', { class: 'muted-text' }, t('pages.tokens.hint')),
        LAYERS.map(([key, names]) => h('div', {}, h('h3', {}, t(`pages.tokens.${key}`)), h('ul', { class: 'token-list' }, names.map(swatch)))))
    }

    // The rows render after the page loads, so the browser cannot scroll to the hash by itself.
    function markTarget () {
      const id = decodeURIComponent(location.hash.slice(1))
      const row = id && document.getElementById(id)
      if (!row) return
      row.classList.add('is-target')
      row.scrollIntoView({ block: 'center' })
    }
    window.addEventListener('hashchange', () => { document.querySelectorAll('.is-target').forEach((r) => r.classList.remove('is-target')); markTarget() })
  </script>
</body>
</html>
