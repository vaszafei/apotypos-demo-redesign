<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=4">
  <link rel="stylesheet" href="assets/app.css?v=12">
  <link rel="stylesheet" href="assets/dash.css?v=55">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=3"></script>
  <script src="assets/messages.js?v=17"></script>
  <script src="assets/messages-v2.js?v=29"></script>
  <script src="assets/components.js?v=6"></script>
  <script src="assets/dash.js?v=11"></script>
  <script src="assets/vendor/d3-hierarchy.min.js"></script>
  <script src="assets/shell.js?v=31"></script>
  <script src="data/groups.js?v=2"></script>
  <script src="data/media.js"></script>
  <script>
    // Media, Ιδιοκτησία: dashboard of APO-161. The group, the owner and the articles come from the static files,
    // so the period is fixed (1 Aug to 30 Sep 2026): there is no period control. The period is in the note of the table.
    const { t, fmt, h, load } = App
    const { fit, reset, niceStep, NO_GROUP, card, cardHead, emptyText, TopBar, textOn, tint } = Dash
    const result = load('groups', ['groups', 'ungrouped', 'totalCollected', 'window'], (b) => b.groups)
    // The daily articles of each outlet (the same period and the same groups as the groups file).
    const media = load('media', ['dates', 'outlets', 'outletDaily'], (b) => b.outlets)
    // A day with fewer articles than this is a gap of the crawler, not a quiet day.
    const GAP = 50

    // Stacked columns: one for each day, one segment for each group. A gap day has a dashed band.
    function VolumeChart ({ dates, stacks, order }) {
      const totals = stacks.map((s) => s.reduce((a, b) => a + b.value, 0))
      return fit((holder, width) => {
        const height = 280
        const pad = { top: 8, right: 4, bottom: 24, left: 44 }
        const step = niceStep(Math.max(...totals, 1) / 4)
        const top = Math.ceil(Math.max(...totals, 1) / step) * step
        const plotW = width - pad.left - pad.right
        const plotH = height - pad.top - pad.bottom
        const bw = plotW / dates.length
        const y = (v) => pad.top + plotH - (v / top) * plotH
        const svg = h('svg', { class: 'chart', width, height, viewBox: `0 0 ${width} ${height}`, 'aria-hidden': 'true' })
        for (let v = 0; v <= top; v += step) {
          svg.append(h('line', { class: 'grid-line', x1: pad.left, x2: width - pad.right, y1: y(v), y2: y(v) }),
            h('text', { x: pad.left - 6, y: y(v) + 4, 'text-anchor': 'end' }, fmt.int(v)))
        }
        const every = Math.max(7, Math.ceil(64 / bw))
        stacks.forEach((segs, i) => {
          const x = pad.left + i * bw
          const w = Math.max(1, bw * 0.6)
          const bx = x + (bw - w) / 2
          if (totals[i] < GAP) svg.append(h('rect', { class: 'gap-band', x: x + 1, y: pad.top, width: Math.max(1, bw - 2), height: plotH }))
          let base = 0
          segs.forEach((s) => {
            if (!s.value) return
            svg.append(h('rect', { x: bx, y: y(base + s.value), width: w, height: Math.max(0.5, (s.value / top) * plotH - 0.5), fill: s.color }))
            base += s.value
          })
          if (i % every === 0) svg.append(h('text', { x: x + bw / 2, y: height - 7, 'text-anchor': 'middle' }, fmt.date(dates[i], { day: 'numeric', month: 'short' })))
        })
        const tipOf = (i) => [t('g2.volume.tip', { date: fmt.date(dates[i]), n: fmt.int(totals[i]) }) + (totals[i] < GAP ? ` · ${t('g2.volume.gap')}` : ''),
          ...stacks[i].filter((s) => s.value).slice().reverse().map((s) => t('g2.volume.tip.group', { group: s.label, n: fmt.int(s.value) }))].join('\n')
        const overlay = h('rect', { class: 'overlay', x: pad.left, y: pad.top, width: plotW, height: plotH })
        const indexAt = (e) => Math.min(dates.length - 1, Math.max(0, Math.floor((e.clientX - svg.getBoundingClientRect().left - pad.left) / bw)))
        overlay.addEventListener('pointermove', (e) => UI.showTooltip(tipOf(indexAt(e)), e.clientX, e.clientY))
        overlay.addEventListener('pointerleave', () => UI.hideTooltip())
        svg.append(overlay)
        const table = h('div', { class: 'visually-hidden' }, h('table', {}, h('caption', {}, t('g2.volume.title')),
          h('thead', {}, h('tr', {}, h('th', {}, ''), order.map((o) => h('th', { scope: 'col' }, o.label)))),
          h('tbody', {}, dates.map((d, i) => h('tr', {}, h('th', { scope: 'row' }, fmt.date(d)), stacks[i].map((s) => h('td', {}, fmt.int(s.value))))))))
        holder.replaceChildren(svg, table)
      })
    }

    // Pointer handlers for a tooltip on a mark.
    const tipOn = (el, text) => {
      const show = (e) => UI.showTooltip(text, e.clientX, e.clientY)
      el.addEventListener('pointerenter', show)
      el.addEventListener('pointermove', show)
      el.addEventListener('pointerleave', () => UI.hideTooltip())
      return el
    }

    // Packed bubbles of owners and outlets: one circle for each group, with a circle for each of its outlets inside. The area is the collected articles.
    function OwnerBubbles ({ groups, total }) {
      return fit((holder, width) => {
        const height = Math.max(280, Math.min(480, Math.round(width * 0.72)))
        const root = d3.hierarchy({ children: groups.map((g) => ({ g, children: g.outlets.map((o) => ({ o, g })) })) })
          .sum((d) => (d.o ? d.o.value : 0)).sort((a, b) => b.value - a.value)
        d3.pack().size([width, height]).padding((d) => (d.depth === 0 ? 10 : 2))(root)
        const svg = h('svg', { class: 'chart', width, height, viewBox: `0 0 ${width} ${height}`, 'aria-hidden': 'true' })
        root.children.forEach((gn) => {
          const g = gn.data.g
          svg.append(tipOn(h('circle', { class: 'bubble-group', cx: gn.x, cy: gn.y, r: gn.r, fill: tint(g.color, 0.88), stroke: g.color, 'stroke-width': 1.5 }),
            t('g2.bubble.group', { group: g.label, owner: g.owner || t('groups.lean.none'), n: fmt.int(gn.value), share: fmt.pct(gn.value / total) })))
          gn.children.forEach((on) => {
            const o = on.data.o
            const fill = tint(g.color, g.key === null ? 0.5 : 0.35)
            svg.append(tipOn(h('circle', { class: 'tile', cx: on.x, cy: on.y, r: on.r, fill }), t('g2.tree.tip', { outlet: o.name, group: g.label, n: fmt.int(o.value), share: fmt.pct(o.value / total) })))
            if (on.r * 2 >= o.name.length * 6.4 + 6 && on.r >= 15) {
              const two = on.r >= 26
              svg.append(h('text', { class: 'tile-label', x: on.x, y: on.y + (two ? -1 : 4), 'text-anchor': 'middle', style: { fill: textOn(fill), 'font-weight': 500 } }, o.name))
              if (two) svg.append(h('text', { class: 'tile-share', x: on.x, y: on.y + 14, 'text-anchor': 'middle', style: { fill: textOn(fill) } }, fmt.pct(o.value / total)))
            }
          })
        })
        const table = h('div', { class: 'visually-hidden' }, h('table', {}, h('caption', {}, t('g2.tree.title')),
          h('tbody', {}, groups.flatMap((g) => g.outlets.map((o) => h('tr', {}, h('th', { scope: 'row' }, o.name), h('td', {}, t('g2.tree.tip', { outlet: o.name, group: g.label, n: fmt.int(o.value), share: fmt.pct(o.value / total) }))))))))
        holder.replaceChildren(svg, table)
      })
    }

    // Sunburst: the inner ring is the groups, the outer ring their outlets. The rings are in the order of the legend, from the top, clockwise.
    function Sunburst ({ groups, total }) {
      const size = 196
      const c = size / 2
      const rings = [[48, 72], [74, 97]]
      const pad = 0.008
      const arc = (a0, a1, r0, r1) => {
        a0 += pad / 2
        a1 = Math.max(a0 + 0.002, a1 - pad / 2)
        const p = (a, r) => `${(c + r * Math.sin(a)).toFixed(2)} ${(c - r * Math.cos(a)).toFixed(2)}`
        const large = a1 - a0 > Math.PI ? 1 : 0
        return `M${p(a0, r1)}A${r1} ${r1} 0 ${large} 1 ${p(a1, r1)}L${p(a1, r0)}A${r0} ${r0} 0 ${large} 0 ${p(a0, r0)}Z`
      }
      const svg = h('svg', { class: 'chart donut sunburst', width: size, height: size, viewBox: `0 0 ${size} ${size}`, role: 'img', 'aria-label': groups.map((g) => `${g.label} ${fmt.pct(g.value / total)}`).join(', ') })
      let a = 0
      groups.forEach((g) => {
        const span = (g.value / total) * 2 * Math.PI
        svg.append(tipOn(h('path', { class: 'slice', d: arc(a, a + span, ...rings[0]), fill: g.color }), t('g2.donut.tip', { group: g.label, n: fmt.int(g.value), share: fmt.pct(g.value / total) })))
        let b = a
        g.outlets.forEach((o) => {
          const s = (o.value / total) * 2 * Math.PI
          svg.append(tipOn(h('path', { class: 'slice', d: arc(b, b + s, ...rings[1]), fill: tint(g.color, g.key === null ? 0.45 : 0.4) }), t('g2.tree.tip', { outlet: o.name, group: g.label, n: fmt.int(o.value), share: fmt.pct(o.value / total) })))
          b += s
        })
        a += span
      })
      svg.append(h('text', { class: 'donut-num', x: c, y: c + 3, 'text-anchor': 'middle' }, fmt.int(total)),
        h('text', { x: c, y: c + 19, 'text-anchor': 'middle' }, t('g2.donut.center')))
      return svg
    }

    Shell.start({
      id: 'groups',
      route: '/groups',
      dash: true,
      title: () => t('groups.title'),
      breadcrumbs: () => [{ label: t('groups.title') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        const draw = () => {
          reset()
          if (result.kind === 'failed' || result.kind === 'notFound') {
            content.replaceChildren(TopBar({ title: t('nav.media'), tabs, quiet: true }), UI.ErrorState({ onRetry: () => location.reload() }), protoNote())
            return
          }
          const d = result.data
          const empty = result.kind === 'empty'
          const period = fmt.period(d.window[0], d.window[1])
          const colorOf = Dash.groupColors(d.groups)
          const groups = empty ? [] : d.groups.filter((g) => g.collected > 0)
          const total = empty ? 0 : d.totalCollected
          const grouped = groups.reduce((s, g) => s + g.collected, 0)
          const ungroupedTotal = empty ? 0 : d.ungrouped.reduce((s, o) => s + o.collected, 0)
          const hrefOf = (g) => `group-v2.html?g=${g.slug}`

          const bar = TopBar({ title: t('nav.media'), tabs, quiet: true })

          const rows = [...groups.map((g) => ({ key: g.name, label: g.name, value: g.collected, color: colorOf.get(g.name) })), ...(ungroupedTotal ? [{ key: null, label: t('media2.groups.none'), value: ungroupedTotal, color: NO_GROUP }] : [])]

          // Row 1: the bubbles of owners and outlets, with the owner of each group beside them.
          const treeGroups = [...groups.map((g) => ({ key: g.name, label: g.name, owner: g.owner, color: colorOf.get(g.name), outlets: g.outlets.filter((o) => o.collected > 0).map((o) => ({ name: o.name, value: o.collected })).sort((a, b) => b.value - a.value) })),
            ...(ungroupedTotal ? [{ key: null, label: t('media2.groups.none'), owner: null, color: NO_GROUP, outlets: d.ungrouped.filter((o) => o.collected > 0).map((o) => ({ name: o.name, value: o.collected })).sort((a, b) => b.value - a.value) }] : [])]
          treeGroups.forEach((g) => { g.value = g.outlets.reduce((s, o) => s + o.value, 0) })
          const owners = h('ul', { class: 'owner-list' }, treeGroups.map((g) => h('li', {},
            h('span', { class: g.key === null ? 'dot dot-none' : 'dot', style: `--dot:${g.color}`, 'aria-hidden': 'true' }),
            h('span', { class: 'owner-group' }, g.key === null ? g.label : h('a', { class: 'quiet-link', href: hrefOf(groups.find((x) => x.name === g.key)) }, g.label)),
            h('span', { class: 'owner-name' }, g.key === null ? t('g2.bubble.none', { n: fmt.int(g.outlets.length) }) : `${g.owner} · ${t('g2.bubble.outlets', { n: fmt.int(g.outlets.length) })}`))))
          const bubbles = card('c-12', cardHead(t('g2.tree.title'), null, [t('g2.tree.sub', { period }), t('g2.record', { source: d.record.source, date: fmt.date(d.record.exportedAt) })].join(' ')),
            total ? h('div', { class: 'owners-wrap' }, OwnerBubbles({ groups: treeGroups, total }), owners) : emptyText(t('groups.empty')))

          // Row 2: the share of each group and of its outlets.
          const shareCard = card('c-5', cardHead(t('media2.groups.title'), null, total ? t('media2.groups.known', { share: fmt.pct(grouped / total) }) : null),
            total
              ? [h('div', { class: 'donut-wrap sun-wrap' }, Sunburst({ groups: treeGroups, total }),
                  h('ul', { class: 'rows rows-groups' }, rows.map((r) => h('li', {},
                    h('span', { class: r.key === null ? 'dot dot-none' : 'dot', style: `--dot:${r.color}`, 'aria-hidden': 'true' }),
                    h('span', { class: 'row-name', title: r.label }, r.key === null ? r.label : h('a', { class: 'quiet-link', href: hrefOf(groups.find((g) => g.name === r.key)) }, r.label)),
                    h('span', { class: 'row-value' }, fmt.pct(r.value / total))))))]
              : emptyText(t('groups.empty')))

          // Row 3: the articles of each day, stacked by group. The largest group is at the bottom, the outlets with no group are on top.
          const m = media.kind === 'data' ? media.data : null
          const groupOf = new Map([...groups.flatMap((g) => g.outlets.map((o) => [o.slug, g.name])), ...(empty ? [] : d.ungrouped.map((o) => [o.slug, null]))])
          const order = rows.map((r) => ({ key: r.key, label: r.label, color: r.color }))
          const stacks = m && !empty ? m.dates.map((_, i) => order.map((o) => ({ ...o, value: m.outlets.reduce((a, out, k) => (groupOf.has(out.slug) && groupOf.get(out.slug) === o.key ? a + m.outletDaily[k][i][0] : a), 0) }))) : []
          const volumeTotal = stacks.reduce((s, day) => s + day.reduce((a, b) => a + b.value, 0), 0)
          const volume = card('c-12', cardHead(t('g2.volume.title'), null, t('g2.volume.info', { min: fmt.int(GAP), n: fmt.int(volumeTotal) })),
            volumeTotal
              ? [h('span', { class: 'legend-inline' }, order.map((o) => h('span', {}, h('span', { class: 'swatch', style: { background: o.color } }), o.label))), VolumeChart({ dates: m.dates, stacks, order })]
              : emptyText(t('groups.empty')))

          // Row 2: the stance of each group. Row 4: the political lean.
          const stanceRows = groups.map((g) => {
            const s = g.outlets.reduce((a, o) => [a[0] + o.stance[0], a[1] + o.stance[1], a[2] + o.stance[2]], [0, 0, 0])
            const n = s[0] + s[1] + s[2]
            return { g, crit: s[0] / n, neu: s[1] / n, sup: s[2] / n, n }
          }).filter((r) => r.n >= 30)
          const unit = stanceRows.length ? 40 / Math.max(...stanceRows.map((r) => Math.max(r.crit + r.neu / 2, r.sup + r.neu / 2))) : 0
          const seg = (name, left, width) => h('span', { class: 'div-seg', style: `--seg:var(--stance-${name});left:${left}%;width:${width}%` })
          const stanceCard = card('c-7', cardHead(t('g2.stance.title'), h('span', { class: 'stance-key' },
            [['stance.critical', 'critical'], ['stance.neutral', 'neutral'], ['stance.supportive', 'supportive']].map(([key, nm]) => h('span', { class: 'key-item' }, h('span', { class: 'swatch', style: { background: `var(--stance-${nm})` } }), t(key)))), t('g2.stance.sub')),
            stanceRows.length
              ? h('ul', { class: 'diverge' }, stanceRows.map((r) => h('li', { 'aria-label': t('g2.stance.row', { group: r.g.name, critical: fmt.pct(r.crit), neutral: fmt.pct(r.neu), supportive: fmt.pct(r.sup), n: fmt.int(r.n) }) },
                h('span', { class: 'div-name', title: r.g.name }, r.g.name),
                h('span', { class: 'div-track' },
                  seg('critical', 50 - (r.neu / 2) * unit - r.crit * unit, r.crit * unit),
                  seg('neutral', 50 - (r.neu / 2) * unit, r.neu * unit),
                  seg('supportive', 50 + (r.neu / 2) * unit, r.sup * unit),
                  h('span', { class: 'div-mid' }),
                  h('span', { class: 'div-val div-val-l', style: `right:${100 - (50 - (r.neu / 2) * unit - r.crit * unit)}%` }, fmt.pct(r.crit)),
                  h('span', { class: 'div-val div-val-r', style: `left:${50 + (r.neu / 2) * unit + r.sup * unit}%` }, fmt.pct(r.sup))))))
              : emptyText(t('groups.empty')))

          const leanTotals = new Map()
          groups.forEach((g) => { const k = g.lean || null; const e = leanTotals.get(k) || { value: 0, groups: 0 }; e.value += g.collected; e.groups++; leanTotals.set(k, e) })
          const leanRows = [...leanTotals.entries()].map(([lean, e]) => ({ lean, ...e })).sort((a, b) => (a.lean === null) - (b.lean === null) || b.value - a.value)
          const leanCard = card('c-12', cardHead(t('g2.lean.title'), null, t('g2.lean.sub')),
            leanRows.length
              ? h('ul', { class: 'rows' }, [...leanRows.map((r) => h('li', { style: `--bar-color:${r.lean === null ? 'var(--bar-muted)' : 'var(--series-news)'}` },
                h('span', { class: 'row-name' }, r.lean || t('groups.lean.none')), h('span', { class: 'row-value' }, t('g2.lean.value', { share: fmt.pct(r.value / total), groups: fmt.int(r.groups) })),
                UI.HBar(r.value, leanRows[0].value))),
              ungroupedTotal ? h('li', { style: '--bar-color:var(--bar-muted)' }, h('span', { class: 'row-name' }, t('media2.groups.none')), h('span', { class: 'row-value' }, fmt.pct(ungroupedTotal / total)), UI.HBar(ungroupedTotal, leanRows[0].value)) : null])
              : emptyText(t('groups.empty')))

          content.replaceChildren(bar, h('div', { class: 'dash-grid' }, bubbles, shareCard, stanceCard, volume, leanCard), protoNote())
        }
        draw()
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
