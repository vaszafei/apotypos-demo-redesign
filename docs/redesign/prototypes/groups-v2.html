  <script>
    // Media, Ιδιοκτησία: dashboard of APO-161. The group, the owner and the articles come from the static files,
    // so the table and the shares cover the window of the groups file and there is no period control. The period is in the note of the table.
    const { t, fmt, h, load } = App
    const { fit, reset, NO_GROUP, card, cardHead, emptyText, TopBar, textOn, tint } = Dash
    const result = load('groups', ['groups', 'ungrouped', 'totalCollected', 'window'], (b) => b.groups)
    // The daily articles of each outlet: the days of media.js, which run past the window of the groups file to the last day of the database. The groups are those of the groups file.
    const media = load('media', ['dates', 'outlets', 'outletDaily'], (b) => b.outlets)
    // A day with fewer articles than this is a gap of the crawler, not a quiet day.
    const GAP = 50

    // Lines: one for each group, the articles of each day. A gap day of the collection has a band and breaks the lines. A hover reads the day for every group.
    function VolumeChart ({ dates, stacks, order }) {
      const totals = stacks.map((s) => s.reduce((a, b) => a + b.value, 0))
      const gapDay = totals.map((v) => v < GAP)
      return fit((holder, width) => {
        const height = 300
        const pad = { top: 12, right: 12, bottom: 26, left: 48 }
        const plotW = width - pad.left - pad.right
        const plotH = height - pad.top - pad.bottom
        const n = dates.length
        const peak = Math.max(1, ...stacks.flatMap((day, i) => (gapDay[i] ? [] : day.map((x) => x.value))))
        const yMax = Dash.niceStep(peak / 4) * 4
        const X = (i) => pad.left + (i / (n - 1)) * plotW
        const Y = (v) => pad.top + plotH - (v / yMax) * plotH
        const step = plotW / (n - 1)
        const svg = h('svg', { class: 'chart', width, height, viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': t('g2.volume.title') })
        for (let v = 0; v <= yMax + 1e-6; v += yMax / 4) svg.append(h('line', { class: 'grid-line', x1: pad.left, x2: width - pad.right, y1: Y(v), y2: Y(v) }), h('text', { x: pad.left - 6, y: Y(v) + 4, 'text-anchor': 'end' }, fmt.int(v)))
        const every = Math.max(1, Math.ceil(72 / step / 7)) * 7
        for (let i = 0; i < n; i += every) svg.append(h('text', { x: X(i), y: height - 6, 'text-anchor': 'middle' }, fmt.date(dates[i], { day: 'numeric', month: 'short' })))
        gapDay.forEach((gap, i) => { if (gap) svg.append(h('rect', { x: X(i) - step / 2, y: pad.top, width: step, height: plotH, fill: 'var(--bar-track)', opacity: 0.8 })) })
        // The outlets with no group are drawn first, so the groups are over them.
        order.map((o, k) => k).reverse().forEach((k) => {
          let d = ''
          let run = 0
          stacks.forEach((day, i) => {
            if (gapDay[i]) { run = 0; return }
            d += `${run ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(day[k].value).toFixed(1)}`
            run++
          })
          svg.append(h('path', { d, fill: 'none', stroke: order[k].color, 'stroke-width': 1.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }))
        })
        // The hover: a line on the day, a dot on each line, and the tooltip with the groups, the largest first.
        const rule = h('line', { class: 'hover-rule', y1: pad.top, y2: pad.top + plotH, stroke: 'var(--rule)', 'stroke-width': 1, visibility: 'hidden' })
        const dots = order.map((o) => h('circle', { r: 3.5, fill: o.color, stroke: 'var(--surface-page)', 'stroke-width': 1.5, visibility: 'hidden' }))
        svg.append(rule, ...dots)
        const over = h('rect', { x: pad.left, y: pad.top, width: plotW, height: plotH, fill: 'transparent' })
        const read = (e) => {
          const box = svg.getBoundingClientRect()
          const i = Math.max(0, Math.min(n - 1, Math.round(((e.clientX - box.left - pad.left) / plotW) * (n - 1))))
          rule.setAttribute('x1', X(i)); rule.setAttribute('x2', X(i)); rule.setAttribute('visibility', 'visible')
          dots.forEach((c, k) => { c.setAttribute('cx', X(i)); c.setAttribute('cy', Y(stacks[i][k].value)); c.setAttribute('visibility', gapDay[i] ? 'hidden' : 'visible') })
          UI.showTooltip([t('g2.volume.tip', { date: fmt.date(dates[i]), n: fmt.int(totals[i]) }) + (gapDay[i] ? ` · ${t('g2.volume.gap')}` : ''),
            ...stacks[i].filter((x) => x.value).slice().sort((x, y) => y.value - x.value).map((x) => t('g2.volume.tip.group', { group: x.label, n: fmt.int(x.value) }))].join('\n'), e.clientX, e.clientY)
        }
        over.addEventListener('pointermove', read)
        over.addEventListener('pointerenter', read)
        over.addEventListener('pointerleave', () => { UI.hideTooltip(); rule.setAttribute('visibility', 'hidden'); dots.forEach((c) => c.setAttribute('visibility', 'hidden')) })
        svg.append(over)
        const table = h('div', { class: 'visually-hidden' }, h('table', {}, h('caption', {}, t('g2.volume.title')),
          h('tbody', {}, dates.map((dt, i) => h('tr', {}, h('th', { scope: 'row' }, fmt.date(dt)), h('td', {}, stacks[i].filter((x) => x.value).map((x) => t('g2.volume.tip.group', { group: x.label, n: fmt.int(x.value) })).join(', ')))))))
        holder.replaceChildren(svg, table)
      })
    }

    // Pointer handlers for a tooltip on a mark.
    const tipOn = (el, text) => {
      const show = (e) => UI.showTooltip(text, e.clientX, e.clientY)
      el.addEventListener('pointerenter', show)
      el.addEventListener('pointermove', show)
      el.addEventListener('pointerleave', () => UI.hideTooltip())
      return el
    }

    // A wide layout of the bubbles: the outlets of each group are packed in its circle, and the groups sit in a band from left to right,
    // in the order of the legend. Each group goes at the leftmost place in the band where it touches no group before it.
    function ribbon (groups, width, height) {
      const pad = 2
      const nodes = groups.map((g) => {
        const children = g.outlets.map((o) => ({ data: { o }, r: Math.sqrt(o.value) }))
        d3.packSiblings(children.map((c) => Object.assign(c, { r: c.r + pad })))
        const enc = d3.packEnclose(children)
        children.forEach((c) => { c.dx = c.x - enc.x; c.dy = c.y - enc.y; c.r -= pad })
        return { data: { g }, r: enc.r + 4, children }
      })
      const maxR = Math.max(...nodes.map((n) => n.r))
      const gap = maxR * 0.06
      // Place the groups in a band of a given half height. Try a few bands and keep the one with the shape closest to the chart.
      const place = (band) => {
        const placed = []
        nodes.forEach((n) => {
          let best = null
          for (let k = -8; k <= 8; k++) {
            const y = (k / 8) * Math.max(0, band - n.r)
            let x = placed.length ? -Infinity : 0
            placed.forEach((p) => {
              const d = p.r + n.r + gap
              const dy = Math.abs(p.y - y)
              if (dy < d) x = Math.max(x, p.x + Math.sqrt(d * d - dy * dy))
            })
            if (x === -Infinity) x = Math.min(...placed.map((p) => p.x - p.r)) + n.r
            if (!best || x < best.x - 0.5 || (Math.abs(x - best.x) <= 0.5 && Math.abs(y) < Math.abs(best.y))) best = { x, y }
          }
          placed.push({ r: n.r, ...best })
        })
        const w = Math.max(...placed.map((p) => p.x + p.r)) - Math.min(...placed.map((p) => p.x - p.r))
        const hh = Math.max(...placed.map((p) => p.y + p.r)) - Math.min(...placed.map((p) => p.y - p.r))
        return { placed, score: Math.abs(Math.log((w / hh) / (width / height))) }
      }
      let best = null
      for (let f = 1; f <= 3; f += 0.1) { const tryIt = place(maxR * f); if (!best || tryIt.score < best.score) best = tryIt }
      nodes.forEach((n, i) => { n.x = best.placed[i].x; n.y = best.placed[i].y })
      // Scale the band to fit the chart, and center it.
      const x0 = Math.min(...nodes.map((n) => n.x - n.r))
      const x1 = Math.max(...nodes.map((n) => n.x + n.r))
      const y0 = Math.min(...nodes.map((n) => n.y - n.r))
      const y1 = Math.max(...nodes.map((n) => n.y + n.r))
      const s = Math.min((width - 8) / (x1 - x0), (height - 8) / (y1 - y0))
      const ox = (width - (x1 - x0) * s) / 2
      const oy = (height - (y1 - y0) * s) / 2
      nodes.forEach((n) => {
        n.x = ox + (n.x - x0) * s
        n.y = oy + (n.y - y0) * s
        n.r = (n.r) * s
        n.children.forEach((c) => { c.x = n.x + c.dx * s; c.y = n.y + c.dy * s; c.r *= s })
      })
      return nodes
    }

    // Bubbles of owners and outlets: one circle for each group, with a circle for each of its outlets inside. The area is the collected articles.
    // Nothing moves: a hover over a group fades the others and the panel under the chart shows the group. A click on a group keeps it, a click on the empty
    // space or Esc lets it go, and a click on an outlet opens its page. The name of a group is written whole above its circle, and is left out where it would touch another name.
    function OwnerBubbles ({ groups, total }) {
      let pinned = null
      let hover = null
      const sumStance = (list) => list.reduce((a, o) => [a[0] + o.stance[0], a[1] + o.stance[1], a[2] + o.stance[2]], [0, 0, 0])
      const stanceBar = (s) => UI.MiniStance([
        { label: t('stance.critical'), value: s[0], color: 'var(--stance-critical)' },
        { label: t('stance.neutral'), value: s[1], color: 'var(--stance-neutral)' },
        { label: t('stance.supportive'), value: s[2], color: 'var(--stance-supportive)' }
      ])
      const stanceText = (s) => { const n = s[0] + s[1] + s[2]; return n >= 30 ? t('g2.bubble.stance', { critical: fmt.pct(s[0] / n), supportive: fmt.pct(s[2] / n) }) : t('stance.few', { n: 30 }) }
      const outletTip = (o, g) => [t('g2.tree.tip', { outlet: o.name, group: g.label, n: fmt.int(o.value), share: fmt.pct(o.value / total) }),
        t('g2.bubble.ofgroup', { share: fmt.pct(o.value / g.value) }),
        t('g2.bubble.news', { share: fmt.pct(o.news / (o.analysed || 1)) }),
        stanceText(o.stance)].join('\n')
      const groupTip = (g) => [g.key === null ? t('g2.donut.tip', { group: g.label, n: fmt.int(g.value), share: fmt.pct(g.value / total) }) : t('g2.bubble.group', { group: g.label, owner: g.owner, n: fmt.int(g.value), share: fmt.pct(g.value / total) })].join('\n')

      return fit((holder, width) => {
        const height = Math.max(260, Math.min(380, Math.round(width * 0.5)))
        const top = 22
        const groupNodes = ribbon(groups, width, height - top * 2)
        groupNodes.forEach((gn) => { gn.y += top; gn.children.forEach((c) => { c.y += top }) })
        const svg = h('svg', { class: 'chart bubbles', width, height, viewBox: `0 0 ${width} ${height}`, role: 'group', 'aria-label': t('g2.tree.title') })
        const back = h('rect', { class: 'bubble-bg', x: 0, y: 0, width, height, fill: 'transparent' })
        const scene = h('g', {})
        const labels = h('g', { class: 'bubble-labels' })
        svg.append(back, scene, labels)
        const panel = h('div', { class: 'bubble-panel', 'aria-live': 'polite' })
        const layers = new Map()
        const active = () => hover || pinned

        function drawPanel () {
          const g = active()
          if (!g) {
            panel.replaceChildren(h('p', { class: 'bubble-hint' }, t('g2.bubble.hint')))
            return
          }
          const s = sumStance(g.outlets)
          const news = g.outlets.reduce((a, o) => a + o.news, 0) / (g.outlets.reduce((a, o) => a + o.analysed, 0) || 1)
          panel.replaceChildren(
            h('div', { class: 'bubble-panel-head' },
              h('span', { class: g.key === null ? 'dot dot-none' : 'dot', style: `--dot:${g.color}`, 'aria-hidden': 'true' }),
              h('strong', {}, g.slug ? h('a', { class: 'quiet-link', href: `group-v2.html?g=${g.slug}` }, g.label) : g.label),
              pinned ? h('button', { type: 'button', class: 'dcard-link', onClick: () => { pinned = null; paint() } }, t('g2.bubble.back')) : null),
            h('dl', { class: 'bubble-facts' },
              [g.key === null ? null : [t('groups.col.owner'), g.owner], g.key === null ? null : [t('groups.col.lean'), g.lean || t('groups.lean.none')],
                [t('groups.col.articles'), `${fmt.int(g.value)} · ${fmt.pct(g.value / total)}`], [t('groups.col.outlets'), fmt.int(g.outlets.length)],
                [t('media.col.news'), fmt.pct(news)], [t('group.col.stance'), stanceBar(s)]]
                .filter(Boolean).map(([k, v]) => h('div', { class: 'bubble-fact' }, h('dt', {}, k), h('dd', {}, v)))))
        }
        function paint () {
          layers.forEach((el, g) => { el.classList.toggle('is-dim', active() !== null && g !== active()); el.classList.toggle('is-active', g === active()) })
          drawPanel()
        }

        groupNodes.forEach((gn) => {
          const g = gn.data.g
          const layer = h('g', { class: 'bubble-layer' })
          layers.set(g, layer)
          scene.append(layer)
          const gc = h('circle', { class: 'bubble-group', cx: gn.x, cy: gn.y, r: gn.r, fill: tint(g.color, 0.9), stroke: g.color, 'stroke-width': 1.5, tabindex: 0, role: 'button', 'aria-label': groupTip(g) })
          tipOn(gc, groupTip(g))
          gc.addEventListener('click', (e) => { e.stopPropagation(); pinned = pinned === g ? null : g; paint() })
          gc.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pinned = pinned === g ? null : g; paint() } })
          gc.addEventListener('focus', () => { hover = g; paint() })
          gc.addEventListener('blur', () => { hover = null; paint() })
          layer.append(gc)
          gn.children.forEach((on) => {
            const o = on.data.o
            const c = h('circle', { class: 'tile', cx: on.x, cy: on.y, r: on.r, fill: tint(g.color, g.key === null ? 0.5 : 0.35) })
            tipOn(c, outletTip(o, g))
            c.addEventListener('click', (e) => { e.stopPropagation(); if (o.slug) location.href = `outlet-v2.html?slug=${o.slug}` })
            layer.append(c)
          })
          layer.addEventListener('pointerenter', () => { hover = g; paint() })
          layer.addEventListener('pointerleave', () => { hover = null; paint() })
        })

        // The names of the outlets show when they fit in their circle. The name of a group is above its circle, below it if there is no room above, and is left out when it would touch another.
        const boxes = []
        const free = (x0, x1, y0, y1) => !boxes.some((b) => x0 < b.x1 && b.x0 < x1 && y0 < b.y1 && b.y0 < y1)
        groupNodes.forEach((gn) => {
          const g = gn.data.g
          gn.children.forEach((on) => {
            const o = on.data.o
            const fill = tint(g.color, g.key === null ? 0.5 : 0.35)
            if (on.r * 2 < o.name.length * 6.4 + 6 || on.r < 15) return
            const lines = [[o.name, 'tile-label']]
            if (on.r >= 26) lines.push([fmt.pct(o.value / total), 'tile-share'])
            const y0 = on.y - ((lines.length - 1) * 15) / 2 + 4
            lines.forEach(([text, cls], i) => labels.append(h('text', { class: cls, x: on.x, y: y0 + i * 15, 'text-anchor': 'middle', style: { fill: textOn(fill), 'font-weight': i ? 400 : 500 } }, text)))
          })
        })
        // A name can stand where its box touches no other circle and no other name.
        const clearOf = (gn, x0, x1, y0, y1) => groupNodes.every((o) => {
          if (o === gn) return true
          const nx = Math.max(x0, Math.min(o.x, x1))
          const ny = Math.max(y0, Math.min(o.y, y1))
          return Math.hypot(o.x - nx, o.y - ny) >= o.r
        })
        groupNodes.slice().sort((a, b) => b.r - a.r).forEach((gn) => {
          const g = gn.data.g
          const w = g.label.length * 6.9
          const x0 = gn.x - w / 2
          const x1 = gn.x + w / 2
          if (x0 < 2 || x1 > width - 2) return
          const above = gn.y - gn.r - 5
          const below = gn.y + gn.r + 16
          const fits = (y) => y - 12 >= 0 && y + 3 <= height && free(x0, x1, y - 12, y + 3) && clearOf(gn, x0, x1, y - 12, y + 3)
          const y = fits(above) ? above : fits(below) ? below : null
          if (y === null) return
          boxes.push({ x0, x1, y0: y - 12, y1: y + 3 })
          labels.append(h('text', { class: 'bubble-name', x: gn.x, y, 'text-anchor': 'middle' }, g.label))
        })

        back.addEventListener('click', () => { if (pinned) { pinned = null; paint() } })
        svg.addEventListener('keydown', (e) => { if (e.key === 'Escape' && pinned) { pinned = null; paint() } })
        paint()
        const table = h('div', { class: 'visually-hidden' }, h('table', {}, h('caption', {}, t('g2.tree.title')),
          h('tbody', {}, groups.flatMap((g) => g.outlets.map((o) => h('tr', {}, h('th', { scope: 'row' }, o.name), h('td', {}, outletTip(o, g).replace(/\n/g, ' · '))))))))
        holder.replaceChildren(svg, panel, table)
      })
    }

    // Sunburst: the inner ring is the groups, the outer ring their outlets. The rings are in the order of the legend, from the top, clockwise.
    function Sunburst ({ groups, total }) {
      const size = 176
      const c = size / 2
      const rings = [[44, 65], [67, 87]]
      const pad = 0.008
      const arc = (a0, a1, r0, r1) => {
        a0 += pad / 2
        a1 = Math.max(a0 + 0.002, a1 - pad / 2)
        const p = (a, r) => `${(c + r * Math.sin(a)).toFixed(2)} ${(c - r * Math.cos(a)).toFixed(2)}`
        const large = a1 - a0 > Math.PI ? 1 : 0
        return `M${p(a0, r1)}A${r1} ${r1} 0 ${large} 1 ${p(a1, r1)}L${p(a1, r0)}A${r0} ${r0} 0 ${large} 0 ${p(a0, r0)}Z`
      }
      const svg = h('svg', { class: 'chart donut sunburst', width: size, height: size, viewBox: `0 0 ${size} ${size}`, role: 'img', 'aria-label': groups.map((g) => `${g.label} ${fmt.pct(g.value / total)}`).join(', ') })
      let a = 0
      groups.forEach((g) => {
        const span = (g.value / total) * 2 * Math.PI
        svg.append(tipOn(h('path', { class: 'slice', d: arc(a, a + span, ...rings[0]), fill: g.color }), t('g2.donut.tip', { group: g.label, n: fmt.int(g.value), share: fmt.pct(g.value / total) })))
        let b = a
        g.outlets.forEach((o) => {
          const s = (o.value / total) * 2 * Math.PI
          svg.append(tipOn(h('path', { class: 'slice', d: arc(b, b + s, ...rings[1]), fill: tint(g.color, g.key === null ? 0.45 : 0.4) }), t('g2.tree.tip', { outlet: o.name, group: g.label, n: fmt.int(o.value), share: fmt.pct(o.value / total) })))
          b += s
        })
        a += span
      })
      svg.append(h('text', { class: 'donut-num', x: c, y: c + 3, 'text-anchor': 'middle' }, fmt.int(total)),
        h('text', { x: c, y: c + 19, 'text-anchor': 'middle' }, t('g2.donut.center')))
      return svg
    }

    Shell.start({
      id: 'groups',
      route: '/groups',
      dash: true,
      title: () => t('groups.title'),
      breadcrumbs: () => [{ label: t('groups.title') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        const draw = () => {
          reset()
          if (result.kind === 'failed' || result.kind === 'notFound') {
            content.replaceChildren(TopBar({ title: t('nav.media'), tabs, quiet: true }), UI.ErrorState({ onRetry: () => location.reload() }), protoNote())
            return
          }
          const d = result.data
          const empty = result.kind === 'empty'
          const period = fmt.period(d.window[0], d.window[1])
          const colorOf = Dash.groupColors(d.groups)
          const groups = empty ? [] : d.groups.filter((g) => g.collected > 0)
          const total = empty ? 0 : d.totalCollected
          const grouped = groups.reduce((s, g) => s + g.collected, 0)
          const ungroupedTotal = empty ? 0 : d.ungrouped.reduce((s, o) => s + o.collected, 0)
          const hrefOf = (g) => `group-v2.html?g=${g.slug}`

          const bar = TopBar({ title: t('nav.media'), tabs, quiet: true })

          const rows = [...groups.map((g) => ({ key: g.name, label: g.name, value: g.collected, color: colorOf.get(g.name) })), ...(ungroupedTotal ? [{ key: null, label: t('media2.groups.none'), value: ungroupedTotal, color: NO_GROUP }] : [])]

          // Row 2, on the left: the bubbles of owners and outlets. Row 1, on the right: the share of each group and of its outlets. The owner of a group is in the title of its legend row.
          const outletOf = (o) => ({ name: o.name, slug: o.slug, value: o.collected, analysed: o.analysed, news: o.news, stance: o.stance })
          const treeGroups = [...groups.map((g) => ({ key: g.name, label: g.name, owner: g.owner, color: colorOf.get(g.name), slug: g.slug, lean: g.lean, outlets: g.outlets.filter((o) => o.collected > 0).map(outletOf).sort((a, b) => b.value - a.value) })),
            ...(ungroupedTotal ? [{ key: null, label: t('media2.groups.none'), owner: null, color: NO_GROUP, outlets: d.ungrouped.filter((o) => o.collected > 0).map(outletOf).sort((a, b) => b.value - a.value) }] : [])]
          treeGroups.forEach((g) => { g.value = g.outlets.reduce((s, o) => s + o.value, 0) })
          const bubbles = card('c-8', cardHead(t('g2.tree.title'), null, [t('g2.tree.sub', { period }), t('g2.record', { source: d.record.source, date: fmt.date(d.record.exportedAt) })].join(' ')),
            total ? [UI.Legend(treeGroups.map((g) => ({ label: g.label, color: g.color }))), OwnerBubbles({ groups: treeGroups, total })] : emptyText(t('groups.empty')))
          // The finding (how much the 3 largest groups write) is the first sentence of the info of the card.
          const top3 = treeGroups.filter((g) => g.key !== null).sort((a, b) => b.value - a.value).slice(0, 3).reduce((a, g) => a + g.value, 0)
          const shareCard = card('c-5', cardHead(t('media2.groups.title'), null, total ? [t('g2.share.finding', { share: fmt.pct(top3 / total) }), t('media2.groups.known', { share: fmt.pct(grouped / total) })].join('. ') : null),
            total
              ? h('div', { class: 'donut-wrap sun-wrap' },
                  h('ul', { class: 'rows rows-groups rows-owners' }, treeGroups.map((g) => {
                    return h('li', { title: g.key === null ? t('g2.bubble.none', { n: fmt.int(g.outlets.length) }) : `${g.owner} · ${t('g2.bubble.outlets', { n: fmt.int(g.outlets.length) })}` },
                      h('span', { class: g.key === null ? 'dot dot-none' : 'dot', style: `--dot:${g.color}`, 'aria-hidden': 'true' }),
                      h('span', { class: 'row-name', title: g.label }, g.key === null ? g.label : h('a', { class: 'quiet-link', href: hrefOf(groups.find((x) => x.name === g.key)) }, g.label)),
                      h('span', { class: 'row-value' }, fmt.pct(g.value / total)))
                  })),
                  Sunburst({ groups: treeGroups, total }))
              : emptyText(t('groups.empty')))

          // Row 1, on the left: a line for each group, the articles of each day.
          const m = media.kind === 'data' ? media.data : null
          const groupOf = new Map([...groups.flatMap((g) => g.outlets.map((o) => [o.slug, g.name])), ...(empty ? [] : d.ungrouped.map((o) => [o.slug, null]))])
          const order = rows.map((r) => ({ key: r.key, label: r.label, color: r.color }))
          const stacks = m && !empty ? m.dates.map((_, i) => order.map((o) => ({ ...o, value: m.outlets.reduce((a, out, k) => (groupOf.has(out.slug) && groupOf.get(out.slug) === o.key ? a + m.outletDaily[k][i][0] : a), 0) }))) : []
          const volumeTotal = stacks.reduce((s, day) => s + day.reduce((a, b) => a + b.value, 0), 0)
          const volume = card('c-7', cardHead(t('g2.volume.title'), null, t('g2.volume.info', { min: fmt.int(GAP), n: fmt.int(volumeTotal) })),
            volumeTotal
              ? [UI.Legend(order.map((o) => ({ label: o.label, color: o.color }))), VolumeChart({ dates: m.dates, stacks, order })]
              : emptyText(t('groups.empty')))

          // Row 2, on the right: the stance of each group.
          const stanceRows = groups.map((g) => {
            const s = g.outlets.reduce((a, o) => [a[0] + o.stance[0], a[1] + o.stance[1], a[2] + o.stance[2]], [0, 0, 0])
            const n = s[0] + s[1] + s[2]
            return { g, crit: s[0] / n, neu: s[1] / n, sup: s[2] / n, n }
          }).filter((r) => r.n >= 30)
          const scale = Math.max(...stanceRows.map((r) => Math.max(r.crit + r.neu / 2, r.sup + r.neu / 2)), 0.01)
          const critical = stanceRows.slice().sort((a, b) => b.crit - a.crit)
          const stanceCard = card('c-4', cardHead(t('g2.stance.title'), null, `${critical.length > 1 ? `${t('g2.stance.finding', { most: critical[0].g.name, a: fmt.pct(critical[0].crit), least: critical[critical.length - 1].g.name, b: fmt.pct(critical[critical.length - 1].crit) })}. ` : ''}${t('g2.stance.sub')}`),
            stanceRows.length
              ? [UI.Legend(['critical', 'neutral', 'supportive'].map((nm, i) => ({ label: t(`stance.${nm}`), color: UI.STANCE_COLORS[i] }))),
                UI.BarList(stanceRows.map((r) => ({
                  label: [h('span', { class: 'dot', style: `--dot:${colorOf.get(r.g.name)}`, 'aria-hidden': 'true' }), r.g.name],
                  text: `${fmt.pct(r.crit)} · ${fmt.pct(r.sup)}`,
                  bar: UI.DivergingBar({ left: r.crit, middle: r.neu, right: r.sup, scale, label: t('g2.stance.row', { group: r.g.name, critical: fmt.pct(r.crit), neutral: fmt.pct(r.neu), supportive: fmt.pct(r.sup), n: fmt.int(r.n) }) })
                })))]
              : emptyText(t('groups.empty')))

          content.replaceChildren(bar, h('div', { class: 'dash-grid' }, volume, shareCard, bubbles, stanceCard), protoNote())
        }
        draw()
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
