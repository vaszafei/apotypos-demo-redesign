<body>

  <script>
    // Media, Ιδιοκτησία: dashboard of APO-161. The group, the owner and the articles come from the static files,
    // so the table and the shares cover the window of the groups file and there is no period control. The period is in the note of the table.
    const { t, fmt, h, load } = App
    const { fit, reset, NO_GROUP, card, cardHead, emptyText, TopBar, textOn, tint } = Dash
    const result = load('groups', ['groups', 'ungrouped', 'totalCollected', 'window'], (b) => b.groups)
    // The daily articles of each outlet: the days of media.js, which run past the window of the groups file to the last day of the database. The groups are those of the groups file.
    const media = load('media', ['dates', 'outlets', 'outletDaily'], (b) => b.outlets)
    // A day with fewer articles than this is a gap of the crawler, not a quiet day.
    const GAP = 50
    // The name of a group without the word that most of them start with, for the legends and the labels of the charts.
    const short = (name) => name.replace(/^Συμφέροντα\s+/, '')
    // The shortest name that is still the group, for the legend of the line chart: one line.
    const compact = (g) => (g.key === null ? t('media2.groups.none.short') : short(g.label).replace(/^Όμιλος\s+/, '').replace(/\s+(Digital Media|Media|Group)$/, '').replace(/-.*$/, ''))

    // A smooth path through the points: a monotone cubic, so the curve goes through every point and never goes over or under the points between two of them.
    function smoothPath (pts) {
      const f = (v) => v.toFixed(1)
      const n = pts.length
      if (n < 3) return pts.map(([x, y], i) => `${i ? 'L' : 'M'}${f(x)} ${f(y)}`).join('')
      const slope = []
      for (let i = 0; i < n - 1; i++) slope[i] = (pts[i + 1][1] - pts[i][1]) / (pts[i + 1][0] - pts[i][0])
      const tan = [slope[0]]
      for (let i = 1; i < n - 1; i++) tan[i] = slope[i - 1] * slope[i] <= 0 ? 0 : (slope[i - 1] + slope[i]) / 2
      tan[n - 1] = slope[n - 2]
      for (let i = 0; i < n - 1; i++) {
        if (slope[i] === 0) { tan[i] = 0; tan[i + 1] = 0; continue }
        const a = tan[i] / slope[i]
        const b = tan[i + 1] / slope[i]
        const sq = a * a + b * b
        if (sq > 9) { const c = 3 / Math.sqrt(sq); tan[i] = c * a * slope[i]; tan[i + 1] = c * b * slope[i] }
      }
      let d = `M${f(pts[0][0])} ${f(pts[0][1])}`
      for (let i = 0; i < n - 1; i++) {
        const w = (pts[i + 1][0] - pts[i][0]) / 3
        d += `C${f(pts[i][0] + w)} ${f(pts[i][1] + tan[i] * w)} ${f(pts[i + 1][0] - w)} ${f(pts[i + 1][1] - tan[i + 1] * w)} ${f(pts[i + 1][0])} ${f(pts[i + 1][1])}`
      }
      return d
    }

    // Lines: one for each group, the articles of each day. The vertical axis is a square-root scale, so the groups with few articles can be read beside the one with the most.
    // A gap day of the collection has a band and breaks the lines. A hover reads the day for every group.
    function VolumeChart ({ dates, stacks, order }) {
      const totals = stacks.map((s) => s.reduce((a, b) => a + b.value, 0))
      const gapDay = totals.map((v) => v < GAP)
      return fit((holder, width) => {
        const height = 230
        const pad = { top: 10, right: 12, bottom: 24, left: 44 }
        const plotW = width - pad.left - pad.right
        const plotH = height - pad.top - pad.bottom
        const n = dates.length
        const peak = Math.max(1, ...stacks.flatMap((day, i) => (gapDay[i] ? [] : day.map((x) => x.value))))
        const STEPS = [100, 250, 500, 1000, 1500, 2000, 3000, 5000, 8000, 10000]
        const yMax = STEPS.find((v) => v >= peak) || Math.ceil(peak / 1000) * 1000
        const X = (i) => pad.left + (i / (n - 1)) * plotW
        const Y = (v) => pad.top + plotH - (Math.sqrt(v) / Math.sqrt(yMax)) * plotH
        const step = plotW / (n - 1)
        const svg = h('svg', { class: 'chart', width, height, viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': t('g2.volume.title') })
        // The ticks from the top down, each at least 20 px under the one before, and the zero.
        const ticks = []
        ;[...STEPS.filter((v) => v <= yMax), 50].sort((a, b) => b - a).forEach((v) => { if (!ticks.length || Y(v) - Y(ticks[ticks.length - 1]) >= 20) ticks.push(v) })
        ;[...ticks.filter((v) => Y(0) - Y(v) >= 20), 0].forEach((v) => svg.append(h('line', { class: 'grid-line', x1: pad.left, x2: width - pad.right, y1: Y(v), y2: Y(v) }), h('text', { x: pad.left - 6, y: Y(v) + 4, 'text-anchor': 'end' }, fmt.int(v))))
        const every = Math.max(1, Math.ceil(72 / step / 7)) * 7
        for (let i = 0; i < n; i += every) svg.append(h('text', { x: X(i), y: height - 6, 'text-anchor': 'middle' }, fmt.date(dates[i], { day: 'numeric', month: 'short' })))
        gapDay.forEach((gap, i) => { if (gap) svg.append(h('rect', { x: X(i) - step / 2, y: pad.top, width: step, height: plotH, fill: 'var(--bar-track)', opacity: 0.8 })) })
        // The outlets with no group are drawn first, so the groups are over them.
        order.map((o, k) => k).reverse().forEach((k) => {
          const runs = []
          stacks.forEach((day, i) => {
            if (gapDay[i]) { runs.push([]); return }
            if (!runs.length) runs.push([])
            runs[runs.length - 1].push([X(i), Y(day[k].value)])
          })
          const d = runs.filter((r) => r.length).map(smoothPath).join('')
          svg.append(h('path', { d, fill: 'none', stroke: order[k].color, 'stroke-width': order[k].key === null ? 1.25 : 1.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: order[k].key === null ? 0.75 : 1 }))
        })
        // The hover: a line on the day, a dot on each line, and the tooltip with the groups, the largest first.
        const rule = h('line', { class: 'hover-rule', y1: pad.top, y2: pad.top + plotH, stroke: 'var(--rule)', 'stroke-width': 1, visibility: 'hidden' })
        const dots = order.map((o) => h('circle', { r: 3.5, fill: o.color, stroke: 'var(--surface-page)', 'stroke-width': 1.5, visibility: 'hidden' }))
        svg.append(rule, ...dots)
        const over = h('rect', { x: pad.left, y: pad.top, width: plotW, height: plotH, fill: 'transparent' })
        const read = (e) => {
          const box = svg.getBoundingClientRect()
          const i = Math.max(0, Math.min(n - 1, Math.round(((e.clientX - box.left - pad.left) / plotW) * (n - 1))))
          rule.setAttribute('x1', X(i)); rule.setAttribute('x2', X(i)); rule.setAttribute('visibility', 'visible')
          dots.forEach((c, k) => { c.setAttribute('cx', X(i)); c.setAttribute('cy', Y(stacks[i][k].value)); c.setAttribute('visibility', gapDay[i] ? 'hidden' : 'visible') })
          UI.showTooltip({
            title: t('g2.volume.tip', { date: fmt.date(dates[i]), n: fmt.int(totals[i]) }),
            rows: stacks[i].filter((x) => x.value).slice().sort((x, y) => y.value - x.value).map((x) => ({ label: x.key === null ? t('media2.groups.none') : short(x.label), value: fmt.int(x.value), color: x.color })),
            note: gapDay[i] ? t('g2.volume.gap') : null
          }, e.clientX, e.clientY)
        }
        over.addEventListener('pointermove', read)
        over.addEventListener('pointerenter', read)
        over.addEventListener('pointerleave', () => { UI.hideTooltip(); rule.setAttribute('visibility', 'hidden'); dots.forEach((c) => c.setAttribute('visibility', 'hidden')) })
        svg.append(over)
        const table = h('div', { class: 'visually-hidden' }, h('table', {}, h('caption', {}, t('g2.volume.title')),
          h('tbody', {}, dates.map((dt, i) => h('tr', {}, h('th', { scope: 'row' }, fmt.date(dt)), h('td', {}, stacks[i].filter((x) => x.value).map((x) => t('g2.volume.tip.group', { group: short(x.label), n: fmt.int(x.value) })).join(', ')))))))
        holder.replaceChildren(svg, table)
      })
    }

    // Pointer handlers for a tooltip on a mark.
    const tipOn = (el, text) => {
      const show = (e) => UI.showTooltip(text, e.clientX, e.clientY)
      el.addEventListener('pointerenter', show)
      el.addEventListener('pointermove', show)
      el.addEventListener('pointerleave', () => UI.hideTooltip())
      return el
    }

    // The layout of the network: each group is a node with its outlets joined to it. The area of an outlet is its collected articles.
    // Two steps, both run to the end here, so the first draw is the final one: the outlets settle round their group (links like springs, circles that push apart),
    // then the groups settle in the chart as circles of the size of their outlets.
    function netLayout (groups, width, height) {
      const cx = width / 2
      const cy = height / 2
      const sumV = groups.reduce((a, g) => a + g.value, 0)
      const maxG = Math.max(...groups.map((g) => g.value))
      let k = Math.sqrt((0.2 * width * height) / (Math.PI * sumV))
      let clusters = []
      for (let attempt = 0; attempt < 12; attempt++) {
        clusters = groups.map((g, gi) => {
          const hub = { kind: 'hub', g, x: 0, y: 0, r: 8 + 6 * Math.sqrt(g.value / maxG) }
          const outs = g.outlets.map((o, oi) => {
            const r = Math.max(4.5, k * Math.sqrt(o.value))
            const ang = oi * 2.399963 + gi
            const dist = hub.r + r + 8 + oi * 4
            return { kind: 'outlet', g, o, r, x: Math.cos(ang) * dist, y: Math.sin(ang) * dist, vx: 0, vy: 0 }
          })
          for (let it = 0; it < 300; it++) {
            outs.forEach((n) => {
              const d = Math.hypot(n.x, n.y) || 0.01
              const f = (d - (hub.r + n.r + 10)) * 0.12
              n.vx -= (n.x / d) * f
              n.vy -= (n.y / d) * f
            })
            for (let i = 0; i < outs.length; i++) {
              for (let j = i + 1; j < outs.length; j++) {
                const p = outs[i]
                const q = outs[j]
                const dx = q.x - p.x
                const dy = q.y - p.y
                const d = Math.hypot(dx, dy) || 0.01
                const min = p.r + q.r + 4
                if (d < min) { const f = (min - d) * 0.5; p.vx -= (dx / d) * f; p.vy -= (dy / d) * f; q.vx += (dx / d) * f; q.vy += (dy / d) * f }
              }
            }
            outs.forEach((n) => { n.x += n.vx; n.y += n.vy; n.vx *= 0.6; n.vy *= 0.6 })
          }
          const R = Math.max(hub.r, ...outs.map((n) => Math.hypot(n.x, n.y) + n.r))
          return { g, hub, outs, R, x: 0, y: 0 }
        })
        clusters.forEach((c, i) => {
          const a = (i / clusters.length) * 2 * Math.PI - Math.PI / 2 + 0.35
          c.x = cx + Math.cos(a) * width * 0.3
          c.y = cy + Math.sin(a) * height * 0.3
        })
        // The groups are circles that cannot overlap each other, drawn a little to the center and kept in the chart.
        for (let it = 0; it < 700; it++) {
          clusters.forEach((c) => { c.x += (cx - c.x) * 0.012; c.y += (cy - c.y) * 0.03 })
          for (let pass = 0; pass < 3; pass++) {
            for (let i = 0; i < clusters.length; i++) {
              for (let j = i + 1; j < clusters.length; j++) {
                const p = clusters[i]
                const q = clusters[j]
                const dx = q.x - p.x
                const dy = q.y - p.y
                const d = Math.hypot(dx, dy) || 0.01
                const min = p.R + q.R + 22
                if (d < min) { const m = (min - d) / 2; p.x -= (dx / d) * m; p.y -= (dy / d) * m; q.x += (dx / d) * m; q.y += (dy / d) * m }
              }
            }
            clusters.forEach((c) => {
              c.x = Math.max(c.R + 8, Math.min(width - c.R - 8, c.x))
              c.y = Math.max(c.R + 22, Math.min(height - c.R - 22, c.y))
            })
          }
        }
        const overlap = clusters.some((p, i) => clusters.some((q, j) => j > i && Math.hypot(q.x - p.x, q.y - p.y) < p.R + q.R + 10))
        if (!overlap) break
        k *= 0.92
      }
      const nodes = []
      const links = []
      clusters.forEach((c) => {
        const hub = { ...c.hub, x: c.x, y: c.y }
        nodes.push(hub)
        c.outs.forEach((n) => { const o = { ...n, x: c.x + n.x, y: c.y + n.y }; nodes.push(o); links.push({ a: hub, b: o }) })
      })
      return { nodes, links, clusters }
    }

    // A network of owners and outlets. Nothing moves and nothing opens: a hover on a group or an outlet fades the other groups and its numbers are in the tooltip.
    // A click on a group opens its page and a click on an outlet opens its page. An outlet has its name inside its circle when it fits and beside it when there is room.
    function OwnerBubbles ({ groups, total }) {
      let hover = null
      const stanceRows = (stance) => {
        const n = stance[0] + stance[1] + stance[2]
        return n >= 30
          ? [{ label: t('stance.critical'), value: fmt.pct(stance[0] / n), color: 'var(--stance-critical)' }, { label: t('stance.supportive'), value: fmt.pct(stance[2] / n), color: 'var(--stance-supportive)' }]
          : [{ label: t('group.col.stance'), value: t('stance.few', { n: 30 }) }]
      }
      const groupTip = (g) => {
        const stance = g.outlets.reduce((a, o) => [a[0] + o.stance[0], a[1] + o.stance[1], a[2] + o.stance[2]], [0, 0, 0])
        const news = g.outlets.reduce((a, o) => a + o.news, 0) / (g.outlets.reduce((a, o) => a + o.analysed, 0) || 1)
        return {
          title: g.label,
          rows: [
            ...(g.key === null ? [] : [{ label: t('groups.col.owner'), value: g.owner }, { label: t('groups.col.lean'), value: g.lean || t('groups.lean.none') }]),
            { label: t('groups.col.articles'), value: `${fmt.int(g.value)} · ${fmt.pct(g.value / total)}` },
            { label: t('groups.col.outlets'), value: fmt.int(g.outlets.length) },
            { label: t('media.col.news'), value: fmt.pct(news) },
            ...stanceRows(stance)
          ]
        }
      }
      const outletTip = (o, g) => ({
        title: `${o.name} · ${g.label}`,
        rows: [
          { label: t('groups.col.articles'), value: `${fmt.int(o.value)} · ${fmt.pct(o.value / total)}` },
          { label: t('g2.bubble.ofgroup', { share: '' }).trim(), value: fmt.pct(o.value / g.value) },
          { label: t('media.col.news'), value: fmt.pct(o.news / (o.analysed || 1)) },
          ...stanceRows(o.stance)
        ]
      })
      const plain = (tip) => `${tip.title}: ${tip.rows.map((r) => `${r.label} ${r.value}`).join(', ')}`
      const tipOnRich = (el, tip) => {
        const show = (e) => UI.showTooltip(tip, e.clientX, e.clientY)
        el.addEventListener('pointerenter', show)
        el.addEventListener('pointermove', show)
        el.addEventListener('pointerleave', () => UI.hideTooltip())
        return el
      }

      return fit((holder, width) => {
        const height = Math.max(300, Math.min(440, Math.round(width * 0.56)))
        const { nodes, links, clusters } = netLayout(groups, width, height)
        const svg = h('svg', { class: 'chart net', width, height, viewBox: `0 0 ${width} ${height}`, role: 'group', 'aria-label': t('g2.tree.title') })
        const edgeLayer = h('g', {})
        const nodeLayer = h('g', {})
        const labelLayer = h('g', { class: 'bubble-labels' })
        svg.append(edgeLayer, nodeLayer, labelLayer)
        const byGroup = new Map(groups.map((g) => [g, []]))
        const mark = (g, el) => { byGroup.get(g).push(el); el.classList.add('net-el'); return el }
        function paint () { byGroup.forEach((els, g) => els.forEach((el) => { el.classList.toggle('is-dim', hover !== null && g !== hover); el.classList.toggle('is-active', g === hover) })) }
        const over = (g, el) => {
          el.addEventListener('pointerenter', () => { hover = g; paint() })
          el.addEventListener('pointerleave', () => { hover = null; paint() })
          return el
        }

        // The edges first, then the nodes, then the names, so a name is never under a circle.
        links.forEach(({ a, b }) => edgeLayer.append(mark(b.g, h('line', { class: 'net-edge', x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: b.g.color }))))
        nodes.forEach((n) => {
          const g = n.g
          if (n.kind === 'hub') {
            const c = h('circle', { class: 'net-hub', cx: n.x, cy: n.y, r: n.r, fill: g.color, stroke: 'var(--surface-page)', 'stroke-width': 2, tabindex: g.slug ? 0 : null, role: g.slug ? 'link' : null, 'aria-label': plain(groupTip(g)) })
            tipOnRich(c, groupTip(g))
            if (g.slug) {
              c.addEventListener('click', () => { location.href = `group-v2.html?g=${g.slug}` })
              c.addEventListener('keydown', (e) => { if (e.key === 'Enter') location.href = `group-v2.html?g=${g.slug}` })
              c.addEventListener('focus', () => { hover = g; paint() })
              c.addEventListener('blur', () => { hover = null; paint() })
            } else c.style.cursor = 'default'
            nodeLayer.append(over(g, mark(g, c)))
          } else {
            const c = h('circle', { class: 'net-outlet', cx: n.x, cy: n.y, r: n.r, fill: tint(g.color, g.key === null ? 0.5 : 0.35), stroke: g.color, 'stroke-width': 1.2 })
            tipOnRich(c, outletTip(n.o, g))
            c.addEventListener('click', () => { if (n.o.slug) location.href = `outlet-v2.html?slug=${n.o.slug}` })
            nodeLayer.append(over(g, mark(g, c)))
          }
        })

        // The names. A name in a circle needs the circle to be wide enough; a name beside a circle goes away from its group and is left out where it would touch another name or a circle.
        const boxes = []
        const hit = (x0, x1, y0, y1) => boxes.some((b) => x0 < b.x1 && b.x0 < x1 && y0 < b.y1 && b.y0 < y1) ||
          nodes.some((o) => { const nx = Math.max(x0, Math.min(o.x, x1)); const ny = Math.max(y0, Math.min(o.y, y1)); return Math.hypot(o.x - nx, o.y - ny) < o.r })
        // The name of a group stands next to its node, where the box is free of circles and names, and at the edge of its cluster if there is no such place.
        clusters.forEach((c) => {
          const name = short(c.g.label)
          const w = name.length * 6.9
          const hub = nodes.find((n) => n.kind === 'hub' && n.g === c.g)
          const ang = Math.atan2(c.y - height / 2, c.x - width / 2)
          const near = [[0, 1], [0, -1], [1, 0], [-1, 0], [0.7, 0.7], [-0.7, 0.7], [0.7, -0.7], [-0.7, -0.7]].map(([ux, uy]) => [ux, uy, hub.x, hub.y, hub.r + 5])
          const far = [[Math.cos(ang), Math.sin(ang)], [0, -1], [0, 1], [-1, 0], [1, 0]].map(([ux, uy]) => [ux, uy, c.x, c.y, c.R + 8])
          for (const [ux, uy, ox, oy, gap] of [...near, ...far]) {
            const anchor = Math.abs(ux) < 0.4 ? 'middle' : ux > 0 ? 'start' : 'end'
            const x = ox + ux * gap
            const y = oy + uy * gap + (uy > 0.4 ? 11 : uy < -0.4 ? -3 : 4)
            const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'start' ? x : x - w
            if (x0 < 2 || x0 + w > width - 2 || y - 12 < 0 || y + 3 > height || hit(x0, x0 + w, y - 12, y + 3)) continue
            boxes.push({ x0, x1: x0 + w, y0: y - 12, y1: y + 3 })
            labelLayer.append(mark(c.g, h('text', { class: 'bubble-name', x, y, 'text-anchor': anchor }, name)))
            break
          }
        })
        nodes.filter((n) => n.kind === 'outlet').sort((a, b) => b.r - a.r).forEach((n) => {
          const name = n.o.name
          const w = name.length * 6.3
          const fill = tint(n.g.color, n.g.key === null ? 0.5 : 0.35)
          if (n.r * 2 >= w + 8 && n.r >= 13) {
            const two = n.r >= 24
            const txt = [h('text', { class: 'tile-label', x: n.x, y: n.y + (two ? -2 : 4), 'text-anchor': 'middle', style: { fill: textOn(fill), 'font-weight': 500 } }, name)]
            if (two) txt.push(h('text', { class: 'tile-share', x: n.x, y: n.y + 13, 'text-anchor': 'middle', style: { fill: textOn(fill) } }, fmt.pct(n.o.value / total)))
            txt.forEach((el) => labelLayer.append(mark(n.g, el)))
            boxes.push({ x0: n.x - w / 2, x1: n.x + w / 2, y0: n.y - 10, y1: n.y + 16 })
            return
          }
          const hub = nodes.find((o) => o.kind === 'hub' && o.g === n.g)
          const ang = Math.atan2(n.y - hub.y, n.x - hub.x)
          const right = Math.cos(ang) >= 0
          const x = n.x + (right ? 1 : -1) * (n.r + 4)
          const y = n.y + 4
          const x0 = right ? x : x - w
          const x1 = right ? x + w : x
          if (x0 < 2 || x1 > width - 2 || hit(x0, x1, y - 12, y + 4)) return
          boxes.push({ x0, x1, y0: y - 12, y1: y + 4 })
          labelLayer.append(mark(n.g, h('text', { class: 'net-name', x, y, 'text-anchor': right ? 'start' : 'end' }, name)))
        })

        paint()
        const table = h('div', { class: 'visually-hidden' }, h('table', {}, h('caption', {}, t('g2.tree.title')),
          h('tbody', {}, groups.flatMap((g) => g.outlets.map((o) => h('tr', {}, h('th', { scope: 'row' }, o.name), h('td', {}, plain(outletTip(o, g)))))))))
        holder.replaceChildren(svg, table)
      })
    }

    // Sunburst: the inner ring is the groups, the outer ring their outlets. The rings are in the order of the legend, from the top, clockwise.
    function Sunburst ({ groups, total }) {
      const size = 176
      const c = size / 2
      const rings = [[44, 65], [67, 87]]
      const pad = 0.008
      const arc = (a0, a1, r0, r1) => {
        a0 += pad / 2
        a1 = Math.max(a0 + 0.002, a1 - pad / 2)
        const p = (a, r) => `${(c + r * Math.sin(a)).toFixed(2)} ${(c - r * Math.cos(a)).toFixed(2)}`
        const large = a1 - a0 > Math.PI ? 1 : 0
        return `M${p(a0, r1)}A${r1} ${r1} 0 ${large} 1 ${p(a1, r1)}L${p(a1, r0)}A${r0} ${r0} 0 ${large} 0 ${p(a0, r0)}Z`
      }
      const svg = h('svg', { class: 'chart donut sunburst', width: size, height: size, viewBox: `0 0 ${size} ${size}`, role: 'img', 'aria-label': groups.map((g) => `${g.label} ${fmt.pct(g.value / total)}`).join(', ') })
      let a = 0
      groups.forEach((g) => {
        const span = (g.value / total) * 2 * Math.PI
        svg.append(tipOn(h('path', { class: 'slice', d: arc(a, a + span, ...rings[0]), fill: g.color }), t('g2.donut.tip', { group: g.label, n: fmt.int(g.value), share: fmt.pct(g.value / total) })))
        let b = a
        g.outlets.forEach((o) => {
          const s = (o.value / total) * 2 * Math.PI
          svg.append(tipOn(h('path', { class: 'slice', d: arc(b, b + s, ...rings[1]), fill: tint(g.color, g.key === null ? 0.45 : 0.4) }), t('g2.tree.tip', { outlet: o.name, group: g.label, n: fmt.int(o.value), share: fmt.pct(o.value / total) })))
          b += s
        })
        a += span
      })
      svg.append(h('text', { class: 'donut-num', x: c, y: c + 3, 'text-anchor': 'middle' }, fmt.int(total)),
        h('text', { x: c, y: c + 19, 'text-anchor': 'middle' }, t('g2.donut.center')))
      return svg
    }

    Shell.start({
      id: 'groups',
      route: '/groups',
      dash: true,
      title: () => t('groups.title'),
      breadcrumbs: () => [{ label: t('groups.title') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        const draw = () => {
          reset()
          if (result.kind === 'failed' || result.kind === 'notFound') {
            content.replaceChildren(TopBar({ title: t('nav.media'), tabs, quiet: true }), UI.ErrorState({ onRetry: () => location.reload() }), protoNote())
            return
          }
          const d = result.data
          const empty = result.kind === 'empty'
          const period = fmt.period(d.window[0], d.window[1])
          const colorOf = Dash.groupColors(d.groups)
          const groups = empty ? [] : d.groups.filter((g) => g.collected > 0)
          const total = empty ? 0 : d.totalCollected
          const grouped = groups.reduce((s, g) => s + g.collected, 0)
          const ungroupedTotal = empty ? 0 : d.ungrouped.reduce((s, o) => s + o.collected, 0)
          const hrefOf = (g) => `group-v2.html?g=${g.slug}`

          const bar = TopBar({ title: t('nav.media'), tabs, quiet: true })

          const rows = [...groups.map((g) => ({ key: g.name, label: g.name, value: g.collected, color: colorOf.get(g.name) })), ...(ungroupedTotal ? [{ key: null, label: t('media2.groups.none'), value: ungroupedTotal, color: NO_GROUP }] : [])]

          // Row 2, on the left: the network of owners and outlets. Row 2, on the right: the share of each group and of its outlets. The owner of a group is in the title of its legend row.
          const outletOf = (o) => ({ name: o.name, slug: o.slug, value: o.collected, analysed: o.analysed, news: o.news, stance: o.stance })
          const treeGroups = [...groups.map((g) => ({ key: g.name, label: g.name, owner: g.owner, color: colorOf.get(g.name), slug: g.slug, lean: g.lean, outlets: g.outlets.filter((o) => o.collected > 0).map(outletOf).sort((a, b) => b.value - a.value) })),
            ...(ungroupedTotal ? [{ key: null, label: t('media2.groups.none'), owner: null, color: NO_GROUP, outlets: d.ungrouped.filter((o) => o.collected > 0).map(outletOf).sort((a, b) => b.value - a.value) }] : [])]
          treeGroups.forEach((g) => { g.value = g.outlets.reduce((s, o) => s + o.value, 0) })
          const bubbles = card('c-8', cardHead(t('g2.tree.title'), null, [t('g2.tree.sub', { period }), t('g2.record', { source: d.record.source, date: fmt.date(d.record.exportedAt) })].join(' ')),
            total ? OwnerBubbles({ groups: treeGroups, total }) : emptyText(t('groups.empty')))
          // The finding (how much the 3 largest groups write) is the first sentence of the info of the card.
          const top3 = treeGroups.filter((g) => g.key !== null).sort((a, b) => b.value - a.value).slice(0, 3).reduce((a, g) => a + g.value, 0)
          const shareCard = card('c-4', cardHead(t('media2.groups.title'), null, total ? [t('g2.share.finding', { share: fmt.pct(top3 / total) }), t('media2.groups.known', { share: fmt.pct(grouped / total) })].join('. ') : null),
            total
              ? h('div', { class: 'donut-wrap sun-wrap' },
                  h('ul', { class: 'rows rows-groups rows-owners' }, treeGroups.map((g) => {
                    return h('li', { title: g.key === null ? t('g2.bubble.none', { n: fmt.int(g.outlets.length) }) : `${g.owner} · ${t('g2.bubble.outlets', { n: fmt.int(g.outlets.length) })}` },
                      h('span', { class: g.key === null ? 'dot dot-none' : 'dot', style: `--dot:${g.color}`, 'aria-hidden': 'true' }),
                      h('span', { class: 'row-name', title: g.label }, g.key === null ? g.label : h('a', { class: 'quiet-link', href: hrefOf(groups.find((x) => x.name === g.key)) }, g.label)),
                      h('span', { class: 'row-value' }, fmt.pct(g.value / total)))
                  })),
                  Sunburst({ groups: treeGroups, total }))
              : emptyText(t('groups.empty')))

          // Row 1, on the left: a line for each group, the articles of each day.
          const m = media.kind === 'data' ? media.data : null
          const groupOf = new Map([...groups.flatMap((g) => g.outlets.map((o) => [o.slug, g.name])), ...(empty ? [] : d.ungrouped.map((o) => [o.slug, null]))])
          const order = rows.map((r) => ({ key: r.key, label: r.label, color: r.color }))
          const stacks = m && !empty ? m.dates.map((_, i) => order.map((o) => ({ ...o, value: m.outlets.reduce((a, out, k) => (groupOf.has(out.slug) && groupOf.get(out.slug) === o.key ? a + m.outletDaily[k][i][0] : a), 0) }))) : []
          const volumeTotal = stacks.reduce((s, day) => s + day.reduce((a, b) => a + b.value, 0), 0)
          const volume = card('c-7', cardHead(t('g2.volume.title'), null, t('g2.volume.info', { min: fmt.int(GAP), n: fmt.int(volumeTotal) })),
            volumeTotal
              ? [(() => { const l = UI.Legend(order.map((o) => ({ label: compact(o), color: o.color }))); l.classList.add('legend-line'); return l })(), VolumeChart({ dates: m.dates, stacks, order })]
              : emptyText(t('groups.empty')))

          // Row 1, on the right: the stance of each group.
          const stanceRows = groups.map((g) => {
            const s = g.outlets.reduce((a, o) => [a[0] + o.stance[0], a[1] + o.stance[1], a[2] + o.stance[2]], [0, 0, 0])
            const n = s[0] + s[1] + s[2]
            return { g, crit: s[0] / n, neu: s[1] / n, sup: s[2] / n, n }
          }).filter((r) => r.n >= 30)
          const scale = Math.max(...stanceRows.map((r) => Math.max(r.crit + r.neu / 2, r.sup + r.neu / 2)), 0.01)
          const critical = stanceRows.slice().sort((a, b) => b.crit - a.crit)
          const stanceCard = card('c-5', cardHead(t('g2.stance.title'), null, `${critical.length > 1 ? `${t('g2.stance.finding', { most: critical[0].g.name, a: fmt.pct(critical[0].crit), least: critical[critical.length - 1].g.name, b: fmt.pct(critical[critical.length - 1].crit) })}. ` : ''}${t('g2.stance.sub')}`),
            stanceRows.length
              ? [UI.Legend(['critical', 'neutral', 'supportive'].map((nm, i) => ({ label: t(`stance.${nm}`), color: UI.STANCE_COLORS[i] }))),
                UI.BarList(stanceRows.map((r) => ({
                  label: [h('span', { class: 'dot', style: `--dot:${colorOf.get(r.g.name)}`, 'aria-hidden': 'true' }), r.g.name],
                  text: `${fmt.pct(r.crit)} · ${fmt.pct(r.sup)}`,
                  bar: UI.DivergingBar({ left: r.crit, middle: r.neu, right: r.sup, scale, label: t('g2.stance.row', { group: r.g.name, critical: fmt.pct(r.crit), neutral: fmt.pct(r.neu), supportive: fmt.pct(r.sup), n: fmt.int(r.n) }) })
                })))]
              : emptyText(t('groups.empty')))

          content.replaceChildren(bar, h('div', { class: 'dash-grid' }, volume, stanceCard, bubbles, shareCard), protoNote())
        }
        draw()
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
