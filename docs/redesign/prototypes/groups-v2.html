<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=4">
  <link rel="stylesheet" href="assets/app.css?v=11">
  <link rel="stylesheet" href="assets/dash.css?v=52">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=2"></script>
  <script src="assets/messages.js?v=11"></script>
  <script src="assets/messages-v2.js?v=27"></script>
  <script src="assets/components.js?v=6"></script>
  <script src="assets/dash.js?v=8"></script>
  <script src="assets/shell.js?v=25"></script>
  <script src="data/groups.js?v=2"></script>
  <script>
    // Media, Ιδιοκτησία: dashboard of APO-161. The group, the owner and the articles come from the static files,
    // so the period is fixed (1 Aug to 30 Sep 2026): there is no period control. The period is in the note of the table.
    const { t, fmt, h, load } = App
    const { fit, reset, NO_GROUP, Scale, card, cardHead, emptyText, TopBar, textOn, tint } = Dash
    const result = load('groups', ['groups', 'ungrouped', 'totalCollected', 'window'], (b) => b.groups)

    // Squarified treemap: the rows of an item list (sorted, largest first) fill a rectangle with boxes of the same shape as far as possible.
    function squarify (items, x, y, w, hh) {
      const total = items.reduce((s, i) => s + i.value, 0)
      if (!total || w <= 0 || hh <= 0) return []
      const nodes = items.map((it) => ({ it, area: (it.value / total) * w * hh }))
      const out = []
      let row = []
      const worst = (r, side) => {
        const s = r.reduce((a, n) => a + n.area, 0)
        const mx = Math.max(...r.map((n) => n.area))
        const mn = Math.min(...r.map((n) => n.area))
        return Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn))
      }
      const layoutRow = (r) => {
        const s = r.reduce((a, n) => a + n.area, 0)
        if (w >= hh) {
          const cw = s / hh
          let cy = y
          r.forEach((n) => { const ch = n.area / cw; out.push({ it: n.it, x, y: cy, w: cw, h: ch }); cy += ch })
          x += cw
          w -= cw
        } else {
          const rh = s / w
          let cx = x
          r.forEach((n) => { const cw = n.area / rh; out.push({ it: n.it, x: cx, y, w: cw, h: rh }); cx += cw })
          y += rh
          hh -= rh
        }
      }
      let i = 0
      while (i < nodes.length) {
        const side = Math.min(w, hh)
        if (!row.length || worst(row.concat(nodes[i]), side) <= worst(row, side)) { row.push(nodes[i]); i++ } else { layoutRow(row); row = [] }
      }
      if (row.length) layoutRow(row)
      return out
    }

    // Treemap of owners and outlets. The area is the collected articles. The color is the group.
    function OwnerTreemap ({ groups, total }) {
      return fit((holder, width) => {
        const height = Math.max(240, Math.min(290, Math.round(width * 0.3)))
        const svg = h('svg', { class: 'chart', width, height, viewBox: `0 0 ${width} ${height}`, 'aria-hidden': 'true' })
        const tip = (o, g) => t('g2.tree.tip', { outlet: o.name, group: g.label, n: fmt.int(o.value), share: fmt.pct(o.value / total) })
        squarify(groups.map((g) => ({ ...g, value: g.outlets.reduce((s, o) => s + o.value, 0) })), 0, 0, width, height).forEach((box) => {
          const g = box.it
          const gx = box.x + 1
          const gy = box.y + 1
          const gw = box.w - 2
          const gh = box.h - 2
          if (gw <= 0 || gh <= 0) return
          // The group box is a light tint with a line of the group color on top. The outlet boxes are a stronger tint of the same color.
          svg.append(h('rect', { x: gx, y: gy, width: gw, height: gh, fill: tint(g.color, 0.84), rx: 4 }),
            h('rect', { x: gx, y: gy, width: gw, height: 3, fill: g.color, rx: 1.5 }))
          const head = gh >= 46 && gw >= 90 ? 22 : 0
          if (head) {
            const label = t('g2.tree.group', { group: g.label, share: fmt.pct(g.value / total) })
            svg.append(h('text', { class: 'tile-head', x: gx + 8, y: gy + 17, style: { fill: '#1f1f1f' } }, label.length * 6.8 > gw - 16 ? `${label.slice(0, Math.max(3, Math.floor((gw - 16) / 6.8) - 1))}…` : label))
          }
          squarify(g.outlets.slice().sort((a, b) => b.value - a.value), gx + 3, gy + head + (head ? 0 : 5), gw - 6, gh - head - (head ? 3 : 8)).forEach((cell) => {
            const o = cell.it
            const fill = tint(g.color, 0.5)
            const r = h('rect', { class: 'tile', x: cell.x + 1, y: cell.y + 1, width: Math.max(0, cell.w - 2), height: Math.max(0, cell.h - 2), fill, rx: 3 })
            const show = (e) => UI.showTooltip(tip(o, g), e.clientX, e.clientY)
            r.addEventListener('pointerenter', show)
            r.addEventListener('pointermove', show)
            r.addEventListener('pointerleave', () => UI.hideTooltip())
            svg.append(r)
            if (cell.w >= o.name.length * 6.5 + 10 && cell.h >= 22) {
              svg.append(h('text', { class: 'tile-label', x: cell.x + 7, y: cell.y + 17, style: { fill: textOn(fill) } }, o.name))
              if (cell.h >= 40) svg.append(h('text', { class: 'tile-share', x: cell.x + 7, y: cell.y + 32, style: { fill: textOn(fill) } }, fmt.pct(o.value / total)))
            }
          })
        })
        const table = h('div', { class: 'visually-hidden' }, h('table', {}, h('caption', {}, t('g2.tree.title')),
          h('tbody', {}, groups.flatMap((g) => g.outlets.map((o) => h('tr', {}, h('th', { scope: 'row' }, o.name), h('td', {}, tip(o, g))))))))
        holder.replaceChildren(svg, table)
      })
    }

    // Donut: the share of each group in the collected articles. The ring is in the order of the legend. The legend has the numbers.
    function Donut ({ rows, total }) {
      const size = 132
      const radius = 54
      const circ = 2 * Math.PI * radius
      const gap = 2
      const svg = h('svg', { class: 'chart donut', width: size, height: size, viewBox: `0 0 ${size} ${size}`, role: 'img', 'aria-label': rows.map((r) => `${r.label} ${fmt.pct(r.value / total)}`).join(', ') })
      let start = 0
      rows.forEach((r) => {
        const len = (r.value / total) * circ
        const c = h('circle', { class: 'slice', cx: size / 2, cy: size / 2, r: radius, fill: 'none', stroke: r.color, 'stroke-width': 18, 'stroke-dasharray': `${Math.max(1, len - gap)} ${circ}`, 'stroke-dashoffset': -start, transform: `rotate(-90 ${size / 2} ${size / 2})` })
        const show = (e) => UI.showTooltip(t('g2.donut.tip', { group: r.label, n: fmt.int(r.value), share: fmt.pct(r.value / total) }), e.clientX, e.clientY)
        c.addEventListener('pointerenter', show)
        c.addEventListener('pointermove', show)
        c.addEventListener('pointerleave', () => UI.hideTooltip())
        svg.append(c)
        start += len
      })
      svg.append(h('text', { class: 'donut-num', x: size / 2, y: size / 2 + 3, 'text-anchor': 'middle' }, fmt.int(total)),
        h('text', { x: size / 2, y: size / 2 + 19, 'text-anchor': 'middle' }, t('g2.donut.center')))
      return svg
    }

    Shell.start({
      id: 'groups',
      route: '/groups',
      dash: true,
      title: () => t('groups.title'),
      breadcrumbs: () => [{ label: t('groups.title') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        const draw = () => {
          reset()
          if (result.kind === 'failed' || result.kind === 'notFound') {
            content.replaceChildren(TopBar({ title: t('nav.media'), tabs, quiet: true }), UI.ErrorState({ onRetry: () => location.reload() }), protoNote())
            return
          }
          const d = result.data
          const empty = result.kind === 'empty'
          const period = fmt.period(d.window[0], d.window[1])
          const colorOf = Dash.groupColors(d.groups)
          const groups = empty ? [] : d.groups.filter((g) => g.collected > 0)
          const total = empty ? 0 : d.totalCollected
          const grouped = groups.reduce((s, g) => s + g.collected, 0)
          const ungroupedTotal = empty ? 0 : d.ungrouped.reduce((s, o) => s + o.collected, 0)
          const hrefOf = (g) => `group-v2.html?g=${g.slug}`

          const bar = TopBar({ title: t('nav.media'), tabs, quiet: true })

          const rows = [...groups.map((g) => ({ key: g.name, label: g.name, value: g.collected, color: colorOf.get(g.name) })), ...(ungroupedTotal ? [{ key: null, label: t('media2.groups.none'), value: ungroupedTotal, color: NO_GROUP }] : [])]

          // Row 1: the treemap and the share of each group.
          const treeGroups = [...groups.map((g) => ({ key: g.name, label: g.name, color: colorOf.get(g.name), outlets: g.outlets.filter((o) => o.collected > 0).map((o) => ({ name: o.name, value: o.collected })) })),
            ...(ungroupedTotal ? [{ key: null, label: t('media2.groups.none'), color: NO_GROUP, outlets: d.ungrouped.filter((o) => o.collected > 0).map((o) => ({ name: o.name, value: o.collected })) }] : [])]
          const treemap = card('c-7', cardHead(t('g2.tree.title'), null, t('g2.tree.sub')),
            total ? OwnerTreemap({ groups: treeGroups, total }) : emptyText(t('groups.empty')))
          const shareCard = card('c-5', cardHead(t('media2.groups.title'), null, total ? t('media2.groups.known', { share: fmt.pct(grouped / total) }) : null),
            total
              ? [h('div', { class: 'donut-wrap' }, Donut({ rows, total }),
                  h('ul', { class: 'rows rows-groups' }, rows.map((r) => h('li', {},
                    h('span', { class: r.key === null ? 'dot dot-none' : 'dot', style: `--dot:${r.color}`, 'aria-hidden': 'true' }),
                    h('span', { class: 'row-name', title: r.label }, r.key === null ? r.label : h('a', { class: 'quiet-link', href: hrefOf(groups.find((g) => g.name === r.key)) }, r.label)),
                    h('span', { class: 'row-value' }, fmt.pct(r.value / total))))))]
              : emptyText(t('groups.empty')))

          // Row 2: the stance of each group, and the political lean.
          const stanceRows = groups.map((g) => {
            const s = g.outlets.reduce((a, o) => [a[0] + o.stance[0], a[1] + o.stance[1], a[2] + o.stance[2]], [0, 0, 0])
            const n = s[0] + s[1] + s[2]
            return { g, crit: s[0] / n, neu: s[1] / n, sup: s[2] / n, n }
          }).filter((r) => r.n >= 30)
          const unit = stanceRows.length ? 40 / Math.max(...stanceRows.map((r) => Math.max(r.crit + r.neu / 2, r.sup + r.neu / 2))) : 0
          const seg = (name, left, width) => h('span', { class: 'div-seg', style: `--seg:var(--stance-${name});left:${left}%;width:${width}%` })
          const stanceCard = card('c-7', cardHead(t('g2.stance.title'), h('span', { class: 'stance-key' },
            [['stance.critical', 'critical'], ['stance.neutral', 'neutral'], ['stance.supportive', 'supportive']].map(([key, nm]) => h('span', { class: 'key-item' }, h('span', { class: 'swatch', style: { background: `var(--stance-${nm})` } }), t(key)))), t('g2.stance.sub')),
            stanceRows.length
              ? h('ul', { class: 'diverge' }, stanceRows.map((r) => h('li', { 'aria-label': t('g2.stance.row', { group: r.g.name, critical: fmt.pct(r.crit), neutral: fmt.pct(r.neu), supportive: fmt.pct(r.sup), n: fmt.int(r.n) }) },
                h('span', { class: 'div-name', title: r.g.name }, r.g.name),
                h('span', { class: 'div-track' },
                  seg('critical', 50 - (r.neu / 2) * unit - r.crit * unit, r.crit * unit),
                  seg('neutral', 50 - (r.neu / 2) * unit, r.neu * unit),
                  seg('supportive', 50 + (r.neu / 2) * unit, r.sup * unit),
                  h('span', { class: 'div-mid' }),
                  h('span', { class: 'div-val div-val-l', style: `right:${100 - (50 - (r.neu / 2) * unit - r.crit * unit)}%` }, fmt.pct(r.crit)),
                  h('span', { class: 'div-val div-val-r', style: `left:${50 + (r.neu / 2) * unit + r.sup * unit}%` }, fmt.pct(r.sup))))))
              : emptyText(t('groups.empty')))

          const leanTotals = new Map()
          groups.forEach((g) => { const k = g.lean || null; const e = leanTotals.get(k) || { value: 0, groups: 0 }; e.value += g.collected; e.groups++; leanTotals.set(k, e) })
          const leanRows = [...leanTotals.entries()].map(([lean, e]) => ({ lean, ...e })).sort((a, b) => (a.lean === null) - (b.lean === null) || b.value - a.value)
          const leanCard = card('c-5', cardHead(t('g2.lean.title'), null, t('g2.lean.sub')),
            leanRows.length
              ? h('ul', { class: 'rows' }, [...leanRows.map((r) => h('li', { style: `--bar-color:${r.lean === null ? 'var(--bar-muted)' : 'var(--series-news)'}` },
                h('span', { class: 'row-name' }, r.lean || t('groups.lean.none')), h('span', { class: 'row-value' }, t('g2.lean.value', { share: fmt.pct(r.value / total), groups: fmt.int(r.groups) })),
                UI.HBar(r.value, leanRows[0].value))),
              ungroupedTotal ? h('li', { style: '--bar-color:var(--bar-muted)' }, h('span', { class: 'row-name' }, t('media2.groups.none')), h('span', { class: 'row-value' }, fmt.pct(ungroupedTotal / total)), UI.HBar(ungroupedTotal, leanRows[0].value)) : null])
              : emptyText(t('groups.empty')))

          // Row 3: the ranking table.
          const newsOf = (g) => g.outlets.reduce((s, o) => s + o.news, 0) / (g.outlets.reduce((s, o) => s + o.analysed, 0) || 1)
          const newsAll = groups.map(newsOf)
          const newsAvg = groups.reduce((s, g) => s + g.outlets.reduce((a, o) => a + o.news, 0), 0) / (groups.reduce((s, g) => s + g.outlets.reduce((a, o) => a + o.analysed, 0), 0) || 1)
          const stanceOf = (g) => g.outlets.reduce((a, o) => [a[0] + o.stance[0], a[1] + o.stance[1], a[2] + o.stance[2]], [0, 0, 0])
          const table = card('c-12', cardHead(t('g2.table.title'), null, [t('g2.table.note', { period }), groups.length ? `${t('groups.table.none', { n: fmt.int(d.ungrouped.length), articles: fmt.int(ungroupedTotal), share: fmt.pct(ungroupedTotal / total) })} ${t('g2.record', { source: d.record.source, date: fmt.date(d.record.exportedAt) })}` : ''].join(' ')),
            UI.DataTable({
              rows: groups, rankColumn: true, emptyText: t('media.empty'),
              columns: [
                { label: t('groups.col.group'), render: (g) => h('span', { class: 'group-cell' }, h('span', { class: 'dot', style: `--dot:${colorOf.get(g.name)}`, 'aria-hidden': 'true' }), h('a', { class: 'quiet-link', href: hrefOf(g) }, g.name)) },
                { label: t('groups.col.owner'), phone: false, key: 'owner' },
                { label: t('groups.col.lean'), phone: false, render: (g) => g.lean || h('span', { class: 'mini-empty' }, t('groups.lean.none')) },
                { label: t('groups.col.outlets'), num: true, render: (g) => fmt.int(g.outlets.length) },
                { label: t('groups.col.articles'), num: true, render: (g) => fmt.int(g.collected) },
                { label: t('groups.col.share'), num: true, render: (g) => fmt.pct(g.collected / total) },
                { label: t('media.col.news'), num: true, phone: false, render: (g) => h('div', { class: 'scale-cell' }, h('span', { class: 'scale-num' }, fmt.pct(newsOf(g))), Scale(newsOf(g), Math.min(...newsAll), Math.max(...newsAll), newsAvg, fmt.pct(newsOf(g)), fmt.pct(newsAvg))) },
                { label: t('group.col.stance'), phone: false, render: (g) => UI.MiniStance([
                  { label: t('stance.critical'), value: stanceOf(g)[0], color: 'var(--stance-critical)' },
                  { label: t('stance.neutral'), value: stanceOf(g)[1], color: 'var(--stance-neutral)' },
                  { label: t('stance.supportive'), value: stanceOf(g)[2], color: 'var(--stance-supportive)' }
                ]) }
              ]
            }))

          content.replaceChildren(bar, h('div', { class: 'dash-grid' }, treemap, shareCard, stanceCard, leanCard, table), protoNote())
        }
        draw()
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
