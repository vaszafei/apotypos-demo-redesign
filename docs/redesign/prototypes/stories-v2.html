<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=6">
  <link rel="stylesheet" href="assets/app.css?v=22">
  <link rel="stylesheet" href="assets/dash.css?v=79">
  <link rel="stylesheet" href="assets/mme.css?v=15">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=4"></script>
  <script src="assets/messages.js?v=28"></script>
  <script src="assets/messages-v2.js?v=37"></script>
  <script src="assets/messages-spread.js?v=15"></script>
  <script src="assets/messages-mme.js?v=10"></script>
  <script src="assets/components.js?v=9"></script>
  <script src="assets/motion.js?v=1"></script>
  <script src="assets/dash.js?v=16"></script>
  <script src="assets/mme.js?v=8"></script>
  <script src="assets/spread.js?v=6"></script>
  <script src="assets/shell.js?v=44"></script>
  <script src="data/stories.js?v=1"></script>
  <script src="data/storyDetail.js?v=1"></script>
  <script src="data/groups.js?v=1"></script>
  <script src="data/mme.js?v=1"></script>
  <script>
    // Stories: one page for all stories (APO-180). The chart of days shows when stories start, and the table lists every story.
    // Two tabs (#62): Επισκόπηση (/stories) and Ανά μέσο (?tab=outlets, /stories/outlets) with the stories × outlets matrix.
    const { t, fmt, h, load, params } = App
    const tab = params.get('tab') === 'outlets' ? 'outlets' : 'overview'
    const { reset, NO_GROUP, card, cardHead } = Dash
    const list = load('stories', ['dates', 'issues', 'stories'], (b) => b.stories)
    const detail = load('storyDetail', ['outlets', 'stories'], (b) => b.stories)
    const groupsData = load('groups', ['groups'], (b) => b.groups)
    // «Ιστορίες ανά μέσο», the stories × outlets matrix of the live page ΜΜΕ & πρόσωπα (data/mme.js), over its whole window.
    const mme = load('mme', ['sets'], (b) => Object.keys(b.sets))
    const mmeView = { generic: false }
    const colorOfGroup = Dash.groupColors(groupsData.data ? groupsData.data.groups : [])
    const STEP = 25
    // The first page of the table is shorter, so it stays on the same screen as the chart of days (#62).
    const FIRST = 12
    // The 4 ways a story starts, from the first day with an outlet that has a group. The first 3 are teal and gray, so they do not use the colors of the groups.
    const TYPES = [
      ['together', 'var(--series-news)'],
      ['follow', 'var(--series-other)'],
      ['single', 'var(--bar-muted)'],
      ['none', 'var(--rule)']
    ]

    // Columns, one for each day, stacked by the way the story started.
    function DailyChart ({ series, dates }) {
      const totals = dates.map((_, i) => series.reduce((sum, x) => sum + x.values[i], 0))
      return UI.BarChart({
        dates, series, height: 190, label: t('stories.daily.aria'),
        reference: { value: totals.reduce((a, b) => a + b, 0) / (totals.length || 1), label: t('find.avg', { n: fmt.int(Math.round(totals.reduce((a, b) => a + b, 0) / (totals.length || 1))) }) },
        tooltipOf: (i) => { const parts = series.filter((x) => x.values[i]).map((x) => `${x.name} ${x.values[i]}`).join(' · '); return `${t('stories.daily.tip', { date: fmt.date(dates[i]), n: fmt.int(totals[i]) })}${parts ? `: ${parts}` : ''}` }
      })
    }

    Shell.start({
      id: 'stories',
      route: tab === 'outlets' ? '/stories/outlets' : '/stories',
      dash: true,
      title: () => t('nav.spread'),
      breadcrumbs: () => [{ label: t('nav.spread') }],
      render (content) {
        content.classList.add('dash', 'minimal')
        const title = t('nav.spread')
        const problem = Dash.stateContent([list, detail])
        if (problem) { content.replaceChildren(...problem.filter(Boolean), protoNote()); return }
        const d = list.data
        const dd = detail.data
        const name = (x) => x[App.locale] || x.el
        const last = d.dates.length - 1
        const prof = Spread.profiles(dd)
        const groups = prof.groups
        const colorOf = (i) => colorOfGroup.get(groups[i]) || NO_GROUP
        const profileOf = new Map(prof.list.map((p) => [p.id, p]))
        // A generic story is a catch-all, such as "Άλλα διεθνή". It is not a story, so the page leaves it out.
        const stories = d.stories.filter((s) => !s.generic && profileOf.has(s.id)).map((s) => {
          const articles = s.days.reduce((sum, v, i) => (i % 2 ? sum + v : sum), 0)
          return { ...s, articles, start: s.days[0], end: s.days[s.days.length - 2], p: profileOf.get(s.id) }
        })

        const grid = h('div', { class: 'dash-grid story-top' })

        function draw () {
          reset()
          const rows = stories.slice().sort((a, b) => b.articles - a.articles || b.start - a.start)

          const series = TYPES.map(([key, color]) => {
            const values = new Array(last + 1).fill(0)
            rows.filter((s) => s.p.type === key).forEach((s) => { values[s.start]++ })
            return { name: t(`stories.type.${key}`), color, values }
          })
          // #60: each title says what its chart shows. The topic of the card goes to its info.
          const dailyCard = card('c-5', cardHead(t('stories.daily.title'), null, t('stories.daily.info')), DailyChart({ series, dates: d.dates }),
            UI.Legend(series.map((x) => ({ label: x.name, color: x.color }))))

          const day = (i) => fmt.date(d.dates[i], { day: 'numeric', month: 'short' })
          const table = UI.DataTable({
            rows, rankColumn: true, pageSize: FIRST, moreStep: STEP, emptyText: t('media.empty'),
            columns: [
              { label: t('media.col.story'), render: (s) => UI.EntityLink({ type: 'story', key: String(s.id), label: name(s) }) },
              { label: t('media.col.issue'), phone: false, render: (s) => h('span', { class: 'topic-cell' }, name(d.issues[s.issue])) },
              { label: t('stories.col.groups'), phone: false, render: (s) => {
                const text = t('echoes.reach.aria', { n: s.p.peakGroups.length, total: groups.length })
                return h('span', { class: 'nowrap reach', role: 'img', 'aria-label': text, title: text },
                  groups.map((_, i) => (s.p.peakGroups.includes(i) ? h('span', { class: 'dot', style: `--dot:${colorOf(i)}` }) : h('span', { class: 'dot dot-none' }))))
              } },
              { label: t('stories.col.period'), phone: false, render: (s) => h('span', { class: 'nowrap' }, s.start === s.end ? day(s.start) : `${day(s.start)} → ${day(s.end)}`) },
              { label: t('media.col.articles'), num: true, render: (s) => fmt.int(s.articles) }
            ]
          })
          const tableCard = card('c-7', cardHead(t('topics2.stories.title'), null, t('topics2.stories.note', { n: fmt.int(stories.length) })),
            h('p', { class: 'dcard-sub' }, t('stories.count', { n: fmt.int(rows.length) })), table)
          // The stories × outlets matrix of ΜΜΕ & πρόσωπα, on Ανά μέσο. Its toggle draws only this card again.
          const mmeCard = h('div', { class: 'c-12 card-col' })
          if (tab === 'outlets' && mme.kind === 'data') {
            const mset = mme.data.sets.gr
            const MS = Mme.summary(mset, 0, mset.dates.length - 1)
            const paintMme = () => mmeCard.replaceChildren(Mme.StoriesCard(MS, { generic: mmeView.generic, onGeneric: (v) => { mmeView.generic = v; paintMme() } }))
            paintMme()
          }
          if (tab === 'outlets') grid.replaceChildren(mmeCard)
          else grid.replaceChildren(tableCard, dailyCard)
        }
        draw()

        content.replaceChildren(h('h1', { class: 'visually-hidden' }, title), grid, protoNote())
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
