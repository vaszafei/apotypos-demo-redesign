<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=15">
  <link rel="stylesheet" href="assets/app.css?v=50">
  <link rel="stylesheet" href="assets/dash.css?v=100">
  <link rel="stylesheet" href="assets/mme.css?v=54">
  <link rel="stylesheet" href="assets/home.css?v=49">
  <link rel="stylesheet" href="assets/date-range.css?v=10">

</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=9"></script>
  <script src="assets/messages.js?v=43"></script>
  <script src="assets/messages-v2.js?v=58"></script>
  <script src="assets/messages-spread.js?v=23"></script>
  <script src="assets/messages-mme.js?v=21"></script>
  <script src="assets/messages-home.js?v=23"></script>
  <script src="assets/components.js?v=20"></script>
  <script src="assets/motion.js?v=3"></script>
  <script src="assets/dash.js?v=28"></script>
  <script src="assets/date-range.js?v=3"></script>
  <script src="assets/mme.js?v=23"></script>
  <script src="assets/home.js?v=39"></script>
  <script src="assets/shell.js?v=64"></script>
  <script src="data/stories.js?v=2"></script>
  <script src="data/storyDetail.js?v=2"></script>
  <script>
    // Stories (/stories): a small calendar of the month picks a day or a period. Under it the list has every story that ran in it, the largest first, and beside it a line chart has the first of them,
    // each over the whole window, with the period tinted.
    const { t, fmt, h, load } = App
    const { reset, card, cardHead, TopBar } = Dash
    const list = load('stories', ['dates', 'issues', 'stories'], (b) => b.stories)
    const detail = load('storyDetail', ['dates', 'outlets', 'stories'], (b) => b.stories)
    const view = { from: null, to: null }
    let rank = 0
    let picked = false
    const LINE_STORIES = 8

    Shell.start({
      id: 'stories',
      route: '/stories',
      dash: true,
      title: () => t('nav.media'),
      breadcrumbs: () => [{ label: t('nav.media') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        const title = t('tab.media.stories')
        const problem = Dash.stateContent([list, detail])
        if (problem) { content.replaceChildren(...problem.filter(Boolean), protoNote()); return }

        const ix = Home.index({ stories: list.data, detail: detail.data })
        const dates = list.data.dates
        // The first visit shows the last day of the window, as Αρχική does.
        if (!view.from || !dates.includes(view.from) || !dates.includes(view.to)) { view.from = dates[dates.length - 1]; view.to = view.from }
        const day = (iso) => fmt.date(iso, { day: 'numeric', month: 'short', year: 'numeric' })
        const span = () => ({ i0: dates.indexOf(view.from), i1: dates.indexOf(view.to) })
        const info = () => { const { i0, i1 } = span(); return Home.rangeInfo(ix, i0, i1, rank) }
        const dateText = () => { const { i0, i1 } = span(); return i0 === i1 ? day(dates[i0]) : `${day(dates[i0])} – ${day(dates[i1])}` }

        // Left, a column: the calendar, and under it the list of all the stories of the period, which takes the height that is left and scrolls inside.
        const range = UI.MonthRange({ dates, from: view.from, to: view.to, onChange: (r) => { Object.assign(view, r); rank = 0; picked = false; paint() } })
        const calendar = card('', cardHead(t('stories.cal.title'), range.nav, t('stories.cal.info')), range.body)
        const listCard = () => Home.DayCard(info(), { dateText: false, part: 'list', span: 'home-list', title: t('topics2.stories.title'), hint: t('stories.period.info'), empty: t('stories.period.empty'),
          onStory: (r) => { rank = r; picked = true; paint() } })

        // Right, the first LINE_STORIES stories of the period as lines over the whole window, and the story that is picked in the list if it is further down.
        const lineCard = () => {
          const lead = info()
          const head = cardHead(t('stories.time.title'), h('span', { class: 'home-date' }, dateText()), t('stories.time.info'))
          if (!lead) return card('c-7', head, Dash.emptyText(t('stories.period.empty')))
          const shown = lead.list.slice(0, LINE_STORIES)
          if (lead.rank >= LINE_STORIES) shown.push(lead.list[lead.rank])
          const colors = Dash.SLOTS
          const series = shown.map(({ s, n }, i) => {
            const values = new Array(dates.length).fill(0)
            for (let j = 0; j < s.days.length; j += 2) values[s.days[j]] = s.days[j + 1]
            return { key: s.id, name: s[App.locale] || s.el, color: i < colors.length ? colors[i] : Dash.color('--cat-9'), values, bold: picked && s.id === lead.story.id, note: fmt.int(n) }
          })
          const { i0, i1 } = span()
          return card('c-7', head, Dash.LinesChart({ dates, series, band: { from: i0, to: i1 }, names: 'key', tall: 440, caption: t('stories.time.title'), href: (s) => `story-v2.html?id=${s.key}` }))
        }
        let listNode = listCard()
        let lineNode = lineCard()
        function paint () {
          reset()
          const nextList = listCard(); listNode.replaceWith(nextList); listNode = nextList
          const nextLine = lineCard(); lineNode.replaceWith(nextLine); lineNode = nextLine
        }
        const bar = TopBar({ title: `${t('nav.media')} · ${title}`, tabs, actions: [], quiet: true })
        content.replaceChildren(bar, h('div', { class: 'dash-grid story-split' }, h('div', { class: 'c-5 card-col card-col-fill' }, calendar, listNode), lineNode), protoNote())
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
