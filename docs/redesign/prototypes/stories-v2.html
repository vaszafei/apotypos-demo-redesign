<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=9"></script>
  <script src="assets/messages.js?v=42"></script>
  <script src="assets/messages-v2.js?v=58"></script>
  <script src="assets/messages-spread.js?v=20"></script>
  <script src="assets/messages-mme.js?v=21"></script>
  <script src="assets/messages-home.js?v=23"></script>
  <script src="assets/components.js?v=20"></script>
  <script src="assets/motion.js?v=3"></script>
  <script src="assets/dash.js?v=21"></script>
  <script src="assets/date-range.js?v=2"></script>
  <script src="assets/mme.js?v=23"></script>
  <script src="assets/home.js?v=38"></script>
  <script src="assets/shell.js?v=63"></script>
  <script src="data/stories.js?v=2"></script>
  <script src="data/storyDetail.js?v=2"></script>
  <script src="data/mme.js?v=20"></script>
  <script>
    // Stories, two tabs (#62). Επισκόπηση (/stories) is the card of the stories of Αρχική for a period: the date picker of the top bar sets the period,
    // and the card lists every story that ran in it, the largest first. Ανά μέσο (?tab=outlets, /stories/outlets) has the stories × outlets matrix.
    const { t, fmt, h, load, params } = App
    const tab = params.get('tab') === 'outlets' ? 'outlets' : 'overview'
    const { reset, card, cardHead, fit, niceStep, TopBar } = Dash
    const list = load('stories', ['dates', 'issues', 'stories'], (b) => b.stories)
    const detail = load('storyDetail', ['dates', 'outlets', 'stories'], (b) => b.stories)
    // «Ιστορίες ανά μέσο», the stories × outlets matrix of the live page ΜΜΕ & πρόσωπα (data/mme.js), over its whole window.
    const mme = load('mme', ['sets'], (b) => Object.keys(b.sets))
    const mmeView = { generic: false }
    const view = { from: null, to: null }
    let lastValid = null
    let rank = 0

    // One line: the articles of the story on each day of the period. The axis is linear and starts at 0; the line is a monotone curve and animates on the first view like the lines of Θέματα.
    function StoryLine ({ dates, values, name }) {
      return fit((holder, width) => {
        const height = width < 520 ? 200 : 330
        const pad = { top: 10, right: 16, bottom: 24, left: 44 }
        const n = dates.length
        const plotW = width - pad.left - pad.right
        const plotH = height - pad.top - pad.bottom
        const peak = Math.max(...values, 1)
        const tickStep = niceStep(peak / 4)
        const yMax = Math.ceil(peak / tickStep) * tickStep
        const X = (i) => pad.left + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW)
        const Y = (v) => pad.top + plotH - (v / yMax) * plotH
        const svg = h('svg', { class: 'chart', width, height, viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': `${t('stories.time.title')}: ${name}` })
        for (let v = 0; v <= yMax; v += tickStep) svg.append(h('line', { class: 'grid-line', x1: pad.left, x2: width - pad.right, y1: Y(v), y2: Y(v) }), h('text', { x: pad.left - 6, y: Y(v) + 4, 'text-anchor': 'end' }, fmt.int(v)))
        // A label about every 72 px: every day, or every 2 to 7 days in a short period, a whole number of weeks in a long one.
        const fitDays = Math.max(1, Math.ceil(72 / (plotW / Math.max(n - 1, 1))))
        const every = fitDays > 7 ? Math.ceil(fitDays / 7) * 7 : fitDays
        for (let i = 0; i < n; i += every) svg.append(h('text', { x: X(i), y: height - 6, 'text-anchor': 'middle' }, fmt.date(dates[i], { day: 'numeric', month: 'short' })))
        svg.append(h('path', { class: 'line-series', d: UI.smoothPath(values.map((v, i) => [X(i), Y(v)]), new Set()), stroke: 'var(--accent)', 'stroke-width': 1.5 }))
        const rule = h('line', { class: 'hover-rule', y1: pad.top, y2: pad.top + plotH, stroke: 'var(--rule)', 'stroke-width': 1, visibility: 'hidden' })
        const dot = h('circle', { r: 3.5, fill: 'var(--accent)', stroke: 'var(--surface-page)', 'stroke-width': 1.5, visibility: 'hidden' })
        svg.append(rule, dot)
        const over = h('rect', { x: pad.left, y: pad.top, width: plotW, height: plotH, fill: 'transparent' })
        const read = (e) => {
          const box = svg.getBoundingClientRect()
          const i = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round(((e.clientX - box.left - pad.left) / plotW) * (n - 1))))
          rule.setAttribute('x1', X(i)); rule.setAttribute('x2', X(i)); rule.setAttribute('visibility', 'visible')
          dot.setAttribute('cx', X(i)); dot.setAttribute('cy', Y(values[i])); dot.setAttribute('visibility', 'visible')
          UI.showTooltip({ title: fmt.date(dates[i]), rows: [{ label: name, value: fmt.int(values[i]), color: 'var(--accent)' }] }, e.clientX, e.clientY)
        }
        over.addEventListener('pointermove', read)
        over.addEventListener('pointerenter', read)
        over.addEventListener('pointerleave', () => { UI.hideTooltip(); rule.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden') })
        svg.append(over)
        holder.replaceChildren(svg)
      })
    }

    Shell.start({
      id: 'stories',
      route: tab === 'outlets' ? '/stories/outlets' : '/stories',
      dash: true,
      title: () => t('nav.media'),
      breadcrumbs: () => [{ label: t('nav.media') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        const title = t('tab.media.stories')
        const problem = Dash.stateContent([list, detail])
        if (problem) { content.replaceChildren(...problem.filter(Boolean), protoNote()); return }

        // Ανά μέσο: the matrix. Its toggle draws only this card again.
        if (tab === 'outlets') {
          const grid = h('div', { class: 'dash-grid story-top' })
          const mmeCard = h('div', { class: 'c-12 card-col' })
          if (mme.kind === 'data') {
            const mset = mme.data.sets.gr
            const MS = Mme.summary(mset, 0, mset.dates.length - 1)
            const paintMme = () => mmeCard.replaceChildren(Mme.StoriesCard(MS, { generic: mmeView.generic, onGeneric: (v) => { mmeView.generic = v; paintMme() } }))
            paintMme()
          }
          grid.replaceChildren(mmeCard)
          content.replaceChildren(h('h1', { class: 'visually-hidden' }, title), grid, protoNote())
          return
        }

        const ix = Home.index({ stories: list.data, detail: detail.data })
        const dates = list.data.dates
        const draw = () => {
          reset()
          if (!view.from || !dates.includes(view.from) || !dates.includes(view.to)) { view.from = dates[0]; view.to = dates[dates.length - 1] }
          if (!lastValid || !dates.includes(lastValid.from) || !dates.includes(lastValid.to)) lastValid = { from: view.from, to: view.to }
          const i0 = dates.indexOf(lastValid.from)
          const i1 = dates.indexOf(lastValid.to)
          const select = (r) => { Object.assign(view, r); if (r.from <= r.to) { lastValid = { from: r.from, to: r.to }; rank = 0 } draw() }
          const picker = UI.DateRangePicker({ dates, from: view.from, to: view.to, presets: Mme.presets({ dates }), onChange: select })
          const bar = TopBar({ title: `${t('nav.media')} · ${title}`, tabs, actions: [picker], quiet: true })
          const day = (iso) => fmt.date(iso, { day: 'numeric', month: 'short', year: 'numeric' })
          const dateText = i0 === i1 ? day(dates[i0]) : `${day(dates[i0])} – ${day(dates[i1])}`
          const info = () => Home.rangeInfo(ix, i0, i1, rank)
          const shared = { dateText }
          // One row of two columns: the story and under it the story over time (c-7), and the list of all the stories (c-5), which takes the height of the row.
          const storyCard = (swap) => Home.DayCard(info(), { ...shared, part: 'story', span: '', swap, title: t('hero.kind.story'), hint: t('stories.story.info'), empty: t('stories.period.empty') })
          const listCard = () => Home.DayCard(info(), { dateText: false, part: 'list', span: 'c-5 home-list', title: t('topics2.stories.title'), hint: t('stories.period.info'), empty: t('stories.period.empty'),
            onStory: (r) => { rank = r; paintStory() } })
          const timeCard = () => {
            const lead = info()
            if (!lead) return card('', cardHead(t('stories.time.title'), null, t('stories.time.info')), Dash.emptyText(t('stories.period.empty')))
            const days = dates.slice(i0, i1 + 1)
            const values = new Array(days.length).fill(0)
            for (let j = 0; j < lead.story.days.length; j += 2) { const k = lead.story.days[j] - i0; if (k >= 0 && k < days.length) values[k] = lead.story.days[j + 1] }
            return card('', cardHead(t('stories.time.title'), null, t('stories.time.info')), StoryLine({ dates: days, values, name: lead.story[App.locale] || lead.story.el }))
          }
          let story = storyCard()
          let list = listCard()
          let time = timeCard()
          // A pick in the list draws the story and the line again; the list keeps its place.
          function paintStory () {
            const nextStory = storyCard('story'); story.replaceWith(nextStory); story = nextStory
            const nextList = listCard(); list.replaceWith(nextList); list = nextList
            const nextTime = timeCard(); time.replaceWith(nextTime); time = nextTime
          }
          const left = h('div', { class: 'c-7 card-col' }, story, time)
          content.replaceChildren(bar, h('div', { class: 'dash-grid story-split' }, left, list), protoNote())
        }
        draw()
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
