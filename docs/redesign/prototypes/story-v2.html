<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=10">
  <link rel="stylesheet" href="assets/app.css?v=31">
  <link rel="stylesheet" href="assets/dash.css?v=81">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=4"></script>
  <script src="assets/messages.js?v=30"></script>
  <script src="assets/messages-v2.js?v=46"></script>
  <script src="assets/messages-spread.js?v=16"></script>
  <script src="assets/components.js?v=12"></script>
  <script src="assets/motion.js?v=1"></script>
  <script src="assets/dash.js?v=16"></script>
  <script src="assets/spread.js?v=6"></script>
  <script src="assets/entity-cards.js?v=7"></script>
  <script src="assets/shell.js?v=47"></script>
  <script src="data/stories.js?v=1"></script>
  <script src="data/storyDetail.js?v=1"></script>
  <script src="data/groups.js?v=1"></script>
  <script>
    // News spread, Story page: /story/<id>. One page for each story of the tab Ιστορίες. The page is open at ?id=<story id>.
    // The data has no article titles, so the page shows how the story spread: when, in which outlets and groups, and how it was written.
    const { t, fmt, h, load, params } = App
    const { reset, NO_GROUP, Spark, card, cardHead } = Dash
    const list = load('stories', ['dates', 'issues', 'stories'], (b) => b.stories)
    const detail = load('storyDetail', ['outlets', 'stories', 'base', 'people'], (b) => b.stories)
    const groupsData = load('groups', ['groups'], (b) => b.groups)
    const colorOfGroup = Dash.groupColors(groupsData.data ? groupsData.data.groups : [])
    const id = Number(params.get('id'))
    const MIN_DAYS = 14
    const RELATED = 6

    // A row of the difference view, for UI.BarList. The center line is the share in all articles. The bar goes right (teal) when the story has more, left (orange) when it has less.
    const DiffRow = (r) => Entity.DiffRow({ ...r, tipKey: 'story.how.tip' })

    // Related stories. The topic is too general: the topic "Θάνατος Μαζωνάκη" holds 11 other deaths. A story is related when its title has rare words in common
    // (the stem is the first 6 letters, so the endings of Greek words do not matter) or when it has articles on the same days. Common words have no weight.
    const stem = (w) => w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').slice(0, 6)
    const wordsOf = (name) => [...new Set((name.match(/[\p{L}]{4,}/gu) || []).map((w) => [stem(w), w]).map(([s, w]) => `${s}|${w}`))].map((x) => x.split('|'))
    function relatedStories (stories, target, daysOf) {
      const df = new Map()
      const bag = new Map(stories.map((s) => [s.id, new Map(wordsOf(s.el))]))
      bag.forEach((words) => words.forEach((_, k) => df.set(k, (df.get(k) || 0) + 1)))
      const rare = (k) => df.get(k) <= 12
      const mine = bag.get(target.id)
      const mineRare = [...mine.keys()].filter(rare)
      const idf = (k) => Math.log(stories.length / df.get(k))
      const norm = (v) => Math.sqrt(v.reduce((s, x) => s + x * x, 0)) || 1
      const myDays = daysOf(target)
      const myNorm = norm(myDays)
      const weight = mineRare.reduce((s, k) => s + idf(k), 0) || 1
      return stories.filter((s) => s.id !== target.id).map((s) => {
        const shared = mineRare.filter((k) => bag.get(s.id).has(k))
        const nameScore = shared.reduce((sum, k) => sum + idf(k), 0) / weight
        const other = daysOf(s)
        const cosine = other.reduce((sum, v, i) => sum + v * myDays[i], 0) / (norm(other) * myNorm)
        return { s, shared: shared.map((k) => mine.get(k)), nameScore, cosine, score: 0.65 * nameScore + 0.35 * cosine }
      }).filter((r) => r.nameScore > 0 || r.cosine >= 0.8).sort((a, b) => b.score - a.score).slice(0, RELATED)
    }

    Shell.start({
      id: 'story',
      route: `/story/${id}`,
      dash: true,
      title: () => t('nav.spread'),
      breadcrumbs: () => null,
      render (content) {
        content.classList.add('dash', 'minimal')
        reset()
        const problem = Dash.stateContent([list, detail])
        if (problem) { content.replaceChildren(...problem.filter(Boolean), protoNote()); return }
        const d = list.data
        const dd = detail.data
        const story = d.stories.find((s) => s.id === id)
        const det = dd.stories.find((s) => s.id === id)
        if (!story || !det) { content.replaceChildren(UI.ErrorPage({ status: 404 })); return }

        const name = (x) => x[App.locale] || x.el
        const last = d.dates.length - 1
        const issue = d.issues[story.issue]
        const daily = (s) => { const v = new Array(last + 1).fill(0); for (let i = 0; i < s.days.length; i += 2) v[s.days[i]] = s.days[i + 1]; return v }
        const articlesOf = (s) => s.days.reduce((sum, v, i) => (i % 2 ? sum + v : sum), 0)

        // The rows of the story: for each outlet the articles, the first day and the line of days. For each group the line of days.
        const byOutlet = new Map()
        const byGroup = new Map()
        const perDay = new Array(last + 1).fill(0)
        let start = last
        let end = 0
        for (let i = 0; i < det.t.length; i += 3) {
          const [o, day, n] = [det.t[i], det.t[i + 1], det.t[i + 2]]
          start = Math.min(start, day)
          end = Math.max(end, day)
          perDay[day] += n
          const rec = byOutlet.get(o) || { outlet: o, n: 0, first: day }
          rec.n += n
          byOutlet.set(o, rec)
          const g = dd.outlets[o].group
          const line = byGroup.get(g) || { group: g, n: 0, values: new Array(last + 1).fill(0) }
          line.n += n
          line.values[day] += n
          byGroup.set(g, line)
        }
        const articles = [...byOutlet.values()].reduce((s, r) => s + r.n, 0)
        const outlets = [...byOutlet.values()].sort((a, b) => b.n - a.n)
        const groupName = (g) => g || t('story.nogroup')
        const groupColor = (g) => (g && colorOfGroup.get(g)) || NO_GROUP
        const groups = [...byGroup.values()].sort((a, b) => b.n - a.n)
        const peak = perDay.indexOf(Math.max(...perDay))
        const profile = Spread.profiles(dd).list.find((e) => e.id === id)
        const echo = profile && profile.reach >= Spread.ECHO_MIN ? profile : null

        // The window of the chart is at least 14 days, so a short story does not fill it with wide bars.
        let lo = start
        let hi = end
        while (hi - lo + 1 < MIN_DAYS && (lo > 0 || hi < last)) {
          if (lo > 0) lo--
          if (hi - lo + 1 < MIN_DAYS && hi < last) hi++
        }

        // The title card: the story, its topic and period once, and one line of facts. The daily chart below shows the life of the story.
        const total = (arr) => arr.reduce((a, b) => a + b, 0)
        const span = end - start + 1
        const dayLabel = (i) => fmt.date(d.dates[i], { day: 'numeric', month: 'short' })
        const people = []
        for (let i = 0; i < det.p.length; i += 4) people.push({ person: dd.people[det.p[i]], counts: det.p.slice(i + 1, i + 4) })
        people.sort((a, b) => total(b.counts) - total(a.counts))
        const titleCard = Entity.TitleCard({
          kind: t('hero.kind.story'),
          title: name(story),
          meta: h('span', {}, UI.EntityLink({ type: 'topic', key: String(story.issue), label: name(issue) }),
            ` · ${dayLabel(start)} → ${fmt.date(d.dates[end])} · ${end === start ? t('story.hero.day.one') : t('entity.fact.days', { n: span })}`),
          facts: [
            { label: t('entity.fact.articles'), value: fmt.int(articles), sub: t('entity.fact.peak', { date: dayLabel(peak), n: fmt.int(perDay[peak]) }), spark: Spark(perDay, lo, hi, t('story.daily.title'), { w: 56, hgt: 16 }) },
            { label: t('entity.fact.outlets'), value: fmt.int(byOutlet.size), sub: t('entity.fact.of', { n: dd.outlets.length }) },
            { label: t('entity.fact.groups'), value: fmt.int(groups.filter((g) => g.group).length), sub: echo ? h('a', { class: 'quiet-link', href: Shell.hrefOf('/stories') }, t('entity.fact.echo', { n: echo.reach })) : t('entity.fact.noecho') },
            people.length ? { label: t('entity.fact.people'), value: fmt.int(people.length), sub: people[0].person.name } : null
          ]
        })

        const series = groups.map((g) => ({ name: groupName(g.group), color: groupColor(g.group), values: g.values }))
        const shown = d.dates.slice(lo, hi + 1)
        const dailyCard = card('c-8', cardHead(t('story.daily.title'), null, t('story.daily.info')),
          Entity.DailyChart({ dates: shown, series: series.map((x) => ({ ...x, values: x.values.slice(lo, hi + 1) })) }),
          UI.Legend(series.map((x) => ({ label: x.name, color: x.color }))))

        // The groups and their outlets in one card, as Άρθρα ανά όμιλο of Ιδιοκτησία: the groups with their outlets under each name, and the sunburst.
        const groupRecord = new Map((groupsData.data ? groupsData.data.groups : []).map((g) => [g.name, g]))
        const tree = groups.map((g) => {
          const outs = outlets.filter((r) => dd.outlets[r.outlet].group === g.group)
          const record = groupRecord.get(g.group)
          return {
            key: g.group || null, label: groupName(g.group), color: groupColor(g.group), value: g.n,
            link: record ? UI.EntityLink({ type: 'group', key: record.slug, label: g.group }) : null,
            sub: h('span', {}, outs.map((r, k) => [k ? ' · ' : '', UI.EntityLink({ type: 'outlet', key: dd.outlets[r.outlet].slug, label: dd.outlets[r.outlet].name }), ` ${fmt.int(r.n)}`])),
            outlets: outs.map((r) => ({ name: dd.outlets[r.outlet].name, value: r.n }))
          }
        })
        const groupsCard = Entity.GroupsCard({ title: t('entity.groups.title'), info: t('story.outlets.info'), groups: tree, total: articles })

        // How the story was written: for each measure, how far the story is from all articles. The rows share one scale, so the bars compare.
        const part = (arr, i, sum = total(arr)) => (sum ? arr[i] / sum : 0)
        // A row shows when the story has articles of that kind. The 2 kinds that are common in all articles and missing in the story show too: that is a finding.
        const rowsOf = (key, labelKey, count) => {
          const all = det[key].map((_, i) => ({ label: t(`story.${key === 'f' ? 'frame' : 'section'}.${dd[labelKey][i]}`), value: part(det[key], i), usual: part(dd.base[key], i) }))
          const present = all.filter((r) => r.value > 0).sort((a, b) => b.value - a.value).slice(0, count)
          const missing = all.filter((r) => r.value === 0).sort((a, b) => b.usual - a.usual).slice(0, 2)
          return [...present, ...missing]
        }
        const stanceN = total(det.s.slice(1))
        const stanceRows = ['critical', 'neutral', 'supportive'].map((code, i) => ({ label: t(`stance.${code}`), value: part(det.s.slice(1), i, stanceN), usual: part(dd.base.s.slice(1), i, total(dd.base.s.slice(1))) }))
        const [scored, baited] = det.k
        const clickRows = scored ? [{ label: t('story.how.clickbait'), value: baited / scored, usual: dd.base.k[1] / dd.base.k[0] }] : []
        const panels = [
          { title: t('story.how.frame'), rows: rowsOf('f', 'frames', 8) },
          { title: t('story.how.section'), rows: rowsOf('c', 'sections', 6) },
          { title: t('story.how.stance'), rows: stanceN ? stanceRows : [], note: stanceN ? t('story.how.stance.n', { n: fmt.int(stanceN), total: fmt.int(articles) }) : t('story.how.stance.none') },
          { title: t('story.how.clickbait'), rows: clickRows, note: scored ? t('story.how.clickbait.n', { n: fmt.int(baited), total: fmt.int(scored) }) : t('story.how.clickbait.none') }
        ]
        const scale = Math.max(0.05, ...panels.flatMap((p) => p.rows.map((r) => Math.abs(r.value - r.usual))))
        const column = (items) => h('div', { class: 'how-panel' }, items.map((p) => [
          h('h3', { class: 'rows-caption' }, p.title),
          p.rows.length ? UI.BarList(p.rows.map((r) => DiffRow({ ...r, scale }))) : null,
          p.note ? h('p', { class: 'dcard-sub' }, p.note) : null
        ]))
        const howKey = Entity.diffKey()
        const howCard = card('c-6', cardHead(t('story.how.title'), null, t('story.how.info')),
          h('div', { class: 'how-grid how-grid-2' }, column([panels[0]]), column([panels[1], panels[3]])), howKey)
        const stanceCard = Entity.StanceCard({
          rows: [{ label: t('entity.stance.story'), color: 'var(--series-news)', counts: det.s.slice(1) }, { label: t('entity.stance.all'), color: NO_GROUP, counts: dd.base.s.slice(1) }],
          foot: stanceN ? t('story.how.stance.n', { n: fmt.int(stanceN), total: fmt.int(articles) }) : null
        })

        const SEG = ['var(--emph-less)', 'var(--bar-muted)', 'var(--emph-more)']
        const peopleCard = card('c-8', cardHead(t('story.people.title'), null, t('story.people.info')), UI.DataTable({
          rows: people, rankColumn: true, pageSize: 7, emptyText: t('story.people.empty'),
          columns: [
            { label: t('story.people.col.person'), render: (r) => h('div', {}, h('div', {}, r.person.name), h('span', { class: 'muted-text' }, [r.person.role, r.person.party].filter(Boolean).join(' · '))) },
            { label: t('story.people.col.mentions'), num: true, render: (r) => fmt.int(total(r.counts)) },
            { label: t('story.people.col.portrayal'), phone: false, render: (r) => {
              return UI.StackedBar(r.counts.map((n, i) => ({ label: t(`story.portrayal.${dd.portrayals[i]}`), value: n, color: SEG[i] })), { legend: false })
            } }
          ]
        }))

        const related = relatedStories(d.stories.filter((s) => !s.generic), story, daily).map((r) => ({ ...r, articles: articlesOf(r.s) }))
        const relatedCard = card('c-4', cardHead(t('story.related.title'), null, t('story.related.info')),
          related.length ? h('ul', { class: 'rows-related' }, related.map((r) => h('li', {},
            h('span', { class: 'related-main' }, UI.EntityLink({ type: 'story', key: String(r.s.id), label: name(r.s) }),
              h('span', { class: 'muted-text' }, r.shared.length ? t('story.related.shared', { words: r.shared.slice(0, 2).join(', ') }) : t('story.related.days'))),
            Spark(daily(r.s), 0, last, t('media2.spark.articles'), { w: 84, hgt: 20 }),
            h('span', { class: 'row-value' }, fmt.int(r.articles)))))
            : h('p', { class: 'dcard-empty' }, t('story.related.empty')))

        // The title card is the first card of the main column on the left. The main cards are under it, and the lists are on the right. On a narrow screen the columns join in one.
        // The title card, then the cards in rows of two: the daily columns and the stance, the groups and how it was written, the people and the related stories.
        content.replaceChildren(h('div', { class: 'dash-grid entity-grid entity-rows' },
          titleCard, dailyCard, stanceCard, groupsCard, howCard, peopleCard, relatedCard), protoNote())
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
