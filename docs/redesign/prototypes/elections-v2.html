<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <base href="/">
  <script src="assets/routes.js?v=4"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=37">
  <link rel="stylesheet" href="assets/app.css?v=69">
  <link rel="stylesheet" href="assets/dash.css?v=94">
  <link rel="stylesheet" href="assets/politics.css?v=12">
  <link rel="stylesheet" href="assets/elections.css?v=10">
  <script src="assets/page-move.js?v=4"></script>
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=11"></script>
  <script src="assets/messages.js?v=42"></script>
  <script src="assets/messages-v2.js?v=50"></script>
  <script src="assets/messages-politics.js?v=16"></script>
  <script src="assets/components.js?v=18"></script>
  <script src="assets/motion.js?v=5"></script>
  <script src="assets/dash.js?v=24"></script>
  <script src="assets/politics.js?v=11"></script>
  <script src="assets/shell.js?v=71"></script>
  <script src="data/elections.js?v=4"></script>
  <script>
    // Πολιτική (#19): the live /elections page (Παρατηρητήριο Εκλογών, 1 Aug to 30 Sep 2026), spread over five tabs.
    // Προβολή (/elections), Μέσα (?tab=outlets), Ιδιοκτησία (?tab=owners), Θέματα (?tab=topics) and Επιθέσεις (?tab=bylines).
    const { t, fmt, h, load, params } = App
    const TABS = { reach: '/elections', outlets: '/elections/outlets', owners: '/elections/owners', topics: '/elections/topics', bylines: '/elections/bylines' }
    const tab = TABS[params.get('tab')] ? params.get('tab') : 'reach'
    const { reset, card, cardHead, emptyText, TopBar, Spark } = Dash
    const { LineChart, signed } = Politics
    const result = load('elections', ['outlets', 'parties', 'weeks', 'people'], (b) => b.outlets)
    const PARTY_COLORS = { ΝΔ: 'var(--party-nd)', ΣΥΡΙΖΑ: 'var(--party-syriza)', ΠΑΣΟΚ: 'var(--party-pasok)', ΚΚΕ: 'var(--party-kke)', ΕΛ: 'var(--party-el)', ΠΛΕΥΣΗ: 'var(--party-plefsi)', ΝΕΑΡ: 'var(--party-near)', ΦΛ: 'var(--party-fl)', ΜΕΡΑ25: 'var(--party-mera25)', ΝΙΚΗ: 'var(--party-niki)' }
    const color = (key) => PARTY_COLORS[key] || 'var(--stance-neutral)'
    const STANCE = [['critical', 'var(--stance-critical)'], ['neutral', 'var(--stance-neutral)'], ['supportive', 'var(--stance-supportive)']]
    const MIN_LIFT = 20
    const MIN_WEEK = 15
    const sum = (a) => a.reduce((x, y) => x + y, 0)
    const pct = (v) => fmt.pct(v)
    // Net stance: supportive minus critical, as a share of the articles.
    const net = ([c, n, s]) => { const all = c + n + s; return all ? (s - c) / all : 0 }
    const stanceLegend = () => UI.Legend(STANCE.map(([k, c]) => ({ label: t(`stance.${k}`), color: c })))
    const stanceBar = (gov, label) => { const all = sum(gov) || 1; return UI.DivergingBar({ left: gov[0] / all, middle: gov[1] / all, right: gov[2] / all, scale: 1, label }) }
    const stanceText = (gov) => { const all = sum(gov) || 1; return h('span', {}, h('span', { style: { color: 'var(--stance-critical)' } }, pct(gov[0] / all)), ' · ', h('span', { style: { color: 'var(--stance-supportive)' } }, pct(gov[2] / all))) }
    const selected = new Set()
    let issuePick = 0
    let favorView = 'lift'
    let personPick = 0

    Shell.start({
      id: 'elections',
      route: TABS[tab],
      dash: true,
      title: () => t('nav.politics'),
      breadcrumbs: () => [{ label: t('nav.politics') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        const title = t('nav.politics')
        const problem = Dash.stateContent([result], { title, tabs, quiet: true })
        if (problem) { content.replaceChildren(...problem); return }
        const d = result.data
        const bar = TopBar({ title, tabs, quiet: true })
        const labels = d.weeks.map((w) => fmt.date(w.from, { day: 'numeric', month: 'short' }))
        const tips = d.weeks.map((w) => `${fmt.date(w.from, { day: 'numeric', month: 'short' })} – ${fmt.date(w.to, { day: 'numeric', month: 'short' })}`)
        const parties = d.parties.slice().sort((a, b) => b.mentions - a.mentions)
        const allMentions = sum(parties.map((p) => p.mentions)) || 1
        const share = (p) => p.mentions / allMentions
        const outlets = d.outlets.filter((o) => !o.thin)

        const partyCard = card('c-5', cardHead(t('e3.party.title'), null, t('e3.party.info')),
          UI.BarList(parties.map((p) => ({ label: h('span', { class: 'twin-key', title: p.name }, p.key), value: share(p), text: pct(share(p)), color: color(p.key) })), { max: share(parties[0]), cls: 'bars-thick' }))
        const shownParties = new Set(parties.slice(0, 5).map((p) => p.key))
        const partyLegend = h('ul', { class: 'legend-inline legend-list legend-pick', 'aria-label': t('e3.party.title') })
        const partyHolder = h('div', {})
        const drawParties = () => {
          partyLegend.replaceChildren(...parties.map((p) => h('li', {}, h('button', { type: 'button', 'aria-pressed': String(shownParties.has(p.key)), title: p.name, onClick: () => { shownParties.has(p.key) ? shownParties.delete(p.key) : shownParties.add(p.key); drawParties() } }, h('span', { class: 'swatch', style: { background: color(p.key) } }), p.key))))
          const picked = parties.filter((p) => shownParties.has(p.key))
          partyHolder.replaceChildren(picked.length ? LineChart({ labels, tips, series: picked.map((p) => ({ label: p.key, color: color(p.key), values: p.weeks })), yFormat: (v) => fmt.int(Math.round(v)), zero: true, height: 280, aria: t('e3.time.title') }) : emptyText(t('topics2.empty')))
        }
        drawParties()
        const timeCard = card('c-7', cardHead(t('e3.time.title'), null, t('e3.time.info')), partyHolder, partyLegend)

        // The people: mentions per week and the tone of the articles.
        const peopleCard = card('c-12', cardHead(t('e3.people.title'), null, t('e3.people.info')),
          h('div', { class: 'person-grid' }, d.people.map((p) => h('div', { class: 'group-panel' },
            h('h3', { class: 'group-panel-name person-name' }, p.name),
            h('p', { class: 'group-panel-total' }, h('strong', {}, fmt.int(p.mentions)), ` ${t('e3.people.mentions')}${p.party ? ` · ${p.party}` : ''}`),
            Spark(p.weeks, 0, p.weeks.length - 1, t('e3.people.mentions'), { w: 200, hgt: 44 }),
            UI.StackedBar(STANCE.map(([k, c], i) => ({ label: t(`stance.${k}`), value: p.tone[i], color: c })), { legend: false }),
            h('p', { class: 'group-panel-peak' }, stanceText(p.tone))))), stanceLegend())

        // Μέσα: the stance of each outlet. A click adds the outlet to the chart of the weeks.
        const stanceTimeHolder = h('div', {})
        const outletHolder = h('div', {})
        const drawStance = () => {
          const series = [{ label: t('e3.market'), color: 'var(--strong)', values: d.market_weeks.map(net) },
            ...outlets.filter((o) => selected.has(o.id)).map((o, i) => ({ label: o.name, color: Dash.SLOTS[i % Dash.SLOTS.length], values: o.weeks.map((w) => (sum(w) >= MIN_WEEK ? net(w) : null)) }))]
          stanceTimeHolder.replaceChildren(LineChart({ labels, tips, series, yFormat: (v) => signed(v, 1), min: -1, max: 1, height: 300, aria: t('e3.stance.time') }))
          outletHolder.replaceChildren(UI.BarList(outlets.slice().sort((a, b) => net(a.gov) - net(b.gov)).map((o) => ({
            label: o.name, text: stanceText(o.gov), value: sum(o.gov), pressed: selected.has(o.id),
            onClick: () => { selected.has(o.id) ? selected.delete(o.id) : selected.add(o.id); drawStance() },
            bar: stanceBar(o.gov, `${o.name}: ${t('stance.critical')} ${pct(o.gov[0] / (sum(o.gov) || 1))}, ${t('stance.supportive')} ${pct(o.gov[2] / (sum(o.gov) || 1))}, n = ${fmt.int(sum(o.gov))}`)
          }))))
        }
        drawStance()
        const outletCard = card('c-6', cardHead(t('e3.outlet.title'), null, t('e3.outlet.info')), stanceLegend(), h('div', { class: 'scroll-card', tabindex: 0 }, outletHolder))
        const stanceTimeCard = card('c-6', cardHead(t('e3.stance.time'), null, t('e3.stance.time.info', { min: fmt.int(MIN_WEEK) })), stanceTimeHolder)

        // Party × outlet: against the market, or the raw share. 1,0× is the market, so color shows only the difference.
        const shareIn = (o, key) => (o.parties[key] || 0) / (sum(Object.values(o.parties)) || 1)
        const liftClass = (v) => (v >= 1.5 ? 'lift-u2' : v >= 1.2 ? 'lift-u1' : v < 0.67 ? 'lift-d2' : v < 0.83 ? 'lift-d1' : '')
        const tableOf = (cell, sub) => h('div', { class: 'table-wrap' }, h('table', { class: 'party-table party-table-compact' }, h('caption', { class: 'visually-hidden' }, t('elec.favor.title')),
          h('thead', {}, h('tr', {}, h('th', { scope: 'col' }, t('e3.col.outlet')), parties.map((p) => h('th', { scope: 'col', style: `--party:${color(p.key)}`, title: p.name }, p.key, sub ? h('span', { class: 'head-sub' }, pct(share(p))) : null)))),
          h('tbody', {}, outlets.slice().sort((a, b) => a.name.localeCompare(b.name)).map((o) => h('tr', {}, h('th', { scope: 'row' }, h('span', { class: 'row-name' }, o.name)), parties.map((p) => cell(o, p)))))))
        const liftTable = () => tableOf((o, p) => {
          const n = o.parties[p.key] || 0
          const v = shareIn(o, p.key) / share(p)
          const title = t('e3.lift.cell', { outlet: o.name, party: p.name, lift: fmt.dec(v), share: pct(shareIn(o, p.key)), n: fmt.int(n) })
          return n < MIN_LIFT ? h('td', { class: 'cell lift-few', title, 'aria-label': title }, '·') : h('td', { class: `cell ${liftClass(v)}`, title, 'aria-label': title }, `${fmt.dec(v)}×`)
        }, true)
        const shareTable = () => tableOf((o, p) => {
          const v = shareIn(o, p.key)
          return h('td', { class: 'cell', style: `--party:${color(p.key)};--k:${Math.round(Math.min(v / 0.6, 1) * 32)}%`, title: `${o.name} · ${p.name}: ${pct(v)}, ${fmt.int(o.parties[p.key] || 0)}` }, pct(v))
        }, false)
        const liftKey = () => h('ul', { class: 'legend lift-key' }, [['lift-u2', 'elec.lift.u2'], ['lift-u1', 'elec.lift.u1'], ['lift-d1', 'elec.lift.d1'], ['lift-d2', 'elec.lift.d2']].map(([c, k]) => h('li', {}, h('span', { class: `swatch ${c}` }), t(k))))
        const favorHead = h('div', {})
        const favorBody = h('div', {})
        const drawFavor = () => {
          const lift = favorView === 'lift'
          favorHead.replaceChildren(cardHead(t('elec.favor.title'), UI.SegmentedControl({ label: t('elec.favor.view'), value: favorView, options: ['lift', 'share'].map((v) => ({ value: v, label: t(`e3.favor.view.${v}`) })), onChange: (v) => { favorView = v; drawFavor() } }), lift ? t('elec.lift.info', { min: fmt.int(MIN_LIFT) }) : t('e3.favor.info')))
          favorBody.replaceChildren(...(lift ? [liftTable(), liftKey(), h('p', { class: 'dcard-sub' }, t('elec.lift.note', { min: fmt.int(MIN_LIFT) }))] : [shareTable()]))
        }
        drawFavor()
        const favorCard = card('c-12', favorHead, favorBody)

        // Ιδιοκτησία: each outlet is a dot at its net stance, one row for each owner. The same owner does not mean the same line.
        const groupsMap = new Map()
        outlets.forEach((o) => { const key = o.group || ''; groupsMap.set(key, [...(groupsMap.get(key) || []), o]) })
        const groupRows = [...groupsMap.entries()].map(([key, list]) => ({ key, list, owner: key ? (list.find((o) => o.owner) || list[0]).owner || key : t('e3.owner.none'), lean: key ? list[0].lean : null, mean: sum(list.map((o) => net(o.gov))) / list.length }))
          .sort((a, b) => a.mean - b.mean)
        const ownerCard = card('c-12', cardHead(t('e3.owner.title'), null, t('e3.owner.info')),
          h('div', { class: 'strip-axis' }, h('span', {}, t('e3.owner.left')), h('span', {}, '0'), h('span', {}, t('e3.owner.right'))),
          h('ul', { class: 'strip-list' }, groupRows.map((g) => {
            const sorted = g.list.slice().sort((a, b) => net(a.gov) - net(b.gov))
            return h('li', {}, h('span', { class: 'strip-name' }, g.owner, g.lean ? h('small', {}, g.lean) : null),
              h('span', { class: 'strip-track' }, h('i', { class: 'strip-zero' }), g.list.map((o) => h('b', { class: 'strip-dot', style: { left: `${50 + net(o.gov) * 50}%` }, title: `${o.name}: ${signed(net(o.gov), 2)}, n = ${fmt.int(sum(o.gov))}`, 'aria-label': `${o.name}: ${signed(net(o.gov), 2)}` }))),
              h('span', { class: 'strip-ends' }, sorted.length > 1 ? `${sorted[0].name} … ${sorted[sorted.length - 1].name}` : sorted[0].name))
          })))

        // Θέματα: the topics on which the government is judged. A click shows how each outlet covered the topic.
        const issueHolder = h('div', {})
        const issueList = h('div', {})
        const drawIssues = () => {
          const issue = d.issues[issuePick]
          issueList.replaceChildren(UI.BarList(d.issues.map((x, i) => ({
            label: x.label, text: fmt.int(sum(x.gov)), value: sum(x.gov), pressed: i === issuePick, onClick: () => { issuePick = i; drawIssues() },
            bar: UI.StackedBar(STANCE.map(([k, c], j) => ({ label: t(`stance.${k}`), value: x.gov[j], color: c })), { legend: false })
          }))))
          const byOutlet = d.outlets.map((o) => ({ o, gov: issue.by_outlet[o.id] })).filter((r) => r.gov && sum(r.gov) >= 10).sort((a, b) => net(a.gov) - net(b.gov))
          issueHolder.replaceChildren(h('h3', { class: 'rows-caption' }, issue.label),
            h('div', { class: 'scroll-card', tabindex: 0 }, UI.BarList(byOutlet.map((r) => ({ label: r.o.name, text: stanceText(r.gov), value: sum(r.gov), bar: stanceBar(r.gov, `${r.o.name}: n = ${fmt.int(sum(r.gov))}`) })))))
        }
        drawIssues()
        const issueCard = card('c-6', cardHead(t('e3.issue.title'), null, t('e3.issue.info')), stanceLegend(), issueList)
        const issueOutletCard = card('c-6', cardHead(t('e3.issue.outlet'), null, t('e3.issue.outlet.info')), issueHolder)

        // Επιθέσεις: who attacks whom, with the reported words.
        const targets = Object.entries(d.people.reduce((acc, p) => { p.attacks.forEach(([k, n]) => { acc[k] = (acc[k] || 0) + n }); return acc }, {})).sort((a, b) => b[1] - a[1]).slice(0, 9).map(([k]) => k)
        const attackTop = Math.max(...d.people.flatMap((p) => p.attacks.filter(([k]) => targets.includes(k)).map(([, n]) => n)), 1)
        const attackCard = card('c-12', cardHead(t('e3.attack.title'), null, t('e3.attack.info')),
          h('div', { class: 'table-wrap' }, h('table', { class: 'party-table attack-table' }, h('caption', { class: 'visually-hidden' }, t('e3.attack.title')),
            h('thead', {}, h('tr', {}, h('th', { scope: 'col' }, t('e3.attack.who')), targets.map((k) => h('th', { scope: 'col' }, k)))),
            h('tbody', {}, d.people.map((p) => h('tr', {}, h('th', { scope: 'row' }, p.name), targets.map((k) => {
              const n = (p.attacks.find(([x]) => x === k) || [k, 0])[1]
              return h('td', { class: 'cell', style: `--party:var(--stance-critical);--k:${Math.round((n / attackTop) * 60)}%`, title: `${p.name} → ${k}: ${fmt.int(n)}` }, n ? fmt.int(n) : '')
            })))))))
        const quoteHolder = h('div', {})
        const drawQuotes = () => {
          const p = d.people[personPick]
          quoteHolder.replaceChildren(h('ul', { class: 'quote-list' }, p.quotes.slice(0, 8).map((q) => h('li', {},
            h('p', { class: 'quote-text' }, q.quote),
            h('p', { class: 'dcard-sub' }, `${q.source} · ${fmt.date(q.date, { day: 'numeric', month: 'short' })}${q.target ? ` · → ${q.target}` : ''} · `, App.safeUrl(q.url) ? h('a', { class: 'quiet-link', href: App.safeUrl(q.url), target: '_blank', rel: 'noopener' }, q.title) : q.title)))))
        }
        drawQuotes()
        const quoteCard = card('c-12', cardHead(t('e3.quotes.title'), Dash.select(t('e3.quotes.pick'), personPick, d.people.map((p, i) => ({ value: i, label: p.name })), (v) => { personPick = Number(v); drawQuotes() }), t('e3.quotes.info')), quoteHolder)

        const cards = { reach: [partyCard, timeCard, peopleCard], outlets: [outletCard, stanceTimeCard, favorCard], owners: [ownerCard], topics: [issueCard, issueOutletCard], bylines: [attackCard, quoteCard] }[tab]
        const gov = d.totals.gov
        content.replaceChildren(bar, h('div', { class: 'dash-grid' }, ...cards),
          h('p', { class: 'proto-note' }, t('e3.method', { from: fmt.date(d.window.from), to: fmt.date(d.window.to), articles: fmt.int(d.totals.articles), analysed: fmt.int(d.totals.analysed), outlets: fmt.int(d.totals.outlets), model: d.model, gov: fmt.int(sum(gov)) })))
      }
    })
    reset()
  </script>
</body>
</html>
