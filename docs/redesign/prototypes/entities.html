<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=4">
  <link rel="stylesheet" href="assets/app.css?v=11">
  <link rel="stylesheet" href="assets/entities.css">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=2"></script>
  <script src="assets/messages.js?v=11"></script>
  <script src="assets/messages-entities.js"></script>
  <script src="assets/components.js?v=7"></script>
  <script src="assets/shell.js?v=25"></script>
  <script src="data/media.js"></script>
  <script src="data/groups.js"></script>
  <script src="data/outlet.js"></script>
  <script>
    // Entities (APO-167): the 7 entities of the public pages, with the route, the skeleton of the page, the links and the real names of each one.
    // The rules are in knowledge_base/redesign/entity-contract.md. The fixtures of the other prototypes give the names.
    // A link to a page that is not built opens the 404 page. ?state=empty and ?state=error show the other states.
    const { t, fmt, h, load } = App
    const media = load('media', ['outlets', 'issues', 'stories', 'people'], (b) => b.outlets)
    const groups = load('groups', ['groups'], (b) => b.groups)
    const outlet = load('outlet', ['name', 'slug', 'headlines'], (b) => b.headlines)
    const results = [media, groups, outlet]
    const SHOWN = 12

    // The text of the cards and of the links in is English, like the notes of pages.html.
    const ENTITIES = [
      { id: 'outlet', status: 'partial', key: 'slug, 10 characters', type: 'Detail', out: ['group', 'owner', 'topic', 'article'],
        cards: ['Facts', '3 KPIs (K48, K09, K10)', 'Stance', 'Topics of the outlet', 'Recent headlines', 'Other outlets of the group'],
        linksIn: 'Media table, group page, owner page, fingerprints matrix, story page, topic page' },
      { id: 'group', status: 'ready', key: 'slug', type: 'Detail', out: ['outlet', 'otherOutlet', 'owner', 'topic'],
        cards: ['Facts with the owner and the political lean', '3 KPIs (K50 to K52)', 'Outlets table', 'Topics of the group'],
        linksIn: 'Media table (column Όμιλος), Ownership table and map, outlet page, owner page' },
      { id: 'owner', status: 'none', key: 'slug', type: 'Detail', out: ['outlet', 'otherOutlet', 'group'],
        cards: ['Facts with the groups and the political lean', '3 KPIs (articles, share of all articles, outlets)', 'Table of all the outlets of the owner'],
        linksIn: 'Group page, outlet page' },
      { id: 'topic', status: 'none', key: 'slug', type: 'Detail', out: ['story', 'otherOutlet', 'group'],
        cards: ['Facts', '3 KPIs chosen from K12 to K15', 'The topic over time', 'Outlets and groups that lead it', 'Largest stories'],
        linksIn: 'Topics tables, outlet page, group page, story page, article page' },
      { id: 'story', status: 'none', key: 'id', type: 'Detail', out: ['topic', 'otherOutlet', 'article'],
        cards: ['Facts', '2 KPIs (K18, K19)', 'The story over time', 'The outlet that published first', 'Articles of the story'],
        linksIn: 'Topic page, article page, tables of stories' },
      { id: 'article', status: 'none', key: 'id', type: 'Detail', out: ['outlet', 'group', 'story', 'topic', 'person'],
        cards: ['Header', 'Text', 'Summary', 'Coding', 'Persons and entities', 'Keywords', 'Same story', 'Similar articles', 'Copies'],
        linksIn: 'Outlet page, story page, topic page, search, list of articles' },
      { id: 'person', status: 'none', key: 'slug', type: 'Detail', out: ['otherOutlet', 'article'],
        cards: ['Facts', '2 KPIs (K16, K17)', 'Attention and stance over time', 'Outlets that cover the person most'],
        linksIn: 'Fingerprints matrix and lists, tab of persons in Media, article page' }
    ]

    const DATA_RULES = [
      'A page reads each value from a field with a fixed name.',
      'A field can be empty. The card of that field shows an empty state, and the rest of the page works.',
      'A list has pages. A page never loads all rows of a list.',
      'Two sources of one list use one shape, for example {id, title, outlet, publishedAt, score, method}.'
    ]
    const DAILY_RULES = [
      'Each page states the time of its data.',
      'The current day is not complete. A chart marks it.',
      'A late article changes a number of an earlier day. The page says that a recent number can change.',
      'A day without collection shows as a gap, not as zero.',
      'A story keeps its id when articles join it. When two stories merge, the old id redirects to the new id.',
      'The set of topics can change. The catch-all topic is not ranked as a topic.'
    ]

    // The real names of each entity. The keys of an owner, a topic, a story, a person and an article are row numbers.
    // The text of an owner in the group file can name several people. The page splits it at the comma.
    function names () {
      const m = media.data
      const g = groups.data.groups
      const o = outlet.data
      const name = (x) => x[App.locale] || x.el
      const owners = g.flatMap((x) => String(x.owner || '').split(',').map((s) => s.trim()).filter(Boolean))
      return {
        outlet: m.outlets.map((x) => ({ type: 'outlet', key: x.slug, label: x.name })),
        group: g.map((x) => ({ type: 'group', key: x.slug, label: x.name })),
        owner: owners.map((label, i) => ({ type: 'owner', key: `owner-${i + 1}`, label })),
        topic: m.issues.map((x, i) => ({ type: 'topic', key: `topic-${i + 1}`, label: name(x) })),
        story: m.stories.map((x, i) => ({ type: 'story', key: `story-${i + 1}`, label: name(x) })),
        article: o.headlines.map((x, i) => ({ type: 'article', key: `article-${i + 1}`, label: x.title })),
        person: m.people.map((x, i) => ({ type: 'person', key: `person-${i + 1}`, label: x.name }))
      }
    }

    const wire = () => h('div', { class: 'wire' },
      h('div', { class: 'wire-box wire-wide' }, t('entities.wire.header')),
      h('div', { class: 'wire-box wire-wide' }, t('entities.wire.facts')),
      [1, 2, 3].map(() => h('div', { class: 'wire-box' }, t('entities.wire.kpi'))),
      h('div', { class: 'wire-box wire-wide wire-main' }, t('entities.wire.main')),
      h('div', { class: 'wire-box wire-wide' }, t('entities.wire.related')))

    function entityCard (e, all) {
      const list = all[e.id]
      const outlets = all.outlet
      const example = (k) => (k === 'otherOutlet' ? outlets.find((x) => x.key !== outlet.data.slug) : k === 'outlet' ? outlets.find((x) => x.key === outlet.data.slug) : all[k][0])
      const facts = h('dl', { class: 'fact-list' },
        h('dt', {}, t('entities.fact.route')), h('dd', {}, h('code', {}, UI.ENTITY_ROUTES[e.id])),
        h('dt', {}, t('entities.fact.key')), h('dd', { lang: 'en' }, e.key),
        h('dt', {}, t('entities.fact.count')), h('dd', {}, fmt.int(e.id === 'story' ? 5062 : e.id === 'article' ? 205204 : list.length)),
        h('dt', {}, t('entities.fact.type')), h('dd', {}, t(`type.${e.type}`)))
      return h('section', { class: 'card entity-card', id: `entity-${e.id}`, 'data-entity': e.id },
        h('div', { class: 'entity-head' }, h('h2', { class: 'card-title' }, t(`entity.${e.id}`)), h('span', { class: 'entity-status', 'data-status': e.status }, t(`entities.status.${e.status}`))),
        facts,
        h('h3', { class: 'entity-sub' }, t('entities.data')),
        h('ul', { class: 'entity-links' }, list.slice(0, SHOWN).map((x) => h('li', {}, UI.EntityLink(x)))),
        list.length > SHOWN && h('p', { class: 'card-note' }, t('entities.more', { n: fmt.int(list.length - SHOWN) })),
        h('h3', { class: 'entity-sub' }, t('entities.wire.title')), wire(),
        h('h3', { class: 'entity-sub' }, t('entities.cards')), h('ul', { class: 'entity-cards', lang: 'en' }, e.cards.map((c) => h('li', {}, c))),
        h('h3', { class: 'entity-sub' }, t('entities.out')), h('ul', { class: 'entity-links' }, e.out.map((k) => h('li', {}, UI.EntityLink(example(k))))),
        h('h3', { class: 'entity-sub' }, t('entities.in')), h('p', { class: 'entity-in', lang: 'en' }, e.linksIn))
    }

    const rulesCard = (title, items) => h('section', { class: 'card entity-card' },
      h('h2', { class: 'card-title' }, title), h('ol', { class: 'rules-list', lang: 'en' }, items.map((x) => h('li', {}, x))))

    Shell.start({
      id: 'entities',
      title: () => t('entities.title'),
      breadcrumbs: () => [{ label: t('pages.title'), href: 'pages.html' }, { label: t('entities.title') }],
      render (content) {
        const header = UI.PageHeader({ title: t('entities.title'), hint: t('entities.hint') })
        const failed = results.some((r) => r.kind === 'failed' || r.kind === 'notFound')
        if (failed) { content.replaceChildren(header, UI.ErrorState({ onRetry: () => location.reload() }), protoNote()); return }
        if (results.some((r) => r.kind === 'empty')) { content.replaceChildren(header, UI.EmptyState({ text: t('media.empty') }), protoNote()); return }
        const all = names()
        content.replaceChildren(header,
          h('p', { class: 'card-note' }, t('entities.legend')),
          h('div', { class: 'entity-grid' }, ENTITIES.map((e) => entityCard(e, all))),
          h('div', { class: 'entity-grid' }, rulesCard(t('entities.rules.title'), DATA_RULES), rulesCard(t('entities.daily.title'), DAILY_RULES)),
          h('p', { class: 'proto-note' }, t('entities.keys.note')),
          protoNote())
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
