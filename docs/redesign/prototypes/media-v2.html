<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=15">
  <link rel="stylesheet" href="assets/app.css?v=45">
  <link rel="stylesheet" href="assets/dash.css?v=88">
  <link rel="stylesheet" href="assets/mme.css?v=36">
  <link rel="stylesheet" href="assets/date-range.css?v=8">
  <script src="assets/page-move.js?v=1"></script>
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=9"></script>
  <script src="assets/messages.js?v=39"></script>
  <script src="assets/messages-v2.js?v=48"></script>
  <script src="assets/messages-spread.js?v=17"></script>
  <script src="assets/messages-mme.js?v=21"></script>
  <script src="assets/components.js?v=17"></script>
  <script src="assets/motion.js?v=3"></script>
  <script src="assets/dash.js?v=21"></script>
  <script src="assets/date-range.js?v=2"></script>
  <script src="assets/mme.js?v=23"></script>
  <script src="assets/shell.js?v=59"></script>
  <script src="data/mme.js?v=20"></script>
  <script src="data/groups.js?v=2"></script>
  <script src="data/originality.js?v=1"></script>
  <script>
    // Μέσα › Επισκόπηση and Μέσα › Πώς γράφουν: the dashboard of APO-161 with everything of the live page ΜΜΕ & πρόσωπα (apotypos.org/media).
    // The data is the one of the live page (data/mme.js, scripts/make-mme.py): 29 Greek outlets and 10 Israeli outlets, summed for the period.
    // The top bar has the tabs, the set of outlets and the period. Each card holds one measure and one picture of it.
    const { t, fmt, h, load, params } = App
    const { fit, reset, pct0, NO_GROUP, Spark, card, cardHead, emptyText, Stat, TopBar } = Dash
    const result = load('mme', ['sets'], (b) => Object.keys(b.sets))
    const groupsData = load('groups', ['groups'], (b) => b.groups)
    // The share of articles with no byline comes from the API in its own period (Sep 2025 – Jan 2026), for 5 outlets.
    const bylines = load('originality', ['window', 'outlets'], (b) => b.outlets)
    const groupList = groupsData.kind === 'failed' ? [] : (groupsData.data.groups || [])
    const slugOfGroup = new Map(groupList.map((g) => [g.name, g.slug]))
    const colorOfGroup = Dash.groupColors(groupList)

    // Two tabs (#62): Επισκόπηση (/media) and Πώς γράφουν (?tab=writing, /media/writing). Both have the set of outlets and the period.
    const tab = params.get('tab') === 'writing' ? 'writing' : 'overview'
    // ?ds=il opens the Israeli set, as on the live page.
    const view = { set: params.get('ds') === 'il' ? 'il' : 'gr', from: null, to: null }
    let lastValid = null
    let draw = () => {}
    // The set of outlets (Ελλάδα, Ισραήλ): a button like the one of the period picker, with a menu in the look of its popover.
    const setMenu = (() => {
      const text = h('span', { class: 'dr-text' })
      const button = h('button', { type: 'button', class: 'dr-trigger', 'aria-haspopup': 'true', 'aria-expanded': 'false' },
        h('span', { class: 'visually-hidden' }, `${t('mme.set')}: `), text, App.Icon('chevron-down', 'icon icon-sm dr-chev'))
      const list = h('ul', { class: 'set-pop', hidden: true })
      const root = h('div', { class: 'set-select' }, button, list)
      const close = () => { list.hidden = true; button.setAttribute('aria-expanded', 'false') }
      const paint = () => {
        text.textContent = t(`mme.set.${view.set}`)
        list.replaceChildren(...['gr', 'il'].map((k) => h('li', {}, h('button', { type: 'button', class: 'dr-preset', 'aria-pressed': String(view.set === k),
          onClick: () => { close(); button.focus(); if (view.set === k) return; view.set = k; view.from = null; lastValid = null; draw() } }, t(`mme.set.${k}`)))))
      }
      button.addEventListener('click', () => {
        if (!list.hidden) { close(); return }
        paint()
        list.hidden = false
        button.setAttribute('aria-expanded', 'true')
        list.querySelector('[aria-pressed="true"]')?.focus()
      })
      root.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !list.hidden) { e.stopPropagation(); close(); button.focus() } })
      document.addEventListener('pointerdown', (e) => { if (!root.contains(e.target)) close() })
      paint()
      return { root, paint }
    })()
    // The drop-down list joins the global search in the top bar of the shell, on its right.
    function placeSetSelect () {
      if (Shell.headerV2) return
      const search = document.querySelector('.header-bar .global-search')
      if (!search || search.parentElement.classList.contains('header-tools')) return
      // The search comes first and the list of countries is on its right.
      const tools = h('div', { class: 'header-tools' })
      search.replaceWith(tools)
      tools.append(search, setMenu.root)
    }

    const sumRange = (arr, i0, i1, pick = (x) => x) => { let s = 0; for (let i = i0; i <= i1; i++) s += pick(arr[i]); return s }

    // Stacked columns, one for each day: news and not news. A drag selects a period.
    function VolumeChart ({ dates, news, other, i0, i1, onSelect, height = 170 }) {
      return UI.BarChart({
        dates, height, label: t('media2.chart.title'), onSelect,
        series: [{ name: t('media2.chart.news'), color: 'var(--series-news)', values: news }, { name: t('media2.chart.other'), color: 'var(--series-other)', values: other }],
        muted: (i) => i < i0 || i > i1,
        tooltipOf: (i) => t('media2.chart.day', { date: fmt.date(dates[i]), n: fmt.int(news[i] + other[i]), news: fmt.int(news[i]) })
      })
    }

    // Scatter: news share on x, clickbait share on y, the size of a dot is the number of articles, the color is the group.
    function Scatter ({ points, avgX, avgY }) {
      return fit((holder, width) => {
        const height = Math.max(240, Math.min(300, Math.round(width * 0.42)))
        const pad = { top: 12, right: 14, bottom: 40, left: 44 }
        const plotW = width - pad.left - pad.right
        const plotH = height - pad.top - pad.bottom
        const xs = points.map((p) => p.x)
        const x0 = Math.max(0, Math.floor((Math.min(...xs) - 0.03) * 20) / 20)
        const x1 = Math.min(1, Math.ceil((Math.max(...xs) + 0.03) * 20) / 20)
        const yMax = Math.ceil((Math.max(...points.map((p) => p.y)) + 0.02) * 20) / 20
        const sx = (v) => pad.left + ((v - x0) / (x1 - x0)) * plotW
        const sy = (v) => pad.top + plotH - (v / yMax) * plotH
        const maxN = Math.max(...points.map((p) => p.n))
        const radius = (n) => 5 + 9 * Math.sqrt(n / maxN)
        const text = (p) => t('media2.scatter.point', { name: p.name, news: fmt.pct(p.x), cb: fmt.pct(p.y), n: fmt.int(p.n) })
        const svg = h('svg', { class: 'chart', width, height, viewBox: `0 0 ${width} ${height}`, 'aria-hidden': 'true' })
        for (let k = 0; k <= 4; k++) {
          const v = (yMax * k) / 4
          svg.append(h('line', { class: 'grid-line', x1: pad.left, x2: width - pad.right, y1: sy(v), y2: sy(v) }), h('text', { x: pad.left - 6, y: sy(v) + 4, 'text-anchor': 'end' }, pct0(v)))
          const xv = x0 + ((x1 - x0) * k) / 4
          svg.append(h('text', { x: sx(xv), y: height - 22, 'text-anchor': 'middle' }, pct0(xv)))
        }
        svg.append(h('text', { class: 'axis-title', x: pad.left + plotW / 2, y: height - 4, 'text-anchor': 'middle' }, `${t('media2.scatter.x')} →  ·  ${t('media2.scatter.y')} ↑`),
          h('line', { class: 'avg-line', x1: sx(avgX), x2: sx(avgX), y1: pad.top, y2: pad.top + plotH }),
          h('line', { class: 'avg-line', x1: pad.left, x2: width - pad.right, y1: sy(avgY), y2: sy(avgY) }))
        points.slice().sort((a, b) => b.n - a.n).forEach((p) => {
          const c = h('circle', { class: 'pt', cx: sx(p.x), cy: sy(p.y), r: radius(p.n), fill: p.color })
          const show = (e) => UI.showTooltip(text(p), e.clientX, e.clientY)
          c.addEventListener('pointerenter', show)
          c.addEventListener('pointermove', show)
          c.addEventListener('pointerleave', () => UI.hideTooltip())
          svg.append(c)
        })
        // Direct labels for the outliers: the highest and the lowest value on each axis, and the 3 largest outlets.
        const bySize = points.slice().sort((a, b) => b.n - a.n).slice(0, 3)
        const outliers = [points.reduce((a, b) => (b.y > a.y ? b : a)), points.reduce((a, b) => (b.y < a.y ? b : a)), points.reduce((a, b) => (b.x > a.x ? b : a)), points.reduce((a, b) => (b.x < a.x ? b : a)), ...bySize]
        // A label that would overlap a label already placed is left out. The tooltip still names the dot.
        const placed = []
        new Set(outliers).forEach((p) => {
          const toLeft = sx(p.x) > width - 120
          const w = p.name.length * 6.5
          const x = sx(p.x) + (toLeft ? -1 : 1) * (radius(p.n) + 4)
          const box = { x0: toLeft ? x - w : x, x1: toLeft ? x : x + w, y: sy(p.y) }
          if (placed.some((b) => Math.abs(b.y - box.y) < 14 && b.x0 < box.x1 && box.x0 < b.x1)) return
          placed.push(box)
          svg.append(h('text', { class: 'pt-label', x, y: box.y + 4, 'text-anchor': toLeft ? 'end' : 'start' }, p.name))
        })
        const table = h('div', { class: 'visually-hidden' }, h('table', {}, h('caption', {}, t('media2.scatter.title')),
          h('tbody', {}, points.map((p) => h('tr', {}, h('th', { scope: 'row' }, p.name), h('td', {}, text(p)))))))
        holder.replaceChildren(svg, table)
      })
    }

    Shell.start({
      id: 'media',
      route: tab === 'writing' ? '/media/writing' : '/media',
      dash: true,
      title: () => t('nav.media'),
      breadcrumbs: () => [{ label: t('nav.media') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal', 'filters-right')
        draw = () => {
          reset()
          if (result.kind === 'failed' || result.kind === 'notFound') {
            content.replaceChildren(TopBar({ title: t('nav.media'), tabs, quiet: true }), UI.ErrorState({ onRetry: () => location.reload() }), protoNote())
            return
          }
          const set = result.data.sets[view.set]
          const dates = set.dates
          if (!view.from || !dates.includes(view.from) || !dates.includes(view.to)) { view.from = dates[0]; view.to = dates[dates.length - 1] }
          if (!lastValid || !dates.includes(lastValid.from) || !dates.includes(lastValid.to)) lastValid = { from: view.from, to: view.to }
          const empty = result.kind === 'empty'
          const i0 = dates.indexOf(lastValid.from)
          const i1 = dates.indexOf(lastValid.to)
          const days = i1 - i0 + 1
          const select = (r) => { Object.assign(view, r); if (r.from <= r.to) lastValid = { from: r.from, to: r.to }; draw() }
          const S = Mme.summary(set, i0, i1)
          const greek = set.country === 'GR'

          // The set of outlets (Ελλάδα, Ισραήλ) is a drop-down list next to the global search. The period is one date picker in the top bar.
          setMenu.paint()
          const picker = UI.DateRangePicker({ dates, from: view.from, to: view.to, presets: Mme.presets(set), onChange: select })
          const setAction = Shell.headerV2 ? setMenu.root : null
          // Header v2: the two controls have their own row under the tabs, on the right (a wrapper is a filter of the tab, not a page action).
          const bar = TopBar({ title: `${t('nav.media')} · ${t(`tab.media.${tab}`)}`, tabs, actions: [setAction ? h('div', { class: 'mme-filters' }, setAction, picker) : picker], quiet: true })

          // Daily totals of all the outlets: the news are the topics with soft: false.
          const news = dates.map((_, d) => S.outlets.reduce((s, o) => s + set.od[o.k][d * 7 + 1], 0))
          const totals = dates.map((_, d) => S.outlets.reduce((s, o) => s + set.od[o.k][d * 7], 0))
          const other = totals.map((v, d) => v - news[d])
          const analysed = S.total
          const newsCount = sumRange(news, i0, i1)
          const storiesPerDay = dates.map(() => 0)
          set.sd.forEach((pairs) => { for (let j = 0; j < pairs.length; j += 2) storiesPerDay[pairs[j]]++ })

          // The 4 small stat cards, two by two at the top of the right column. Each has a number and a small picture of the same measure.
          const groupCount = new Set(S.active.map((o) => o.group).filter(Boolean)).size
          const statOutlets = Stat({
            variant: 'compact', kpi: 'K05', label: t('mme.stat.outlets'), empty: !S.active.length, value: fmt.int(S.active.length),
            sub: greek ? t('mme.stat.outlets.sub', { groups: fmt.int(groupCount) }) : t('mme.stat.outlets.sub.il'),
            viz: UI.HBar(newsCount / (analysed || 1), 1, { label: fmt.pct(newsCount / (analysed || 1)) })
          })
          const hasPrev = days >= 14
          const last7 = sumRange(totals, i1 - 6, i1)
          const prev7 = hasPrev ? sumRange(totals, i1 - 13, i1 - 7) : 0
          const change = hasPrev && prev7 > 0 ? (last7 - prev7) / prev7 : null
          const statArticles = Stat({
            variant: 'compact', kpi: 'K06', label: t('media2.stat.articles'), empty: analysed <= 0, value: fmt.int(analysed),
            delta: change, sub: change !== null ? t('media2.stat.articles.delta') : t('media2.stat.articles.avg', { n: fmt.int(Math.round(analysed / days)) }),
            viz: Spark(totals, i0, i1, t('media2.spark.articles'), { w: 80, hgt: 22 })
          })
          const statStories = Stat({
            variant: 'compact', kpi: 'K07', label: t('media2.stat.stories'), empty: S.storyCount <= 0, value: fmt.int(S.storyCount),
            sub: t('media.k07.hint'), viz: Spark(storiesPerDay, i0, i1, t('media2.spark.stories'), { w: 80, hgt: 22 })
          })
          const quoteTotal = S.personQuotes.reduce((a, b) => a + b, 0)
          const statPeople = Stat({
            variant: 'compact', label: t('mme.stat.people'), empty: !quoteTotal, value: fmt.int(S.personQuotes.filter((n) => n > 0).length),
            sub: t('mme.stat.people.sub', { n: fmt.int(quoteTotal) })
          })

          // The lead chart: articles per day, news and other. A drag selects a period.
          let peakDay = i0
          for (let i = i0; i <= i1; i++) if (totals[i] > totals[peakDay]) peakDay = i
          const volume = card('mme-side',
            cardHead(t('media2.chart.title'), UI.Legend([{ label: t('media2.chart.news'), color: 'var(--series-news)' }, { label: t('media2.chart.other'), color: 'var(--series-other)' }]),
              analysed > 0 ? `${t('media2.chart.peak', { date: fmt.date(dates[peakDay]), n: fmt.int(totals[peakDay]) })} · ${t('media2.chart.hint')}` : null),
            analysed > 0 ? VolumeChart({ dates, news, other, i0, i1, onSelect: select, height: window.matchMedia('(min-width: 1280px)').matches ? 340 : 170 }) : emptyText(t('media2.chart.empty')))

          // The scatter: news share and clickbait share of each outlet.
          const cbOutlets = S.active.filter((o) => o.cbKnown >= 100)
          const points = cbOutlets.map((o) => ({ name: o.name, x: o.news / o.n, y: o.cbYes / o.cbKnown, n: o.n, color: o.group ? colorOfGroup.get(o.group) || NO_GROUP : NO_GROUP }))
          const newsAvg = S.active.reduce((s, o) => s + o.news, 0) / (analysed || 1)
          const cbAvg = cbOutlets.reduce((s, o) => s + o.cbYes, 0) / (cbOutlets.reduce((s, o) => s + o.cbKnown, 0) || 1)
          const scatterCard = card('',
            cardHead(t('media2.scatter.title'), null, t('media2.scatter.sub', { n: fmt.int(points.length), total: fmt.int(S.active.length) })),
            points.length > 1 ? Scatter({ points, avgX: newsAvg, avgY: cbAvg }) : emptyText(t('media2.empty.list')))

          // The share of articles with no byline, for the 5 outlets that the API scores. The card says its own period.
          // The info names the outlet with the most articles with no byline. The tick is the average of the 5 outlets.
          const anon = bylines.kind === 'data' ? bylines.data.outlets.slice().sort((a, b) => b.anonPct - a.anonPct) : []
          const anonAvg = anon.reduce((s, r) => s + r.anonPct, 0) / (anon.length || 1)
          const bylineCard = greek && anon.length ? card('', cardHead(t('originality.anon.title'), null, `${t('originality.anon.finding', { name: anon[0].name, v: fmt.pct(anon[0].anonPct / 100) })}. ${t('originality.anon.info')}`),
            h('p', { class: 'dcard-sub' }, t('originality.meta', { n: bylines.data.outlets.length, from: fmt.date(bylines.data.window[0], { month: 'short', year: 'numeric' }), to: fmt.date(bylines.data.window[1], { month: 'short', year: 'numeric' }) })),
            UI.BarList(anon.map((r) => ({ label: r.name, value: r.anonPct, text: fmt.pct(r.anonPct / 100) })), { max: 100, reference: { value: anonAvg, label: t('originality.anon.avg', { v: fmt.pct(anonAvg / 100) }) } })) : null

          // All the outlets: one row for each, in place of the outlet cards of the live page. The card answers which outlets write the most,
          // and the columns put the group and the articles side by side. The header of the articles sorts.
          const groupCell = (o) => h('p', { class: 'mme-rank-group' }, h('span', { class: o.group ? 'dot' : 'dot dot-none', style: o.group ? `--dot:${colorOfGroup.get(o.group) || NO_GROUP}` : null, 'aria-hidden': 'true' }),
            !o.group ? h('span', {}, t('media.col.group.none')) : slugOfGroup.has(o.group) ? h('a', { href: `group-v2.html?g=${slugOfGroup.get(o.group)}` }, o.group) : o.group)
          const columns = [
            { label: t('media.col.outlet'), render: (o) => h('p', { class: 'mme-rank-name' }, Mme.outletLink(S, o)) },
            greek && { label: t('media.col.group'), phone: false, render: groupCell },
            { label: t('mme.rank.sort.n'), num: true, sortable: true, sortKey: 'n', sortValue: (o) => o.n, render: (o) => fmt.int(o.n) }
          ].filter(Boolean)
          const ranking = card('c-6 mme-rank', cardHead(t('mme.rank.all'), null, `${t('mme.rank.note')}`),
            UI.DataTable({ columns, rows: S.active, rankColumn: true, pageSize: Infinity, sort: { key: 'n', dir: 'desc' }, emptyText: t('media.empty') }))
          ranking.id = 'ranking'
          ranking.setAttribute('aria-live', 'polite')

          // The cards of the live page that the dashboard did not have.
          // The topic chips and «Ένα θέμα, όλα τα μέσα» are on Θέματα › Ένα θέμα. «Οι ιστορίες του διαστήματος» is on Ιστορίες › Ανά μέσο. «Τι ξεχωρίζει» is on Αρχική.
          // «Η ατζέντα κάθε μέσου» is on Θέματα › Ατζέντα μέσων. «Τα πρόσωπα» and «Πώς παρουσιάζει κάθε μέσο τα πρόσωπα» are on Πρόσωπα.
          // Πώς γράφουν: the scatter and the bylines side by side, the stance of all the outlets under them in two columns.
          const gov = Mme.GovCard(S)
          gov.classList.add('c-12')
          scatterCard.classList.add(bylineCard ? 'c-6' : 'c-12')
          bylineCard?.classList.add('c-6')

          const cards = tab === 'writing'
            ? [scatterCard, bylineCard, gov]
            : [ranking, h('div', { class: 'c-6 card-col card-col-fill' }, h('div', { class: 'stats-2x2' }, statOutlets, statArticles, statStories, statPeople), volume)]
          content.replaceChildren(bar, h('div', { class: 'dash-grid' }, ...cards), Mme.MethodNote(S), protoNote())
          // Side by side, the right column is as tall as the table: the chart takes the height that the stat cards leave.
          if (tab !== 'writing' && analysed > 0) {
            requestAnimationFrame(() => requestAnimationFrame(() => {
              if (!window.matchMedia('(min-width: 1280px)').matches || !volume.isConnected) return
              const chartEl = volume.lastElementChild
              const slack = volume.getBoundingClientRect().bottom - parseFloat(getComputedStyle(volume).paddingBottom) - chartEl.getBoundingClientRect().bottom
              if (slack > 4) chartEl.replaceWith(VolumeChart({ dates, news, other, i0, i1, onSelect: select, height: 340 + Math.floor(slack) }))
            }))
          }
        }
        placeSetSelect()
        draw()
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
