  <script>
    // Μέσα › Επισκόπηση and Μέσα › Στάση: the dashboard of APO-161 with everything of the live page ΜΜΕ & πρόσωπα (apotypos.org/media).
    // The data is the one of the live page (data/mme.js, scripts/make-mme.py): 29 Greek outlets and 10 Israeli outlets, summed for the period.
    // The top bar has the tabs, the set of outlets and the period. Each card holds one measure and one picture of it.
    const { t, fmt, h, load, params } = App
    const { fit, reset, pct0, NO_GROUP, card, cardHead, emptyText, TopBar } = Dash
    const result = load('mme', ['sets'], (b) => Object.keys(b.sets))
    const groupsData = load('groups', ['groups'], (b) => b.groups)
    const groupList = groupsData.kind === 'failed' ? [] : (groupsData.data.groups || [])
    const slugOfGroup = new Map(groupList.map((g) => [g.name, g.slug]))
    const colorOfGroup = Dash.groupColors(groupList)

    // Two tabs (#62): Επισκόπηση (/media) and Στάση (?tab=writing, /media/writing). Both have the set of outlets and the period.
    const tab = params.get('tab') === 'writing' ? 'writing' : 'overview'
    const view = { set: 'gr', from: null, to: null }
    let lastValid = null
    let draw = () => {}

    // Stacked columns, one for each day of the chosen period: news and not news. The chart is drawn again for each period, with its own scale. A drag selects a period inside it.
    function VolumeChart ({ dates, news, other, onSelect, height = 170 }) {
      return UI.BarChart({
        dates, height, label: t('media2.chart.title'), onSelect,
        series: [{ name: t('media2.chart.news'), color: 'var(--series-news)', values: news }, { name: t('media2.chart.other'), color: 'var(--series-other)', values: other }],
        tooltipOf: (i) => t('media2.chart.day', { date: fmt.date(dates[i]), n: fmt.int(news[i] + other[i]), news: fmt.int(news[i]) })
      })
    }

    // Πώς γράφουν για την κυβέρνηση: one dot for each outlet. x = critical share, y = supportive share, the rest up to 100% is neutral.
    // The dot is sized by its articles and colored by its group.
    function StanceMap ({ points, avg }) {
      return fit((holder, width) => {
        // On a phone the names of the zones and the notes about the averages inside the plot are left out; the card then has a key of the three zones.
        const narrow = width < 640
        const height = narrow ? 380 : Math.max(420, Math.min(560, Math.round(width * 0.46)))
        const pad = { top: 14, right: narrow ? 14 : 22, bottom: 54, left: narrow ? 56 : 66 }
        const step = narrow ? 0.2 : 0.1
        const plotW = width - pad.left - pad.right
        const plotH = height - pad.top - pad.bottom
        // The axes start and end near the data, so that the dots spread over the whole plot and more of them have room for a name.
        const x0 = Math.max(0, Math.floor((Math.min(...points.map((p) => p.c)) - 0.03) * 10) / 10)
        const xm = Math.min(1, Math.ceil((Math.max(...points.map((p) => p.c)) + 0.03) * 10) / 10)
        const y0 = Math.max(0, Math.floor((Math.min(...points.map((p) => p.s)) - 0.02) * 10) / 10)
        const ym = Math.min(1, Math.ceil((Math.max(...points.map((p) => p.s)) + 0.03) * 10) / 10)
        const sx = (v) => pad.left + ((v - x0) / (xm - x0)) * plotW
        const sy = (v) => pad.top + plotH - ((v - y0) / (ym - y0)) * plotH
        const maxN = Math.max(...points.map((p) => p.n))
        const radius = (p) => 4 + 8 * Math.sqrt(p.n / maxN)
        const text = (p) => t('mme.map.point', { name: p.name, c: fmt.pct(p.c), u: fmt.pct(p.u), s: fmt.pct(p.s), n: fmt.int(p.n) })
        const svg = h('svg', { class: 'chart', width, height, viewBox: `0 0 ${width} ${height}`, 'aria-hidden': 'true' })
        const clipId = `stance-clip-${Math.random().toString(36).slice(2, 8)}`
        svg.append(h('clipPath', { id: clipId }, h('rect', { x: pad.left, y: pad.top, width: plotW, height: plotH })))
        const first = (from) => Math.ceil(from / step - 1e-9) * step
        for (let v = first(y0); v <= ym + 1e-9; v += step) svg.append(h('line', { class: 'grid-line', x1: pad.left, x2: width - pad.right, y1: sy(v), y2: sy(v) }), h('text', { x: pad.left - 8, y: sy(v) + 4, 'text-anchor': 'end' }, pct0(v)))
        for (let v = first(x0); v <= xm + 1e-9; v += step) svg.append(h('text', { x: sx(v), y: pad.top + plotH + 18, 'text-anchor': 'middle' }, pct0(v)))
        svg.append(h('text', { class: 'axis-title', x: pad.left + plotW / 2, y: height - 8, 'text-anchor': 'middle' }, t('mme.map.x')),
          h('text', { class: 'axis-title', transform: `translate(16 ${pad.top + plotH / 2}) rotate(-90)`, 'text-anchor': 'middle' }, t('mme.map.y')))

        // Zones: the share that is the largest. They meet where the three shares are a third each; the diagonals between them are where two shares are equal.
        // A zone is a light tint of its stance color and is named once, in its own corner.
        const g = h('g', { 'clip-path': `url(#${clipId})` })
        const third = 1 / 3
        const poly = (pts) => `M${pts.map(([c, s]) => `${sx(c).toFixed(1)},${sy(s).toFixed(1)}`).join('L')}Z`
        const zone = (pts, color) => g.append(h('path', { d: poly(pts), style: `fill:color-mix(in srgb, ${color} 13%, transparent)` }))
        zone([[third, third], [0.5, 0], [1, 0], [0.5, 0.5]], 'var(--stance-critical)')
        zone([[third, third], [0, 0.5], [0, 1], [0.5, 0.5]], 'var(--stance-supportive)')
        zone([[0, 0], [0.5, 0], [third, third], [0, 0.5]], 'var(--stance-neutral)')
        const line = (c1, s1, c2, s2) => h('line', { class: 'grid-line', style: 'stroke-width:1.5', x1: sx(c1), y1: sy(s1), x2: sx(c2), y2: sy(s2) })
        g.append(line(third, third, 0.5, 0.5), line(third, third, 0.5, 0), line(third, third, 0, 0.5))
        svg.append(g)

        // Each zone is named in its own corner, in plain horizontal text.
        if (!narrow) svg.append(h('text', { class: 'axis-title', style: 'font-weight:600', x: width - pad.right - 8, y: pad.top + plotH - 10, 'text-anchor': 'end' }, t('mme.map.zone.crit')),
          h('text', { class: 'axis-title', style: 'font-weight:600', x: pad.left + 8, y: pad.top + 16 }, t('mme.map.zone.supp')),
          h('text', { class: 'axis-title', style: 'font-weight:600', x: pad.left + 8, y: pad.top + plotH - 10 }, t('mme.map.zone.neutral')))

        // All the articles: the average of the outlets pooled, with its own label.
        svg.append(h('line', { class: 'avg-line', x1: sx(avg.c), x2: sx(avg.c), y1: pad.top, y2: pad.top + plotH }),
          h('line', { class: 'avg-line', x1: pad.left, x2: width - pad.right, y1: sy(avg.s), y2: sy(avg.s) }))
        if (!narrow) svg.append(h('text', { class: 'axis-title', x: sx(avg.c) + 6, y: pad.top + plotH - 10 }, t('mme.gov.avg', { v: pct0(avg.c) })),
          h('text', { class: 'axis-title', x: width - pad.right - 6, y: sy(avg.s) - 6, 'text-anchor': 'end' }, t('mme.map.avg.supp', { v: pct0(avg.s) })))

        const leaders = h('g')
        svg.append(leaders)
        const dots = points.slice().sort((a, b) => b.n - a.n).map((p) => {
          const c = h('circle', { class: 'pt', cx: sx(p.c), cy: sy(p.s), r: radius(p), fill: p.color })
          const show = (e) => { UI.showTooltip(text(p), e.clientX, e.clientY); dots.forEach((d) => { d.c.style.opacity = d.p === p ? '1' : '0.3' }) }
          c.addEventListener('pointerenter', show)
          c.addEventListener('pointermove', show)
          c.addEventListener('pointerleave', () => { UI.hideTooltip(); dots.forEach((d) => { d.c.style.opacity = '' }) })
          svg.append(c)
          return { p, c }
        })

        // A name for every dot, as many as fit: the most crowded dots choose first, each tries 4 distances and 8 directions around its dot
        // and gets a thin leader line when its name is not next to it. The names of the zones and of the averages are obstacles too.
        const boxes = []
        const bottom = pad.top + plotH
        const obstacle = (xa, xb, ya, yb) => boxes.push({ x0: xa, x1: xb, y0: ya, y1: yb })
        if (!narrow) {
          const wide = (key) => t(key).length * 7
          obstacle(width - pad.right - 8 - wide('mme.map.zone.crit'), width - pad.right - 8, bottom - 26, bottom - 4)
          obstacle(pad.left + 8, pad.left + 8 + wide('mme.map.zone.supp'), pad.top + 2, pad.top + 22)
          obstacle(pad.left + 8, pad.left + 8 + wide('mme.map.zone.neutral'), bottom - 26, bottom - 4)
          obstacle(sx(avg.c) + 6, sx(avg.c) + 6 + t('mme.gov.avg', { v: pct0(avg.c) }).length * 6.6, bottom - 24, bottom - 6)
          const sl = t('mme.map.avg.supp', { v: pct0(avg.s) }).length * 6.6
          obstacle(width - pad.right - 6 - sl, width - pad.right - 6, sy(avg.s) - 20, sy(avg.s) - 2)
        }
        const circles = points.map((p) => ({ p, x: sx(p.c), y: sy(p.s), r: radius(p) }))
        const crowd = (o) => circles.filter((q) => q !== o && Math.hypot(q.x - o.x, q.y - o.y) < 46).length
        const hit = (a, b) => a.x0 < b.x1 && b.x0 < a.x1 && a.y0 < b.y1 && b.y0 < a.y1
        const angles = [0, Math.PI, -Math.PI / 6, Math.PI / 6, (-5 * Math.PI) / 6, (5 * Math.PI) / 6, -Math.PI / 2, Math.PI / 2]
        circles.slice().sort((a, b) => crowd(b) - crowd(a) || b.p.n - a.p.n).forEach((o) => {
          const w = o.p.name.length * 6.4 + 2
          for (const d of [4, 14, 28, 44]) {
            for (const th of angles) {
              const cs = Math.cos(th); const sn = Math.sin(th)
              const ax = o.x + cs * (o.r + d); const ay = o.y + sn * (o.r + d)
              const xa = cs > 0.4 ? ax : cs < -0.4 ? ax - w : ax - w / 2
              const ya = Math.abs(sn) < 0.4 ? ay - 7 : sn > 0 ? ay : ay - 14
              const b = { x0: xa, x1: xa + w, y0: ya, y1: ya + 14 }
              if (b.x0 < pad.left || b.x1 > width - pad.right || b.y0 < pad.top || b.y1 > bottom) continue
              if (boxes.some((q) => hit(b, q))) continue
              if (circles.some((q) => b.x0 < q.x + q.r + 1 && q.x - q.r - 1 < b.x1 && b.y0 < q.y + q.r + 1 && q.y - q.r - 1 < b.y1)) continue
              boxes.push(b)
              if (d > 4) {
                const tx = Math.min(Math.max(o.x, b.x0), b.x1); const ty = Math.min(Math.max(o.y, b.y0), b.y1)
                const len = Math.hypot(tx - o.x, ty - o.y) || 1
                leaders.append(h('line', { x1: o.x + ((tx - o.x) / len) * o.r, y1: o.y + ((ty - o.y) / len) * o.r, x2: tx, y2: ty, style: 'stroke:var(--text-secondary);stroke-width:0.75;opacity:0.7' }))
              }
              svg.append(h('text', { class: 'pt-label', x: b.x0, y: b.y0 + 11, 'pointer-events': 'none' }, o.p.name))
              return
            }
          }
        })
        const table = h('div', { class: 'visually-hidden' }, h('table', {}, h('caption', {}, t('mme.gov.title')),
          h('tbody', {}, points.map((p) => h('tr', {}, h('th', { scope: 'row' }, p.name), h('td', {}, text(p)))))))
        holder.replaceChildren(svg, table)
      })
    }


    // The key of the zones, for a phone only: a wide plot names the zones in its corners.
    const ZONES = [['crit', 'var(--stance-critical)'], ['supp', 'var(--stance-supportive)'], ['neutral', 'var(--stance-neutral)']]
    const zoneKey = () => (window.matchMedia('(max-width: 639px)').matches
      ? h('ul', { class: 'legend' }, ZONES.map(([code, color]) => h('li', {}, h('span', { class: 'swatch', style: `background:color-mix(in srgb, ${color} 30%, var(--surface-raised));box-shadow:inset 0 0 0 1px var(--rule)` }), t(`mme.map.zone.${code}`))))
      : null)

    function StanceMapCard (S) {
      const title = S.set.country === 'GR' ? t('mme.gov.title') : t('mme.gov.title.il')
      const all = S.active.filter((o) => o.stance && o.stance[0] + o.stance[1] + o.stance[2] > 0)
      const points = all.filter((o) => o.stance[0] + o.stance[1] + o.stance[2] >= 30).map((o) => {
        const n = o.stance[0] + o.stance[1] + o.stance[2]
        return { name: o.name, c: o.stance[0] / n, u: o.stance[1] / n, s: o.stance[2] / n, n, color: o.group ? colorOfGroup.get(o.group) || NO_GROUP : NO_GROUP }
      })
      const tot = all.reduce((a, o) => a.map((v, j) => v + o.stance[j]), [0, 0, 0])
      const T = tot[0] + tot[1] + tot[2]
      return card('c-12', cardHead(title, null, t('mme.map.info')),
        points.length > 1
          ? [h('p', { class: 'dcard-sub' }, t('mme.map.sub', { n: fmt.int(points.length), total: fmt.int(all.length) })), zoneKey(), StanceMap({ points, avg: { c: tot[0] / T, s: tot[2] / T } })]
          : emptyText(t('media2.empty.list')))
    }

    const tipOn = (el, text) => {
      const show = (e) => UI.showTooltip(text, e.clientX, e.clientY)
      el.addEventListener('pointerenter', show)
      el.addEventListener('pointermove', show)
      el.addEventListener('pointerleave', () => UI.hideTooltip())
      return el
    }

    // Articles per topic of the news in the chosen period: one ring, a slice for each topic, from the top, clockwise, the largest first.
    // The 8 largest topics have a color, the others share the neutral. The list on its left has every topic and scrolls.
    function TopicDonut ({ S }) {
      const rows = S.set.issues.map((x, i) => ({ i, name: x.el, n: S.issueN[i] })).filter((r) => S.hard[r.i] && r.n > 0).sort((a, b) => b.n - a.n)
      const total = rows.reduce((s, r) => s + r.n, 0)
      const slots = Dash.SLOTS
      const colorOf = (k) => (k < 8 ? slots[k] : 'var(--bar-muted)')
      const size = 176
      const c = size / 2
      const [r0, r1] = [57, 87]
      const pad = 0.008
      const arc = (a0, a1) => {
        a0 += pad / 2
        a1 = Math.max(a0 + 0.002, a1 - pad / 2)
        const p = (a, r) => `${(c + r * Math.sin(a)).toFixed(2)} ${(c - r * Math.cos(a)).toFixed(2)}`
        const large = a1 - a0 > Math.PI ? 1 : 0
        return `M${p(a0, r1)}A${r1} ${r1} 0 ${large} 1 ${p(a1, r1)}L${p(a1, r0)}A${r0} ${r0} 0 ${large} 0 ${p(a0, r0)}Z`
      }
      const tip = (r) => t('media2.topic.tip', { topic: r.name, n: fmt.int(r.n), share: fmt.pct(r.n / total) })
      const svg = h('svg', { class: 'chart donut topic-donut', width: size, height: size, viewBox: `0 0 ${size} ${size}`, role: 'img', 'aria-label': t('media2.topics.title') })
      let a = 0
      rows.forEach((r, k) => {
        const span = (r.n / total) * 2 * Math.PI
        svg.append(tipOn(h('path', { class: k < 8 ? 'slice' : 'slice slice-rest', d: arc(a, a + span), fill: colorOf(k) }), tip(r)))
        a += span
      })
      svg.append(h('text', { class: 'donut-num', x: c, y: c + 3, 'text-anchor': 'middle' }, fmt.int(total)),
        h('text', { x: c, y: c + 19, 'text-anchor': 'middle' }, t('media2.topics.center')))
      const list = h('ul', { class: 'rows rows-groups rows-owners mme-topic-list' }, rows.map((r, k) => h('li', { title: tip(r) },
        h('span', { class: 'dot', style: `--dot:${colorOf(k)}`, 'aria-hidden': 'true' }),
        h('span', { class: 'row-name' }, UI.EntityLink({ type: 'topic', key: String(r.i), label: r.name })),
        h('span', { class: 'row-value' }, fmt.pct(r.n / total)))))
      return h('div', { class: 'donut-wrap sun-wrap mme-topic-wrap' }, h('div', { class: 'mme-topic-box' }, list), svg)
    }

    // Squarified layout: items [{ v }] in the rectangle, the largest first, as near to squares as it can. Returns [{ i, x, y, w, h }].
    function squarify (items, x, y, w, h0) {
      const out = []
      const scale = (w * h0) / items.reduce((a, b) => a + b.v, 0)
      let rest = items.slice()
      let X = x
      let Y = y
      let W = w
      let H = h0
      while (rest.length) {
        const side = Math.min(W, H)
        const worst = (r, sum) => Math.max(...r.map((i) => Math.max((side * side * i.v * scale) / (sum * sum), (sum * sum) / (side * side * i.v * scale))))
        let row = []
        let best = Infinity
        for (let k = 1; k <= rest.length; k++) {
          const r = rest.slice(0, k)
          const wv = worst(r, r.reduce((a, b) => a + b.v * scale, 0))
          if (wv > best) break
          best = wv
          row = r
        }
        const sum = row.reduce((a, b) => a + b.v * scale, 0)
        const thick = sum / side
        let pos = 0
        row.forEach((i) => {
          const len = (i.v * scale) / thick
          out.push(W >= H ? { i, x: X, y: Y + pos, w: thick, h: len } : { i, x: X + pos, y: Y, w: len, h: thick })
          pos += len
        })
        if (W >= H) { X += thick; W -= thick } else { Y += thick; H -= thick }
        rest = rest.slice(row.length)
      }
      return out
    }

    // The outlets by group: the groups are on the x axis, each is a block that stands on the axis with its name under it, written across. The outlets are the tiles
    // of the block, in rows and columns, so the area of a tile is the articles of its outlet, and the area of a block is the articles of its group, on one scale.
    // The width of a block follows the root of its articles, with a floor so that its name fits. The height comes from the area. A tile is the link of its outlet
    // and has its name when it is large enough (the tooltip has it in every case). The outlets with no group are a block like the others.
    function GroupTiles ({ S }) {
      const byGroup = new Map()
      S.active.forEach((o) => {
        const key = o.group || null
        if (!byGroup.has(key)) byGroup.set(key, [])
        byGroup.get(key).push(o)
      })
      const rows = [...byGroup].map(([name, outlets]) => ({
        name, outlets: outlets.sort((a, b) => b.n - a.n), n: outlets.reduce((s, o) => s + o.n, 0),
        color: name ? colorOfGroup.get(name) || NO_GROUP : NO_GROUP
      })).sort((a, b) => (a.name === null) - (b.name === null) || b.n - a.n)
      const holder = fit((box, width) => {
        const H = 380
        const gap = 8
        const page = Dash.color('--surface-page')
        // A tile at rest is its color at 80% on the page, and it fills on hover.
        const blend = (a, b, k) => `#${[1, 3, 5].map((i) => Math.round(parseInt(a.slice(i, i + 2), 16) * k + parseInt(b.slice(i, i + 2), 16) * (1 - k)).toString(16).padStart(2, '0')).join('')}`
        const floor = 104
        const usable = width - gap * (rows.length - 1)
        // Widths: the root of the articles, scaled to the width of the chart. A block under the floor gets the floor and the others share the rest.
        const fixed = new Set()
        let w = rows.map((r) => Math.sqrt(r.n))
        for (let pass = 0; pass < rows.length; pass++) {
          const free = rows.map((_, k) => k).filter((k) => !fixed.has(k))
          const rest = usable - fixed.size * floor
          const sum = free.reduce((a, k) => a + Math.sqrt(rows[k].n), 0)
          w = rows.map((r, k) => (fixed.has(k) ? floor : (Math.sqrt(r.n) / sum) * rest))
          const small = free.filter((k) => w[k] < floor)
          if (!small.length) break
          small.forEach((k) => fixed.add(k))
        }
        // One scale for the area: the tallest block is H high.
        const per = Math.max(...rows.map((r, k) => r.n / w[k])) / H
        const boxes = h('div', { class: 'gt-row', style: `height:${H}px` })
        const labels = h('div', { class: 'gt-row gt-labels' })
        rows.forEach((r, k) => {
          const bh = r.n / w[k] / per
          const nameText = r.name || t('media2.groups.none')
          const group = h('div', { class: 'gt-box', style: `width:${w[k]}px;height:${bh}px` })
          squarify(r.outlets.map((o) => ({ o, v: o.n })), 0, 0, w[k], bh).forEach(({ i: { o }, x, y, w: ow, h: oh }, m) => {
            const full = m % 2 ? Dash.tint(r.color, 0.35) : r.color
            const rest = blend(full, page, 0.8)
            const tw = ow - 1
            const th = oh - 1
            const tile = UI.EntityLink({ type: 'outlet', key: o.slug, label: '' })
            tile.classList.add('gt-tile')
            if (tw >= 30 && th >= 14) tile.append(h('span', { class: 'gt-name' }, o.name))
            if (tw >= 58 && th >= 34) tile.append(h('span', { class: 'gt-n' }, fmt.int(o.n)))
            tile.setAttribute('style', `left:${x}px;top:${y}px;width:${Math.max(0, tw)}px;height:${Math.max(0, th)}px;--tile-rest:${rest};--tile-full:${full};--ink-rest:${Dash.textOn(rest)};--ink-full:${Dash.textOn(full)}`)
            group.append(tipOn(tile, t('g2.tree.tip', { outlet: o.name, group: nameText, n: fmt.int(o.n), share: fmt.pct(o.n / S.total) })))
          })
          boxes.append(group)
          const label = r.name && slugOfGroup.has(r.name) ? UI.EntityLink({ type: 'group', key: slugOfGroup.get(r.name), label: r.name }) : nameText
          labels.append(h('div', { class: 'gt-axis', style: `width:${w[k]}px;border-color:${r.color}` }, h('span', { class: 'gt-gname' }, label), h('span', { class: 'gt-gval' }, `${fmt.int(r.n)} · ${fmt.pct(r.n / S.total)}`)))
        })
        box.replaceChildren(boxes, labels)
      })
      return h('div', { class: 'gt-scroll' }, holder)
    }

    Shell.start({
      id: 'media',
      route: tab === 'writing' ? '/media/writing' : '/media',
      dash: true,
      title: () => t('nav.media'),
      breadcrumbs: () => [{ label: t('nav.media') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal', 'filters-right')
        draw = () => {
          reset()
          if (result.kind === 'failed' || result.kind === 'notFound') {
            content.replaceChildren(TopBar({ title: t('nav.media'), tabs, quiet: true }), UI.ErrorState({ onRetry: () => location.reload() }), protoNote())
            return
          }
          const set = result.data.sets[view.set]
          const dates = set.dates
          if (!view.from || !dates.includes(view.from) || !dates.includes(view.to)) { view.from = dates[0]; view.to = dates[dates.length - 1] }
          if (!lastValid || !dates.includes(lastValid.from) || !dates.includes(lastValid.to)) lastValid = { from: view.from, to: view.to }
          const empty = result.kind === 'empty'
          const i0 = dates.indexOf(lastValid.from)
          const i1 = dates.indexOf(lastValid.to)
          const select = (r) => { Object.assign(view, r); if (r.from <= r.to) lastValid = { from: r.from, to: r.to }; draw() }
          const S = Mme.summary(set, i0, i1)

          const picker = UI.DateRangePicker({ dates, from: view.from, to: view.to, presets: Mme.presets(set), onChange: select })
          const bar = TopBar({ title: `${t('nav.media')} · ${t(`tab.media.${tab}`)}`, tabs, actions: [picker], quiet: true })

          // Daily totals of all the outlets: the news are the topics with soft: false.
          const news = dates.map((_, d) => S.outlets.reduce((s, o) => s + set.od[o.k][d * 7 + 1], 0))
          const totals = dates.map((_, d) => S.outlets.reduce((s, o) => s + set.od[o.k][d * 7], 0))
          const other = totals.map((v, d) => v - news[d])
          const analysed = S.total

          // The lead chart: articles per day, news and other. A drag selects a period.
          let peakDay = i0
          for (let i = i0; i <= i1; i++) if (totals[i] > totals[peakDay]) peakDay = i
          const volume = card('c-7',
            cardHead(t('media2.chart.title'), UI.Legend([{ label: t('media2.chart.news'), color: 'var(--series-news)' }, { label: t('media2.chart.other'), color: 'var(--series-other)' }]),
              analysed > 0 ? `${t('media2.chart.peak', { date: fmt.date(dates[peakDay]), n: fmt.int(totals[peakDay]) })} · ${t('media2.chart.hint')}` : null),
            analysed > 0 ? VolumeChart({ dates: dates.slice(i0, i1 + 1), news: news.slice(i0, i1 + 1), other: other.slice(i0, i1 + 1), onSelect: select, height: window.matchMedia('(min-width: 1280px)').matches ? 230 : 170 }) : emptyText(t('media2.chart.empty')))

          // Row 1 on the right: the articles of each topic of the news in the period, one ring with a slice for each topic. The list of the topics scrolls inside the card.
          const topicCard = card('c-5', cardHead(t('media2.topics.title')),
            S.newsN > 0 ? TopicDonut({ S }) : emptyText(t('media2.chart.empty')))

          // Row 2: one bar for each group, cut in its outlets. The outlets with no group are the last bar.
          const groupCard = card('c-12', cardHead(t('media2.bygroup.title')),
            analysed > 0 ? GroupTiles({ S }) : emptyText(t('media2.chart.empty')))

          // The cards of the live page that the dashboard did not have.
          // The topic chips and «Ένα θέμα, όλα τα μέσα» are on Θέματα › Ένα θέμα. «Οι ιστορίες του διαστήματος» is on Ιστορίες › Ανά μέσο. «Τι ξεχωρίζει» is on Αρχική.
          // «Η ατζέντα κάθε μέσου» is on Θέματα › Ατζέντα μέσων. «Τα πρόσωπα» and «Πώς παρουσιάζει κάθε μέσο τα πρόσωπα» are on Πρόσωπα.
          // Στάση: the stance of all the outlets to the government, as one map.
          const gov = StanceMapCard(S)

          const cards = tab === 'writing'
            ? [gov]
            : [volume, topicCard, groupCard]
          content.replaceChildren(bar, h('div', { class: 'dash-grid' }, ...cards), Mme.MethodNote(S), protoNote())
        }
        draw()
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
