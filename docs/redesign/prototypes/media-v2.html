<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=4">
  <link rel="stylesheet" href="assets/app.css?v=12">
  <link rel="stylesheet" href="assets/dash.css?v=54">
  <link rel="stylesheet" href="assets/mme.css?v=4">
  <link rel="stylesheet" href="assets/date-range.css?v=3">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=3"></script>
  <script src="assets/messages.js?v=16"></script>
  <script src="assets/messages-v2.js?v=28"></script>
  <script src="assets/messages-spread.js?v=12"></script>
  <script src="assets/messages-mme.js?v=4"></script>
  <script src="assets/components.js?v=6"></script>
  <script src="assets/dash.js?v=11"></script>
  <script src="assets/date-range.js?v=1"></script>
  <script src="assets/mme.js?v=3"></script>
  <script src="assets/shell.js?v=30"></script>
  <script src="data/mme.js?v=1"></script>
  <script src="data/groups.js?v=2"></script>
  <script src="data/originality.js?v=1"></script>
  <script>
    // Μέσα › Επισκόπηση: the dashboard of APO-161 with everything of the live page ΜΜΕ & πρόσωπα (apotypos.org/media).
    // The data is the one of the live page (data/mme.js, scripts/make-mme.py): 29 Greek outlets and 10 Israeli outlets, summed for the period.
    // The top bar has the tabs, the set of outlets and the period. Each card holds one measure and one picture of it.
    const { t, fmt, h, load, params } = App
    const { fit, reset, niceStep, pct0, NO_GROUP, Spark, Scale, card, cardHead, emptyText, Stat, Meter, TopBar } = Dash
    const result = load('mme', ['sets'], (b) => Object.keys(b.sets))
    const groupsData = load('groups', ['groups'], (b) => b.groups)
    // The share of articles with no byline comes from the API in its own period (Sep 2025 – Jan 2026), for 5 outlets.
    const bylines = load('originality', ['window', 'outlets'], (b) => b.outlets)
    const groupList = groupsData.kind === 'failed' ? [] : (groupsData.data.groups || [])
    const slugOfGroup = new Map(groupList.map((g) => [g.name, g.slug]))
    const colorOfGroup = Dash.groupColors(groupList)

    // ?ds=il opens the Israeli set, as on the live page.
    const view = { set: params.get('ds') === 'il' ? 'il' : 'gr', from: null, to: null, sort: 'n' }
    let lastValid = null
    let draw = () => {}
    const setSelect = h('select', { 'aria-label': t('mme.set'), onChange: (e) => { view.set = e.target.value; view.from = null; lastValid = null; draw() } },
      ['gr', 'il'].map((k) => h('option', { value: k }, t(`mme.set.${k}`))))
    // The drop-down list joins the global search in the top bar of the shell, on its right.
    function placeSetSelect () {
      const search = document.querySelector('.header-bar .global-search')
      if (!search || search.parentElement.classList.contains('header-tools')) return
      // The search comes first and the list of countries is on its right.
      const tools = h('div', { class: 'header-tools' })
      search.replaceWith(tools)
      tools.append(search, h('label', { class: 'set-select' }, h('span', { class: 'visually-hidden' }, t('mme.set')), setSelect))
    }

    const sumRange = (arr, i0, i1, pick = (x) => x) => { let s = 0; for (let i = i0; i <= i1; i++) s += pick(arr[i]); return s }

    // A bar with round top corners. The radius is never more than half of the width or the full height.
    function barPath (x, y, w, hgt, radius) {
      const r = Math.min(radius, w / 2, hgt)
      if (r <= 0) return `M${x} ${y}h${w}v${hgt}h${-w}z`
      return `M${x} ${y + hgt}V${y + r}a${r} ${r} 0 0 1 ${r} ${-r}h${w - 2 * r}a${r} ${r} 0 0 1 ${r} ${r}V${y + hgt}z`
    }

    // Stacked columns, one for each day: news and not news. A drag selects a period. The numbers mark the largest stories.
    function VolumeChart ({ dates, news, other, i0, i1, onSelect }) {
      const totals = news.map((v, i) => v + other[i])
      return fit((holder, width) => {
        const height = 170
        const pad = { top: 8, right: 4, bottom: 24, left: 44 }
        const max = Math.max(...totals, 1)
        const step = niceStep(max / 4)
        const top = Math.ceil(max / step) * step
        const plotW = width - pad.left - pad.right
        const plotH = height - pad.top - pad.bottom
        const bw = plotW / totals.length
        const y = (v) => pad.top + plotH - (v / top) * plotH
        const svg = h('svg', { class: 'chart', width, height, viewBox: `0 0 ${width} ${height}`, 'aria-hidden': 'true' })
        for (let v = 0; v <= top; v += step) {
          svg.append(h('line', { class: 'grid-line', x1: pad.left, x2: width - pad.right, y1: y(v), y2: y(v) }),
            h('text', { x: pad.left - 6, y: y(v) + 4, 'text-anchor': 'end' }, fmt.int(v)))
        }
        const every = Math.max(7, Math.ceil(64 / bw))
        totals.forEach((v, i) => {
          const x = pad.left + i * bw
          const muted = i < i0 || i > i1 ? ' is-muted' : ''
          const hNews = (news[i] / top) * plotH
          const hOther = (other[i] / top) * plotH
          // A bar fills 60% of its slot. The top edge of the stack is round.
          const w = Math.max(1, bw * 0.6)
          const bx = x + (bw - w) / 2
          const hTop = Math.max(0, hOther - 1)
          svg.append(h('path', { class: `bar-news${muted}`, d: barPath(bx, pad.top + plotH - hNews, w, Math.max(0, hNews), hTop > 0 ? 0 : 3) }),
            hTop > 0 && h('path', { class: `bar-other${muted}`, d: barPath(bx, pad.top + plotH - hNews - hOther, w, hTop, 3) }))
          if (i % every === 0) svg.append(h('text', { x: x + bw / 2, y: height - 7, 'text-anchor': 'middle' }, fmt.date(dates[i], { day: 'numeric', month: 'short' })))
        })
        const band = h('rect', { class: 'band', x: 0, y: pad.top, width: 0, height: plotH, hidden: true })
        svg.append(band)
        const indexAt = (e) => Math.min(totals.length - 1, Math.max(0, Math.floor((e.clientX - svg.getBoundingClientRect().left - pad.left) / bw)))
        let anchor = null
        const showBand = (a, b) => { const lo = Math.min(a, b); const hi = Math.max(a, b); band.removeAttribute('hidden'); band.setAttribute('x', pad.left + lo * bw); band.setAttribute('width', (hi - lo + 1) * bw) }
        const overlay = h('rect', { class: 'overlay', x: pad.left, y: pad.top, width: plotW, height: plotH })
        overlay.addEventListener('pointerdown', (e) => { anchor = indexAt(e); overlay.setPointerCapture(e.pointerId) })
        overlay.addEventListener('pointermove', (e) => {
          const i = indexAt(e)
          if (anchor !== null) showBand(anchor, i)
          UI.showTooltip(t('media2.chart.day', { date: fmt.date(dates[i]), n: fmt.int(totals[i]), news: fmt.int(news[i]) }), e.clientX, e.clientY)
        })
        overlay.addEventListener('pointerup', (e) => {
          const i = indexAt(e)
          const a = anchor
          anchor = null
          UI.hideTooltip()
          if (a !== null && a !== i) onSelect({ from: dates[Math.min(a, i)], to: dates[Math.max(a, i)] })
          else band.setAttribute('hidden', '')
        })
        overlay.addEventListener('pointercancel', () => { anchor = null; band.setAttribute('hidden', '') })
        overlay.addEventListener('pointerleave', () => UI.hideTooltip())
        svg.append(overlay)
        // The same values as a table for a screen reader. The period control works with the keyboard.
        const table = h('div', { class: 'visually-hidden' }, h('table', {}, h('caption', {}, t('media2.chart.title')),
          h('tbody', {}, totals.map((v, i) => h('tr', {}, h('th', { scope: 'row' }, fmt.date(dates[i])), h('td', {}, fmt.int(v)))))))
        holder.replaceChildren(svg, table)
      })
    }

    // Scatter: news share on x, clickbait share on y, the size of a dot is the number of articles, the color is the group.
    function Scatter ({ points, avgX, avgY }) {
      return fit((holder, width) => {
        const height = Math.max(240, Math.min(300, Math.round(width * 0.42)))
        const pad = { top: 12, right: 14, bottom: 40, left: 44 }
        const plotW = width - pad.left - pad.right
        const plotH = height - pad.top - pad.bottom
        const xs = points.map((p) => p.x)
        const x0 = Math.max(0, Math.floor((Math.min(...xs) - 0.03) * 20) / 20)
        const x1 = Math.min(1, Math.ceil((Math.max(...xs) + 0.03) * 20) / 20)
        const yMax = Math.ceil((Math.max(...points.map((p) => p.y)) + 0.02) * 20) / 20
        const sx = (v) => pad.left + ((v - x0) / (x1 - x0)) * plotW
        const sy = (v) => pad.top + plotH - (v / yMax) * plotH
        const maxN = Math.max(...points.map((p) => p.n))
        const radius = (n) => 5 + 9 * Math.sqrt(n / maxN)
        const text = (p) => t('media2.scatter.point', { name: p.name, news: fmt.pct(p.x), cb: fmt.pct(p.y), n: fmt.int(p.n) })
        const svg = h('svg', { class: 'chart', width, height, viewBox: `0 0 ${width} ${height}`, 'aria-hidden': 'true' })
        for (let k = 0; k <= 4; k++) {
          const v = (yMax * k) / 4
          svg.append(h('line', { class: 'grid-line', x1: pad.left, x2: width - pad.right, y1: sy(v), y2: sy(v) }), h('text', { x: pad.left - 6, y: sy(v) + 4, 'text-anchor': 'end' }, pct0(v)))
          const xv = x0 + ((x1 - x0) * k) / 4
          svg.append(h('text', { x: sx(xv), y: height - 22, 'text-anchor': 'middle' }, pct0(xv)))
        }
        svg.append(h('text', { class: 'axis-title', x: pad.left + plotW / 2, y: height - 4, 'text-anchor': 'middle' }, `${t('media2.scatter.x')} →  ·  ${t('media2.scatter.y')} ↑`),
          h('line', { class: 'avg-line', x1: sx(avgX), x2: sx(avgX), y1: pad.top, y2: pad.top + plotH }),
          h('line', { class: 'avg-line', x1: pad.left, x2: width - pad.right, y1: sy(avgY), y2: sy(avgY) }))
        points.slice().sort((a, b) => b.n - a.n).forEach((p) => {
          const c = h('circle', { class: 'pt', cx: sx(p.x), cy: sy(p.y), r: radius(p.n), fill: p.color })
          const show = (e) => UI.showTooltip(text(p), e.clientX, e.clientY)
          c.addEventListener('pointerenter', show)
          c.addEventListener('pointermove', show)
          c.addEventListener('pointerleave', () => UI.hideTooltip())
          svg.append(c)
        })
        // Direct labels for the outliers: the highest and the lowest value on each axis, and the 3 largest outlets.
        const bySize = points.slice().sort((a, b) => b.n - a.n).slice(0, 3)
        const outliers = [points.reduce((a, b) => (b.y > a.y ? b : a)), points.reduce((a, b) => (b.y < a.y ? b : a)), points.reduce((a, b) => (b.x > a.x ? b : a)), points.reduce((a, b) => (b.x < a.x ? b : a)), ...bySize]
        // A label that would overlap a label already placed is left out. The tooltip still names the dot.
        const placed = []
        new Set(outliers).forEach((p) => {
          const toLeft = sx(p.x) > width - 120
          const w = p.name.length * 6.5
          const x = sx(p.x) + (toLeft ? -1 : 1) * (radius(p.n) + 4)
          const box = { x0: toLeft ? x - w : x, x1: toLeft ? x : x + w, y: sy(p.y) }
          if (placed.some((b) => Math.abs(b.y - box.y) < 14 && b.x0 < box.x1 && box.x0 < b.x1)) return
          placed.push(box)
          svg.append(h('text', { class: 'pt-label', x, y: box.y + 4, 'text-anchor': toLeft ? 'end' : 'start' }, p.name))
        })
        const table = h('div', { class: 'visually-hidden' }, h('table', {}, h('caption', {}, t('media2.scatter.title')),
          h('tbody', {}, points.map((p) => h('tr', {}, h('th', { scope: 'row' }, p.name), h('td', {}, text(p)))))))
        holder.replaceChildren(svg, table)
      })
    }

    Shell.start({
      id: 'media',
      route: '/media',
      dash: true,
      title: () => t('nav.media'),
      breadcrumbs: () => [{ label: t('nav.media') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        draw = () => {
          reset()
          if (result.kind === 'failed' || result.kind === 'notFound') {
            content.replaceChildren(TopBar({ title: t('nav.media'), tabs, quiet: true }), UI.ErrorState({ onRetry: () => location.reload() }), protoNote())
            return
          }
          const set = result.data.sets[view.set]
          const dates = set.dates
          if (!view.from || !dates.includes(view.from) || !dates.includes(view.to)) { view.from = dates[0]; view.to = dates[dates.length - 1] }
          if (!lastValid || !dates.includes(lastValid.from) || !dates.includes(lastValid.to)) lastValid = { from: view.from, to: view.to }
          const empty = result.kind === 'empty'
          const i0 = dates.indexOf(lastValid.from)
          const i1 = dates.indexOf(lastValid.to)
          const days = i1 - i0 + 1
          const select = (r) => { Object.assign(view, r); if (r.from <= r.to) lastValid = { from: r.from, to: r.to }; draw() }
          const S = Mme.summary(set, i0, i1)
          const greek = set.country === 'GR'

          // The set of outlets (Ελλάδα, Ισραήλ) is a drop-down list next to the global search. The period is one date picker in the top bar.
          setSelect.value = view.set
          const picker = UI.DateRangePicker({ dates, from: view.from, to: view.to, presets: Mme.presets(set), onChange: select })
          const bar = TopBar({ title: `${t('nav.media')} · ${t('tab.media.overview')}`, tabs, actions: [picker], quiet: true })

          // Daily totals of all the outlets: the news are the topics with soft: false.
          const news = dates.map((_, d) => S.outlets.reduce((s, o) => s + set.od[o.k][d * 7 + 1], 0))
          const totals = dates.map((_, d) => S.outlets.reduce((s, o) => s + set.od[o.k][d * 7], 0))
          const other = totals.map((v, d) => v - news[d])
          const analysed = S.total
          const newsCount = sumRange(news, i0, i1)
          const storiesPerDay = dates.map(() => 0)
          set.sd.forEach((pairs) => { for (let j = 0; j < pairs.length; j += 2) storiesPerDay[pairs[j]]++ })

          // Row 1: 4 small stat cards on two lines. Each has a number and a small picture of the same measure.
          const c3 = (el) => { el.classList.replace('c-4', 'c-3'); el.classList.add('mme-kpi'); return el }
          const groupCount = new Set(S.active.map((o) => o.group).filter(Boolean)).size
          const statOutlets = c3(Stat({
            kpi: 'K05', label: t('mme.stat.outlets'), empty: !S.active.length, value: fmt.int(S.active.length),
            sub: greek ? t('mme.stat.outlets.sub', { groups: fmt.int(groupCount) }) : t('mme.stat.outlets.sub.il'),
            viz: Meter(newsCount / (analysed || 1))
          }))
          const hasPrev = days >= 14
          const last7 = sumRange(totals, i1 - 6, i1)
          const prev7 = hasPrev ? sumRange(totals, i1 - 13, i1 - 7) : 0
          const change = hasPrev && prev7 > 0 ? (last7 - prev7) / prev7 : null
          const statArticles = c3(Stat({
            kpi: 'K06', label: t('media2.stat.articles'), empty: analysed <= 0, value: fmt.int(analysed),
            sub: change !== null ? [h('span', { class: 'delta' }, `${change >= 0 ? '▲' : '▼'} ${fmt.signed(change * 100)}%`), ' ', t('media2.stat.articles.delta')] : t('media2.stat.articles.avg', { n: fmt.int(Math.round(analysed / days)) }),
            viz: Spark(totals, i0, i1, t('media2.spark.articles'), { w: 80, hgt: 22 })
          }))
          const statStories = c3(Stat({
            kpi: 'K07', label: t('media2.stat.stories'), empty: S.storyCount <= 0, value: fmt.int(S.storyCount),
            sub: t('media.k07.hint'), viz: Spark(storiesPerDay, i0, i1, t('media2.spark.stories'), { w: 80, hgt: 22 })
          }))
          const quoteTotal = S.personQuotes.reduce((a, b) => a + b, 0)
          const statPeople = c3(Stat({
            label: t('mme.stat.people'), empty: !quoteTotal, value: fmt.int(S.personQuotes.filter((n) => n > 0).length),
            sub: t('mme.stat.people.sub', { n: fmt.int(quoteTotal) })
          }))

          // The lead chart: articles per day, news and other. A drag selects a period.
          let peakDay = i0
          for (let i = i0; i <= i1; i++) if (totals[i] > totals[peakDay]) peakDay = i
          const volume = card('',
            cardHead(t('media2.chart.title'), h('span', { class: 'legend-inline' },
              h('span', {}, h('span', { class: 'swatch', style: { background: 'var(--series-news)' } }), t('media2.chart.news')),
              h('span', {}, h('span', { class: 'swatch', style: { background: 'var(--series-other)' } }), t('media2.chart.other'))),
              analysed > 0 ? `${t('media2.chart.peak', { date: fmt.date(dates[peakDay]), n: fmt.int(totals[peakDay]) })} · ${t('media2.chart.hint')}` : null),
            analysed > 0 ? VolumeChart({ dates, news, other, i0, i1, onSelect: select }) : emptyText(t('media2.chart.empty')))

          // The scatter: news share and clickbait share of each outlet.
          const cbOutlets = S.active.filter((o) => o.cbKnown >= 100)
          const points = cbOutlets.map((o) => ({ name: o.name, x: o.news / o.n, y: o.cbYes / o.cbKnown, n: o.n, color: o.group ? colorOfGroup.get(o.group) || NO_GROUP : NO_GROUP }))
          const newsAvg = S.active.reduce((s, o) => s + o.news, 0) / (analysed || 1)
          const cbAvg = cbOutlets.reduce((s, o) => s + o.cbYes, 0) / (cbOutlets.reduce((s, o) => s + o.cbKnown, 0) || 1)
          const scatterCard = card('',
            cardHead(t('media2.scatter.title'), null, t('media2.scatter.sub', { n: fmt.int(points.length), total: fmt.int(S.active.length) })),
            points.length > 1 ? Scatter({ points, avgX: newsAvg, avgY: cbAvg }) : emptyText(t('media2.empty.list')))

          // The share of articles with no byline, for the 5 outlets that the API scores. The card says its own period.
          const bylineCard = greek && bylines.kind === 'data' ? card('', cardHead(t('originality.anon.title'), null, t('originality.anon.info')),
            h('p', { class: 'dcard-sub' }, t('originality.meta', { n: bylines.data.outlets.length, from: fmt.date(bylines.data.window[0], { month: 'short', year: 'numeric' }), to: fmt.date(bylines.data.window[1], { month: 'short', year: 'numeric' }) })),
            h('ul', { class: 'rows' }, bylines.data.outlets.slice().sort((a, b) => b.anonPct - a.anonPct).map((r) => h('li', {},
              h('span', { class: 'row-name' }, r.name), h('span', { class: 'row-value' }, fmt.pct(r.anonPct / 100)), UI.HBar(r.anonPct, 100))))) : null

          // All the outlets: one tile for each, in place of the outlet cards of the live page. A tile has the articles, the three largest topics, clickbait and stance.
          const cbMax = Math.max(...cbOutlets.map((o) => o.cbYes / o.cbKnown), 0.01)
          const crit = (o) => { const n = o.stance[0] + o.stance[1] + o.stance[2]; return n >= 30 ? o.stance[0] / n : -1 }
          const cb = (o) => (o.cbKnown >= 100 ? o.cbYes / o.cbKnown : -1)
          const SORTS = { n: (a, b) => b.n - a.n, cb: (a, b) => cb(b) - cb(a), crit: (a, b) => crit(b) - crit(a), name: (a, b) => a.name.localeCompare(b.name, App.locale) }
          const rows = S.active.slice().sort(SORTS[view.sort] || SORTS.n)
          const nMax = Math.max(...S.active.map((o) => o.n), 1)
          const tile = (o, i) => {
            const color = o.group ? colorOfGroup.get(o.group) || NO_GROUP : null
            const group = !greek ? null : o.group
              ? h('p', { class: 'mme-tile-group' }, h('span', { class: 'dot', style: `--dot:${color}`, 'aria-hidden': 'true' }),
                slugOfGroup.has(o.group) ? h('a', { href: `group-v2.html?g=${slugOfGroup.get(o.group)}` }, o.group) : o.group)
              : h('p', { class: 'mme-tile-group' }, h('span', { class: 'dot dot-none', 'aria-hidden': 'true' }), t('media.col.group.none'))
            const stanceN = o.stance[0] + o.stance[1] + o.stance[2]
            const top = Mme.topIssues(S, o, 3)
            const topMax = Math.max(...top.map((r) => r.v), 0.01)
            return h('li', { class: 'mme-tile', style: color ? `--gc:${color}` : '' },
              h('div', { class: 'mme-tile-head' },
                h('div', { class: 'mme-tile-id' },
                  h('p', { class: 'mme-tile-name' }, view.sort === 'name' ? null : h('span', { class: 'mme-tile-rank' }, `${i + 1}`), Mme.outletLink(S, o)),
                  group),
                h('p', { class: 'mme-tile-n' }, fmt.int(o.n), h('small', {}, t('mme.tile.articles')))),
              h('div', { class: 'mme-tile-vol', 'aria-hidden': 'true' }, h('span', { style: `width:${(o.n / nMax) * 100}%` })),
              h('ul', { class: 'mme-tile-topics', 'aria-label': t('mme.rank.topics') }, top.map((r) => h('li', {},
                h('span', { class: 'mme-tile-topic' }, r.x[App.locale] || r.x.el),
                h('span', { class: 'mme-tile-bar', 'aria-hidden': 'true' }, h('span', { style: `width:${(r.v / topMax) * 100}%` })),
                h('span', { class: 'mme-tile-pct' }, `${Math.round(r.v * 100)}%`)))),
              h('div', { class: 'mme-tile-metrics' },
                h('div', { class: 'mme-tile-metric' },
                  h('p', { class: 'mme-tile-label' }, t('mme.tile.cb')),
                  o.cbKnown >= 100
                    ? [h('p', { class: 'mme-tile-val' }, fmt.pct(o.cbYes / o.cbKnown)), Scale(o.cbYes / o.cbKnown, 0, cbMax, cbAvg, fmt.pct(o.cbYes / o.cbKnown), fmt.pct(cbAvg))]
                    : h('p', { class: 'mme-tile-none' }, t('group.clickbait.none'))),
                h('div', { class: 'mme-tile-metric' },
                  h('p', { class: 'mme-tile-label' }, t('mme.rank.stance')),
                  stanceN >= 30
                    ? [h('p', { class: 'mme-tile-val' }, t('mme.tile.crit', { p: pct0(o.stance[0] / stanceN) })), Mme.StanceBar(o.stance, o.name)]
                    : h('p', { class: 'mme-tile-none' }, t('stance.few', { n: 30 })))))
          }
          const sorter = UI.SegmentedControl({ label: t('mme.rank.sort'), value: view.sort, options: ['n', 'cb', 'crit', 'name'].map((k) => ({ value: k, label: t(`mme.rank.sort.${k}`) })), onChange: (k) => { view.sort = k; draw() } })
          const ranking = card('c-12 mme-rank', cardHead(t('mme.rank.all'), sorter, `${t('mme.rank.note')} ${t('media2.rank.outlets.note')}`),
            rows.length ? h('ul', { class: 'mme-tiles' }, rows.map(tile)) : emptyText(t('media.empty')))
          ranking.id = 'ranking'
          ranking.setAttribute('aria-live', 'polite')

          // The cards of the live page that the dashboard did not have.
          // The topic chips and «Ένα θέμα, όλα τα μέσα» are on the page Θέματα. «Οι ιστορίες του διαστήματος» is on the page Ιστορίες. «Τι ξεχωρίζει» is on Αρχική.
          // «Η ατζέντα κάθε μέσου» is on Θέματα. «Τα πρόσωπα» and «Πώς παρουσιάζει κάθε μέσο τα πρόσωπα» are on Πρόσωπα.
          const gov = Mme.GovCard(S)

          content.replaceChildren(bar, h('div', { class: 'dash-grid' },
            statOutlets, statArticles, statStories, statPeople,
            ranking, h('div', { class: 'c-6 card-col' }, volume, scatterCard, bylineCard), h('div', { class: 'c-6 card-col' }, gov)), Mme.MethodNote(S), protoNote())
        }
        placeSetSelect()
        draw()
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
