<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=15">
  <link rel="stylesheet" href="assets/app.css?v=47">
  <link rel="stylesheet" href="assets/dash.css?v=88">
  <link rel="stylesheet" href="assets/mme.css?v=36">
  <script src="assets/page-move.js?v=1"></script>
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=9"></script>
  <script src="assets/messages.js?v=39"></script>
  <script src="assets/messages-v2.js?v=48"></script>
  <script src="assets/components.js?v=17"></script>
  <script src="assets/motion.js?v=3"></script>
  <script src="assets/messages-mme.js?v=21"></script>
  <script src="assets/dash.js?v=21"></script>
  <script src="assets/mme.js?v=23"></script>
  <script src="assets/shell.js?v=59"></script>
  <script src="data/fingerprints.js?v=2"></script>
  <script src="data/stanceRatings.js?v=2"></script>
  <script src="data/groups.js?v=2"></script>
  <script src="data/mme.js?v=20"></script>
  <script>
    // Πρόσωπα › Επισκόπηση (formerly Μέσα › Αποτυπώματα): dashboard of APO-161.
    // First «Τα πρόσωπα» and «Πώς παρουσιάζει κάθε μέσο τα πρόσωπα» of the live page ΜΜΕ & πρόσωπα (data/mme.js, the Greek outlets over the whole window), with its own tone and voice control.
    // Πρόσωπα › Έμφαση και στάση (?tab=spread, #62): the 15 persons of the API, the strongest cells in a list and the range chart. The measure control (emphasis or stance) is in the top bar, on the right.
    const { t, fmt, h, load, params } = App
    const tab = params.get('tab') === 'spread' ? 'spread' : 'overview'
    const { fit, reset, NO_GROUP, card, cardHead, emptyText, TopBar } = Dash
    const sources = {
      persons: load('fingerprints', ['entities', 'sources', 'days', 'referenceDate'], (b) => b.sources),
      stance: load('stanceRatings', ['persons', 'days', 'referenceDate', 'minN'], (b) => b.persons)
    }
    const groupsData = load('groups', ['groups'], (b) => b.groups)
    const groupList = groupsData.kind === 'failed' ? [] : (groupsData.data.groups || [])
    const colorOf = Dash.groupColors(groupList)
    const groupOfOutlet = new Map(groupList.flatMap((g) => g.outlets.map((o) => [o.name, g.name])))
    const groupRank = new Map(groupList.map((g, i) => [g.name, i]))
    const state = { mode: 'attention', people: 'tone' }
    const mme = load('mme', ['sets'], (b) => Object.keys(b.sets))
    const mmeSummary = mme.kind === 'data' ? Mme.summary(mme.data.sets.gr, 0, mme.data.sets.gr.dates.length - 1) : null

    // Two palettes. Coverage (more or less attention) uses orange and teal, so it is not read as a party color. Stance uses the critical and supportive colors.
    // The ends and the gray middle are tokens (tokens.css): emphasis less and more, stance critical and supportive, --div-mid.
    const PALETTES = { cover: { low: '--emph-less', high: '--emph-more' }, stance: { low: '--stance-critical', high: '--stance-supportive' } }
    const rgbOf = (name) => { const hex = Dash.color(name); return [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)) }
    const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k))
    const luminance = (rgb) => {
      const [r, g, b] = rgb.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4 })
      return 0.2126 * r + 0.7152 * g + 0.0722 * b
    }
    const contrast = (a, b) => (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05)
    const DARK_TEXT = luminance(rgbOf('--text-on-light'))
    // A stepped scale: 4 steps on each side of a gray middle. A step that falls where neither dark nor white text reaches 4.5 to 1 gets a stronger tone.
    const LIMITS = [0.5, 1, 1.5, 2]
    const STRENGTH = [0, 0.3, 0.5, 0.7, 1]
    const stepOf = (z) => { const level = LIMITS.filter((l) => Math.abs(z) >= l).length; return z < 0 ? -level : level }
    function stepColors (step, palette) {
      let k = STRENGTH[Math.abs(step)]
      for (;;) {
        const rgb = mix(rgbOf('--div-mid'), rgbOf(step < 0 ? PALETTES[palette].low : PALETTES[palette].high), k)
        const l = luminance(rgb)
        const dark = contrast(l, DARK_TEXT)
        const light = contrast(l, 1)
        if (dark >= 4.5 || light >= 4.5 || k >= 1) return { background: `rgb(${rgb.join(',')})`, color: dark >= light ? 'var(--text-on-light)' : 'var(--text-on-dark)' }
        k = Math.min(1, k + 0.02)
      }
    }

    const NET_LABELS = ['≤ −0,5', '−0,4', '−0,25', '−0,1', '0', '+0,1', '+0,25', '+0,4', '≥ +0,5']
    const Z_LABELS = ['≤ −2', '−1,5', '−1', '−0,5', '0', '+0,5', '+1', '+1,5', '≥ +2']
    const zOfNet = (net) => net * 4

    // The short name of a person is the last word. A name that two persons share stays whole.
    const shortNames = (names) => names.map((n) => { const last = n.split(' ').pop(); return names.filter((m) => m.split(' ').pop() === last).length > 1 ? n : last })

    // Each model builder returns { failed }, { empty, line } or a model:
    // { kind, palette, labels, line, period, note, titleKey, rows: [{ name, group, sub, weight }], cols: [{ title, short }], grid: cell | null }.
    // A cell is { z, label, title, own }. The grid has the cells for each row and each column.
    function buildGrid (rows, cols, cell) { return rows.map((_, ri) => cols.map((_, ci) => cell(ri, ci))) }
    function sortRows (model) {
      // A row without any value is a row of dashes. It is not shown, and the note gives the count.
      const emptyRows = model.rows.filter((_, i) => model.grid[i].every((c) => !c)).length
      const order = model.rows.map((_, i) => i).filter((i) => model.grid[i].some(Boolean)).sort((a, b) => {
        const ra = groupRank.has(model.rows[a].group) ? groupRank.get(model.rows[a].group) : 99
        const rb = groupRank.has(model.rows[b].group) ? groupRank.get(model.rows[b].group) : 99
        return ra - rb || (model.rows[b].weight || 0) - (model.rows[a].weight || 0) || model.rows[a].name.localeCompare(model.rows[b].name, 'el')
      })
      return { ...model, rows: order.map((i) => model.rows[i]), grid: order.map((i) => model.grid[i]), note: emptyRows ? `${model.note} ${t('fp.note.noValue', { n: emptyRows })}` : model.note }
    }

    function personsModel () {
      const attention = state.mode === 'attention'
      const r = attention ? sources.persons : sources.stance
      if (r.kind === 'failed' || r.kind === 'notFound') return { failed: true }
      const d = r.data
      // The API gives the 15 persons in another order for stance. The columns keep the order of the attention view.
      const persons = sources.persons.kind === 'failed' ? d.persons.map((p) => p.name) : sources.persons.data.entities
      const period = t('fp.period.days', { days: d.days, date: fmt.date(d.referenceDate) })
      if (r.kind === 'empty') return { empty: true }
      const short = shortNames(persons)
      const cols = persons.map((p, i) => ({ title: p, short: short[i] }))
      let rows
      let grid
      if (attention) {
        rows = d.sources.map((s) => ({ name: s.name, group: groupOfOutlet.get(s.name) || null, sub: groupOfOutlet.get(s.name) || null, weight: s.total || 0 }))
        grid = buildGrid(rows, cols, (ri, ci) => {
          const [z, n] = d.sources[ri].cells[ci]
          return { z, label: fmt.signed(z), n, title: t('fp.cell', { outlet: d.sources[ri].name, person: persons[ci], z: fmt.signed(z), n: fmt.int(n) }) }
        })
      } else {
        const names = [...new Set(d.persons.flatMap((p) => Object.keys(p.outlets)))]
        rows = names.map((name) => ({ name, group: groupOfOutlet.get(name) || null, sub: groupOfOutlet.get(name) || null, weight: 0 }))
        grid = buildGrid(rows, cols, (ri, ci) => {
          const found = d.persons.find((p) => p.name === persons[ci])?.outlets[rows[ri].name]
          if (!found || found[1] < d.minN) return null
          return { z: zOfNet(found[0]), label: fmt.signed(found[0]), n: found[1], title: t('fp.cell.stance', { outlet: rows[ri].name, person: persons[ci], net: fmt.signed(found[0]), n: fmt.int(found[1]) }) }
        })
      }
      return sortRows({ kind: attention ? 'attention' : 'stance', palette: attention ? 'cover' : 'stance', labels: attention ? Z_LABELS : NET_LABELS, period, rows, cols, grid, note: t(attention ? 'fp.note.extended' : 'fp.note.extended.stance') })
    }

    // The strongest cells, as a list with a bar.
    function CellList (m, direction) {
      const cells = m.grid.flatMap((row, ri) => row.map((c, ci) => (c ? { ...c, ri, ci } : null))).filter(Boolean)
      const sorted = cells.sort((a, b) => (direction === 'top' ? b.z - a.z : a.z - b.z)).filter((c) => (direction === 'top' ? c.z > 0 : c.z < 0)).slice(0, 12)
      const max = Math.max(...sorted.map((c) => Math.abs(c.z)), 0.1)
      const color = stepColors(direction === 'top' ? 3 : -3, m.palette).background
      return card('card-side', cardHead(t(`f2.${direction}.${m.kind}`)),
        sorted.length
          ? UI.BarList(sorted.map((c) => ({ label: m.rows[c.ri].name, sub: m.cols[c.ci].title, text: c.label, value: Math.abs(c.z), color, tip: c.title })), { max })
          : emptyText(t('f2.empty')))
    }

    // Range chart: one row for each person. The bar is the middle half of the outlets (the 25th to the 75th percentile), the tick is the median,
    // the thin line is the full range, and the two dots are the outlets with the highest and the lowest value. The row order is the order of the matrix.
    function RangeChart (m) {
      const unit = m.kind === 'stance' ? 0.25 : 1
      const step = m.kind === 'stance' ? 0.25 : 1
      const axisText = (v) => (Math.abs(v) < 1e-9 ? '0' : new Intl.NumberFormat('el-GR', { maximumFractionDigits: 2, signDisplay: 'always' }).format(v).replace('-', '−'))
      const quantile = (sorted, q) => { const pos = (sorted.length - 1) * q; const lo = Math.floor(pos); return sorted[lo] + (sorted[Math.min(lo + 1, sorted.length - 1)] - sorted[lo]) * (pos - lo) }
      const people = m.cols.map((c, ci) => {
        const pts = m.rows.map((r, ri) => ({ r, cell: m.grid[ri][ci] })).filter((p) => p.cell).sort((a, b) => a.cell.z - b.cell.z)
        return { c, pts }
      })
      const all = people.flatMap((p) => p.pts.map((x) => x.cell.z * unit))
      const a = Math.floor(Math.min(...all, 0) / step) * step
      const b = Math.ceil(Math.max(...all, 0) / step) * step
      const rowH = 34
      return fit((holder, width) => {
        const pad = { top: 4, right: 16, bottom: 26, left: 100 }
        const height = pad.top + pad.bottom + rowH * people.length
        const plotW = width - pad.left - pad.right
        const sx = (z) => pad.left + ((z * unit - a) / (b - a)) * plotW
        const svg = h('svg', { class: 'chart', width, height, viewBox: `0 0 ${width} ${height}`, 'aria-hidden': 'true' })
        for (let v = a; v <= b + 1e-9; v += step) {
          svg.append(h('line', { class: Math.abs(v) < 1e-9 ? 'zero-line' : 'grid-line', x1: sx(v / unit), x2: sx(v / unit), y1: pad.top, y2: height - pad.bottom }),
            h('text', { x: sx(v / unit), y: height - 8, 'text-anchor': 'middle' }, axisText(v)))
        }
        const show = (text) => ({ pointerenter: (e) => UI.showTooltip(text, e.clientX, e.clientY), pointermove: (e) => UI.showTooltip(text, e.clientX, e.clientY), pointerleave: () => UI.hideTooltip() })
        const listen = (el, text) => Object.entries(show(text)).forEach(([ev, fn]) => el.addEventListener(ev, fn))
        people.forEach(({ c, pts }, i) => {
          const cy = pad.top + i * rowH + rowH / 2
          svg.append(h('text', { class: 'row-label', x: pad.left - 8, y: cy + 4, 'text-anchor': 'end' }, c.short))
          if (!pts.length) return
          const zs = pts.map((x) => x.cell.z)
          const q1 = quantile(zs, 0.25)
          const q2 = quantile(zs, 0.5)
          const q3 = quantile(zs, 0.75)
          svg.append(h('line', { class: 'range-line', x1: sx(zs[0]), x2: sx(zs[zs.length - 1]), y1: cy, y2: cy }))
          const band = h('rect', { class: 'range-band', x: sx(q1), y: cy - 7, width: Math.max(2, sx(q3) - sx(q1)), height: 14, rx: 4 })
          listen(band, t('f2.strip.band.tip', { person: c.title, from: axisText(q1 * unit), to: axisText(q3 * unit), median: axisText(q2 * unit), n: pts.length }))
          svg.append(band, h('line', { class: 'range-median', x1: sx(q2), x2: sx(q2), y1: cy - 9, y2: cy + 9 }))
          ;[[pts[pts.length - 1], 1], [pts[0], -1]].forEach(([p, dir]) => {
            const x = sx(p.cell.z)
            const dot = h('circle', { class: 'pt', cx: x, cy, r: 5.5, fill: colorOf.get(p.r.group) || NO_GROUP })
            listen(dot, p.cell.title)
            const label = `${p.r.name} ${p.cell.label}`
            const w = label.length * 6.6
            const right = dir > 0 ? x + 6 + w <= width - 4 : x - 6 - w < pad.left
            svg.append(dot, h('text', { class: 'pt-label', x: right ? x + 9 : x - 9, y: cy + 4, 'text-anchor': right ? 'start' : 'end' }, label))
          })
        })
        const table = h('div', { class: 'visually-hidden' }, h('table', {}, h('caption', {}, t('f2.strip.persons')),
          h('tbody', {}, m.grid.flatMap((row) => row.filter(Boolean).map((cell) => h('tr', {}, h('td', {}, cell.title)))))))
        holder.replaceChildren(svg, table)
      })
    }

    Shell.start({
      id: 'fingerprints',
      route: tab === 'spread' ? '/fingerprints/spread' : '/fingerprints',
      dash: true,
      title: () => t('fp.title'),
      breadcrumbs: () => [{ label: t('nav.people') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        const draw = () => {
          reset()
          const focused = [...document.querySelectorAll('.dash-bar .segmented button')].indexOf(document.activeElement)
          const m = personsModel()
          const measure = UI.SegmentedControl({ label: t('fp.mode'), value: state.mode, onChange: (mode) => { state.mode = mode; draw() }, options: ['attention', 'stance'].map((mode) => ({ value: mode, label: t(`fp.mode.${mode}`) })) })
          const bar = TopBar({ title: t('nav.people'), actions: tab === 'spread' ? [measure] : [], tabs, quiet: true })
          if (m.failed || (tab === 'overview' && !mmeSummary)) { content.replaceChildren(bar, UI.ErrorState({ onRetry: () => location.reload() }), protoNote()); return }
          if (m.empty && tab === 'spread') { content.replaceChildren(bar, h('div', { class: 'dash-grid' }, card('c-12', cardHead(t('fp.matrix.title')), UI.EmptyState({ text: t('fp.empty') }))), protoNote()); return }

          // Επισκόπηση: the person cards and the people × outlets of the live page. Έμφαση και στάση: the strongest cells in a narrow column and the range chart.
          const personCards = mmeSummary ? Mme.PersonsCard(mmeSummary) : null
          const people = mmeSummary ? Mme.PeopleCard(mmeSummary, { mode: state.people, onMode: (mode) => { state.people = mode; draw() } }) : null
          if (people) people.append(h('p', { class: 'dcard-sub' }, t('mme.topics.window', { from: fmt.date(mmeSummary.set.dates[0]), to: fmt.date(mmeSummary.set.dates[mmeSummary.set.dates.length - 1]) })))
          if (tab === 'overview') {
            content.replaceChildren(bar, h('div', { class: 'dash-grid fp-people' }, personCards, people), protoNote())
            return
          }
          const strip = card('card-main', cardHead(t('f2.strip.persons'), h('span', { class: 'legend-inline' },
              h('span', {}, h('span', { class: 'swatch swatch-band' }), t('f2.strip.key.band')),
              h('span', {}, h('span', { class: 'swatch swatch-tick' }), t('f2.strip.key.median')),
              h('span', {}, h('span', { class: 'dot', style: '--dot:var(--text-secondary)' }), t('f2.strip.key.extreme'))),
            t('f2.strip.sub')), RangeChart(m))
          strip.append(h('p', { class: 'dcard-sub' }, m.note))

          content.replaceChildren(bar, h('div', { class: 'dash-grid dash-grid-side' }, CellList(m, 'top'), strip), protoNote())
          if (focused >= 0) document.querySelectorAll('.dash-bar .segmented button')[focused]?.focus()
        }
        draw()
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
