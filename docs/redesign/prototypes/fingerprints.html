<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=6">
  <link rel="stylesheet" href="assets/app.css?v=22">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=4"></script>
  <script src="assets/messages.js?v=25"></script>
  <script src="assets/components.js?v=9"></script>
  <script src="assets/motion.js?v=1"></script>
  <script src="assets/shell.js?v=42"></script>
  <script src="data/fingerprints.js"></script>
  <script src="data/peopleMatrix.js"></script>
  <script src="data/stanceRatings.js"></script>
  <script src="data/interests.js"></script>
  <script src="data/groups.js"></script>
  <script>
    // Αποτυπώματα (APO-161): Matrix with 3 views. Each view states its persons, its period and its source in one line.
    // People (static, default) and People, extended (API) have the switch Attention | Stance. Interests (API) shows groups × clubs.
    const { t, fmt, h, load } = App
    const sources = {
      people: load('peopleMatrix', ['persons', 'outlets', 'window'], (b) => b.outlets),
      extended: load('fingerprints', ['entities', 'sources', 'days', 'referenceDate'], (b) => b.sources),
      stance: load('stanceRatings', ['persons', 'days', 'referenceDate', 'minN'], (b) => b.persons),
      interests: load('interests', ['clubs', 'groups', 'days', 'referenceDate'], (b) => b.groups)
    }
    const groupsData = load('groups', ['groups'], (b) => b.groups)
    const groupOfOutlet = new Map(groupsData.kind === 'failed' ? [] : (groupsData.data.groups || []).flatMap((g) => g.outlets.map((o) => [o.name, g.name])))
    const state = { view: 'people', mode: 'attention' }
    // An outlet with few analysed articles gives extreme values (Solomon: 2 articles, x9,2), so the static view hides it.
    const MIN_ROWS = 300

    const LOW = [0xc2, 0x3b, 0x3b]
    const MID = [0xe4, 0xe1, 0xda]
    const HIGH = [0x2a, 0x62, 0xc4]
    const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k))
    const luminance = (rgb) => {
      const [r, g, b] = rgb.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4 })
      return 0.2126 * r + 0.7152 * g + 0.0722 * b
    }
    const contrast = (a, b) => (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05)
    const DARK_TEXT = luminance([0x1f, 0x1f, 0x1f])
    // A stepped scale: 4 steps on each side of a gray middle. A continuous scale has middle tones
    // where neither dark nor white text reaches 4.5 to 1, so a step that falls there gets a stronger tone.
    const LIMITS = [0.5, 1, 1.5, 2]
    const STRENGTH = [0, 0.3, 0.5, 0.7, 1]
    function stepOf (z) {
      const level = LIMITS.filter((l) => Math.abs(z) >= l).length
      return z < 0 ? -level : level
    }
    function stepColors (step) {
      let k = STRENGTH[Math.abs(step)]
      for (;;) {
        const rgb = mix(MID, step < 0 ? LOW : HIGH, k)
        const l = luminance(rgb)
        const dark = contrast(l, DARK_TEXT)
        const light = contrast(l, 1)
        if (dark >= 4.5 || light >= 4.5 || k >= 1) return { background: `rgb(${rgb.join(',')})`, color: dark >= light ? '#1f1f1f' : '#ffffff' }
        k = Math.min(1, k + 0.02)
      }
    }
    // The step uses the rounded value, so a cell that shows +2,0 is in the step ≥ +2.
    const cellColors = (z) => stepColors(stepOf(Math.round(z * 10) / 10))
    const STEP_LABELS = ['≤ −2', '−1,5', '−1', '−0,5', '0', '+0,5', '+1', '+1,5', '≥ +2']


    // Three scales, one step function. The value of a cell is turned into a z-like value first.
    const RATIO_LABELS = ['≤ ×0,5', '×0,6', '×0,7', '×0,8', '×1', '×1,2', '×1,4', '×1,7', '≥ ×2']
    const NET_LABELS = ['≤ −0,5', '−0,4', '−0,25', '−0,1', '0', '+0,1', '+0,25', '+0,4', '≥ +0,5']
    const zOfRatio = (r) => (r > 0 ? 2 * Math.log2(r) : -4)
    const zOfNet = (net) => net * 4
    const ratioText = (r) => `×${new Intl.NumberFormat('el-GR', { minimumFractionDigits: 1, maximumFractionDigits: 2 }).format(r)}`
    const emptyCell = (title) => ({ background: 'transparent', color: 'var(--text-secondary)', text: '–', title, className: 'cell-empty' })

    function legendOf (labels) {
      return h('div', { class: 'scale-legend' }, h('span', {}, t('fp.legend.low')),
        h('ol', { class: 'scale-steps' }, [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((s, i) => { const c = stepColors(s); return h('li', { style: { background: c.background, color: c.color } }, labels[i]) })),
        h('span', {}, t('fp.legend.high')))
    }
    const rowLabel = (name) => {
      const group = groupOfOutlet.get(name)
      return h('span', {}, name, group ? h('span', { class: 'row-sub' }, group) : null)
    }

    // Each builder returns { line, note, card } or { failed: true } or { empty: true }.
    function peopleView () {
      const r = sources.people
      if (r.kind === 'failed' || r.kind === 'notFound') return { failed: true }
      const d = r.data
      const line = t('fp.line.people', { n: d.persons.length, period: fmt.period(d.window[0], d.window[1]) })
      if (r.kind === 'empty') return { line, empty: true }
      const attention = state.mode === 'attention'
      const shown = d.outlets.filter((o) => o.rows >= MIN_ROWS)
      const hidden = d.outlets.length - shown.length
      const matrix = UI.MatrixChart({
        caption: t('fp.matrix.title'), rowHeader: t('fp.col.outlet'),
        rows: shown.map((o) => ({ label: rowLabel(o.name) })),
        columns: d.persons.map((p) => ({ label: p, title: p })),
        cell: (ri, ci) => {
          const o = shown[ri]
          const c = o.cells[ci]
          if (attention) return { ...cellColors(zOfRatio(c.ratio)), text: ratioText(c.ratio), title: t('fp.cell.people', { outlet: o.name, person: d.persons[ci], ratio: ratioText(c.ratio).slice(1), n: fmt.int(c.n) }) }
          if (c.net === null) return emptyCell(t('fp.cell.stance.few', { outlet: o.name, person: d.persons[ci], min: 5 }))
          return { ...cellColors(zOfNet(c.net)), text: fmt.signed(c.net), title: t('fp.cell.stance', { outlet: o.name, person: d.persons[ci], net: fmt.signed(c.net), n: fmt.int(c.n) }) }
        },
        legend: legendOf(attention ? RATIO_LABELS : NET_LABELS)
      })
      return { line, note: `${t(attention ? 'fp.note.people.attention' : 'fp.note.people.stance')} ${t('fp.note.hidden', { n: hidden, min: MIN_ROWS })}`, card: t('fp.matrix.title'), matrix }
    }

    function extendedView () {
      const attention = state.mode === 'attention'
      const r = attention ? sources.extended : sources.stance
      if (r.kind === 'failed' || r.kind === 'notFound') return { failed: true }
      const d = r.data
      // The API gives the 15 persons in another order for stance. The columns keep the order of the attention view.
      const persons = sources.extended.kind === 'failed' ? d.persons.map((p) => p.name) : sources.extended.data.entities
      const line = t(attention ? 'fp.line.extended' : 'fp.line.extended.stance', { n: persons.length, days: d.days, date: fmt.date(d.referenceDate) })
      if (r.kind === 'empty') return { line, empty: true }
      let rows, cell, labels
      if (attention) {
        rows = d.sources.map((s) => ({ name: s.name }))
        cell = (ri, ci) => {
          const [z, n] = d.sources[ri].cells[ci]
          return { ...cellColors(z), text: fmt.signed(z), title: t('fp.cell', { outlet: d.sources[ri].name, person: persons[ci], z: fmt.signed(z), n: fmt.int(n) }) }
        }
        labels = ['≤ −2', '−1,5', '−1', '−0,5', '0', '+0,5', '+1', '+1,5', '≥ +2']
      } else {
        const names = [...new Set(d.persons.flatMap((p) => Object.keys(p.outlets)))].sort((a, b) => a.localeCompare(b, 'el'))
        rows = names.map((name) => ({ name }))
        cell = (ri, ci) => {
          const found = d.persons.find((p) => p.name === persons[ci])?.outlets[rows[ri].name]
          if (!found || found[1] < d.minN) return emptyCell(t('fp.cell.stance.few', { outlet: rows[ri].name, person: persons[ci], min: d.minN }))
          return { ...cellColors(zOfNet(found[0])), text: fmt.signed(found[0]), title: t('fp.cell.stance', { outlet: rows[ri].name, person: persons[ci], net: fmt.signed(found[0]), n: fmt.int(found[1]) }) }
        }
        labels = NET_LABELS
      }
      const matrix = UI.MatrixChart({
        caption: t('fp.matrix.title'), rowHeader: t('fp.col.outlet'),
        rows: rows.map((x) => ({ label: rowLabel(x.name) })),
        columns: persons.map((p) => ({ label: p, title: p })),
        cell, legend: legendOf(labels)
      })
      return { line, note: t(attention ? 'fp.note.extended' : 'fp.note.extended.stance'), card: t('fp.matrix.title'), matrix }
    }

    function interestsView () {
      const r = sources.interests
      if (r.kind === 'failed' || r.kind === 'notFound') return { failed: true }
      const d = r.data
      const line = t('fp.line.interests', { days: d.days, date: fmt.date(d.referenceDate) })
      if (r.kind === 'empty') return { line, empty: true }
      const matrix = UI.MatrixChart({
        caption: t('fp.interests.title'), rowHeader: t('fp.col.group'),
        rows: d.groups.map((g) => ({ label: h('span', {}, g.name, h('span', { class: 'row-sub' }, g.owner)) })),
        columns: d.clubs.map((c) => ({ label: `${c} (${fmt.pct(d.market[c] / 100)})`, title: c })),
        cell: (ri, ci) => {
          const g = d.groups[ri]
          const c = g.cells[ci]
          return { ...cellColors(zOfRatio(c.index)), text: ratioText(c.index), className: c.own ? 'cell-own' : null,
            title: t('fp.cell.interest', { group: g.name, club: c.club, index: ratioText(c.index).slice(1), share: fmt.pct(c.share / 100) }) + (c.own ? ` · ${t('fp.owned')}` : '') }
        },
        legend: legendOf(RATIO_LABELS)
      })
      return { line, note: t('fp.note.interests'), card: t('fp.interests.title'), matrix }
    }

    Shell.start({
      id: 'fingerprints',
      route: '/fingerprints',
      title: () => t('fp.title'),
      breadcrumbs: () => [{ label: t('fp.title') }],
      render (content) {
        const draw = () => {
          const focused = [...document.querySelectorAll('.segmented button')].indexOf(document.activeElement)
          const header = UI.PageHeader({ kicker: t('fp.kicker'), title: t('fp.title'), hint: t('fp.hint') })
          const controls = h('div', { class: 'view-controls' },
            UI.SegmentedControl({ label: t('fp.view'), value: state.view, onChange: (v) => { state.view = v; draw() },
              options: ['people', 'extended', 'interests'].map((v) => ({ value: v, label: t(`fp.view.${v}`) })) }),
            state.view !== 'interests' && UI.SegmentedControl({ label: t('fp.mode'), value: state.mode, onChange: (m) => { state.mode = m; draw() },
              options: ['attention', 'stance'].map((m) => ({ value: m, label: t(`fp.mode.${m}`) })) }))
          const v = state.view === 'people' ? peopleView() : state.view === 'extended' ? extendedView() : interestsView()
          const body = v.failed
            ? UI.ErrorState({ onRetry: () => location.reload() })
            : v.empty
              ? UI.ChartCard({ title: t('fp.matrix.title'), body: UI.EmptyState({ text: t('fp.empty') }) })
              : UI.ChartCard({ title: v.card, note: v.note, body: v.matrix })
          content.replaceChildren(header, controls, v.line ? h('p', { class: 'view-line', 'data-testid': 'view-line' }, v.line) : null, body, protoNote())
          if (focused >= 0) document.querySelectorAll('.segmented button')[focused]?.focus()
        }
        draw()
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
