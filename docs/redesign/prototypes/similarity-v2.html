<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=4">
  <link rel="stylesheet" href="assets/app.css?v=13">
  <link rel="stylesheet" href="assets/dash.css?v=67">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=3"></script>
  <script src="assets/messages.js?v=21"></script>
  <script src="assets/messages-v2.js?v=32"></script>
  <script src="assets/messages-spread.js?v=13"></script>
  <script src="assets/components.js?v=7"></script>
  <script src="assets/dash.js?v=11"></script>
  <script src="assets/spread.js?v=5"></script>
  <script src="assets/shell.js?v=36"></script>
  <script src="data/stories.js?v=1"></script>
  <script src="data/storyDetail.js?v=1"></script>
  <script src="data/originality.js?v=1"></script>
  <script src="data/groups.js?v=1"></script>
  <script>
    // Media, Ομοιότητα και πρωτοτυπία: who writes the stories that other outlets also write. The matrix and the panel of an outlet use the rows of the stories.
    // Originality reads the API in its own period (Sep 2025 – Jan 2026), so it has its own section with its own period.
    const { t, fmt, h, load } = App
    const { reset, NO_GROUP, card, cardHead, TopBar, select } = Dash
    const list = load('stories', ['dates'], (b) => b.stories)
    const detail = load('storyDetail', ['outlets', 'stories'], (b) => b.stories)
    const orig = load('originality', ['window', 'outlets'], (b) => b.outlets)
    const groupsData = load('groups', ['groups'], (b) => b.groups)
    const colorOfGroup = Dash.groupColors(groupsData.data ? groupsData.data.groups : [])
    const STEP = 25
    // The matrix shows the outlets with at least 700 stories. Each pair of them has 257 shared stories or more, so no cell is noise.
    const MIN_STORIES = 700
    // A pair with fewer shared stories is noise: two small outlets can share one story and reach 100 percent.
    const MIN_SHARED = 10
    const PANEL_ROWS = 8

    // The lag is in minutes. Less than 1 day shows in hours, the rest in days.
    const lagText = (min) => (min < 1440 ? t('originality.lag.h', { n: fmt.dec(min / 60) }) : t('originality.lag.d', { n: fmt.dec(min / 1440) }))

    Shell.start({
      id: 'similarity',
      route: '/similarity',
      dash: true,
      title: () => t('nav.media'),
      breadcrumbs: () => [{ label: t('nav.media') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        reset()
        const title = t('nav.media')
        const problem = Dash.stateContent([list, detail, orig], { title, tabs, quiet: true })
        if (problem) { content.replaceChildren(...problem.filter(Boolean), protoNote()); return }
        const dd = detail.data
        const outletName = (i) => dd.outlets[i].name
        const groupColor = (i) => { const g = dd.outlets[i].group; return (g && colorOfGroup.get(g)) || NO_GROUP }
        const dot = (i) => h('span', { class: dd.outlets[i].group ? 'dot' : 'dot dot-none', style: `--dot:${groupColor(i)}` })

        // The matrix. A cell is the share of the stories of the row outlet that the column outlet also wrote. The order of both axes comes from the clustering.
        const mx = Spread.matrix(dd, MIN_STORIES)
        const n = mx.order.length
        // Two ways to color the cells. share: the share of the stories of the row. lift: the same share against the level of chance, from 1 to the largest value.
        const pairsOfMatrix = mx.order.flatMap((a) => mx.order.filter((b) => b !== a).map((b) => [a, b]))
        const MODES = {
          share: { value: (a, b) => mx.cover(a, b), low: 0, high: Math.max(...pairsOfMatrix.map(([a, b]) => mx.cover(a, b))), text: (v) => fmt.pct(v) },
          lift: { value: (a, b) => mx.lift(a, b), low: 1, high: Math.max(...pairsOfMatrix.map(([a, b]) => mx.lift(a, b))), text: (v) => `×${fmt.dec(v)}` }
        }
        const state = { sel: mx.ids[0], mode: 'share' }
        const shade = (v) => { const m = MODES[state.mode]; return `color-mix(in srgb, var(--series-news) ${Math.round(8 + 92 * Math.max(0, (v - m.low) / (m.high - m.low)))}%, #ffffff)` }
        const matrixHolder = h('div', { class: 'mx-wrap' })
        const panelHolder = h('div', {})
        const pick = (a) => { state.sel = a; draw() }
        const pairText = (a, b) => t('sim.mx.tip', { a: outletName(a), b: outletName(b), pct: fmt.pct(mx.cover(a, b)), n: fmt.int(mx.shared(a, b)) }) + t('sim.mx.tip.lift', { lift: fmt.dec(mx.lift(a, b)) })

        function drawMatrix () {
          const grid = h('div', { class: 'mx', style: `--n:${n}`, role: 'img', 'aria-label': t('sim.mx.aria', { n }) },
            h('span', {}),
            mx.order.map((b) => h('span', { class: 'mx-col' }, dot(b), outletName(b))),
            mx.order.map((a) => [
              h('button', { type: 'button', class: `mx-row${a === state.sel ? ' is-sel' : ''}`, onClick: () => pick(a) }, outletName(a), dot(a)),
              mx.order.map((b) => {
                if (a === b) return h('span', { class: 'mx-cell mx-self' })
                const m = MODES[state.mode]
                const v = m.value(a, b)
                const dark = (v - m.low) / (m.high - m.low) > 0.55
                const cell = h('span', { class: `mx-cell${a === state.sel ? ' is-sel' : ''}`, style: `background:${shade(v)};color:${dark ? '#ffffff' : '#1f1f1f'}` }, a === state.sel ? (state.mode === 'share' ? String(Math.round(v * 100)) : fmt.dec(v)) : null)
                cell.dataset.a = a
                cell.dataset.b = b
                return cell
              })
            ]))
          grid.addEventListener('pointermove', (e) => {
            const cell = e.target.closest('.mx-cell[data-a]')
            if (cell) UI.showTooltip(pairText(Number(cell.dataset.a), Number(cell.dataset.b)), e.clientX, e.clientY)
            else UI.hideTooltip()
          })
          grid.addEventListener('pointerleave', () => UI.hideTooltip())
          grid.addEventListener('click', (e) => { const cell = e.target.closest('.mx-cell[data-a]'); if (cell) pick(Number(cell.dataset.a)) })
          const m = MODES[state.mode]
          const key = h('div', { class: 'mx-key' }, h('span', {}, m.text(m.low)), h('span', { class: 'mx-ramp', style: `background:linear-gradient(90deg, ${shade(m.low)}, ${shade(m.high)})` }), h('span', {}, m.text(m.high)))
          const left = mx.left.map(outletName).sort((x, y) => x.localeCompare(y)).join(', ')
          matrixHolder.replaceChildren(grid, key, h('p', { class: 'dcard-sub' }, t('sim.mx.note', { n, min: fmt.int(MIN_STORIES), m: mx.left.length, names: left })))
        }

        // The panel of the selected outlet: the 8 outlets that write most of its stories. The second number is the share the other way.
        function drawPanel () {
          const a = state.sel
          const m = MODES[state.mode]
          const rows = mx.order.filter((b) => b !== a).map((b) => ({ b, v: m.value(a, b), cover: mx.cover(a, b), back: mx.cover(b, a) })).sort((x, y) => y.v - x.v).slice(0, PANEL_ROWS)
          const options = mx.order.map((i) => ({ value: String(i), label: outletName(i) })).sort((x, y) => x.label.localeCompare(y.label))
          panelHolder.replaceChildren(card('c-12', cardHead(t('sim.sel.title', { name: outletName(a) }), null, t('sim.sel.info')),
            h('div', { class: 'mx-select' }, select(t('sim.sel.pick'), a, options, (v) => pick(Number(v)))),
            h('p', { class: 'dcard-sub' }, t('sim.sel.stories', { n: fmt.int(mx.per[a]) })),
            h('ul', { class: 'rows rows-groups' }, rows.map((r) => h('li', { style: `--bar-color:${groupColor(r.b)}` },
              dot(r.b),
              h('span', { class: 'row-name' }, UI.EntityLink({ type: 'outlet', key: dd.outlets[r.b].slug, label: outletName(r.b) })),
              h('span', { class: 'row-value' }, state.mode === 'share' ? t('sim.sel.row', { pct: fmt.pct(r.cover), back: fmt.pct(r.back) }) : t('sim.sel.row.lift', { lift: fmt.dec(r.v), pct: fmt.pct(r.cover) })),
              UI.HBar(r.v - m.low, m.high - m.low))))))
        }
        const modeButtons = Object.keys(MODES).map((key) => h('button', { type: 'button', 'aria-pressed': String(key === state.mode), onClick: () => { state.mode = key; modeButtons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === key))); draw() } }, t(`sim.mx.mode.${key}`)))
        modeButtons.forEach((b, i) => { b.dataset.mode = Object.keys(MODES)[i] })
        const modeSwitch = h('div', { class: 'segmented', role: 'group', 'aria-label': t('sim.mx.mode') }, modeButtons)
        function draw () { drawMatrix(); drawPanel() }
        draw()

        // The same group or not: the average similarity of the pairs of outlets that both have a group.
        const { list: pairList } = Spread.pairs(dd)
        const all = pairList.filter((p) => p.shared >= MIN_SHARED)
        const grouped = all.filter((p) => p.grouped)
        const mean = (xs) => (xs.length ? xs.reduce((s, p) => s + p.score, 0) / xs.length : 0)
        const sameRows = [['same', grouped.filter((p) => p.sameGroup)], ['other', grouped.filter((p) => !p.sameGroup)]].map(([key, ps]) => ({ key, n: ps.length, score: mean(ps) }))
        const sameColors = { same: 'var(--series-news)', other: 'var(--series-other)' }
        const sameRing = Spread.Ring(sameRows.map((r) => ({ name: t(`sim.group.${r.key}`), n: r.n, color: sameColors[r.key], score: r.score })), {
          center: fmt.int(sameRows.reduce((sum, r) => sum + r.n, 0)), caption: t('sim.same.total'), aria: t('sim.same.aria'),
          tip: (it) => t('sim.same.tip', { name: it.name, n: fmt.int(it.n), score: fmt.pct(it.score) })
        })
        const sameCard = card('c-12', cardHead(t('sim.same.title'), null, t('sim.same.info')),
          h('div', { class: 'ring-stack' }, sameRing,
            h('ul', { class: 'ring-list' }, sameRows.map((r) => h('li', {},
              h('span', { class: 'dot', style: `--dot:${sameColors[r.key]}` }), h('span', {}, t(`sim.group.${r.key}`)),
              h('span', { class: 'muted-text' }, t('sim.same.row', { score: fmt.pct(r.score), n: fmt.int(r.n) })))))))

        // Originality: the share of original articles of each outlet. The bar is 100 percent of the scored articles and the dashed line is the average of the 5 outlets.
        const d = orig.data
        const rows = d.outlets.slice().sort((a, b) => b.pct - a.pct)
        const average = rows.reduce((sum, r) => sum + r.originals, 0) / rows.reduce((sum, r) => sum + r.scored, 0)
        const pct = (v) => fmt.pct(v / 100)
        const by = (field) => rows.slice().sort((a, b) => a[field] - b[field])
        const extremes = new Map()
        const mark = (r, code) => extremes.set(r.name, [...(extremes.get(r.name) || []), code])
        mark(rows[0], 'best')
        mark(rows[rows.length - 1], 'worst')
        mark(by('lagMin')[0], 'fast')
        const period = t('originality.meta', { n: rows.length, from: fmt.date(d.window[0], { month: 'short', year: 'numeric' }), to: fmt.date(d.window[1], { month: 'short', year: 'numeric' }) })
        const origKey = h('span', { class: 'legend-inline' },
          h('span', {}, h('span', { class: 'swatch', style: { background: 'var(--series-news)' } }), t('originality.key.original')),
          h('span', {}, h('span', { class: 'swatch', style: { background: 'var(--bar-muted)' } }), t('originality.key.rewrite')),
          h('span', {}, h('span', { class: 'swatch-tick' }), t('originality.key.avg', { pct: fmt.pct(average) })))
        const origTable = UI.DataTable({
          rows, rankColumn: true, pageSize: 10, emptyText: t('media.empty'),
          columns: [
            { label: t('media.col.outlet'), render: (r) => h('div', { class: 'name-cell' }, UI.EntityLink({ type: 'outlet', key: null, label: r.name }),
              h('span', { class: 'reason' }, (extremes.get(r.name) || ['mid']).map((code) => h('span', { class: 'chip chip-sm' }, t(`originality.reason.${code}`))))) },
            { label: t('originality.col.scored'), num: true, phone: false, render: (r) => fmt.int(r.scored) },
            { label: t('originality.col.pct'), render: (r) => {
              const tip = t('originality.share.tip', { name: r.name, originals: fmt.int(r.originals), rewrites: fmt.int(r.rewrites) })
              return h('div', { class: 'orig-cell', title: tip },
                h('strong', {}, pct(r.pct)),
                h('div', { class: 'orig-bar', role: 'img', 'aria-label': tip },
                  h('div', { class: 'stack stack-fill' },
                    h('span', { style: `width:${(r.originals / r.scored) * 100}%;--seg:var(--series-news)` }), h('span', { style: `width:${(r.rewrites / r.scored) * 100}%` })),
                  h('span', { class: 'avg-tick', style: `left:${average * 100}%` })))
            } },
            { label: t('originality.col.lag'), num: true, phone: false, render: (r) => lagText(r.lagMin) }
          ]
        })
        const maxLag = Math.max(...rows.map((r) => r.lagMin), 1)
        const lagCard = card('c-4', cardHead(t('originality.lag.title'), null, t('originality.lag.info')),
          h('ul', { class: 'rows' }, rows.map((r) => h('li', {}, h('span', { class: 'row-name' }, r.name), h('span', { class: 'row-value' }, lagText(r.lagMin)), UI.HBar(r.lagMin, maxLag)))))

        // The table of all pairs is the table view of the matrix. It stays closed until the reader opens it.
        const pairRows = all.slice().sort((a, b) => b.score - a.score || b.shared - a.shared)
        const topScore = pairRows.reduce((m, p) => Math.max(m, p.score), 0.0001)
        const name = (i) => h('span', { class: 'group-cell nowrap' }, dot(i), UI.EntityLink({ type: 'outlet', key: dd.outlets[i].slug, label: outletName(i) }))
        const pairsCard = card('c-12', h('details', { class: 'pairs-details' }, h('summary', { class: 'dcard-title' }, t('sim.table.title', { n: fmt.int(pairRows.length) })),
          UI.DataTable({
            rows: pairRows, rankColumn: true, pageSize: STEP, moreStep: STEP, emptyText: t('spread.rank.empty'),
            columns: [
              { label: t('sim.col.pair'), render: (p) => h('span', { class: 'pair' }, name(p.a), h('span', { class: 'muted-text' }, ' ↔ '), name(p.b)) },
              { label: t('sim.col.shared'), num: true, phone: false, render: (p) => fmt.int(p.shared) },
              { label: t('sim.col.score'), num: true, render: (p) => h('div', { class: 'bar-cell' }, h('span', { class: 'bar-num' }, fmt.pct(p.score)), UI.HBar(p.score, topScore)) }
            ]
          })))

        // The top bar is the one of Μέσα: only the tabs. Originality states its own period in its section.
        const dates = list.data.dates
        const bar = TopBar({ title, tabs, quiet: true })

        content.replaceChildren(bar, h('div', { class: 'dash-grid' },
          card('c-8 mx-card', cardHead(t('sim.mx.title'), modeSwitch, t('sim.mx.info')), matrixHolder),
          h('div', { class: 'card-col c-4' }, panelHolder, sameCard),
          card('c-8', cardHead(t('originality.title'), origKey, t('originality.info')), h('p', { class: 'dcard-sub' }, period), origTable),
          lagCard,
          pairsCard), protoNote())
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
