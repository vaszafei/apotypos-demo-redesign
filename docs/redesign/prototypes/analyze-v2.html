<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=4">
  <link rel="stylesheet" href="assets/app.css?v=12">
  <link rel="stylesheet" href="assets/dash.css?v=54">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=3"></script>
  <script src="assets/messages.js?v=16"></script>
  <script src="assets/messages-v2.js?v=28"></script>
  <script src="assets/messages-analyze.js?v=2"></script>
  <script src="assets/components.js?v=6"></script>
  <script src="assets/dash.js?v=11"></script>
  <script src="assets/shell.js?v=30"></script>
  <script src="data/analyze.js?v=1"></script>
  <script src="data/groups.js?v=2"></script>
  <script>
    // Αναλύσεις & Ιδιοκτησία, Επισκόπηση (/analyze, issue #8). The data is a snapshot of the 3 endpoints of the live page (scripts/make-analyze.py).
    // The live API returns one window for every ?days=, so the page shows that window and has no period control.
    const { t, fmt, h, load } = App
    const { reset, NO_GROUP, groupColor, card, cardHead, emptyText, Stat, Meter, TopBar } = Dash
    const result = load('analyze', ['dates', 'sources', 'groups', 'categories', 'window'], (b) => b.sources)
    const groupsFile = load('groups', ['groups'], (b) => b.groups)
    const slugOf = new Map(groupsFile.kind === 'failed' ? [] : groupsFile.data.groups.map((g) => [g.name, g.slug]))

    // Small multiples: one row of day columns for each source, on one shared scale.
    function SourceRows ({ rows, max }) {
      return h('ul', { class: 'src-rows' }, rows.map((r) => {
        const total = r.daily.reduce((a, b) => a + b, 0)
        const peak = Math.max(...r.daily)
        const w = 124
        const hh = 28
        const bw = w / r.daily.length
        const svg = h('svg', { class: 'src-spark', width: w, height: hh, viewBox: `0 0 ${w} ${hh}`, 'aria-hidden': 'true' },
          r.daily.map((v, i) => (v ? h('rect', { x: i * bw + bw * 0.15, y: hh - Math.max(1, (v / max) * hh), width: bw * 0.7, height: Math.max(1, (v / max) * hh), fill: r.color }) : null)))
        return h('li', { 'aria-label': t('an.sources.row', { name: r.label, n: fmt.int(total), max: fmt.int(peak) }) },
          h('span', { class: 'src-name', title: r.label }, h('span', { class: r.color === NO_GROUP ? 'dot dot-none' : 'dot', style: `--dot:${r.color}`, 'aria-hidden': 'true' }), r.label),
          svg,
          h('span', { class: 'row-value' }, fmt.int(total)))
      }))
    }

    Shell.start({
      id: 'analyze',
      route: '/analyze',
      dash: true,
      title: () => t('an.title'),
      breadcrumbs: () => [{ label: t('an.title') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        const draw = () => {
          reset()
          const bar = TopBar({ title: t('an.title'), tabs, quiet: true })
          if (result.kind === 'failed' || result.kind === 'notFound') {
            content.replaceChildren(bar, UI.ErrorState({ onRetry: () => location.reload() }), protoNote())
            return
          }
          const d = result.data
          const empty = result.kind === 'empty'
          const period = fmt.period(d.window[0], d.window[1])
          const sources = empty ? [] : d.sources
          const groups = empty ? [] : d.groups.slice().sort((a, b) => b.total - a.total)
          const cats = empty ? [] : d.categories.slice().sort((a, b) => b.total - a.total)
          const volumeTotal = sources.reduce((s, r) => s + r.daily.reduce((a, b) => a + b, 0), 0)
          const knownVolume = sources.filter((r) => r.group).reduce((s, r) => s + r.daily.reduce((a, b) => a + b, 0), 0)
          const groupTotal = groups.reduce((s, g) => s + g.total, 0)
          const catTotal = cats.reduce((s, c) => s + c.total, 0)

          // Row 1: the stat cards K35, K37 and K49.
          const top3 = groups.slice(0, 3)
          const top3Share = groupTotal ? top3.reduce((s, g) => s + g.total, 0) / groupTotal : 0
          const statGroups = Stat({
            kpi: 'K35', label: t('an.stat.groups'), empty: !groups.length, value: fmt.int(groups.filter((g) => g.total > 0).length),
            sub: t('an.stat.groups.sub', { total: fmt.int(d.groupsOnRecord.length) }),
            viz: h('span', { class: 'dot-row', 'aria-hidden': 'true' }, d.groupsOnRecord.map((name) => h('span', { class: groups.some((g) => g.group === name && g.total) ? 'dot' : 'dot dot-none', style: `--dot:${groupColor(name)}` })))
          })
          const statTop3 = Stat({
            kpi: 'K37', label: t('an.stat.top3'), empty: !groupTotal, value: fmt.pct(top3Share),
            sub: t('an.stat.top3.sub', { names: top3.map((g) => g.group).join(', '), n: fmt.int(groupTotal) }), viz: Meter(top3Share)
          })
          const statKnown = Stat({
            kpi: 'K49', label: t('an.stat.known'), empty: !volumeTotal, value: fmt.pct(knownVolume / (volumeTotal || 1)),
            sub: t('an.stat.known.sub', { n: fmt.int(knownVolume), total: fmt.int(volumeTotal), sources: fmt.int(sources.length) }), viz: Meter(knownVolume / (volumeTotal || 1))
          })

          // Row 2: the volume of each source, and the groups. The daily volume by group is on Μέσα > Ιδιοκτησία.
          // The 8 largest sources and the rest.
          const top = sources.slice(0, 8).map((s) => ({ label: s.name, color: groupColor(s.group), daily: s.daily }))
          const rest = sources.slice(8)
          if (rest.length) top.push({ label: t('an.sources.rest', { n: fmt.int(rest.length) }), color: NO_GROUP, daily: d.dates.map((_, i) => rest.reduce((a, s) => a + s.daily[i], 0)) })
          const sourceMax = Math.max(1, ...top.flatMap((r) => r.daily))
          const sourcesCard = card('c-6', cardHead(t('an.sources.title'), null, t('an.sources.info')),
            top.length ? SourceRows({ rows: top, max: sourceMax }) : emptyText(t('an.empty')))

          // The groups and the categories, as ranked rows with bars. A category bar is grey: the group colors are only for groups.
          const groupsCard = card('c-6', cardHead(t('an.groups.title'), null, t('an.groups.info', { n: fmt.int(groupTotal), m: fmt.int(volumeTotal) })),
            groups.length
              ? [h('ul', { class: 'rows' }, groups.slice(0, 10).map((g) => h('li', { style: `--bar-color:${groupColor(g.group)}` },
                  h('span', { class: 'row-name group-cell', title: `${g.group} · ${g.owner}` }, h('span', { class: 'dot', style: `--dot:${groupColor(g.group)}`, 'aria-hidden': 'true' }),
                    slugOf.has(g.group) ? h('a', { class: 'quiet-link', href: `group-v2.html?g=${slugOf.get(g.group)}` }, g.group) : g.group),
                  h('span', { class: 'row-value' }, t('an.groups.value', { n: fmt.int(g.total), share: fmt.pct(g.total / groupTotal) })),
                  UI.HBar(g.total, groups[0].total)))),
                h('a', { class: 'dcard-foot quiet-link', href: 'groups-v2.html' }, t('an.groups.all'))]
              : emptyText(t('an.empty')))
          const catsCard = card('c-12', cardHead(t('an.cats.title'), null, t('an.cats.info', { n: fmt.int(catTotal) })),
            cats.length
              ? h('ul', { class: 'rows' }, cats.slice(0, 10).map((c) => h('li', { style: '--bar-color:var(--text-secondary)' },
                  h('span', { class: 'row-name' }, c.category),
                  h('span', { class: 'row-value' }, t('an.groups.value', { n: fmt.int(c.total), share: fmt.pct(c.total / catTotal) })),
                  UI.HBar(c.total, cats[0].total))))
              : emptyText(t('an.empty')))

          const windowNote = h('p', { class: 'dash-window' }, t('an.window', { period }))
          content.replaceChildren(bar, windowNote, h('div', { class: 'dash-grid' }, statGroups, statTop3, statKnown, sourcesCard, groupsCard, catsCard), protoNote())
        }
        draw()
      }
    })

    function protoNote () { return h('p', { class: 'proto-note' }, t('proto.states')) }
  </script>
</body>
</html>
