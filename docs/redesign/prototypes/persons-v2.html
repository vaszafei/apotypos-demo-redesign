<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=15">
  <link rel="stylesheet" href="assets/app.css?v=50">
  <link rel="stylesheet" href="assets/dash.css?v=95">
  <link rel="stylesheet" href="assets/politics.css?v=8">
  <script src="assets/page-move.js?v=1"></script>
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=9"></script>
  <script src="assets/messages.js?v=40"></script>
  <script src="assets/messages-v2.js?v=57"></script>
  <script src="assets/messages-politics.js?v=10"></script>
  <script src="assets/components.js?v=20"></script>
  <script src="assets/motion.js?v=3"></script>
  <script src="assets/dash.js?v=21"></script>
  <script src="assets/politics.js?v=11"></script>
  <script src="assets/shell.js?v=61"></script>
  <script src="data/personFile.js?v=1"></script>
  <script>
    // Πολιτική, Πρόσωπα: the person file. One person, a fixed page (the data has one person today).
    // The statements are verbatim from interviews. The pairs and the verdicts are proposals of models to review.
    // Three sub-tabs (#62): Επισκόπηση (/contradictions), Αντιφάσεις (?tab=pairs) and Έλεγχος στοιχείων (?tab=checks). Each list fills its sub-tab.
    const { t, fmt, h, load, safeUrl, params } = App
    const TABS = { overview: '/contradictions', pairs: '/contradictions/pairs', checks: '/contradictions/checks' }
    const tab = TABS[params.get('tab')] ? params.get('tab') : 'overview'
    const { reset, card, cardHead, Stat, TopBar } = Dash
    const result = load('personFile', ['summary', 'themes', 'pairs', 'checked'], (b) => b.themes)
    const VERDICTS = ['accurate', 'mostly_accurate', 'inaccurate', 'unverifiable']
    const KINDS = ['fact', 'position', 'accusation', 'prediction', 'promise', 'claim']
    const PAIRS = 6
    let allPairs = false

    const videoAt = (video, sec) => safeUrl(`https://www.youtube.com/watch?v=${encodeURIComponent(video)}&t=${Math.floor(sec || 0)}s`)
    const day = (iso) => fmt.date(iso, { day: 'numeric', month: 'short', year: 'numeric' })

    Shell.start({
      id: 'persons',
      route: TABS[tab],
      dash: true,
      title: () => t('nav.people'),
      breadcrumbs: () => [{ label: t('nav.people') }, { label: t('tab.people.file') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        const paint = () => {
          const title = t('tab.people.file')
          const problem = Dash.stateContent([result], { title, tabs, quiet: true })
          if (problem) { content.replaceChildren(...problem); return }
          const d = result.data
          const s = d.summary
          const name = App.locale === 'en' ? s.person_en : s.person
          // The sub-tabs without the person card name the person in the page head.
          const bar = TopBar({ title, meta: name, tabs, quiet: tab === 'overview' })

          const hero = card('c-6 hero dossier-hero',
            h('div', { class: 'hero-main' },
              h('p', { class: 'hero-kicker' }, t('pf.kicker')),
              h('h1', { class: 'hero-title' }, name),
              h('p', { class: 'dcard-sub hero-lead' }, t('pf.lead')),
              // #60: the counts of videos and statements are the first two stat cards, under the title, so they are not chips here too.
              h('div', { class: 'hero-chips' },
                h('span', { class: 'hero-period' }, h('strong', {}, t('pf.period', { from: day(s.from), to: day(s.to) }))))))

          const wide = (stat) => { stat.classList.remove('c-4'); return stat }
          const stats = [
            wide(Stat({ label: t('pf.stat.videos'), value: fmt.int(d.videos), sub: t('pf.stat.videos.sub', { n: fmt.int(d.videosSampled), x: fmt.int(d.noCaptions) }) })),
            wide(Stat({ label: t('pf.stat.claims'), value: fmt.int(s.claims), sub: t('pf.stat.claims.sub') })),
            wide(Stat({ label: t('pf.stat.pairs'), value: fmt.int(d.pairs.length), sub: t('pf.stat.pairs.sub') })),
            wide(Stat({ label: t('pf.stat.checked'), value: fmt.int(d.checks.checked), sub: t('pf.stat.checked.sub', { n: fmt.int(d.checks.checkable) }) }))
          ]
          // The title card takes the left half and the four stat cards the right half, in two rows of two (#dossier).
          const statGrid = h('div', { class: 'c-6 dossier-stats' }, ...stats)

          // The months from the first to the last statement. A month with no interview is a gap, not a zero line.
          const counts = new Map(d.claimsByMonth)
          const months = []
          for (let x = new Date(`${d.claimsByMonth[0][0]}-01T00:00:00Z`); x.toISOString().slice(0, 7) <= d.claimsByMonth[d.claimsByMonth.length - 1][0]; x.setUTCMonth(x.getUTCMonth() + 1)) months.push(x.toISOString().slice(0, 7))
          const monthLabel = (m) => fmt.date(`${m}-01`, { month: 'short', year: '2-digit' })
          // The title names the month with the most statements; the dashed line is the average of the months with an interview.
          const monthly = months.map((m) => counts.get(m) || 0)
          const busiest = monthly.indexOf(Math.max(...monthly))
          const active = monthly.filter((n) => n > 0)
          const monthAvg = active.reduce((a, b) => a + b, 0) / (active.length || 1)
          const monthCard = card('c-8', cardHead(t('pf.months.title'), null, `${t('pf.months.finding', { month: monthLabel(months[busiest]), n: fmt.int(monthly[busiest]) })}. ${t('pf.months.info')}`),
            UI.BarChart({ labels: months.map(monthLabel), values: monthly, height: 220, label: t('pf.months.title'), reference: { value: monthAvg, label: t('find.avg', { n: fmt.int(Math.round(monthAvg)) }) },
              tooltipOf: (i) => `${monthLabel(months[i])} · ${fmt.int(counts.get(months[i]) || 0)}` }))
          const verdictColor = { accurate: 'var(--stance-supportive)', mostly_accurate: 'color-mix(in srgb, var(--stance-supportive) 55%, var(--surface-raised))', inaccurate: 'var(--stance-critical)', unverifiable: 'var(--bar-muted)' }
          // The title gives the share of the checked figures that hold, fully or mostly.
          const holds = ((d.checks.verdicts.accurate || 0) + (d.checks.verdicts.mostly_accurate || 0)) / (d.checks.checked || 1)
          const verdictCard = card('c-4', cardHead(t('pf.verdict.title'), null, `${d.checks.checked ? `${t('pf.verdict.finding', { share: fmt.pct(holds) })}. ` : ''}${t('pf.verdict.info')}`),
            UI.BarList(VERDICTS.map((k) => ({ label: t(`pf.verdict.${k}`), value: d.checks.verdicts[k] || 0, text: `${fmt.int(d.checks.verdicts[k] || 0)} · ${fmt.pct((d.checks.verdicts[k] || 0) / (d.checks.checked || 1))}`, color: verdictColor[k] })), { max: d.checks.checked }))

          const themeRows = d.themes.slice().sort((a, b) => b.n - a.n)
          const kindsOf = (x) => KINDS.filter((k) => x.kinds[k]).sort((a, b) => x.kinds[b] - x.kinds[a]).slice(0, 3).map((k) => `${t(`pf.kind.${k}`)} ${fmt.int(x.kinds[k])}`).join(' · ')
          const themeCard = card('c-12', cardHead(t('pf.themes.title'), null, t('pf.themes.info')),
            h('ul', { class: 'theme-list' }, themeRows.map((x) => h('li', {}, h('details', {},
              h('summary', {},
                h('span', { class: 'theme-name' }, x.el),
                UI.HBar(x.n, themeRows[0].n, { text: fmt.int(x.n) }),
                h('span', { class: 'muted-text theme-kinds' }, kindsOf(x)),
                h('span', { class: 'muted-text nowrap' }, `${fmt.date(x.from, { month: 'short', year: 'numeric' })} → ${fmt.date(x.to, { month: 'short', year: 'numeric' })}`)),
              h('p', { class: 'theme-summary' }, x.summary))))))

          const pairs = allPairs ? d.pairs : d.pairs.slice(0, PAIRS)
          const side = (label, x) => h('div', { class: 'pair-side' },
            h('p', { class: 'quote-meta' }, h('strong', {}, label), ' · ', day(x.date), ' · ', h('a', { class: 'quiet-link', href: videoAt(x.video, x.t), target: '_blank', rel: 'noopener' }, t('pf.watch'))),
            h('p', { class: 'quote-text' }, `«${x.quote}»`))
          const pairCard = card('c-12', cardHead(t('pf.pairs.title'), null, t('pf.pairs.info')),
            h('ul', { class: 'quote-list' }, pairs.map((p) => h('li', {},
              h('span', { class: 'quote-meta' }, h('span', { class: 'pill pill-hot' }, t(`pf.pair.${p.type}`)), h('span', {}, t(`pf.pair.${p.confidence}`))),
              h('strong', { class: 'pair-conflict' }, p.conflict),
              h('div', { class: 'pair-sides' }, side(t('pf.pair.earlier'), p.earlier), side(t('pf.pair.later'), p.later))))),
            d.pairs.length > PAIRS ? h('div', { class: 'table-more' }, h('button', { type: 'button', class: 'button', 'aria-expanded': String(allPairs), onClick: () => { allPairs = !allPairs; paint() } }, allPairs ? t('table.less') : t('pf.pairs.more', { n: fmt.int(d.pairs.length) }))) : null)

          const order = { inaccurate: 0, accurate: 1, mostly_accurate: 2, unverifiable: 3 }
          const checks = d.checked.slice().sort((a, b) => order[a.verdict] - order[b.verdict] || b.date.localeCompare(a.date)).slice(0, 10)
          const checkCard = card('c-12', cardHead(t('pf.checks.title'), null, t('pf.checks.info')),
            h('ul', { class: 'quote-list' }, checks.map((c) => h('li', {},
              h('span', { class: 'quote-meta' }, h('span', { class: `pill verdict-${c.verdict}` }, t(`pf.verdict.${c.verdict}`)), day(c.date), ' · ', h('a', { class: 'quiet-link', href: videoAt(c.video, c.t), target: '_blank', rel: 'noopener' }, t('pf.watch'))),
              h('strong', {}, c.assertion_el),
              c.summary_el ? h('span', { class: 'muted-text' }, c.summary_el) : h('span', { class: 'quote-text' }, `«${c.quote}»`)))))

          const cards = { overview: [hero, statGrid, monthCard, verdictCard, themeCard], pairs: [pairCard], checks: [checkCard] }[tab]
          content.replaceChildren(bar, h('div', { class: 'dash-grid' }, ...cards), h('p', { class: 'proto-note' }, t('pf.note')))
        }
        paint()
      }
    })
    reset()
  </script>
</body>
</html>
