<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=4">
  <link rel="stylesheet" href="assets/app.css?v=12">
  <link rel="stylesheet" href="assets/dash.css?v=59">
  <link rel="stylesheet" href="assets/politics.css?v=1">
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=3"></script>
  <script src="assets/messages.js?v=17"></script>
  <script src="assets/messages-v2.js?v=31"></script>
  <script src="assets/messages-politics.js?v=2"></script>
  <script src="assets/components.js?v=6"></script>
  <script src="assets/dash.js?v=11"></script>
  <script src="assets/politics.js?v=1"></script>
  <script src="assets/shell.js?v=31"></script>
  <script src="data/gazaCoverage.js?v=1"></script>
  <script>
    // Κόσμος, Γάζα: how the press builds the picture of Gaza (K24 to K26). It reads the Gaza file (1 Aug to 30 Sep 2026).
    // The five questions of the live page, each in one small card.
    const { t, fmt, h, load } = App
    const { reset, card, cardHead, Stat, TopBar } = Dash
    const { weekLabel, ColumnChart, LineChart, Rows, PairRows, pctOf, signed } = Politics
    const result = load('gazaCoverage', ['daily', 'overall', 'outlets'], (b) => b.daily)
    const TERMS = ['genocide', 'famine', 'occupation', 'terrorism', 'war', 'war_crimes']
    const WEEK_TERMS = ['genocide', 'famine', 'occupation', 'terrorism', 'war_crimes']
    let term = 'genocide'
    let sample = 'pal_agentless'

    Shell.start({
      id: 'gaza',
      route: '/gaza',
      dash: true,
      title: () => t('nav.world'),
      breadcrumbs: () => [{ label: t('nav.world') }, { label: t('tab.world.gaza') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal')
        const title = t('tab.world.gaza')
        const problem = Dash.stateContent([result], { title, tabs, quiet: true })
        if (problem) { content.replaceChildren(...problem); return }
        const d = result.data
        const o = d.overall
        const bar = TopBar({ title, tabs, quiet: true })
        const names = [t('gz.side.pal'), t('gz.side.isr')]
        const pair = (label, a, b, extra = {}) => ({ label, a: { value: a, text: pctOf(a), sub: extra.subA }, b: { value: b, text: pctOf(b), sub: extra.subB } })
        const day = (iso) => fmt.date(iso, { day: 'numeric', month: 'short' })

        const total = d.daily.reduce((a, x) => a + x.total, 0)
        const peak = d.peaks[0]
        const stats = [
          Stat({ kpi: 'K24', label: t('gz.stat.n'), value: fmt.int(d.nGaza), sub: t('gz.stat.n.sub', { n: fmt.dec((d.daily.reduce((a, x) => a + x.gaza, 0) / total) * 1000), c: fmt.int(d.nCandidates) }) }),
          Stat({ kpi: 'K25', label: t('gz.stat.peak'), value: fmt.int(peak.gaza), sub: t('gz.stat.peak.sub', { date: day(peak.date), title: peak.titles[0] ? peak.titles[0].title.split(':')[0] : '' }) }),
          Stat({ kpi: 'K26', label: t('gz.stat.outlets'), value: fmt.int(d.fullOutlets), sub: t('gz.stat.outlets.sub') })
        ]

        // The days, with the six peaks and two headlines of each peak.
        const marks = Object.fromEntries(d.peaks.map((p, i) => [d.daily.findIndex((x) => x.date === p.date), i + 1]))
        const dailyCard = card('c-12', cardHead(t('gz.daily.title'), null, t('gz.daily.info')),
          ColumnChart({
            labels: d.daily.map((x) => day(x.date)),
            values: d.daily.map((x) => x.gaza),
            marks,
            height: 240,
            tips: d.daily.map((x) => t('gz.daily.tip', { date: fmt.date(x.date, { weekday: 'short', day: 'numeric', month: 'short' }), n: fmt.int(x.gaza), per: fmt.dec(x.per1k) })),
            aria: t('gz.daily.title')
          }),
          h('ol', { class: 'peak-list' }, d.peaks.map((p, i) => h('li', {},
            h('span', { class: 'marker-num' }, String(i + 1)),
            h('div', {}, h('p', { class: 'quote-meta' }, fmt.date(p.date, { weekday: 'short', day: 'numeric', month: 'short' }), ' · ', t('gz.peak.n', { n: fmt.int(p.gaza) })),
              p.titles.map((x) => h('p', { class: 'peak-title' }, h('span', { class: 'muted-text' }, `${x.outlet}: `), h('a', { class: 'quiet-link', href: x.url, target: '_blank', rel: 'noopener' }, x.title))))))))

        // The five questions.
        // The card «Ποιος σκότωσε;» is gone: the live page withdrew the perpetrator-naming measure (its check gave κ = 0,09).
        const q2 = card('c-4', cardHead(t('gz.q2.title'), null, t('gz.q2.info')),
          PairRows([pair(t('gz.q2.any'), o.any_pal_voice, o.any_isr_voice), pair(t('gz.q2.first'), o.first_pal, o.first_isr)], { names, max: 100 }),
          h('p', { class: 'dcard-sub' }, t('gz.q2.civil', { a: pctOf(o.pal_civilian_voice), b: pctOf(o.un_voice) })))
        const q3 = card('c-4', cardHead(t('gz.q3.title'), null, t('gz.q3.info')),
          PairRows([pair(t('gz.q3.row'), o.named_pal, o.named_isr)], { names, max: 100 }))
        const q4 = card('c-4', cardHead(t('gz.q4.title'), null, t('gz.q4.info')),
          h('div', { class: 'dstat-row' }, h('p', { class: 'dstat-value' }, pctOf(o.hamas_label)), h('p', { class: 'dstat-sub' }, t('gz.q4.label'), h('br'), t('gz.q4.value', { n: fmt.int(o.with_figures) })), Dash.Meter(o.hamas_label / 100)))
        const q5 = card('c-6', cardHead(t('gz.q5.title'), null, t('gz.q5.info')),
          h('span', { class: 'stance-key' },
            h('span', { class: 'key-item' }, h('span', { class: 'swatch', style: { background: 'var(--ink)' } }), t('gz.q5.own')),
            h('span', { class: 'key-item' }, h('span', { class: 'swatch', style: { background: 'var(--bar-muted)' } }), t('gz.q5.quoted'))),
          h('ul', { class: 'rows' }, TERMS.map((k) => {
            const own = o[`o_${k}`]
            const quoted = o[`q_${k}`]
            const scale = 30
            return h('li', {}, h('span', { class: 'row-name' }, t(`gz.term.${k}`)), h('span', { class: 'row-value' }, `${pctOf(own)} · ${pctOf(quoted)}`),
              h('div', { class: 'stack term-stack', role: 'img', 'aria-label': `${t(`gz.term.${k}`)}: ${t('gz.q5.own')} ${pctOf(own)}, ${t('gz.q5.quoted')} ${pctOf(quoted)}` },
                h('span', { style: `width:${Math.min(100, (own / scale) * 100)}%;--seg:var(--ink)` }),
                h('span', { style: `width:${Math.min(100, (quoted / scale) * 100)}%;--seg:var(--bar-muted)` })))
          })))
        const q6 = card('c-6', cardHead(t('gz.q6.title'), null, t('gz.q6.info')),
          Rows([{ label: t('gz.q6.oct7'), value: o.ctx_oct7, text: pctOf(o.ctx_oct7) }, { label: t('gz.q6.occupation'), value: o.ctx_occupation, text: pctOf(o.ctx_occupation) }], { max: 100, cls: 'rows-wrap' }))

        // The words for each week. A control picks the term.
        const termHolder = h('div', {})
        const drawTerms = () => {
          const labels = d.termsWeekly.map((w) => weekLabel(w.week, d.window))
          termHolder.replaceChildren(
            Dash.select('', term, WEEK_TERMS.map((k) => ({ value: k, label: t(`gz.term.${k}`) })), (v) => { term = v; drawTerms() }),
            LineChart({
              labels: labels.map((l) => l.short), tips: labels.map((l) => l.long), height: 220, min: 0, zero: true, yFormat: pctOf,
              aria: t('gz.terms.aria', { term: t(`gz.term.${term}`) }),
              series: [
                { label: t('gz.q5.own'), color: 'var(--ink)', values: d.termsWeekly.map((w) => w[`o_${term}`]) },
                { label: t('gz.q5.quoted'), color: 'var(--stance-neutral)', dash: '5 4', values: d.termsWeekly.map((w) => w[`q_${term}`]) }
              ]
            }))
        }
        drawTerms()
        const termCard = card('c-6', cardHead(t('gz.terms.title'), null, t('gz.terms.info')), termHolder)

        const share = (obj) => Object.entries(obj).filter(([k]) => k !== 'other').sort((a, b) => b[1] - a[1])
        const perspCard = card('c-6', cardHead(t('gz.persp.title'), null, t('gz.persp.info')),
          h('div', { class: 'how-grid' },
            h('div', { class: 'how-panel' }, h('h3', { class: 'rows-caption' }, t('gz.persp.head')), Rows(share(o.persp).map(([k, v]) => ({ label: t(`gz.persp.${k}`), value: v, text: pctOf(v) })), { max: 100 })),
            h('div', { class: 'how-panel' }, h('h3', { class: 'rows-caption' }, t('gz.frames.head')), Rows(share(o.frames).slice(0, 8).map(([k, v]) => ({ label: t(`gz.frame.${k}`), value: v, text: pctOf(v) })), { max: 40 }))))

        const g = d.greece
        const greeceCard = card('c-5', cardHead(t('gz.greece.title'), null, t('gz.greece.info')),
          Rows(Object.entries(g.roles).filter(([k]) => k !== 'other').sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ label: t(`gz.role.${k}`), value: v }))),
          h('div', { class: 'dstat-row callout' }, h('p', { class: 'dstat-value' }, pctOf(g.deals_mention_gaza)), h('p', { class: 'dstat-sub' }, t('gz.greece.deals', { n: fmt.int(g.deals) }))))

        // Sample headlines for one measure.
        const sampleHolder = h('div', {})
        const drawSample = () => {
          sampleHolder.replaceChildren(
            Dash.select('', sample, Object.keys(d.examples).map((k) => ({ value: k, label: t(`gz.ex.${k}`) })), (v) => { sample = v; drawSample() }),
            h('ul', { class: 'quote-list' }, (d.examples[sample] || []).map((e) => h('li', {},
              h('span', { class: 'quote-meta' }, e.outlet, ' · ', day(e.date)),
              h('a', { class: 'quiet-link', href: e.url, target: '_blank', rel: 'noopener' }, e.title)))))
        }
        drawSample()
        const titlesCard = card('c-7', cardHead(t('gz.titles.title'), null, t('gz.titles.info')), sampleHolder)

        const rows = Object.entries(d.outlets).map(([name, x]) => ({ name, ...x })).sort((a, b) => b.n - a.n)
        const outletCard = card('c-12', cardHead(t('gz.outlets.title'), null, t('gz.outlets.info')),
          UI.DataTable({
            rows, rankColumn: true, pageSize: rows.length,
            columns: [
              { label: t('gz.col.outlet'), render: (r) => h('span', { class: 'nowrap', title: r.lean || null }, r.name) },
              { label: t('gz.col.n'), num: true, render: (r) => fmt.int(r.n) },
              { label: t('gz.col.agent'), num: true, render: (r) => pctOf(r.pal_active) },
              { label: t('gz.col.palvoice'), num: true, phone: false, render: (r) => pctOf(r.any_pal_voice) },
              { label: t('gz.col.isrvoice'), num: true, phone: false, render: (r) => pctOf(r.any_isr_voice) },
              { label: t('gz.col.hamas'), num: true, phone: false, render: (r) => (r.with_figures >= 5 ? pctOf(r.hamas_label) : h('span', { class: 'mini-empty' }, '–')) },
              { label: t('gz.col.genocide'), num: true, phone: false, render: (r) => pctOf(r.o_genocide) },
              { label: t('gz.col.occupation'), num: true, phone: false, render: (r) => pctOf(r.ctx_occupation) },
              { label: t('gz.col.israel'), num: true, render: (r) => (r.israel_net === null || r.israel_net === undefined ? '–' : signed(r.israel_net, 0)) }
            ]
          }))

        content.replaceChildren(bar, h('div', { class: 'dash-grid' }, ...stats, dailyCard, q2, q3, q4, q5, q6, termCard, perspCard, greeceCard, titlesCard, outletCard),
          h('p', { class: 'proto-note' }, t('gz.note')))
      }
    })
    reset()
  </script>
</body>
</html>
