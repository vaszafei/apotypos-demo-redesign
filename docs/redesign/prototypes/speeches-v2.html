<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Απότυπος</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css?v=18">
  <link rel="stylesheet" href="assets/app.css?v=62">
  <link rel="stylesheet" href="assets/dash.css?v=107">
  <link rel="stylesheet" href="assets/politics.css?v=11">
  <script src="assets/page-move.js?v=1"></script>
</head>
<body>
  <div id="app"></div>
  <script src="assets/icons.js?v=14"></script>
  <script src="assets/messages.js?v=51"></script>
  <script src="assets/messages-v2.js?v=62"></script>
  <script src="assets/messages-politics.js?v=15"></script>
  <script src="assets/components.js?v=21"></script>
  <script src="assets/motion.js?v=4"></script>
  <script src="assets/dash.js?v=33"></script>
  <script src="assets/politics.js?v=12"></script>
  <script src="assets/shell.js?v=73"></script>
  <script src="data/speeches.js?v=1"></script>
  <script>
    // Αναλύσεις, ΟΗΕ: the 192 speeches of the 81st General Assembly (K47 and 3 kept tiles). Words and countries move to the hints.
    // The region pills in the top bar filter every card.
    const { t, fmt, h, load } = App
    const { reset, card, cardHead, TopBar, SLOTS } = Dash
    const { dataName } = Politics
    const result = load('speeches', ['rows'], (b) => b.rows)
    const REGIONS = ['Africa', 'Europe', 'Asia-Pacific', 'Latin America & Caribbean', 'Middle East', 'North America']
    const DOMESTIC = 'Domestic affairs'
    const TONES = ['hostile', 'critical', 'neutral', 'conciliatory', 'supportive']
    let region = ''

    Shell.start({
      id: 'speeches',
      route: '/speeches',
      dash: true,
      title: () => t('nav.world'),
      breadcrumbs: () => [{ label: t('nav.world') }, { label: t('tab.world.speeches') }, { label: t('tab.world.speeches.all') }],
      render (content, { tabs }) {
        content.classList.add('dash', 'minimal', 'filters-right')
        const paint = () => {
          const title = t('tab.world.speeches')
          const problem = Dash.stateContent([result], { title, tabs, quiet: true })
          if (problem) { content.replaceChildren(...problem); return }
          const d = result.data
          const rows = d.rows.filter((r) => !region || r.region === region)
          const topic = (x) => dataName('un.topic', x)
          const pills = h('div', { class: 'region-pills', role: 'group', 'aria-label': t('un.regions') },
            [['', t('un.region.all'), d.rows.length], ...REGIONS.map((r) => [r, t(`un.region.${r}`), d.rows.filter((x) => x.region === r).length])].map(([value, label, n]) =>
              h('button', { type: 'button', 'aria-pressed': String(region === value), onClick: () => { region = value; paint() } }, `${label} `, h('span', { class: 'muted-text' }, fmt.int(n)))))
          const bar = TopBar({ title, tabs, quiet: true, actions: [pills] })

          // The fingerprint colors: the 8 largest topics of all speeches have a fixed color, the domestic affairs are dark gray, every other topic is gray.
          // The agenda donut, the table and its legend read the same map.
          const everything = Politics.topicMinutes(d.rows)
          const colorOf = new Map(everything.topics.filter((a) => a.topic !== DOMESTIC).slice(0, SLOTS.length).map((a, i) => [a.topic, SLOTS[i]]))
          colorOf.set(DOMESTIC, 'var(--cat-strong)')
          const segColor = (k) => colorOf.get(k) || 'var(--bar-muted)'

          // The agenda as a sunburst: the regions inside (the time of their speeches), the topics outside (the 9 largest topics of the picked speeches, and the rest).
          // The legend lists the topics. With a region picked the inner ring is that region alone.
          const mins = Politics.topicMinutes(rows)
          const big = mins.topics.slice(0, 9)
          const restMin = Math.max(0, mins.total - big.reduce((a, x) => a + x.minutes, 0))
          const TINTS = [7, 6, 5, 4, 3, 2].map((i) => `var(--seq-${i})`)
          const regionStats = REGIONS.map((g) => ({ g, rows: rows.filter((r) => r.region === g) })).filter((x) => x.rows.length).map((x) => ({ ...x, m: Politics.topicMinutes(x.rows), speeches: x.rows.length })).sort((a, b) => b.m.total - a.m.total)
          const rings = regionStats.map((x, i) => {
            const by = new Map(x.m.topics.map((e) => [e.topic, e.minutes]))
            const name = t(`un.region.${x.g}`)
            // A topic under 3% of the time of the region goes into the rest, so the outer ring has no slivers.
            const kids = big.map((e) => ({ key: e.topic, label: topic(e.topic), value: (by.get(e.topic) || 0) / x.m.total >= 0.03 ? by.get(e.topic) : 0, color: segColor(e.topic) }))
            kids.push({ key: '', label: t('un.other'), value: Math.max(0, x.m.total - kids.reduce((a, k) => a + k.value, 0)), color: 'var(--bar-track)' })
            kids.forEach((k) => { k.tip = t('un.sun.tip', { region: name, topic: k.label, m: fmt.int(Math.round(k.value)), p: fmt.pct(k.value / x.m.total) }) })
            return { label: name, value: x.m.total, color: TINTS[i], tip: t('un.sun.region', { region: name, h: fmt.dec(x.m.total / 60), n: fmt.int(x.speeches) }), children: kids }
          })
          const agendaCard = card('', cardHead(t('un.agenda.title'), null, t('un.agenda.info')),
            Dash.Sunburst({
              size: 250,
              center: { num: fmt.dec(mins.total / 60), cap: t('un.donut.hours') },
              rings,
              legend: [...big.map((x) => ({ key: x.topic, label: topic(x.topic), color: segColor(x.topic), text: t('un.agenda.row', { m: fmt.int(Math.round(x.minutes)), p: fmt.pct(x.minutes / mins.total) }), tip: t('un.agenda.top', { names: x.top.join(', ') }) })),
                { key: '', label: t('un.other'), color: 'var(--bar-track)', text: t('un.agenda.row', { m: fmt.int(Math.round(restMin)), p: fmt.pct(restMin / mins.total) }) }]
            }),
            UI.Legend(regionStats.map((x, i) => ({ label: `${t(`un.region.${x.g}`)} ${fmt.dec(x.m.total / 60)}`, color: TINTS[i] }))))

          // What each region talks about: the share of the time of the region on each of the 9 largest topics, colored by how far it is above the share of all regions.
          const heatTopics = everything.topics.slice(0, 9)
          const FEW = 5
          const heatRegions = REGIONS.map((g) => { const l = d.rows.filter((r) => r.region === g); return { g, rows: l, speeches: l.length, seconds: l.reduce((a, r) => a + r.seconds, 0) } }).sort((a, b) => b.seconds - a.seconds)
          const share = heatRegions.map((x) => { const m = Politics.topicMinutes(x.rows); const by = new Map(m.topics.map((e) => [e.topic, e.minutes])); return { ...x, by, total: m.total } })
          const heatRows = share.map((x) => ({ label: x.speeches < FEW ? `${t(`un.region.${x.g}`)} · ${t('un.heat.few', { n: x.speeches })}` : h('span', { class: x.g === region ? 'un-picked' : null }, t(`un.region.${x.g}`)) }))
          const heatCard = card('un-heat', cardHead(t('un.heat.title'), null, t('un.heat.info')),
            UI.MatrixChart({
              caption: t('un.heat.title'), rowHeader: t('un.heat.region'), rows: heatRows, columns: heatTopics.map((x) => ({ label: topic(x.topic) })),
              cell: (r, c) => {
                const x = share[r]
                if (x.speeches < FEW) return { className: 'cell-empty', text: '—' }
                const mine = (x.by.get(heatTopics[c].topic) || 0) / x.total
                const all = heatTopics[c].minutes / everything.total
                return { ...Dash.seq(Math.min(1, mine / all / 4)), text: Dash.pct0(mine), title: t('un.heat.tip', { region: t(`un.region.${x.g}`), topic: topic(heatTopics[c].topic), p: fmt.pct(mine), m: fmt.int(Math.round(x.by.get(heatTopics[c].topic) || 0)) }) }
              }
            }),
            h('p', { class: 'dcard-sub' }, t('un.heat.note', { n: FEW })))
          heatCard.querySelector('table').classList.add('matrix-turned')

          const targets = {}
          // Two names of the data can have one Greek name (for example Western nations and Western countries). The shown name is the key.
          rows.forEach((r) => new Map(r.targets.map(([k, n]) => [dataName('un.target', k), n])).forEach((n, k) => { const e = targets[k] || (targets[k] = { n: 0, leaders: 0 }); e.n += n; e.leaders++ }))
          const targetRows = Object.entries(targets).sort((a, b) => b[1].n - a[1].n).slice(0, 8)
          const targetCard = card('', cardHead(t('un.targets.title'), null, t('un.targets.info')),
            UI.BarList(targetRows.map(([k, e]) => ({ label: k, value: e.n, text: t('un.targets.value', { n: fmt.int(e.n), l: fmt.int(e.leaders) }), color: 'var(--stance-critical)' }))))

          const greek = rows.filter((r) => r.greece.n).sort((a, b) => b.greece.n - a.greece.n)
          const greeceCard = card('', cardHead(t('un.greece.title'), null, t('un.greece.info')),
            greek.length
              ? h('ul', { class: 'target-list' }, greek.map((r) => h('li', {},
                h('span', {}, h('strong', {}, r.speaker), ' ', h('span', { class: 'muted-text' }, `${r.role}, ${r.country} · ${t('un.greece.refs', { n: fmt.int(r.greece.n) })}`)),
                h('span', { class: 'chips' }, TONES.filter((k) => r.greece.tones[k]).map((k) => h('span', { class: `target-chip tone-${k}` }, t(`un.tone.${k}`), h('strong', {}, fmt.int(r.greece.tones[k])))),
                  r.greece.refers_to.map((x) => h('span', { class: 'pill' }, x))))))
              : h('p', { class: 'dcard-empty' }, t('un.greece.none')))

          // The fingerprint of each speech, with the colors of the agenda donut.
          const legend = UI.Legend([...[...colorOf.keys()].map((k) => ({ label: topic(k), color: colorOf.get(k) })), { label: t('un.other'), color: 'var(--bar-muted)' }])
          const Print = (r) => {
            const rest = Math.max(0, 1 - r.shares.reduce((a, [, s]) => a + s, 0))
            const label = r.shares.map(([k, s]) => `${topic(k)} ${fmt.pct(s)}`).join(', ')
            return UI.StackedBar([...r.shares.map(([k, s]) => ({ label: topic(k), value: s, color: segColor(k) })), { label: t('un.other'), value: rest > 0.01 ? rest : 0, color: 'var(--bar-track)' }], { legend: false, label })
          }
          const sorted = rows.slice().sort((a, b) => b.seconds - a.seconds)
          const tableCard = card('c-12', cardHead(t('un.table.title'), null, t('un.table.info')), legend,
            UI.DataTable({
              rows: sorted, rankColumn: true, pageSize: 25, moreStep: 25,
              columns: [
                { label: t('un.col.leader'), render: (r) => h('span', { class: 'leader-cell' }, h('a', { class: 'quiet-link', href: r.url, target: '_blank', rel: 'noopener' }, r.speaker), h('span', { class: 'row-sub' }, `${r.role} · ${r.country}`)) },
                { label: t('un.col.minutes'), num: true, render: (r) => fmt.int(Math.round(r.seconds / 60)) },
                { label: t('un.col.wpm'), num: true, phone: false, render: (r) => fmt.int(Math.round(r.words / (r.seconds / 60))) },
                { label: t('un.col.print'), phone: false, render: Print },
                { label: t('un.col.top'), phone: false, render: (r) => { const top = r.shares.find(([k]) => k !== DOMESTIC) || r.shares[0]; return top ? h('span', { class: 'nowrap' }, `${topic(top[0])} `, h('span', { class: 'muted-text' }, fmt.pct(top[1]))) : '–' } },
                { label: t('un.col.claims'), num: true, render: (r) => fmt.int(r.counts.claims) },
                { label: t('un.col.promises'), num: true, phone: false, render: (r) => fmt.int(r.counts.promises) },
                { label: t('un.col.attacks'), num: true, phone: false, render: (r) => fmt.int(r.counts.attacks) }
              ]
            }))

          content.replaceChildren(bar, h('div', { class: 'dash-grid' }, h('div', { class: 'c-7 card-col' }, agendaCard, heatCard), h('div', { class: 'c-5 card-col' }, targetCard, greeceCard), tableCard), h('p', { class: 'proto-note' }, t('un.note')))
        }
        paint()
      }
    })
    reset()
  </script>
</body>
</html>
